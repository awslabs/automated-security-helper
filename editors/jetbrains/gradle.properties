# The IntelliJ Platform Gradle plugin resolves an IDE distribution of roughly a gigabyte
# and indexes it, so the default 512m heap is not enough and the failure is an
# OutOfMemoryError in a Gradle daemon rather than anything naming the SDK.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Off deliberately, and it is not a performance preference.
#
# Gradle 9 turns the configuration cache ON by default, and this build has to be on Gradle
# 9: the IntelliJ Platform Gradle plugin 2.19.0 refuses to apply on anything older, with
# "IntelliJ Platform Gradle Plugin requires Gradle Gradle 9.0.0 and higher". The wrapper
# was first pinned at 8.14.3 and that is the error it produced, so this is measured rather
# than assumed.
#
# What that leaves is a build whose configuration reads the resolved IDE's layout running
# under a cache that serializes and replays configuration. Rather than discover which of
# the IntelliJ Platform plugin's tasks are cache-correct on this Gradle, the cache is off
# and the build takes the configuration cost on every run. This is worth revisiting: it
# is a deliberate "not now", not a claim that the two are incompatible.
org.gradle.configuration-cache=false

# Build caching is safe here and worth having: the SDK resolution is the expensive step
# and its outputs are content-addressed.
org.gradle.caching=true
