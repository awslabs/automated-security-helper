[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Configure test discovery and execution
#
# `-n auto` runs the suite across every available CPU. It replaced `-n 1`, which
# had been in place since the v3 release with no recorded reason and served no
# purpose: xdist gives each worker its own process, so cwd, environment and
# module-level singletons are already isolated per worker. That is why the eight
# test modules that call os.chdir/monkeypatch.chdir are safe in parallel, and no
# test binds a socket or port, which is the one pattern that genuinely breaks.
#
# Verified before changing: five consecutive full-suite runs at 192 workers, all
# 2700 passed / 0 failed, plus a 4-worker run (matching a GitHub standard runner)
# also 2700 passed.
#
# Note on `auto`, as pytest-xdist 3.8 resolves it: PYTEST_XDIST_AUTO_NUM_WORKERS if
# that is set, and otherwise, since psutil is not a dependency, the number of CPUs
# this process may run on: len(os.sched_getaffinity(0)), which taskset and cpusets
# lower, or os.cpu_count() where that call does not exist (macOS, Windows). Those
# are *logical* CPUs. --maxprocesses, if given, caps the result. If psutil ever
# arrives as a transitive dependency, `auto` starts meaning physical cores instead
# and the worker count on hyperthreaded runners halves; switch to `-n logical` then.
#
# `--dist worksteal` instead of xdist's default `load`: `load` deals each worker a
# fixed share up front, so the worker that drew the slow tests runs alone at the
# end; with worksteal an idle worker takes queued tests from a busy one. It ignores
# xdist grouping (loadscope, loadfile, loadgroup, xdist_group), which nothing here
# uses; tests/unit/test_pytest_distributes_by_work_stealing.py keeps it that way.
# With `-n 0` it is inert (measured on xdist 3.8.0: the run stays in-process). No
# worker cap belongs here; pass `-n <count>` on the command line to set one.
#
# No coverage options here. With them, and fail_under=80 in .coveragerc, every run
# of one directory or one test would exit 1 on the coverage threshold with every
# test passing, and everything that ran a subset would have to remember --no-cov.
# The 80% gate is a property of the whole suite, so it lives where the whole suite
# runs: the "Run PyTest" step of .github/actions/run-unit-tests/action.yml passes
# --cov and --cov-fail-under=80 itself, and tests/unit/test_unit_test_step_gates.py
# fails if it stops, or if coverage options come back here.
addopts =
    --verbose
    --junit-xml=test-results/pytest.junit.xml
    --durations=10
    -n auto
    --dist worksteal

# Configure markers for test categorization
markers =
    unit: Unit tests that test individual components in isolation
    integration: Integration tests that test component interactions
    slow: Tests that take a long time to run
    scanner: Tests related to scanner functionality
    reporter: Tests related to reporter functionality
    config: Tests related to configuration functionality
    model: Tests related to data models
    allow_aws_network: may send botocore requests off this machine; every other test has them refused

# Configure test output
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:

# asyncio configuration
asyncio_default_fixture_loop_scope = module