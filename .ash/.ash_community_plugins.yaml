  cyclonedx:
    enabled: true
  flat-json:
    enabled: true
  html:
    enabled: true
  junitxml:
    enabled: true
  markdown:
    enabled: true
    options:
      include_detailed_findings: true
      include_findings_table: false
      include_summary: true
      max_detailed_findings: 20
      top_hotspots_limit: 10
      use_collapsible_details: true
  ocsf:
    enabled: true
  sarif:
    enabled: true
  text:
    enabled: true
  gitlab-sast:
    enabled: true
  spdx:
    enabled: false
  yaml:
    enabled: false
scanners:
  bandit:
    enabled: true
    # .ash/bandit.yaml is named with --config-overrides where this repository
    # scans itself: a config file inside the scanned tree does not choose a
    # scanner's own config file.
    options:
      confidence_level: all
      ignore_nosec: false
  cdk-nag:
    enabled: false
    options:
      nag_packs:
        AwsSolutionsChecks: true
        HIPAASecurityChecks: true
        NIST80053R4Checks: true
        NIST80053R5Checks: true
        PCIDSS321Checks: true
  cfn-nag:
    enabled: false
  checkov:
    enabled: false
    options:
      frameworks:
        - all
      additional_formats: []
      skip_path: []
      # .ash/.checkov.yaml is not named here: a checkov config file inside the
      # scanned tree is not passed to checkov, whoever names it.
      severity_threshold: LOW
  detect-secrets:
    enabled: false
  npm-audit:
    enabled: false
  grype:
    enabled: false
  opengrep:
    enabled: false
  semgrep:
    enabled: false
  snyk-code:
    enabled: false
    options:
      severity_threshold: "MEDIUM"
  syft:
    enabled: false
  ferret-scan:
    enabled: true
    options:
      confidence_levels: "high"
      checks: "CREDIT_CARD,SECRETS,SSN,PASSPORT"
      recursive: true
      use_default_config: false
      exclude_patterns:
        - ".venv"
        - "tests/test_data"
        - ".ash/ash_output"
        - ".git"
        - "__pycache__"
        - "*.pyc"
  trivy-repo:
    enabled: true
    options:
      scanners: ["vuln", "misconfig", "secret", "license"]
      ignore_unfixed: false
      license_full: false
      disable_telemetry: true
      # trivy-repo has no skip_dirs option: global_settings.ignore_paths keeps
      # tests/test_data out of its scan (utils/link_exclusions.py trivy_skip_dirs
      # turns the entry into trivy's --skip-dirs), and an option the plugin does
      # not declare stops the scan.
converters:
  archive:
    enabled: true # Disable once #197 is fixed, not required for the test
  jupyter:
    enabled: false
