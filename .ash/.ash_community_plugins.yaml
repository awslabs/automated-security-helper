    # === ferret-scan API_KEY_OR_SECRET, unquoted-assignment false positives ===
    # ferret-scan v2.3.3 added unquoted keyword-assignment detection to the SECRETS
    # validator, so an ordinary identifier whose NAME is a secret keyword (session,
    # token, secret, ...) sitting next to an assignment now reads as API_KEY_OR_SECRET
    # at HIGH confidence. Bumping the plugin's supported binary to v2.4.5 surfaced the
    # high-confidence hits below. The type CANNOT be turned off in config:
    # ferret-scan honours validators.<name> disabled_types ONLY for intellectual_
    # property, never for secrets (verified against v2.4.5). Per the plugin design
    # decision (ash_ferret_plugins/DEVELOPMENT.md → "API_KEY_OR_SECRET policy"), the
    # detector stays ENABLED and its false positives are managed here by path. Reasons
    # are paraphrased rather than quoting the offending line, because the triggering
    # shape would otherwise make this file flag itself.
    - path: automated_security_helper/schemas/ocsf/ocsf_vulnerability_finding.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. This module is generated by datamodel-codegen; the flagged
        lines are typed model fields whose names match the secret-keyword heuristic
        (a login/session object field), not credentials. Any fix belongs on the
        source JSON schema, not this generated file.
    - path: automated_security_helper/cli/mcp/sessions.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. The flagged line assigns a local variable named for an MCP
        session object; the detector matches the variable name, and the assigned
        value is a constructed object rather than a credential.
    - path: deploy/terraform/modules/fargate/main.tf
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. The flagged local's name contains the word "secret"
        (manage-auth-secret), but its value is a boolean computed from whether an
        optional input was supplied, not a credential.
    - path: tests/unit/cli/mcp/test_sessions.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. This file assigns locals named for session objects, which match
        the secret-keyword heuristic; these are fixtures, not real credentials. Scoped to
        this file (rather than tests/**) so a genuinely hardcoded credential added to some
        other test later is not silently suppressed.
    - path: tests/unit/test_artifact_contents_gate.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. The match is a backtick-quoted module filename sitting in a
        test docstring that explains the vendored-scanner classifier; the keyword
        heuristic misreads an ordinary identifier in prose as a credential. It is
        documentation, not a secret. Scoped to this file rather than tests/** so a
        genuinely hardcoded credential added to another test later is not silently
        suppressed.
    # === ferret-scan API_KEY_OR_SECRET: names and placeholders the detector misreads ===
    # The same detector, the same cause as the block above: an identifier or a prose
    # word that is a secret keyword stem next to a colon, an equals sign or a quoted
    # value reads as a credential at high confidence. Every entry names the file and
    # what the match is, and none quotes the matching line, so this file does not
    # flag itself. Entries are per file, never tests/** or docs/**, so a real
    # credential added to another file is still reported.
    - path: automated_security_helper/config/tool_config_trust.py
      rule_id: API_KEY_OR_SECRET
      line_start: 116
      line_end: 116
      reason: >-
        False positive. The line is a table key naming the detect-secrets scanner,
        mapped to the one option the scanned tree may not set for it. The keyword
        is part of a tool name; the value is an option name, not a credential.
        Pinned to the line so a real value added elsewhere in the file still reports.
    - path: tests/integration/codecommit_gate_regression/assert_case.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. The match is a dictionary entry keyed by the detect-secrets
        scanner's name, holding a status and a dependency flag in an expected
        scan-result fixture. The keyword is part of a tool name.
    - path: tests/unit/config/test_config_alias_round_trip.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. The match is a configuration fixture keyed by the
        detect-secrets scanner's name, holding a severity threshold. The keyword is
        part of a tool name.
    - path: tests/unit/cli/mcp/test_delivered_config_env.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. The match is a module constant naming an MCP client session
