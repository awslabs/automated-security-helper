    # === ferret-scan API_KEY_OR_SECRET: pinned release checksums ===
    # Separate from the block above and for a different reason. Those are identifiers
    # whose NAMES match a secret keyword; this one is a table of values that genuinely
    # look like high-entropy secrets because a SHA256 is high-entropy.
    - path: automated_security_helper/utils/tool_downloads.py
      rule_id: API_KEY_OR_SECRET
      line_start: 334
      line_end: 439
      reason: >-
        False positive — every string in this range is a published SHA256 release
        checksum or the SHA256 of what one of those verified archives extracts to.
        The archive digests in _DIGESTS were transcribed from the vendor's
        own *_checksums.txt or `<asset>.sha256` file, or, for the projects that
        publish neither (cfn-guard, opengrep, the Guard Rules Registry), from the
        digest GitHub reports for each release asset and confirmed by hashing the
        asset. _EXECUTABLE_DIGESTS, the second table in the range, holds the SHA256
        of the executable extracted from each verified archive, and
        _BUNDLE_CONTENTS_DIGESTS, the third, the SHA256 over the names and digests of
        the rule files extracted from a rules bundle archive. A 64-character hex
        string is what an entropy detector is built to find, so every one is
        reported at 95% confidence, but a release checksum is public by construction
        and is the opposite of a credential: it exists so anyone can compare against
        it. detect-secrets is handled by an inline `# pragma: allowlist secret` on
        each line; ferret-scan does not honour that marker, hence this entry.
        Scoped to the digest table's line range rather than the whole file on
        purpose. A range that drifts after a version bump fails loudly -- the
        findings come back and the scan goes red -- whereas a whole-file suppression
        would silently swallow a real secret added here later.
