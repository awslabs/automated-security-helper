    # The CDK templates are generated by `cdk synth` and committed. The matches are
    # CloudFormation logical ids, which CDK builds from a construct path plus an
    # eight-character hash suffix, so they look like a name followed by a random token.
    # No entry carries a line range: the lines move whenever a template is
    # regenerated. Per file, so a template added later is still scanned.
    - path: deploy/cdk/templates/AshAgentCore.template.json
      rule_id: API_KEY_OR_SECRET
      reason: >-
        False positive. The matches are the logical id of the MCP auth header
        secret resource and the references to it. The id is a name plus CDK's hash
        suffix; the template stores no value for it (the value lives in Secrets
        Manager).
    - path: deploy/cdk/templates/AshCodeCommitGate.template.json
