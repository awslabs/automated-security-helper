    # === trivy AWS-0054 is checkov's CKV_AWS_2 and cfn-nag's W56, same listener ===
    - rule_id: AWS-0054
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        LoadBalancerListener, the only listener in this template and the same
        resource CKV_AWS_2, CKV_AWS_103 and CFN_NAG_W56 fire on in .ash/.ash.yaml.
        An HTTPS listener needs an ACM certificate, and ACM issues one only against
        a domain the requester can prove control of, so there is no default this
        template could supply. The load balancer is internal and starts with no
        ingress rule at all, so nothing reaches the HTTP listener until an operator
        sets McpIngressCidr. CertificateArn is the reserved name for this opt-in.
    - rule_id: AWS-0054
      path: deploy/terraform/modules/fargate/main.tf
      reason: >-
        aws_lb_listener.this chooses HTTPS over HTTP from local.use_tls, which is
        `var.certificate_arn != null`, and sets ssl_policy on the same condition.
        certificate_arn defaults to null, so the finding is ACCURATE rather than a
        parser artifact: the default listener really is HTTP, and supplying a
        certificate makes it HTTPS with no further change. Same underlying decision
        as the CKV_AWS_2 entry for the template above -- no module can default a
        certificate it cannot issue -- and this module additionally refuses
        mcp_auth_header_value without a certificate unless the caller explicitly
        sets allow_plaintext_auth_header, so reaching a plaintext listener that
        carries an auth header takes a deliberate opt-in.
    # === trivy AWS-0104 is cfn-nag's W5, and only the destination CIDR is left ===
    - rule_id: AWS-0104
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        ServiceSecurityGroup, the same egress rule CFN_NAG_W5 fires on in
        .ash/.ash.yaml, where the full accounting lives. The protocol and port are
        already pinned to TCP 443; the destination is the public internet, because
        the task runs in a private subnet with no VPC endpoint and reaches ECR,
