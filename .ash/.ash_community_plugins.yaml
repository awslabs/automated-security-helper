    # === trivy AWS-0031 is checkov's CKV_AWS_51, same repositories ===
    #
    # "Repository tags are mutable" is the rule checkov reports as CKV_AWS_51, and
    # that decision is already made in two places: the CKV_AWS_51 entries in
    # .ash/.ash.yaml for the five templates, and the inline CKV_AWS_51 skips on
    # aws_ecr_repository in the ash-image-pipeline and codecommit-gate modules. The
    # counts line up exactly, six terraform findings against six CKV_AWS_51
    # terraform findings and six template findings against six.
    #
    # MUTABLE is load-bearing rather than an oversight. Every build republishes a
    # moving tag, which is what lets a long-lived deployment pick up base-image and
    # scanner patches without a stack update; IMMUTABLE would make the second
    # scheduled rebuild fail on the push. A version-qualified tag is pushed
    # alongside it for anyone who wants immutable pinning, and AshImageTag in the
    # templates and ecr_image_tag_mutability in the modules are the opt-ins. Cited
    # by symbol rather than by line because the lines move.
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshAgentCore.template.json
      reason: >-
        ImageRepository is MUTABLE because flavorBuildCommands in
        deploy/cdk/lib/ash-image-build.ts republishes the moving tag on every
        rebuild. See the CKV_AWS_51 entry for this same file in .ash/.ash.yaml.
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshCodeCommitGate.template.json
      reason: "ImageRepository, same mechanism and same CKV_AWS_51 entry as AshAgentCore."
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        ImageRepository, same mechanism as AshAgentCore. This template additionally
        consumes the moving tag as a CodeBuild environment image, resolved when each
        build starts.
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshFargate.template.json
      reason: "ImageRepository, same mechanism and same CKV_AWS_51 entry as AshAgentCore."
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshImagePipeline.template.json
      reason: >-
        Arm64Repository and Amd64Repository, one per architecture. Same mechanism as
        AshAgentCore; AshImageTag is not declared here because this template runs no
        workload and publishes the tags as stack outputs.
    - rule_id: AWS-0031
      path: deploy/terraform/modules/ash-image-pipeline/main.tf
      reason: >-
        aws_ecr_repository.this takes image_tag_mutability from the
        ecr_image_tag_mutability input, whose default is MUTABLE for the reason its
        own description gives: the scheduled rebuild republishes the same image_tag
        so running targets pick up patched scanners. This is the resource that
        already carries an inline CKV_AWS_51 skip saying the same thing.
    - rule_id: AWS-0031
      path: deploy/terraform/modules/codecommit-gate/main.tf
      reason: >-
        aws_ecr_repository.gate, the same ecr_image_tag_mutability input and the
        same inline CKV_AWS_51 skip as the ash-image-pipeline entry.
    # === trivy AWS-0132: SSE-S3 on the buckets, one of them by AWS requirement ===
    #
    # "Bucket does not encrypt data with a customer managed key" fires on every
    # bucket in these two stacks. All of them are BucketEncryption S3_MANAGED, which
    # is SSE-S3 with an AWS managed key, so they are encrypted at rest and the rule
    # is about WHICH key. No default-mode scanner asks this: checkov's CMK rule for
    # S3 has no CloudFormation implementation, its CloudFormation rule CKV_AWS_19
    # accepts AES256, and cfn-nag's W41 only checks that an encryption block exists.
    # So unlike most of this block there is no prior decision to point at, and the
    # argument is assembled here from the same cost family.
    #
    # For the load-balancer log bucket the answer is not ours to make: AWS documents
    # that for an Application Load Balancer access-log bucket "the only server-side
    # encryption option that's supported is Amazon S3-managed keys (SSE-S3)"
    # (Elastic Load Balancing User Guide, Enable access logs for your Application
    # Load Balancer, Step 1 requirements). accessLogArchiveProps in
    # deploy/cdk/lib/ash-config.ts records that the archive bucket matches it to
    # keep one shape across both stacks.
    #
    # For the remaining pipeline buckets the trade is the one already recorded
    # against CKV_AWS_158 and CKV_AWS_149: a customer managed key is billed monthly
    # per key plus per request, and it would additionally need a decrypt grant on
    # every CodePipeline action role that touches an artifact. Wiring KmsKeyArn
    # through to these buckets is a reasonable follow-up for a deployment that needs
    # it; it is not something a template should impose on every adopter.
    - rule_id: AWS-0132
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        All five buckets -- AccessLogsArchive, AccessLogs, Source, Results and
        Artifacts -- are S3_MANAGED, so each is encrypted at rest with an AWS
        managed key. See the block comment above for the ALB requirement on the log
        pair and the per-key cost on the other three.
    - rule_id: AWS-0132
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        AccessLogs receives the load balancer's access logs, and SSE-S3 is the only
        encryption AWS supports on that bucket; AccessLogsArchive matches it, as
        accessLogArchiveProps records. Neither could take a customer key.
    # === trivy AWS-0089: an access-log chain has to terminate somewhere ===
    #
    # "Bucket has logging disabled" fires on exactly one bucket per stack,
    # AccessLogsArchive, and on no other -- every other bucket names a destination.
    # That bucket is the terminus of the chain, and it logs to ITSELF, which CDK
    # expresses as a LoggingConfiguration carrying only a LogFilePrefix.
    #
    # MEASURED. Adding a DestinationBucketName to AccessLogsArchive in
    # AshFargate.template.json, changing nothing else, takes trivy's AWS-0089 count
    # for that template from one to zero. So the rule reads the destination and a
    # self-reference does not satisfy it. checkov's CKV_AWS_18 does accept the
    # prefix-only form, which is why the default config reports nothing here; the
    # doc comment on accessLogArchiveProps in deploy/cdk/lib/ash-config.ts records
    # the probe template that established that.
    #
    # There is no configuration that clears this. Turning logging on needs a
    # destination, the destination needs one too, and the chain has to stop; the only
    # decision is which bucket points at itself, and the same comment sets out why
    # it is the quietest one and which two alternatives were rejected. Adding a
    # third bucket relocates the finding rather than removing it, which is the same
    # conclusion cdk-nag's AwsSolutions-S1 suppression reaches in
    # suppressLogBucketSelfLogging.
    - rule_id: AWS-0089
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        AccessLogsArchive, the chain terminus, whose LoggingConfiguration names a
        prefix and no destination because it delivers to itself. See the block
        comment above and accessLogArchiveProps.
    - rule_id: AWS-0089
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        AccessLogsArchive, the chain terminus in this stack, same shape as the
        AshDistributedPipeline entry.
    - rule_id: AWS-0089
      path: deploy/terraform/modules/codepipeline-executor/main.tf
      reason: >-
        The artifact bucket, which is the resource this module's inline CKV_AWS_18
        skip already covers: server access logging needs a second log bucket per
        deployment, access here is limited to roles declared in the module, and
        object-level access is auditable account-wide through CloudTrail data
        events. trivy asks the same question under its own id.
    # === trivy AWS-0066 is checkov's CKV_AWS_50, same functions ===
    #
    # "Function does not have tracing enabled" is X-Ray, which checkov reports as
    # CKV_AWS_50. The codecommit-gate module already carries an inline CKV_AWS_50
    # skip on its gate function, and the argument there applies unchanged to the CDK
    # equivalents: X-Ray bills per trace and would describe one synchronous path
    # that the function's own log group already records step by step, with no
    # cross-service call graph for tracing to reveal.
    #
    # The decision existed only for terraform until now because CKV_AWS_50 has no
    # CloudFormation implementation at all -- it is registered for the terraform
    # aws_lambda_function resource only -- and cfn-nag has no Lambda tracing rule
    # either. So no default-mode scanner ever asked this question about the
    # templates. TracingConfig is genuinely absent rather than conditional,
    # confirmed by reading the rendered Lambda resources, so the finding is accurate
    # and the answer is the cost rather than a parser difference.
    - rule_id: AWS-0066
      path: deploy/cdk/templates/AshAgentCore.template.json
      reason: >-
        ImageBootstrapStarter, the CloudFormation custom-resource responder that
        starts the image build. It runs once per stack operation on a single
        synchronous path and already writes to its own log group. Same argument as
        the inline CKV_AWS_50 skip in the codecommit-gate module.
    - rule_id: AWS-0066
      path: deploy/cdk/templates/AshCodeCommitGate.template.json
      reason: >-
        ImageBootstrapStarter and ScanFunction. ScanFunction is the CDK counterpart
        of the terraform gate function whose inline CKV_AWS_50 skip records this
        argument: clone, scan, comment is one synchronous path, already recorded
        step by step in its log group.
    - rule_id: AWS-0066
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        ImageBootstrapStarter, the same custom-resource responder as the AshAgentCore
        entry. The ECS task is unaffected: it is not a Lambda function.
    - rule_id: AWS-0066
      path: deploy/terraform/modules/codecommit-gate/main.tf
      reason: >-
        aws_lambda_function for the gate, the resource that already carries the
        inline CKV_AWS_50 skip. trivy asks the same question under its own id.
    # === trivy AWS-0054 is checkov's CKV_AWS_2 and cfn-nag's W56, same listener ===
    - rule_id: AWS-0054
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        LoadBalancerListener, the only listener in this template and the same
        resource CKV_AWS_2, CKV_AWS_103 and CFN_NAG_W56 fire on in .ash/.ash.yaml.
        An HTTPS listener needs an ACM certificate, and ACM issues one only against
        a domain the requester can prove control of, so there is no default this
        template could supply. The load balancer is internal and starts with no
        ingress rule at all, so nothing reaches the HTTP listener until an operator
        sets McpIngressCidr. CertificateArn is the reserved name for this opt-in.
    - rule_id: AWS-0054
      path: deploy/terraform/modules/fargate/main.tf
      reason: >-
        aws_lb_listener.this chooses HTTPS over HTTP from local.use_tls, which is
        `var.certificate_arn != null`, and sets ssl_policy on the same condition.
        certificate_arn defaults to null, so the finding is ACCURATE rather than a
        parser artifact: the default listener really is HTTP, and supplying a
        certificate makes it HTTPS with no further change. Same underlying decision
        as the CKV_AWS_2 entry for the template above -- no module can default a
        certificate it cannot issue -- and this module additionally refuses
        mcp_auth_header_value without a certificate unless the caller explicitly
        sets allow_plaintext_auth_header, so reaching a plaintext listener that
        carries an auth header takes a deliberate opt-in.
    # === trivy AWS-0104 is cfn-nag's W5, and only the destination CIDR is left ===
    - rule_id: AWS-0104
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        ServiceSecurityGroup, the same egress rule CFN_NAG_W5 fires on in
        .ash/.ash.yaml, where the full accounting lives. The protocol and port are
        already pinned to TCP 443; the destination is the public internet, because
        the task runs in a private subnet with no VPC endpoint and reaches ECR,
        CloudWatch Logs, Systems Manager and Secrets Manager through the NAT
        gateway. No AWS-managed prefix list names those endpoints, so narrowing the
        CIDR needs interface endpoints, billed hourly per Availability Zone.
    - rule_id: AWS-0104
      path: deploy/terraform/modules/fargate/main.tf
      reason: >-
        aws_vpc_security_group_egress_rule.service_all, the terraform counterpart of
        the rule CFN_NAG_W5 covers above, with the same public-internet destination
        for the same four AWS API endpoints. Narrowing the destination depends on
        whether the caller's VPC uses NAT or interface endpoints, which this module
        does not know; the comment above the resource records that.
    # === trivy AWS-0036 matches the variable NAME, not a value ===
    #
    # MEASURED. Renaming ASH_MCP_AUTH_HEADER_VALUE_SECRET_ARN to
    # ASH_MCP_AUTH_HEADER_VALUE_LOCATOR in AshFargate.template.json and changing
    # nothing else takes trivy's AWS-0036 count from one to zero, so the rule is
    # matching on the name. That is the same heuristic .ash/.ash.yaml already
    # records for detect-secrets on deploy/terraform/modules/ash-image-pipeline/
    # files/ash-container-init, where the match was the NAME of the variable holding
    # an ARN.
    #
    # A rename would clear it, and was rejected: the name is read by the generated
    # entrypoint in deploy/cdk/lib/ash-container-scripts.ts, asserted by the CDK
    # tests, and shipped in three committed templates, so renaming trades an
    # accurate description for a scanner's keyword list. Moving the value into the
    # task definition's Secrets block would be worse -- that injects the RESOLVED
    # secret into the container environment, which is exactly what this design
    # avoids.
    - rule_id: AWS-0036
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        The match is an environment variable NAME on the ECS task definition,
        beginning ASH_MCP_AUTH_HEADER_VALUE and ending in _ARN. Written split
        rather than spelled out, because spelling it contiguously makes this
        reason itself a keyword finding -- the same trap the hex entry in
        .ash/.ash.yaml records, and the reason this file previously failed the
        Windows scan. Its value is not a credential: mcpEnvironment in
        deploy/cdk/lib/ash-runtime-config.ts sets it from the auth secret's ARN
        behind an Fn::If, and the entrypoint generated
        by deploy/cdk/lib/ash-container-scripts.ts calls GetSecretValue on that ARN
        at container start. The secret value therefore never enters the task
        definition, which is what the secret's own Description in this template
        says.
    # === trivy DS-0002 and DS-0026 are already decided in the Dockerfiles ===
    #
    # Both Dockerfiles carry inline `checkov:skip` comments for exactly these two
    # questions, and the mapping is one to one:
    #
    #   DS-0002 "specify at least 1 USER command with a non-root user" maps to
    #   CKV_DOCKER_3 on wrapper.Dockerfile, which sets no USER at all, and to
    #   CKV_DOCKER_8 on gate.Dockerfile, which sets USER root. checkov reports
    #   CKV_DOCKER_3 only on the first and CKV_DOCKER_8 only on the second; trivy
    #   reports DS-0002 on both, because one rule covers both shapes.
    #
    #   DS-0026 "add HEALTHCHECK" maps to CKV_DOCKER_2 on both files.
    #
    # MEASURED that the rules read what they say: adding a USER and a HEALTHCHECK to
    # a copy of wrapper.Dockerfile clears both. That measurement proves the scanner
    # is satisfied, and NOT that the change is viable -- which is the whole point
    # here, so it is worth being blunt about. The uid used to clear it, 1000, is not
    # ASH's: the root Dockerfile's non-root stage builds ash-user as 500:100 and
    # chowns the home directory, /src and /out to exactly that pair, so a container
    # running as 1000 would own none of them. The change that turns this rule green
    # breaks the DEFAULT target rather than an edge case.
    #
    # What blocks a real fix is the design, not the scanner. The base image arrives
    # through the ASH_BASE_IMAGE build argument, whose stage is chosen by
    # ash-image-pipeline's ash_image_target input: `core` and `ci` create no user and
    # chown nothing, and only `non-root`, the default, defines 500:100. So any USER
    # the wrapper hardcodes converts a documented three-way operator choice into a
    # one-way one -- and `ci` exists precisely because, as its variable description
    # records, some scanners and some CI environments require root. Whether the
    # running container is unprivileged is therefore ash_image_target's decision, not
    # this file's.
    - rule_id: DS-0002
      path: deploy/terraform/modules/ash-image-pipeline/files/wrapper.Dockerfile
      reason: >-
        No USER is set here and no fixed uid could be: the base image target is
        configurable through ASH_BASE_IMAGE and only its non-root target defines
        one. The ash_image_target input decides this, not the wrapper. Same
        reasoning as this file's inline CKV_DOCKER_3 skip, and the reason the COPY
        instructions use --chmod rather than a RUN chmod.
    - rule_id: DS-0002
      path: deploy/terraform/modules/codecommit-gate/files/gate.Dockerfile
      reason: >-
        USER root is set and cannot be reverted: pip needs to write to
        site-packages, ASH's scanners need root to run, and no fixed uid could be
        restored because only the base image's non-root target defines one. This
        image is a Lambda function, where each invocation gets a single-tenant
        execution environment with a read-only root filesystem outside /tmp, so root
        confers nothing across a boundary. Same reasoning as this file's inline
        CKV_DOCKER_8 skip.
    - rule_id: DS-0026
      path: deploy/terraform/modules/ash-image-pipeline/files/wrapper.Dockerfile
      reason: >-
        Nothing that runs this image reads a Docker HEALTHCHECK. AgentCore Runtime
        probes the container over its own protocol, and ECS documents that it "does
        not monitor Docker health checks that are embedded in a container image and
        not specified in the container definition" -- the Fargate target is
        health-checked by its ALB target group instead. An inherited HEALTHCHECK
        could not be relied on either, since only the base image's non-root target
        declares one. Same reasoning as this file's inline CKV_DOCKER_2 skip.
        Deliberately NOT the argument .ash/.ash.yaml gives for CKV_DOCKER_2 on the
        repository's own Dockerfile: "ASH is a CLI tool" is false of this image,
        which serves long-running HTTP behind a load balancer on the Fargate target.
    - rule_id: DS-0026
      path: deploy/terraform/modules/codecommit-gate/files/gate.Dockerfile
      reason: >-
        Lambda manages this execution environment's lifecycle through the Runtime
        API and never reads a Docker HEALTHCHECK, so the instruction would have no
        effect. Same reasoning as this file's inline CKV_DOCKER_2 skip.
    # === trivy license scanner: two expressions the approved list does not match ===
    #
    # The approved-license entries above are keyed on rule ids of the form
    # <package>:<license>, so `*:MIT` matches a bare MIT and nothing else. These two
    # findings carry licenses that are not bare identifiers on that list, so they
    # need their own decision.
    #
    # Both packages live at node_modules/aws-cdk-lib/node_modules/, that is, inside
    # aws-cdk-lib's own vendored dependency tree, which is pinned to an exact version
    # in deploy/cdk/package.json. Neither can be upgraded or dropped without
    # changing aws-cdk-lib itself, so no change in this repository removes either
    # finding. Named per package and per file rather than as `*:<license>` with path
    # `**`, so the same license arriving in another lockfile has to be looked at
    # instead of inheriting this.
    - rule_id: "case:(MIT OR GPL-3.0-or-later)"
      path: deploy/cdk/package-lock.json
      reason: >-
        A disjunctive SPDX expression, not a dual obligation. The SPDX
        specification's license-expression annex defines OR as the operator to use
        "if presented with a choice between two or more licenses", so a recipient may
        take the MIT branch, and MIT is already on the approved list above. trivy
        reports it because the rule id is the whole expression string rather than
        either operand. The package is case 1.6.3, vendored under aws-cdk-lib.
    - rule_id: "minimatch:BlueOak-1.0.0"
      path: deploy/cdk/package-lock.json
      reason: >-
        BlueOak-1.0.0 is the SPDX identifier for the Blue Oak Model License 1.0.0,
        on the SPDX License List since 2019. Its own text grants each recipient
        permission "to do everything with this software that would otherwise
        infringe that contributor's copyright in it", grants the equivalent patent
        permission, and states that no contributor can revoke it; the one obligation
        it imposes is passing the license text or its URL along with any part of the
        software. Not asserted to be OSI-approved, because that could not be
        confirmed from the SPDX license page. The package is minimatch 10.2.5,
        vendored under aws-cdk-lib; the separate top-level minimatch 3.1.5 is ISC and
        is covered by the entry above.
  ignore_paths:
    - path: "**/.venv/**"
      reason: Virtual environment, not committed, only 3p content
    - path: "test-results/**"
      reason: CI-generated coverage reports contain rendered source that triggers false positives
    - path: "tests/test_data/**"
      reason: This is test data that is used during unit testing only and is not part of the core application.
    - path: "automated_security_helper/assets/ASH_COMMIT*"
      reason: This file is generated by the build process and does not contain any secrets or sensitive information.
    # `/**` is load-bearing: without it this pattern matches the directory entry
    # and nothing inside it, so the ignore did nothing. `ash config validate`
    # rejects it, but only where the directory exists -- tests/pytest-temp/ is
    # gitignored, so a fresh CI checkout has no such directory and the validator
    # stays quiet. It fails for a developer who has run pytest first. .ash/.ash.yaml
    # already carries the `/**` form.
    - path: "tests/pytest-temp/**"
      reason: This is temporary data that is generated during unit testing only and is not part of the core application.
    - path: "tests/integration/codecommit_gate_regression/cases/**"
      reason: >-
        Positive-control inputs for the pull-request gate regression fixture.
        cases/vulnerable/src/vulnerable.py is deliberately unsafe -- it exists so
        the fixture can assert that a dangerous input produces a blocking verdict,
        which is the assertion the gate was missing. Its bandit findings are the
        point of the file, so reporting them against this repository would be a
        false positive that also removes the only reason the file exists. Scoped to
        cases/ rather than the whole fixture so the harness itself (assert_case.py,
        run_regression.sh) is still scanned. Same entry as in .ash/.ash.yaml, which
        is where this decision was made; without it, this mode reports B307, B602
        and B605 on that file, none of which the default mode ever sees.
    - path: "**/automated_security_helper/schemas/AshAggregatedResults.json"
      reason: This file is generated by a corresponding Pydantic model and does not contain any secrets or sensitive information. Findings on this file are false positives and should be addressed on the related Pydantic models, not on this JSON file.
    - path: "**/automated_security_helper/schemas/AshConfig.json"
      reason: This file is generated by a corresponding Pydantic model and does not contain any secrets or sensitive information. Findings on this file are false positives and should be addressed on the related Pydantic models, not on this JSON file.
reporters:
  security-hub:
    enabled: false
  # cloudwatch-logs:
  #   enabled: false
  #   options:
  #     aws_region: !ENV ${AWS_REGION:None}
  #     log_group_name: !ENV ${ASH_CLOUDWATCH_LOG_GROUP:None}
  # s3:
  #   enabled: false
  #   options:
  #     aws_region: !ENV ${AWS_REGION:None}
  #     bucket_name: !ENV ${ASH_S3_BUCKET_NAME:None}
  #     bucket_prefix: !ENV ${ASH_S3_BUCKET_PREFIX:None}
  csv:
    enabled: true
  cyclonedx:
    enabled: true
  flat-json:
    enabled: true
  html:
    enabled: true
  junitxml:
    enabled: true
  markdown:
    enabled: true
    options:
      include_detailed_findings: true
      include_findings_table: false
      include_summary: true
      max_detailed_findings: 20
      top_hotspots_limit: 10
      use_collapsible_details: true
  ocsf:
    enabled: true
  sarif:
    enabled: true
  text:
    enabled: true
  gitlab-sast:
    enabled: true
  spdx:
    enabled: false
  yaml:
    enabled: false
scanners:
  bandit:
    enabled: true
    options:
      confidence_level: all
      ignore_nosec: false
      config_file: .ash/bandit.yaml
  cdk-nag:
    enabled: false
    options:
      nag_packs:
        AwsSolutionsChecks: true
        HIPAASecurityChecks: true
        NIST80053R4Checks: true
        NIST80053R5Checks: true
        PCIDSS321Checks: true
  cfn-nag:
    enabled: false
  checkov:
    enabled: false
    options:
      frameworks:
        - all
      additional_formats: []
      skip_path: []
      config_file: .ash/.checkov.yaml
      severity_threshold: LOW
  detect-secrets:
    enabled: false
  npm-audit:
    enabled: false
  grype:
    enabled: false
    options:
      config_file: .ash/.grype.yaml
  opengrep:
    enabled: false
  semgrep:
    enabled: false
  snyk-code:
    enabled: false
    severity_threshold: "MEDIUM"
  syft:
    enabled: false
  ferret-scan:
    enabled: true
    options:
      confidence_levels: "high"
      checks: "CREDIT_CARD,SECRETS,SSN,PASSPORT"
      recursive: true
      use_default_config: false
      exclude_patterns:
        - ".venv"
        - "tests/test_data"
        - ".ash/ash_output"
        - ".git"
        - "__pycache__"
        - "*.pyc"
  trivy-repo:
    enabled: true
    options:
      scanners: ["vuln", "misconfig", "secret", "license"]
      ignore_unfixed: false
      license_full: false
      disable_telemetry: true
      skip_dirs: ["tests/test_data"]
converters:
  archive:
    enabled: true # Disable once #197 is fixed, not required for the test
  jupyter:
    enabled: false
