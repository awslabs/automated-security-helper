    # =====================================================================
    # Community-plugin mode: bandit, ferret-scan, trivy-repo
    # =====================================================================
    #
    # This file enables a different scanner set from .ash/.ash.yaml -- bandit,
    # ferret-scan and trivy-repo, with cdk-nag, cfn-nag, checkov, detect-secrets,
    # grype, npm-audit, opengrep, semgrep, snyk-code and syft all off. Everything
    # below exists because of that difference rather than because the code differs.
    # Most of it is trivy-repo asking a question checkov or cfn-nag already asked
    # under a different rule id and answering it differently, and the rest is
    # bandit findings whose decision had only ever been written down in the other
    # file.
    #
    # WHERE THE COUNT GOES, counted rather than estimated. 107 active findings
    # collapse to 21 distinct (scanner, rule_id) pairs: 12 trivy misconfiguration
    # rules, 2 trivy license rules, 4 bandit rules, and 3 more bandit rules on one
    # deliberately-unsafe fixture file, which ignore_paths handles instead.
    #
    # Of the 12 misconfiguration rules, 9 map to a named checkov or cfn-nag rule
    # whose decision is already recorded, either in .ash/.ash.yaml or as an inline
    # skip in the terraform module: AWS-0017 to CKV_AWS_158, AWS-0031 to
    # CKV_AWS_51, AWS-0054 to CKV_AWS_2 and CFN_NAG_W56, AWS-0066 to CKV_AWS_50,
    # AWS-0089 to CKV_AWS_18, AWS-0098 to CKV_AWS_149, AWS-0104 to CFN_NAG_W5,
    # DS-0002 to CKV_DOCKER_3 and CKV_DOCKER_8, and DS-0026 to CKV_DOCKER_2.
    # AWS-0036 maps to a decision recorded here against detect-secrets rather than
    # checkov, on the same variable-name heuristic. That leaves two, AWS-0033 and
    # AWS-0132, where the nearest checkov rule asks a weaker question and therefore
    # passed, so the argument had to be assembled from the same cost family; both say
    # so where they sit.
    #
    # WHY THESE LIVE HERE RATHER THAN AS INLINE trivy:ignore COMMENTS. Two reasons,
    # and neither is preference. Four of the five affected templates are JSON, which
    # has no comment syntax, so an inline ignore is structurally unavailable. And
    # trivy documents that checks which fire on the ABSENCE of something cannot be
    # ignored inline, naming the missing-USER check as its example -- which is
    # DS-0002, one of the rules below. Keeping every one of them in this file also
    # means `ash config validate` and the unused-suppressions report can see them,
    # which an inline comment would not be.
    #
    # FERRET-SCAN CONTRIBUTES NOTHING TO THIS BLOCK, stated outright because a
    # scanner reporting nothing is indistinguishable from one that never ran. It
    # reports 4 findings, all the PASSPORT rule on scripts/generate_test_docx.py,
    # all 4 already covered by the PASSPORT entry above, and it reaches status
    # PASSED rather than MISSING or SKIPPED.
    #
    # PATHS ARE NAMED FILE BY FILE. A trailing `**` is a whole-subtree match, so a
    # sixth template or a new terraform module would inherit a suppression nobody
    # looked at; naming files costs entries and makes a new one fail loudly. This
    # follows the convention the detect-secrets block in .ash/.ash.yaml sets out at
    # length. No entry carries a line range either: `cdk synth` regenerates the
    # templates and the lines move, so resources are cited by logical id and
    # terraform by resource address.
    #
    # === bandit: ported from .ash/.ash.yaml, not re-derived ===
    #
    # Every bandit finding active in this mode already has a decision in
    # .ash/.ash.yaml against the same rule id and the same path. A suppression list
    # is not inherited across config files, so those decisions are restated here in
    # short form; the full argument stays in the other file. The paths were checked
    # against what this mode actually reports rather than copied wholesale, so the
    # entries there for files this mode does not flag are deliberately absent.
    #
    # B404 fires on `import subprocess` itself, before any call is examined, and
    # ASH's whole function is running other tools, so no code change satisfies it.
    # B603 is inverted rather than merely unfixable: it fires on every
    # `subprocess.run` that does NOT pass `shell=True`, so silencing it would add
    # the shell-injection surface the rule exists to warn about. Every call covered
    # below passes a list argv with `shell` left at False and a `shutil.which`
    # resolved argv[0], which matters because a bare argv[0] is re-resolved by the
    # child against whatever PATH it inherits.
    - rule_id: B104
      path: tests/unit/cli/test_mcp_sse_host_binding.py
      reason: >-
        This file exists to test 0.0.0.0 handling, so the address is the subject of
        the test rather than a careless default. AgentCore requires the MCP server
        to bind every interface; a loopback bind would be unreachable from a load
        balancer. Same entry as in .ash/.ash.yaml.
    - rule_id: B104
      path: tests/unit/cli/test_mcp_stateless_http.py
      reason: >-
        Same as test_mcp_sse_host_binding.py: asserts the streamable-http app is
        built with the host AgentCore requires, so the address is the value under
        test. Same entry as in .ash/.ash.yaml.
    - rule_id: B108
      path: deploy/terraform/modules/codecommit-gate/files/ash_pr_gate.py
      reason: >-
        The hardcoded /tmp cannot be relocated. This module runs as a Lambda
        function, whose execution environment mounts the root filesystem read-only
        and gives /tmp as the only writable path, so the clone and the scan output
        have nowhere else to go. It is a module-level constant rather than anything
        attacker influenced, and the line already carries a matching noqa for the
        ruff equivalent. Same entry as in .ash/.ash.yaml.
    - rule_id: B404
      path: ash-agent-plugins/agentic-coding/transpiler/tools/generate_models.py
      reason: "Imports subprocess to run the model generator; see the block comment above. Same entry as in .ash/.ash.yaml."
    - rule_id: B404
      path: ash-agent-plugins/agentic-coding/transpiler/tools/refresh_schemas.py
      reason: "Imports subprocess to run `git clone`; the URL is scheme-restricted to HTTP(S) before use. Same entry as in .ash/.ash.yaml."
    - rule_id: B404
      path: ash-agent-plugins/agentic-coding/transpiler/transpiler/backends/aider/__init__.py
      reason: "Backend shells out to its CLI; the import is the rule's only subject. Same entry as in .ash/.ash.yaml."
    - rule_id: B404
      path: ash-agent-plugins/agentic-coding/transpiler/transpiler/backends/generic_skill/__init__.py
      reason: "Backend shells out to its CLI; the import is the rule's only subject. Same entry as in .ash/.ash.yaml."
    - rule_id: B404
      path: ash-agent-plugins/agentic-coding/transpiler/transpiler/core.py
      reason: "Invokes external validators and CLIs; the import cannot be removed. Same entry as in .ash/.ash.yaml."
    - rule_id: B404
      path: deploy/terraform/modules/codecommit-gate/files/ash_pr_gate.py
      reason: >-
        The handler clones the pull request and runs ASH over it, so `import
        subprocess` cannot be removed. Same entry as in .ash/.ash.yaml.
    - rule_id: B603
      path: ash-agent-plugins/agentic-coding/transpiler/tools/generate_models.py
      reason: "List argv, shell=False, which-resolved argv[0]; see the block comment above. Same entry as in .ash/.ash.yaml."
    - rule_id: B603
      path: ash-agent-plugins/agentic-coding/transpiler/tools/refresh_schemas.py
      reason: >-
        List argv, shell=False, which-resolved argv[0]. The one configuration-sourced
        element, `source_url`, is scheme-restricted to HTTP(S) and passed after a
        `--` terminator, because `git clone` otherwise accepts `ext::<command>`.
        Same entry as in .ash/.ash.yaml.
    - rule_id: B603
      path: ash-agent-plugins/agentic-coding/transpiler/transpiler/backends/generic_skill/__init__.py
      reason: "List argv, shell=False, which-resolved argv[0]. Same entry as in .ash/.ash.yaml."
    - rule_id: B603
      path: ash-agent-plugins/agentic-coding/transpiler/transpiler/core.py
      reason: "List argv, shell=False, which-resolved argv[0]. Same entry as in .ash/.ash.yaml."
    - rule_id: B603
      path: deploy/terraform/modules/codecommit-gate/files/ash_pr_gate.py
      reason: >-
        The single call site is `_run(argv: list[str])`, which passes a list to
        `subprocess.run` with `shell` left at its default of False. The line already
        carries a matching noqa for the ruff equivalent. Same entry as in
        .ash/.ash.yaml.
    # === trivy: a conditional customer key reads as no key at all ===
    #
    # AWS-0017 (log group is not encrypted), AWS-0033 (repository encryption does
    # not use a customer managed KMS key) and AWS-0098 (secret is not encrypted
    # with a customer managed key) are trivy's identifiers for hardening
    # .ash/.ash.yaml records as already FIXED: 37 of the 53 checkov findings on
    # these templates were cleared by making a customer key opt-in through a
    # KmsKeyArn parameter. checkov passes on the result. trivy does not, and the
    # difference is the intrinsic rather than the posture.
    #
    # MEASURED TWICE, not reasoned about, because "the scanner is confused" is the
    # easiest thing to assert and the easiest to be wrong about.
    #
    #   1. Taking AshAgentCore.template.json as it stands and replacing only the
    #      three Fn::If wrapped key references with a literal KMS ARN -- KmsKeyId on
    #      both log groups, KmsKey under the ECR repository's EncryptionConfiguration,
    #      and KmsKeyId on the auth secret -- takes trivy from AWS-0017 twice,
    #      AWS-0033 once and AWS-0098 once to none of the three, leaving AWS-0031 and
    #      AWS-0066 untouched.
    #   2. Leaving the template alone and adding only a non-empty `Default` to the
    #      KmsKeyArn parameter clears the same three, and nothing else moves.
    #
    # The second result is the informative one: what trivy objects to is the value
    # the conditional yields when no key is supplied, not the presence of an
    # intrinsic. So this is NOT a case of a scanner failing to parse something. On
    # the default path the finding is literally true -- there is no customer managed
    # key -- and checkov's CKV_AWS_158 passes only because it accepts any non-null
    # value in the property.
    #
    # Which is why the apparent fix is refused rather than merely inconvenient. That
    # `Default` would have to be a KMS key ARN, and no ARN exists that is valid in
    # every adopter's account; the parameter's own AllowedPattern admits `^$` and its
    # Description says "Empty uses AWS-managed encryption", so a Default would
    # contradict the documented behaviour and point at a key nobody owns. The cost of
    # removing the option instead is a customer managed key per deployment, billed
    # monthly per key plus per request, to encrypt container image build logs and a
    # placeholder secret that the non-MCP stacks never read.
    #
    # The terraform modules reach the same place from the other direction, and the
    # honest wording differs: there the inputs simply default to null, so trivy
    # resolves the HCL correctly and the findings are accurate rather than artifacts.
    # ECR encryption_type is a ternary on ecr_kms_key_arn, and the log groups set no
    # kms_key_id at all. The trade is already recorded there against checkov's
    # CKV_AWS_158 and CKV_AWS_149 as inline skips on
    # deploy/terraform/modules/*/main.tf.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshAgentCore.template.json
      reason: >-
        ImageBuildLogs and ImageBootstrapStarterLogs both take KmsKeyId from the
        HasKmsKey condition on the KmsKeyArn parameter. See the block comment above
        for the measurement, and the CKV_AWS_158 inline skips for the cost.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshCodeCommitGate.template.json
      reason: >-
        ImageBuildLogs, ImageBootstrapStarterLogs and ScanLogs, all three keyed off
        the same HasKmsKey condition. Same mechanism as the AshAgentCore entry.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        ImageBuildLogs, keyed off the same HasKmsKey condition. Same mechanism as
        the AshAgentCore entry.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        ImageBuildLogs, ImageBootstrapStarterLogs, VpcFlowLogs and TaskLogs, all
        keyed off the same HasKmsKey condition. Same mechanism as the AshAgentCore
        entry.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshImagePipeline.template.json
      reason: >-
        Arm64BuildLogs and Amd64BuildLogs, one per architecture, both keyed off the
        same HasKmsKey condition. Same mechanism as the AshAgentCore entry.
    - rule_id: AWS-0017
      path: deploy/terraform/modules/ash-image-pipeline/main.tf
      reason: >-
        aws_cloudwatch_log_group.build sets no kms_key_id. This is the resource
        checkov reports CKV_AWS_158 on, where the module already carries an inline
        skip recording that CloudWatch Logs encrypts at rest with an AWS managed key
