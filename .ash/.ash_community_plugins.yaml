    # === trivy AWS-0031 is checkov's CKV_AWS_51, same repositories ===
    #
    # "Repository tags are mutable" is the rule checkov reports as CKV_AWS_51, and
    # that decision is already made in two places: the CKV_AWS_51 entries in
