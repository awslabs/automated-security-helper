        suppression should not imply a posture the resource does not have. Left
        open deliberately and recorded here so it is visible in review.
    # === trivy AWS-0036 matches the variable NAME, not a value ===
    #
    # MEASURED. Renaming ASH_MCP_AUTH_HEADER_VALUE_SECRET_ARN to
    # ASH_MCP_AUTH_HEADER_VALUE_LOCATOR in AshFargate.template.json and changing
    # nothing else takes trivy's AWS-0036 count from one to zero, so the rule is
    # matching on the name. That is the same heuristic .ash/.ash.yaml already
    # records for detect-secrets on deploy/terraform/modules/ash-image-pipeline/
    # files/ash-container-init, where the match was the NAME of the variable holding
    # an ARN.
    #
    # A rename would clear it, and was rejected: the name is read by the generated
    # entrypoint in deploy/cdk/lib/ash-container-scripts.ts, asserted by the CDK
    # tests, and shipped in three committed templates, so renaming trades an
    # accurate description for a scanner's keyword list. Moving the value into the
    # task definition's Secrets block would be worse -- that injects the RESOLVED
    # secret into the container environment, which is exactly what this design
    # avoids.
    - rule_id: AWS-0036
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        The match is an environment variable NAME on the ECS task definition,
        beginning ASH_MCP_AUTH_HEADER_VALUE and ending in _ARN. Written split
        rather than spelled out, because spelling it contiguously makes this
        reason itself a keyword finding -- the same trap the hex entry in
        .ash/.ash.yaml records, and the reason this file previously failed the
        Windows scan. Its value is not a credential. mcpEnvironment in
        deploy/cdk/lib/ash-runtime-config.ts sets it from the auth secret's ARN
        behind an Fn::If, and the entrypoint generated
        by deploy/cdk/lib/ash-container-scripts.ts calls GetSecretValue on that ARN
        at container start. The secret value therefore never enters the task
        definition, which is what the secret's own Description in this template
        says.
    # === trivy DS-0002 and DS-0026 are already decided in the Dockerfiles ===
    #
    # Both Dockerfiles carry inline `checkov:skip` comments for exactly these two
    # questions, and the mapping is one to one:
    #
    #   DS-0002 "specify at least 1 USER command with a non-root user" maps to
    #   CKV_DOCKER_3 on wrapper.Dockerfile, which sets no USER at all, and to
    #   CKV_DOCKER_8 on gate.Dockerfile, which sets USER root. checkov reports
    #   CKV_DOCKER_3 only on the first and CKV_DOCKER_8 only on the second; trivy
    #   reports DS-0002 on both, because one rule covers both shapes.
    #
    #   DS-0026 "add HEALTHCHECK" maps to CKV_DOCKER_2 on both files.
    #
    # MEASURED that the rules read what they say: adding a USER and a HEALTHCHECK to
    # a copy of wrapper.Dockerfile clears both. That measurement proves the scanner
    # is satisfied, and NOT that the change is viable -- which is the whole point
    # here, so it is worth being blunt about. The uid used to clear it, 1000, is not
    # ASH's: the root Dockerfile's non-root stage builds ash-user as 500:100 and
    # chowns the home directory, /src and /out to exactly that pair, so a container
    # running as 1000 would own none of them. The change that turns this rule green
    # breaks the DEFAULT target rather than an edge case.
    #
    # What blocks a real fix is the design, not the scanner. The base image arrives
    # through the ASH_BASE_IMAGE build argument, whose stage is chosen by
    # ash-image-pipeline's ash_image_target input: `core` and `ci` create no user and
    # chown nothing, and only `non-root`, the default, defines 500:100. So any USER
    # the wrapper hardcodes converts a documented three-way operator choice into a
    # one-way one -- and `ci` exists precisely because, as its variable description
    # records, some scanners and some CI environments require root. Whether the
    # running container is unprivileged is therefore ash_image_target's decision, not
    # this file's.
    - rule_id: DS-0002
      path: deploy/terraform/modules/ash-image-pipeline/files/wrapper.Dockerfile
      reason: >-
        No USER is set here and no fixed uid could be: the base image target is
        configurable through ASH_BASE_IMAGE and only its non-root target defines
        one. The ash_image_target input decides this, not the wrapper. Same
        reasoning as this file's inline CKV_DOCKER_3 skip, and the reason the COPY
        instructions use --chmod rather than a RUN chmod.
    - rule_id: DS-0002
      path: deploy/terraform/modules/codecommit-gate/files/gate.Dockerfile
      reason: >-
        USER root is set and cannot be reverted: pip needs to write to
        site-packages, ASH's scanners need root to run, and no fixed uid could be
        restored because only the base image's non-root target defines one. This
        image is a Lambda function, where each invocation gets a single-tenant
        execution environment with a read-only root filesystem outside /tmp, so root
        confers nothing across a boundary. Same reasoning as this file's inline
        CKV_DOCKER_8 skip.
    - rule_id: DS-0026
      path: deploy/terraform/modules/ash-image-pipeline/files/wrapper.Dockerfile
      reason: >-
        Nothing that runs this image reads a Docker HEALTHCHECK. AgentCore Runtime
        probes the container over its own protocol, and ECS documents that it "does
        not monitor Docker health checks that are embedded in a container image and
        not specified in the container definition" -- the Fargate target is
        health-checked by its ALB target group instead. An inherited HEALTHCHECK
        could not be relied on either, since only the base image's non-root target
        declares one. Same reasoning as this file's inline CKV_DOCKER_2 skip.
        Deliberately NOT the argument .ash/.ash.yaml gives for CKV_DOCKER_2 on the
        repository's own Dockerfile: "ASH is a CLI tool" is false of this image,
        which serves long-running HTTP behind a load balancer on the Fargate target.
    - rule_id: DS-0026
      path: deploy/terraform/modules/codecommit-gate/files/gate.Dockerfile
      reason: >-
        Lambda manages this execution environment's lifecycle through the Runtime
        API and never reads a Docker HEALTHCHECK, so the instruction would have no
        effect. Same reasoning as this file's inline CKV_DOCKER_2 skip.
    # === GuardDog (#727): false positives, approved by the maintainer 2026-10-07 ===
    # The same 12 entries as .ash/.ash.yaml. This is the config the self-scan runs
    # GuardDog under, and it does not read .ash/.ash.yaml.
    # One entry per finding, pinned to its line, so a new hit anywhere else in these
    # files is still reported. If a line moves, the finding comes back and the entry
    # needs its line updated, which is the point of not using a range or a glob.
    - rule_id: threat-process-download-exec
      path: automated_security_helper/assets/install-pinned-tool.py
      line_start: 253
      line_end: 253
      reason: "urlopen in download(): every asset is digest-checked before extraction and nothing downloaded is executed."
    - rule_id: threat-process-download-exec
      path: automated_security_helper/assets/install-pinned-tool.py
      line_start: 701
      line_end: 701
      reason: "subprocess.run of `uv tool dir`; it runs nothing this script downloaded."
    - rule_id: threat-process-download-exec
      path: automated_security_helper/assets/install-pinned-tool.py
      line_start: 973
      line_end: 973
      reason: "subprocess.run of `<tool> --version` on an installed binary in a throwaway HOME; nothing downloaded is executed."
    - rule_id: threat-filesystem-destruction
      path: deploy/cdk-constructs/test/ash-scan-step.test.ts
      line_start: 367
      line_end: 367
      reason: "'main; rm -rf /' is an input the test asserts is rejected at synth."
    - rule_id: threat-filesystem-read
      path: deploy/cdk-constructs/test/ash-scan-step.test.ts
      line_start: 362
      line_end: 362
      reason: "file:///etc/passwd is an input the test asserts is rejected as non-https."
    - rule_id: threat-filesystem-destruction
      path: tests/snapshot/test_snapshot_normalizer.py
      line_start: 264
      line_end: 264
      reason: "Regex artifact: the match is the \"rm\" inside \"normalizer\" before add_literal(\"/home/...\"); nothing is deleted."
    - rule_id: threat-filesystem-destruction
      path: tests/snapshot/test_snapshot_normalizer.py
      line_start: 272
      line_end: 272
      reason: "Regex artifact: the match is the \"rm\" inside \"normalizer\" before add_literal(\"/home/...\"); nothing is deleted."
    - rule_id: threat-filesystem-read
      path: tests/unit/test_artifact_contents_gate.py
      line_start: 782
      line_end: 782
      reason: "Symlink target in a synthetic archive that the gate under test must reject."
    - rule_id: threat-filesystem-read
      path: tests/unit/test_artifact_contents_gate.py
      line_start: 1469
      line_end: 1469
      reason: "Symlink target in a synthetic archive that the gate under test must reject."
    - rule_id: threat-filesystem-read
      path: tests/unit/test_defense_in_depth.py
      line_start: 404
      line_end: 404
      reason: "'v1.0|cat /etc/passwd' is a revision string the test asserts is rejected."
    - rule_id: threat-filesystem-read
      path: tests/unit/test_pinned_tool_version_check.py
      line_start: 1131
      line_end: 1131
      reason: "file:///etc/passwd is a URL the test asserts is refused before opening."
    - rule_id: threat-runtime-obfuscation-base64exec
      path: tests/unit/utils/test_opengrep_pinned_download.py
      line_start: 392
      line_end: 392
      reason: "Decodes a nix SRI hash to hex to compare with the pinned table; nothing is executed."
    # === trivy license scanner: two expressions the approved list does not match ===
    #
    # The approved-license entries above are keyed on rule ids of the form
    # <package>:<license>, so `*:MIT` matches a bare MIT and nothing else. These two
    # findings carry licenses that are not bare identifiers on that list, so they
    # need their own decision.
    #
    # Both packages live at node_modules/aws-cdk-lib/node_modules/, that is, inside
    # aws-cdk-lib's own vendored dependency tree, which is pinned to an exact version
    # in deploy/cdk/package.json. Neither can be upgraded or dropped without
    # changing aws-cdk-lib itself, so no change in this repository removes either
    # finding. Named per package and per file rather than as `*:<license>` with path
    # `**`, so the same license arriving in another lockfile has to be looked at
    # instead of inheriting this.
    - rule_id: "case:(MIT OR GPL-3.0-or-later)"
      path: deploy/cdk/package-lock.json
      reason: >-
        A disjunctive SPDX expression, not a dual obligation. The SPDX
        specification's license-expression annex defines OR as the operator to use
        "if presented with a choice between two or more licenses", so a recipient may
        take the MIT branch, and MIT is already on the approved list above. trivy
        reports it because the rule id is the whole expression string rather than
        either operand. The package is case 1.6.3, vendored under aws-cdk-lib.
    - rule_id: "minimatch:BlueOak-1.0.0"
      path: deploy/cdk/package-lock.json
      reason: >-
        BlueOak-1.0.0 is the SPDX identifier for the Blue Oak Model License 1.0.0,
        on the SPDX License List since 2019. Its own text grants each recipient
        permission "to do everything with this software that would otherwise
        infringe that contributor's copyright in it", grants the equivalent patent
        permission, and states that no contributor can revoke it; the one obligation
        it imposes is passing the license text or its URL along with any part of the
        software. Not asserted to be OSI-approved, because that could not be
        confirmed from the SPDX license page. The package is minimatch 10.2.5,
        vendored under aws-cdk-lib; the separate top-level minimatch 3.1.5 is ISC and
        is covered by the entry above.
    # === Time-boxed: dnspython CVE-2026-114605 / GHSA-45c3-73f7-pv4m on Python 3.10 (expires 2026-11-24) ===
    # Same decision as the dnspython entries in .ash/.ash.yaml, restated here because
    # a suppression list is not inherited across config files. uv.lock holds two
    # dnspython entries. The one for Python 3.11 and later is at 2.9.0, the first
    # fixed release. The one for Python 3.10 stays at 2.8.0 because 2.9.0 requires
    # Python 3.11 and requires-python is >=3.10. dnspython comes in through
    # email-validator, which pydantic[email] uses to validate email syntax. The
    # version is pinned in the entry, so the 2.9.0 entry is never covered and a
    # different 3.10 version reports again. trivy-repo reports the CVE id as is; grype,
    # which would add the package name to the GHSA id, is off in this mode.
    # Revisit when requires-python rises or a dnspython release supporting Python
    # 3.10 ships.
    - rule_id: "CVE-2026-114605"
      path: "uv.lock"
      package_name: "dnspython"
      package_version: "2.8.0"
      expiration: "2026-11-24"
      reason: >-
        CVE-2026-114605 (GHSA-45c3-73f7-pv4m): dnspython 2.8.0 in uv.lock, the Python 3.10
        entry. The fixed release 2.9.0 requires Python 3.11; the Python 3.11 and later entry
        is at 2.9.0. Revisit when requires-python rises or a supporting release ships.
    # === ferret-scan API_KEY_OR_SECRET, continued: names and generated templates ===
    #
    # The same unquoted-assignment and name-matching dispositions as the ferret-scan
    # blocks above. Per-file entries naming the flagged value, as the existing ferret
    # entries do.
    - path: tests/unit/test_docs_ci_runner_judgments.py
      rule_id: API_KEY_OR_SECRET
      reason: >-
        The flagged line assigns the TOKEN constant a pattern-built 32-hex
        fixture value that the judgment tests use as the thing that must be
        redacted from runner output. The fixture exists to prove redaction. The
        reason does not repeat the assignment, so this file does not flag itself.
    # === gitleaks: fixture tokens in tests (kept in step with .ash/.ash.yaml) ===
    - rule_id: "generic-api-key"
      path: "tests/unit/docs/test_page_claims.py"
      reason: >-
        The match is the docs' illustrative example DATABASE_PASSWORD =
        "correct-horse-battery-staple-1234", embedded here because this test
        executes the documentation's own snippets verbatim. A published doc
        example, not a credential.
    - rule_id: "generic-api-key"
      path: "tests/unit/test_docs_ci_runner_judgments.py"
      reason: >-
        The flagged line assigns the TOKEN constant a pattern-built 32-hex
        fixture value (it starts 0a1b2c3d) that the judgment tests use as the
        thing that must be redacted from runner output. The fixture exists to
        prove redaction. The reason does not repeat the assignment, so this file
        does not flag itself.
    # === bandit in tests and one log line (kept in step with .ash/.ash.yaml) ===
    - rule_id: B104
      path: automated_security_helper/cli/mcp/__init__.py
      reason: >-
        Not a bind. The flagged line is the startup LOG helper that reproduces
        uvicorn's "running on" message: host = "0.0.0.0" if config.host is None
        mirrors the display default uvicorn itself logs; the socket was bound
        elsewhere, where tests/unit/cli/test_mcp_non_loopback_bind_is_refused.py
        asserts a non-loopback bind is refused without the explicit opt-in.
    - rule_id: B314
      path: tests/integration/docs/ci_runners/reports.py
      reason: >-
        ET.parse reads the JUnit XML the harness's own pinned CI runners just
        wrote inside the test sandbox, counting testcases; a parse failure is
        skipped. Input produced by the fixture run itself, not attacker XML.
    - rule_id: B314
      path: tests/integration/docs/ci_runners/verdict.py
      reason: >-
        ET.fromstring parses the JUnit file Jenkins wrote inside the leg's own
        container, after stripping the XML 1.1 declaration Jenkins emits. The
        harness consumes its own run's output.
    # === trivy-repo misconfiguration: the gitlab-ci-local helper fixture ===
    - rule_id: "DS-0002"
      path: "tests/integration/docs/ci_runners/gitlab-helper/Dockerfile"
      reason: >-
        The helper image gitlab-ci-local uses around a job must run as root: it
        sets build-directory ownership and copies artifacts under /artifacts at
        the filesystem root, as gitlab-ci-local's own helper image does. The
        file's checkov:skip=CKV_DOCKER_3 header records the same decision for
        checkov; this entry is trivy's spelling of it.
  ignore_paths:
    - path: "**/.venv/**"
      reason: Virtual environment, not committed, only 3p content
    - path: ".cache/**"
      reason: >-
        Gitignored local cache. The test suite extracts the jsii package cache here
        (aws-cdk-lib alone is about 7,500 files of third-party JavaScript).
    - path: "test-results/**"
      reason: CI-generated coverage reports contain rendered source that triggers false positives
    - path: "tests/test_data/**"
      reason: This is test data that is used during unit testing only and is not part of the core application.
    # The same entry as in .ash/.ash.yaml, which explains the "/**/*" spelling: ASH's
    # path matcher ignores a trailing "**" once the pattern has more than one segment.
    # Without it here, ferret-scan reported the fixture's placeholder password as
    # API_KEY_OR_SECRET (CRITICAL) in four reporter snapshots that quote it.
    - path: "tests/**/__snapshots__/**/*"
      reason: >-
        Recorded output of the snapshot tests under tests/, most of it ASH's reports
        on the deliberately insecure fixture under tests/test_data/snapshot_fixture.
        The reports quote that fixture's findings (a placeholder password, a
        shell=True call), so scanning them would report tests/test_data a second time
        through its own snapshots. Limited to tests/ so a __snapshots__ directory
        anywhere else in the repository is still scanned.
    - path: "automated_security_helper/assets/ASH_COMMIT*"
      reason: This file is generated by the build process and does not contain any secrets or sensitive information.
    # Byte-for-byte copies of two tracked files, staged into assets/ by
    # hatch_build.py because the shipped Dockerfile's build context is the assets
    # directory and cannot COPY from outside it. Both originals are scanned at
    # their tracked paths, so every finding here is a duplicate of one already
    # accounted for -- and assets/tool_downloads.py in particular reproduced all
    # 16 release checksums outside the line range the suppression above covers,
    # which failed the community-plugins legs with 16 CRITICAL
    # API_KEY_OR_SECRET findings on a file nobody edits.
    #
    # Ignored by exact path rather than by an assets/*.py glob, so a genuinely
    # new Python asset is still scanned. Extending the suppression's line range
    # to a second path was rejected: the range would then have to be correct in
    # two places for one table, and tests/unit/utils/test_pinned_tool_downloads.py
    # asserts that range against where _DIGESTS actually opens and closes.
    - path: "automated_security_helper/assets/tool_downloads.py"
      reason: >-
        Build-generated copy of automated_security_helper/utils/tool_downloads.py,
        which is scanned and suppressed at its tracked path. Staged into assets/ by
        hatch_build.py so the shipped Dockerfile can COPY it from its own build
        context.
    - path: "automated_security_helper/assets/exceptions.py"
      reason: >-
        Build-generated copy of automated_security_helper/core/exceptions.py, which
        is scanned at its tracked path. Staged into assets/ by hatch_build.py
        because tool_downloads.py imports it.
    # `/**` is load-bearing: without it this pattern matches the directory entry
    # and nothing inside it, so the ignore did nothing. `ash config validate`
    # rejects it, but only where the directory exists -- tests/pytest-temp/ is
    # gitignored, so a fresh CI checkout has no such directory and the validator
    # stays quiet. It fails for a developer who has run pytest first. .ash/.ash.yaml
    # already carries the `/**` form.
    - path: "tests/pytest-temp/**"
      reason: This is temporary data that is generated during unit testing only and is not part of the core application.
    - path: "tests/integration/codecommit_gate_regression/cases/**"
      reason: >-
        Positive-control inputs for the pull-request gate regression fixture.
        cases/vulnerable/src/vulnerable.py is deliberately unsafe -- it exists so
        the fixture can assert that a dangerous input produces a blocking verdict,
        which is the assertion the gate was missing. Its bandit findings are the
        point of the file, so reporting them against this repository would be a
        false positive that also removes the only reason the file exists. Scoped to
        cases/ rather than the whole fixture so the harness itself (assert_case.py,
        run_regression.sh) is still scanned. Same entry as in .ash/.ash.yaml, which
        is where this decision was made; without it, this mode reports B307, B602
        and B605 on that file, none of which the default mode ever sees.
    - path: "**/automated_security_helper/schemas/AshAggregatedResults.json"
      reason: This file is generated by a corresponding Pydantic model and does not contain any secrets or sensitive information. Findings on this file are false positives and should be addressed on the related Pydantic models, not on this JSON file.
    - path: "**/automated_security_helper/schemas/AshConfig.json"
      reason: This file is generated by a corresponding Pydantic model and does not contain any secrets or sensitive information. Findings on this file are false positives and should be addressed on the related Pydantic models, not on this JSON file.
    # The same entry as in .ash/.ash.yaml, where the default mode already made
    # this call. Without it here, the community scanners report the docs'
    # illustrative DATABASE_PASSWORD example (gitleaks and ferret-scan, on
    # platform-teams.md, its .template and reference/coverage.md), which is not
    # shipped code or a real credential.
    - path: "docs/**"
      reason: Documentation content with example code snippets — secrets/keywords in examples are illustrative, not real credentials.
