# yaml-language-server: $schema=../automated_security_helper/schemas/AshConfig.json
project_name: automated-security-helper
fail_on_findings: true
#ash_plugin_modules: []
# automated_security_helper.plugin_modules.ash_snyk_plugins is not listed: this file
# is inside the scanned tree, and such a file cannot load it, because its scanner
# sends the scanned source to Snyk with the operator's token. The CI legs that use
# this file pass it with --ash-plugin-modules (.github/actions/run-scan-test).
ash_plugin_modules:
  - automated_security_helper.plugin_modules.ash_trivy_plugins
  - automated_security_helper.plugin_modules.ash_ferret_plugins
external_reports_to_include: []
global_settings:
  severity_threshold: MEDIUM
  suppressions:
    # === GuardDog false positive in this repository's own tests (line-pinned) ===
    # GuardDog's heuristics read source text, so test code that writes a fake
    # credentials file matches them. Pinned to the one line GuardDog reports, so a
    # real finding elsewhere in the file is still reported. The test writes creds.env
    # twice, at lines 775 and 991; GuardDog 3.2.0 drops a match whose code snippet
    # is the same as one it already reported, so it reports 775 only.
    - rule_id: "threat-filesystem-read"
      path: "tests/integration/scanners/test_trivy_real_binary.py"
      line_start: 775
      line_end: 775
      reason: >-
        False positive. The line writes a creds.env holding a fake AWS key id and
        secret, generated per run with secrets.choice, into the test's temporary
        fixture tree so trivy's secret scanner has something to find. Nothing reads
        a real credentials file.
    # === Product code and documents: pinned or scoped to the file ===
    - rule_id: B104
      path: automated_security_helper/cli/mcp/__init__.py
      line_start: 930
      line_end: 930
      reason: >-
        False positive. The line only works out the host to show in the "running on"
        message, for a server whose socket is already bound. Nothing binds to it, and
        the line is pinned so that a bind elsewhere in the file still reports.
    - rule_id: API_KEY_OR_SECRET
      path: automated_security_helper/config/tool_config_trust.py
      line_start: 122
      line_end: 122
      reason: >-
        False positive. The line is one row of a table that names, for each scanner,
        the option that points at a file; the detector reads a scanner name and a word
        in the row. No value is held.
    - rule_id: API_KEY_OR_SECRET
      path: "deploy/cdk/templates/*.template.json"
      reason: >-
        False positive. The flagged lines are CloudFormation logical ids and references
        to them (a hash-suffixed id for the MCP auth header resource, route table ids)
        and a build command that names a repository URL variable. The templates hold
        names, not values.
    - rule_id: API_KEY_OR_SECRET
      path: automated_security_helper/plugin_modules/ash_ferret_plugins/spec/2026-09-13-ferret-scan-plugin-v2-update-analysis.md
      reason: >-
        False positive. These design notes quote, in prose, the type annotation that
        causes this false positive in ferret-scan.
    - rule_id: API_KEY_OR_SECRET
      path: CHANGELOG.md
      reason: >-
        False positive. A changelog sentence about a Security Hub credentials check; it
        holds words, not a credential.
    - rule_id: SSN
      path: docs/content/reference/converters.md
      reason: >-
        False positive. The nine-digit numbers are the 256 MiB byte limits in the
        converter option examples and table, which the detector reads as a social
        security number. The number is left out of this reason because it would make
        this file trip the same rule.
