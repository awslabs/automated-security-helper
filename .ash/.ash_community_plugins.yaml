        CIDR needs interface endpoints, billed hourly per Availability Zone.
    - rule_id: AWS-0104
      path: deploy/terraform/modules/fargate/main.tf
      reason: >-
        aws_vpc_security_group_egress_rule.service_all, the terraform counterpart of
        the rule CFN_NAG_W5 covers above, with the same public-internet destination
        for the same four AWS API endpoints. Narrowing the destination depends on
        whether the caller's VPC uses NAT or interface endpoints, which this module
        does not know; the comment above the resource records that.
        IMPORTANT ASYMMETRY, do not read the section header above as covering this
        entry: unlike the CDK security group, this resource is ip_protocol "-1",
        every protocol and every port, not TCP 443. Every sibling egress rule in
        this module pins "tcp"; this one alone does not. Narrowing it would NOT
        clear AWS-0104, which reads the CIDR rather than the protocol, so it is a
