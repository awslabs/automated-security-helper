    # === trivy AWS-0132: SSE-S3 on the buckets, one of them by AWS requirement ===
    #
    # "Bucket does not encrypt data with a customer managed key" fires on every
    # bucket in these two stacks. All of them are BucketEncryption S3_MANAGED, which
    # is SSE-S3 with an AWS managed key, so they are encrypted at rest and the rule
    # is about WHICH key. No default-mode scanner asks this: checkov's CMK rule for
    # S3 has no CloudFormation implementation, its CloudFormation rule CKV_AWS_19
    # accepts AES256, and cfn-nag's W41 only checks that an encryption block exists.
    # So unlike most of this block there is no prior decision to point at, and the
    # argument is assembled here from the same cost family.
    #
    # For the load-balancer log bucket the answer is not ours to make: AWS documents
    # that for an Application Load Balancer access-log bucket "the only server-side
    # encryption option that's supported is Amazon S3-managed keys (SSE-S3)"
    # (Elastic Load Balancing User Guide, Enable access logs for your Application
    # Load Balancer, Step 1 requirements). accessLogArchiveProps in
    # deploy/cdk/lib/ash-config.ts records that the archive bucket matches it to
    # keep one shape across both stacks.
    #
    # For the remaining pipeline buckets the trade is the one already recorded
    # against CKV_AWS_158 and CKV_AWS_149: a customer managed key is billed monthly
    # per key plus per request, and it would additionally need a decrypt grant on
    # every CodePipeline action role that touches an artifact. Wiring KmsKeyArn
    # through to these buckets is a reasonable follow-up for a deployment that needs
    # it; it is not something a template should impose on every adopter.
    - rule_id: AWS-0132
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        All five buckets -- AccessLogsArchive, AccessLogs, Source, Results and
        Artifacts -- are S3_MANAGED, so each is encrypted at rest with an AWS
        managed key. See the block comment above for the ALB requirement on the log
        pair and the per-key cost on the other three.
    - rule_id: AWS-0132
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        AccessLogs receives the load balancer's access logs, and SSE-S3 is the only
        encryption AWS supports on that bucket; AccessLogsArchive matches it, as
        accessLogArchiveProps records. Neither could take a customer key.
    # === trivy AWS-0089: an access-log chain has to terminate somewhere ===
    #
    # "Bucket has logging disabled" fires on exactly one bucket per stack,
    # AccessLogsArchive, and on no other -- every other bucket names a destination.
    # That bucket is the terminus of the chain, and it logs to ITSELF, which CDK
    # expresses as a LoggingConfiguration carrying only a LogFilePrefix.
    #
    # MEASURED. Adding a DestinationBucketName to AccessLogsArchive in
    # AshFargate.template.json, changing nothing else, takes trivy's AWS-0089 count
    # for that template from one to zero. So the rule reads the destination and a
    # self-reference does not satisfy it. checkov's CKV_AWS_18 does accept the
    # prefix-only form, which is why the default config reports nothing here; the
    # doc comment on accessLogArchiveProps in deploy/cdk/lib/ash-config.ts records
    # the probe template that established that.
    #
    # There is no configuration that clears this. Turning logging on needs a
    # destination, the destination needs one too, and the chain has to stop; the only
    # decision is which bucket points at itself, and the same comment sets out why
    # it is the quietest one and which two alternatives were rejected. Adding a
    # third bucket relocates the finding rather than removing it, which is the same
    # conclusion cdk-nag's AwsSolutions-S1 suppression reaches in
    # suppressLogBucketSelfLogging.
    - rule_id: AWS-0089
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        AccessLogsArchive, the chain terminus, whose LoggingConfiguration names a
        prefix and no destination because it delivers to itself. See the block
        comment above and accessLogArchiveProps.
    - rule_id: AWS-0089
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        AccessLogsArchive, the chain terminus in this stack, same shape as the
        AshDistributedPipeline entry.
    - rule_id: AWS-0089
      path: deploy/terraform/modules/codepipeline-executor/main.tf
      reason: >-
        The artifact bucket, which is the resource this module's inline CKV_AWS_18
        skip already covers: server access logging needs a second log bucket per
        deployment, access here is limited to roles declared in the module, and
        object-level access is auditable account-wide through CloudTrail data
