    # aws_ecr_repository in the ash-image-pipeline and codecommit-gate modules. The
    # counts line up exactly, six terraform findings against six CKV_AWS_51
    # terraform findings and six template findings against six.
    #
    # MUTABLE is load-bearing rather than an oversight. Every build republishes a
    # moving tag, which is what lets a long-lived deployment pick up base-image and
    # scanner patches without a stack update; IMMUTABLE would make the second
    # scheduled rebuild fail on the push. A version-qualified tag is pushed
    # alongside it for anyone who wants immutable pinning, and AshImageTag in the
    # templates and ecr_image_tag_mutability in the modules are the opt-ins. Cited
    # by symbol rather than by line because the lines move.
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshAgentCore.template.json
      reason: >-
        ImageRepository is MUTABLE because flavorBuildCommands in
        deploy/cdk/lib/ash-image-build.ts republishes the moving tag on every
        rebuild. See the CKV_AWS_51 entry for this same file in .ash/.ash.yaml.
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshCodeCommitGate.template.json
      reason: "ImageRepository, same mechanism and same CKV_AWS_51 entry as AshAgentCore."
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        ImageRepository, same mechanism as AshAgentCore. This template additionally
        consumes the moving tag as a CodeBuild environment image, resolved when each
        build starts.
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshFargate.template.json
      reason: "ImageRepository, same mechanism and same CKV_AWS_51 entry as AshAgentCore."
    - rule_id: AWS-0031
      path: deploy/cdk/templates/AshImagePipeline.template.json
      reason: >-
        Arm64Repository and Amd64Repository, one per architecture. Same mechanism as
