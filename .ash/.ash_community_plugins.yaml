    # === trivy: a conditional customer key reads as no key at all ===
    #
    # AWS-0017 (log group is not encrypted), AWS-0033 (repository encryption does
    # not use a customer managed KMS key) and AWS-0098 (secret is not encrypted
    # with a customer managed key) are trivy's identifiers for hardening
    # .ash/.ash.yaml records as already FIXED: 37 of the 53 checkov findings on
    # these templates were cleared by making a customer key opt-in through a
    # KmsKeyArn parameter. checkov passes on the result. trivy does not, and the
    # difference is the intrinsic rather than the posture.
    #
    # MEASURED TWICE, not reasoned about, because "the scanner is confused" is the
    # easiest thing to assert and the easiest to be wrong about.
    #
    #   1. Taking AshAgentCore.template.json as it stands and replacing only the
    #      three Fn::If wrapped key references with a literal KMS ARN -- KmsKeyId on
    #      both log groups, KmsKey under the ECR repository's EncryptionConfiguration,
    #      and KmsKeyId on the auth secret -- takes trivy from AWS-0017 twice,
    #      AWS-0033 once and AWS-0098 once to none of the three, leaving AWS-0031 and
    #      AWS-0066 untouched.
    #   2. Leaving the template alone and adding only a non-empty `Default` to the
    #      KmsKeyArn parameter clears the same three, and nothing else moves.
    #
    # The second result is the informative one: what trivy objects to is the value
    # the conditional yields when no key is supplied, not the presence of an
    # intrinsic. So this is NOT a case of a scanner failing to parse something. On
    # the default path the finding is literally true -- there is no customer managed
    # key -- and checkov's CKV_AWS_158 passes only because it accepts any non-null
    # value in the property.
    #
    # Which is why the apparent fix is refused rather than merely inconvenient. That
    # `Default` would have to be a KMS key ARN, and no ARN exists that is valid in
    # every adopter's account; the parameter's own AllowedPattern admits `^$` and its
    # Description says "Empty uses AWS-managed encryption", so a Default would
    # contradict the documented behaviour and point at a key nobody owns. The cost of
    # removing the option instead is a customer managed key per deployment, billed
    # monthly per key plus per request, to encrypt container image build logs and a
    # placeholder secret that the non-MCP stacks never read.
    #
    # The terraform modules reach the same place from the other direction, and the
    # honest wording differs: there the inputs simply default to null, so trivy
    # resolves the HCL correctly and the findings are accurate rather than artifacts.
    # ECR encryption_type is a ternary on ecr_kms_key_arn, and the log groups set no
    # kms_key_id at all. The trade is already recorded there against checkov's
    # CKV_AWS_158 and CKV_AWS_149 as inline skips on
    # deploy/terraform/modules/*/main.tf.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshAgentCore.template.json
      reason: >-
        ImageBuildLogs and ImageBootstrapStarterLogs both take KmsKeyId from the
        HasKmsKey condition on the KmsKeyArn parameter. See the block comment above
        for the measurement, and the CKV_AWS_158 inline skips for the cost.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshCodeCommitGate.template.json
      reason: >-
        ImageBuildLogs, ImageBootstrapStarterLogs and ScanLogs, all three keyed off
        the same HasKmsKey condition. Same mechanism as the AshAgentCore entry.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        ImageBuildLogs, keyed off the same HasKmsKey condition. Same mechanism as
        the AshAgentCore entry.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        ImageBuildLogs, ImageBootstrapStarterLogs, VpcFlowLogs and TaskLogs, all
        keyed off the same HasKmsKey condition. Same mechanism as the AshAgentCore
        entry.
    - rule_id: AWS-0017
      path: deploy/cdk/templates/AshImagePipeline.template.json
      reason: >-
        Arm64BuildLogs and Amd64BuildLogs, one per architecture, both keyed off the
        same HasKmsKey condition. Same mechanism as the AshAgentCore entry.
    - rule_id: AWS-0017
      path: deploy/terraform/modules/ash-image-pipeline/main.tf
      reason: >-
        aws_cloudwatch_log_group.build sets no kms_key_id. This is the resource
        checkov reports CKV_AWS_158 on, where the module already carries an inline
