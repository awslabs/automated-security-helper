    # === cfn-nag W76 measures intrinsics, not permissiveness ===
    #
    # SPCM counts a statement's distinct "services", taking the service from the
    # ARN's third colon-separated field. StatementMetric#resource_service_name does
    # that only for Strings and returns the value unchanged for anything else, so a
    # resource written as Fn::GetAtt, Fn::Join or Ref becomes its own distinct
    # service: 2 points under Extra_Service, plus 1 more under
    # Resource_Action_NotAligned because it cannot match the statement's action
    # service either.
    #
    # These templates are environment-agnostic on purpose -- deploy/cdk/scripts/
    # synth-templates.sh depends on it, because a template with a baked-in account id
    # is neither reproducible nor launchable by an adopter. So every resource ARN is
    # an intrinsic. MEASURED, by rescoring each flagged document with its intrinsics
    # replaced by literal ARNs of the service actually being granted: 32 becomes 11,
    # 31 becomes 7, the five 42s become 9, and 29 becomes 2, against a threshold of
    # 25. Identical grants, identical permissiveness, every one of them well clear.
    #
    # The metric is also insensitive to what W12 looks at. PipelineRoleDefaultPolicy
    # scores 29 with two statements and no wildcard at all, and the image-build policy
    # sits at 24 in four templates and 31 in the fifth, one statement apart.
    # @aws-cdk/aws-iam:minimizePolicies is already true in deploy/cdk/cdk.json and
    # pushes the wrong way here: merging statements concentrates resources into fewer
    # statements, and the per-resource cost is charged either way.
    - rule_id: CFN_NAG_W76
      path: deploy/cdk/templates/AshAgentCore.template.json
      reason: >-
        The AgentCore runtime role's CDK DefaultPolicy, scoring 32 against a
        threshold of 25. Seven of its resources are intrinsics -- log-group ARNs
        built from AWS::Partition, AWS::Region and AWS::AccountId, and the ECR
        repository and config references -- and rescoring the same document with
        literal ARNs gives 11. Writing literals would bake an account id into a
        template adopters launch, which is what the synth-templates.sh drift gate
        exists to prevent.
    - rule_id: CFN_NAG_W76
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        Seven CDK DefaultPolicy resources: the image-build role at 31, the four scan
        shards and the merge project at 42 each, and the pipeline role at 29, against
        a threshold of 25. Rescored with literal ARNs in place of intrinsics they are
        7, 9 and 2. The pipeline role is the clearest case that this rule is not
        measuring permissiveness: two statements, no wildcard resource at all, and it
        still trips, because it names an artifact bucket and six action roles by
        Fn::GetAtt. Same mechanism as the AshAgentCore entry above.
    # === cfn-nag W56 is checkov's CKV_AWS_2, same listener ===
    - rule_id: CFN_NAG_W56
