    # === NOT COMPLIANCE FINDINGS (1 of 2): rules that threw and never ran ===
    #
    # READ THIS BEFORE TREATING THE 15 ENTRIES BELOW AS ACCEPTED RISK. They are not.
    # Each is a rule that raised an exception during validation and therefore evaluated
    # nothing: it neither passed nor failed, and every record says so in its own
    # message text, which begins "Rule threw an error during validation". Suppressing
    # these suppresses a scanner malfunction report, not a judgement about the
    # template. An audit reader comparing this group against the compliance-pack
    # entries above should read these as UNEVALUATED, not as risks weighed and
    # accepted, and should not count them toward either a compliant or a
    # non-compliant tally.
    #
    # WHY THE RULES THROW
    #
    # These templates are environment-agnostic on purpose -- deploy/cdk/scripts/
    # synth-templates.sh depends on it, because a template with a baked-in account id
    # is neither reproducible nor launchable by an adopter -- and they are
    # parameterized so an adopter can point them at their own key, CIDR and image tag.
    # The consequence is that the properties these rules want to inspect are
    # CloudFormation intrinsics rather than literals: an Fn::Join over ECR repository
    # attributes, a Ref to a parameter, an Fn::If over a condition. Three of the four
    # messages say exactly that, naming the value that "resolved to a non-primitive".
    # The fourth, "items.map is not a function", is the same shape reaching a rule that
    # does not handle it.
    #
    # WHY THE TEMPLATE'S OWN SUPPRESSION DOES NOT ALREADY COVER THEM
    #
    # It looks as though it should, and this is the part worth being precise about.
    # Every resource named below already carries a reviewed in-template suppression for
    # exactly this case: Metadata.cdk_nag.rules_to_suppress with id
    # CdkNagValidationFailure, written by deploy/cdk/lib/ash-nag-suppressions.ts, whose
    # reason names the intrinsics and the affected rules. ASH honors in-template
    # suppressions -- 116 of this scanner's 437 findings are suppressed that way -- but
    # the honoring is keyed by rule id: _template_suppression_reason in
    # automated_security_helper/utils/cdk_nag_wrapper.py compares the suppression's id
    # against the finding's rule id, and against that id with any bracketed scope
    # stripped. cdk-nag emits a validation failure under the CRASHED RULE's own id, so
    # a record arrives as AwsSolutions-EC23 while the suppression covering it is filed
    # under CdkNagValidationFailure. The two never compare equal, and the reviewed
    # reason sitting in the same file is never reached.
    #
    # That is a mechanism worth fixing upstream of these entries rather than papering
    # over indefinitely -- either by having the wrapper treat a CdkNagValidationFailure
    # suppression as covering any rule that threw on that resource, or by having it
    # report crashes under a rule id of their own so they are filterable as a class.
    # Until one of those lands, naming the records here is the only way to keep the
    # exit code honest, and it is why they are grouped and labelled separately instead
    # of being mixed in with the compliance findings above.
    - rule_id: AwsSolutions-CB5
      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        Five records, on the four scan-shard projects and the merge project. CB5
        checks whether a CodeBuild project uses an image the CodeBuild service
        provides, and it threw because Environment.Image on these five is an
        Fn::Join that assembles the ASH ECR image URI from the repository's ARN plus
        an Fn::If over AshImageTag -- a non-primitive, which the message quotes in
        full. The rule never ran, so this says nothing about the image. All five
        resources already carry a CdkNagValidationFailure suppression ASH cannot
        match to this id; see the block comment above. ImageBuild is absent from
        this list because it uses a standard CodeBuild image, so the rule evaluated
        it normally and it passed.
    - rule_id: AwsSolutions-EC23
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        One record, on McpIngress. The rule checks a security group for an 0.0.0.0/0
        or ::/0 CIDR and threw because CidrIp is a Ref to the McpIngressCidr
        parameter, which the message reports as resolving to a non-primitive. The
        rule never ran, so this record says nothing about whether the CIDR an
        adopter supplies is open -- and the resource itself only exists when
        McpIngressCidrSupplied is true, so a default deployment has no ingress rule
        for it to have judged. McpIngress already carries a CdkNagValidationFailure
        suppression ASH cannot match to this id; see the block comment above.
    - rule_id: AwsSolutions-IAM5
      path: deploy/cdk/templates/AshAgentCore.template.json
      reason: >-
        One record, on RuntimeRoleDefaultPolicy, and the one in this block most
        likely to be misread -- IAM5 is the wildcard-permissions rule, and 95 of
        this scanner's already-suppressed findings are wildcard grants. This is not
        one of them and is not a wildcard being accepted. The message is "Rule threw
        an error during validation. items.map is not a function": the rule crashed
        on this policy's intrinsic-valued resources and evaluated no statement at
