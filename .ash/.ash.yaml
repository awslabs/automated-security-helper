    # --- S3BucketDefaultLockEnabled: Object Lock would stop the stack's own cleanup ---
    #
    # 7 buckets, one pack. Only NIST 800-53 Revision 4 raises this; the other three
    # packs enabled here do not, which is worth knowing before reading the count as
    # under-coverage.
    #
    # Object Lock is write-once-read-many retention, and it can only be turned on when
    # a bucket is created -- an existing deployment cannot adopt it through a stack
    # update, so this is not a setting an adopter can add later either. It also
    # contradicts what these buckets are configured to do: each one that holds anything
    # durable has a lifecycle rule whose job is to DELETE objects, and under a
    # retention lock those deletions fail until the retention period expires. An
    # adopter would be left paying to store scan artifacts they had asked the template
    # to expire.
