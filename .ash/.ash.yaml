      path: deploy/cdk/templates/AshDistributedPipeline.template.json
      reason: >-
        Five buckets. Results expires shard output after 30 days and Artifacts
        expires superseded artifacts after 30 noncurrent days, so a retention lock
        would block the two rules this template relies on to keep a long-lived
        pipeline from accumulating every scan it has ever run. See the block comment
        above.
