    # and cfn-nag's CFN_NAG_W56 above already carry the certificate argument, so it is
    # summarized rather than repeated: an HTTPS listener needs an ACM certificate, ACM
    # issues one only against a domain the requester can prove control of, and there is
    # no default this template could supply. The balancer is `Scheme: internal` and the
    # template creates no ingress rule at all until an operator sets McpIngressCidr, so
    # nothing reaches the HTTP listener in a default deployment. CertificateArn is the
    # reserved parameter name for the opt-in; once set, the redirection and ACM rules
    # pass without further work.
