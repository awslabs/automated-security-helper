    # === cfn-nag W5: the destination is the internet, and only the CIDR is left ===
    #
    # The last finding on the ECS task's egress rule. The group is now written by
    # deploy/cdk/lib/ash-fargate-stack.ts rather than left to FargateService, so the
    # protocol and port are pinned to TCP 443 and only the destination CIDR is still
    # open. The comment on serviceSecurityGroup there carries the full argument, the
    # cases a 443-only rule does not cover, and how an adopter widens it.
    - rule_id: CFN_NAG_W5
      path: deploy/cdk/templates/AshFargate.template.json
      reason: >-
        The ECS task's egress destination is the public internet and cannot be
        narrowed to a CIDR set. The task runs in a private subnet with assignPublicIp
        disabled and this template creates no VPC endpoint, so the image pull, the
        awslogs delivery, and the Systems Manager and Secrets Manager reads all leave
        through the NAT gateway to public service endpoints. An AWS-managed prefix
        list would be the way to name those endpoints, and the published set covers
        none of them -- it is CloudFront origin-facing, DynamoDB, EC2 Instance
        Connect, Ground Station, Route 53 health checkers, S3, S3 Express One Zone,
        VPC Lattice, and Secrets Manager's managed external secrets ranges, which are
        not the Secrets Manager API endpoint. Nothing covers ECR, CloudWatch Logs, the
        Secrets Manager endpoint or Systems Manager. Naming them instead needs
        interface endpoints, billed hourly per Availability Zone, which is the cost
        already recorded against CKV_AWS_117. Everything else about this rule WAS
        narrowed: the protocol and port are now TCP 443, which cleared CFN_NAG_W40 and
        avoided CFN_NAG_W29. The residual limitation is recorded where an operator
        will meet it rather than only here -- a scanned repository that resolves
        dependencies from a registry on another port fails to fetch, and the
        TaskSecurityGroupId output is the handle for authorizing that port.

    # === cdk-nag on the synthesized CloudFormation templates ===
    #
    # WHY THIS BLOCK ARRIVED SO LATE, WHEN checkov AND cfn-nag WERE DONE ABOVE
    #
    # cdk-nag reports MISSING in the `ash / SAST, SCA, and IaC Scan` check, because
    # that leg installs no `cdk` extra and the scanner needs aws-cdk-lib, cdk-nag and
    # constructs to run at all. A MISSING scanner contributes no findings, so whoever
    # wrote the checkov and cfn-nag blocks above was reading a report in which cdk-nag
    # had produced nothing. Its 437 findings on these same five templates were never
    # visible to that work. They surface only in a run where the extra is installed,
    # which is the run this block was derived from.
    #
    # WHAT ASH EVALUATES HERE THAT THE TEMPLATES WERE NOT AUTHORED AGAINST
    #
    # deploy/cdk/bin/ash.ts:76 registers exactly one nag pack, AwsSolutionsChecks. That
    # is the pack the CDK app is gated on, the pack whose findings were fixed or
    # suppressed in deploy/cdk/lib/ash-nag-suppressions.ts, and the pack these
    # templates were designed to pass. This repository's own scan config enables four
    # more -- HIPAASecurityChecks, NIST80053R4Checks, NIST80053R5Checks and
    # PCIDSS321Checks -- so the self-scan judges these templates against three
    # compliance regimes and a payment-card standard that no part of this project
    # claims to implement.
    #
    # Saying that plainly matters more than it might look. Clearing a HIPAA or PCI rule
    # id is not the same as being HIPAA- or PCI-compliant, and suppressing one is not a
    # claim of non-compliance either. ASH has adopted no compliance posture; these
    # packs are enabled here because they exercise more of the scanner. The entries
    # below therefore say what each rule wants, what satisfying it would cost, and why
    # it is out of scope for a template an adopter parameterizes -- not that a risk was
    # weighed and accepted against a control ASH is audited on.
    #
    # 116 of the 437 findings are already suppressed and do not appear below. Those
    # carry reviewed reasons in the templates' own Metadata.cdk_nag blocks, written by
    # ash-nag-suppressions.ts and honored by ASH; 95 of them are the CodeBuild and ECR
    # wildcard grants and 12 the pipeline's object-level bucket access. The 321 that
    # remain are what this block covers, and they fall into three kinds an audit reader
    # should not have to squint to tell apart:
    #
    #   * 284 compliance-pack findings -- real rules from the four packs above,
    #     evaluating properties these templates deliberately leave to the adopter.
    #   * 15 rules that THREW during validation and were never evaluated. Not findings
    #     about the template at all; see the block above them.
    #   * 22 from CDK's own `CloudFormation Validate` plugin, which cdk-nag reports
    #     alongside its packs and ASH attributes to cdk-nag. Also not findings about
    #     the template; see the block above them.
    #
    # Worth recording because it contradicts a plausible reading of the severity
    # columns: the 31 findings ASH counts at MEDIUM are NOT the same set as the
    # not-a-compliance-finding group. 27 of the 37 in that group are Warning-level and
    # so land in MEDIUM, but AwsSolutions-IAM5, AwsSolutions-EC23 and the eight
    # EC2Restricted* crashes are Error-level, while the four VPCDefaultSecurityGroupClosed
    # findings are Warning-level genuine compliance results. Split the categories by
    # message text, not by severity.
    #
    # PATHS ARE NAMED FILE BY FILE, AND SO ARE RULES
    #
    # No entry below globs. `deploy/cdk/templates/**` with a `*-IAMNoInlinePolicy` rule
    # id would collapse 20 entries into one, and it was written that way first; the
    # problem is that a sixth template, or a fifth pack, then inherits a suppression
    # nobody read. The five files and the four pack-qualified rule ids are named
    # individually for the same reason the detect-secrets block below gives. Counts
    # quoted per entry are the counts measured on THIS revision -- `cdk synth`
    # regenerates these templates, so treat a drifted count as a prompt to re-measure
    # rather than as a defect in the reason.
    #
    # --- IAMNoInlinePolicy: the rule's own subject is not what these templates hold ---
    #
    # 35 policies per pack, 140 findings, the largest single group in this block. The
    # rule reads "The IAM Group, User, or Role contains an inline policy" and asks for
    # customer-managed policies instead, for reusability, versioning and rollback.
    #
    # Measured before writing this, not assumed: not one AWS::IAM::Role in any of the
    # five templates carries a `Policies` array. Every finding is on a standalone
    # AWS::IAM::Policy resource attached through `Roles`, which is what CDK emits for
    # `grant*` and `addToPolicy`, and the per-file finding counts equal the
    # AWS::IAM::Policy counts exactly -- 5, 4, 15, 7 and 4. So the rule is not reacting
    # to a policy embedded in a role; it treats a role's separately-attached Policy
    # resource as one.
    #
    # Two reasons no code change here is the right answer. First, the CDK grant model
    # produces these: a customer-managed policy per grant would mean hand-writing every
    # statement CDK derives today, and hand-writing grants is how least-privilege
    # mistakes get made. Second, the change the rule asks for is the same trade
    # AwsSolutions-IAM4 was fixed to AVOID -- that finding was cleared by replacing the
    # managed AWSLambdaBasicExecutionRole with a narrow one-log-group policy, and
    # cfn-nag CFN_NAG_W58 above is suppressed because satisfying IT would mean granting
    # a logs:CreateLogGroup the functions do not use. Moving back to managed policies
    # to satisfy this rule would undo both.
