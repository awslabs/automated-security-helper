# Jenkins plugins for the jenkinsfile-runner leg on core 2.375.4, the core that
# jenkinsfile-runner 1.0-beta-32 is built against (jenkins.version in its root pom.xml).
#
# The release zip, jenkinsfile-runner-1.0-beta-32.zip, holds the launcher only: it has no
# Jenkins WAR and no plugins. So `bundled` is empty, the 2.375.4 WAR is pinned in
# runners.toml, and this file carries the same plugin set as plugins-lts.toml: the plugins
# the vanilla package declares at that tag (payload-dependencies/pom.xml and
# vanilla-package/pom.xml), plus junit, plus every non-optional dependency of those, each at
# the newest release whose required core is 2.375.4 or older. Versions and sha256 values
# are from the Jenkins update center's plugin-versions.json, resolved 2026-10-12. The
# update center publishes no tier for this core (a request for it is redirected to the
# 2.516.2 tier), so plugin-versions.json is the only source used here. Each url is the
# plugin's file on get.jenkins.io, where the update center's download urls redirect; each
# file was downloaded from that url and hashed on 2026-10-13, and every hash equals the
# sha256 here.
#
# This core is past its upstream support period. The leg exists to run the runner release on
# the core it was built for, and it runs only on a disposable CI runner.
#
# The install step downloads each url, checks its sha256, and places the file in the
# directory passed to jenkinsfile-runner with -p. Nothing resolves plugins at run time.
# `dependencies` lists only non-optional dependencies, and each one is an entry here.

