# Jenkins plugins for the jenkinsfile-runner leg on the Jenkins LTS core 2.580.1.
#
# The set: the plugins jenkinsfile-runner 1.0-beta-32 declares for its vanilla package
# (payload-dependencies/pom.xml and vanilla-package/pom.xml at that tag), plus junit, plus
# every non-optional dependency of those, each at the newest release whose required core is
# 2.580.1 or older. Versions and sha256 values are from the Jenkins update center's
# plugin-versions.json, resolved 2026-10-12, and equal what its dynamic-stable-2.580.1 tier
# lists for each plugin. Each url is the plugin's file on get.jenkins.io, where the update
# center's download urls redirect; each file was downloaded from that url and hashed on
# 2026-10-13, and every hash equals the sha256 here.
#
# The install step downloads each url, checks its sha256, and places the file in the
# directory passed to jenkinsfile-runner with -p. Nothing resolves plugins at run time.
# `dependencies` lists only non-optional dependencies, and each one is an entry here.

