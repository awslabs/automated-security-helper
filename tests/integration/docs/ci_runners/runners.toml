# Pinned tools, images and Jenkins cores for running the CI pages' examples with their CI
# systems' local runners. Resolved 2026-10-12.
#
# Tools: every url is https, and every sha256 is the hash of a download of that url,
# compared with the publisher's own checksum where one exists (the source note says which).
# The install step refuses a file whose sha256 differs and leaves nothing extracted or on
# PATH. Each tool is installed in its own directory, and `executable` is the program to
# run, relative to that directory; the install step makes it executable, because the
# jenkinsfile-runner zip stores its launcher script without an execute bit.
#
# Images: every ref is name@sha256:<digest>, read from the registry's v2 API with an
# anonymous pull token, and the registry served that digest when it was read. A digest
# that is an image index covers several platforms; the runners here are linux/amd64. The
# sizes in the source notes are the compressed layer bytes of the linux/amd64 manifest;
# unpacked images take more disk. `license` is the license the registry or the image's
# labels state, or "unknown" where neither names one.
#
# Jenkins: jenkinsfile-runner's release zip holds the launcher only, so each core pins its
# own WAR and its own plugin closure.

[tools.act]
version = "0.2.89"
url = "https://github.com/nektos/act/releases/download/v0.2.89/act_Linux_x86_64.tar.gz"
sha256 = "0191d6f1f3b716b5c55820032605d05fc3c1cdbf581ebeff655019e5dd1524c0"
license = "MIT"
source = "https://github.com/nektos/act/releases/tag/v0.2.89; equal to the release's checksums.txt and to the GitHub asset digest"
executable = "act"

[tools.gitlab-ci-local]
version = "4.76.1"
url = "https://github.com/firecow/gitlab-ci-local/releases/download/4.76.1/gitlab-ci-local-linux-amd64.tar.gz"
sha256 = "c4a857c578924df96bffdf2d0f0270fdb0a4cb396a114401e2ae52e96bbe6da4"
license = "MIT"
source = "https://github.com/firecow/gitlab-ci-local/releases/tag/4.76.1; equal to the GitHub asset digest (the release publishes no checksums file); a detached PGP signature, gitlab-ci-local-linux-amd64.tar.gz.asc, is published beside it"
executable = "gitlab-ci-local"

[tools.jenkinsfile-runner]
version = "1.0-beta-32"
url = "https://github.com/jenkinsci/jenkinsfile-runner/releases/download/1.0-beta-32/jenkinsfile-runner-1.0-beta-32.zip"
sha256 = "958b959d3bb51843b36c0f8f3783717dc5c800ada86f866e72698132e3a4f304"
license = "MIT"
source = "https://github.com/jenkinsci/jenkinsfile-runner/releases/tag/1.0-beta-32; the GitHub asset has no digest; equal to the .sha256 that repo.jenkins-ci.org publishes for io.jenkins.jenkinsfile-runner:jenkinsfile-runner:1.0-beta-32:zip, whose .sha1 and .md5 also match; the two downloads are byte-identical"
executable = "bin/jenkinsfile-runner"

[tools.codebuild-build-sh]
version = "a07b8a37906d4de35cf0c1aa6fa94dc1151114e6"
url = "https://raw.githubusercontent.com/aws/aws-codebuild-docker-images/a07b8a37906d4de35cf0c1aa6fa94dc1151114e6/local_builds/codebuild_build.sh"
sha256 = "0e10dda810a2418bd7ba5df013a6143e1d71fc549a73071db5d71429d645930d"
license = "Apache-2.0"
source = "https://github.com/aws/aws-codebuild-docker-images/blob/master/local_builds/codebuild_build.sh; the commit is the file's last change on master, and the file on master has the same sha256; license from local_builds/LICENSE.txt at that commit"
executable = "codebuild_build.sh"

[tools.circleci-cli-local-execute]
version = "0.1.47860"
