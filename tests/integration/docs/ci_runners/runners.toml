sha256 = "37000f009dcbe607c1d4a1af534b339aed928078225095bce7e487fb2ab32a6d"
license = "MIT"
source = "https://github.com/CircleCI-Public/circleci-cli/releases/tag/v0.1.47860; the last release with `local execute`; equal to circleci-cli_0.1.47860_checksums.txt and to the GitHub asset digest"
