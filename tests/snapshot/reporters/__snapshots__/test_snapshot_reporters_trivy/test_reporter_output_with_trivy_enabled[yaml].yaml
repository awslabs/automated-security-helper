          fullDescription:
            markdown: null
            properties: null
            text: 'Impact:


              Lodash versions 4.17.23 and earlier are vulnerable to prototype pollution
              in the _.unset and _.omit functions. The fix for (CVE-2025-13465: https://github.com/lodash/lodash/security/advisories/GHSA-xxjr-mmjv-4gpg)
              only guards against string key members, so an attacker can bypass the
              check by passing array-wrapped path segments. This allows deletion of
              properties from built-in prototypes such as Object.prototype, Number.prototype,
              and String.prototype.


              The issue permits deletion of prototype properties but does not allow
              overwriting their original behavior.


              Patches:


              This issue is patched in 4.18.0.


              Workarounds:


              None. Upgrade to the patched version.'
