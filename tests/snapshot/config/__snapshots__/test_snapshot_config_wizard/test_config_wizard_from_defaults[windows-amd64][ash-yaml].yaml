# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
# Reminder: export ASH_OFFLINE=YES before running ASH for offline mode
project_name: wizard-demo
global_settings:
  severity_threshold: MEDIUM
  ignore_paths: []
  suppressions: []
  mcp:
    runtime_overrides:
      enabled: false
      allowed_paths: []
      denied_paths:
      - /fail_on_findings
      - /fail_on_incomplete_scanners
      - /content_db_staleness
      - /global_settings/ignore_paths
      - /global_settings/suppressions
      - /reporters/bedrock-summary-reporter/options/aws_*
      - /reporters/cloudwatch-logs/**
      denied_value_patterns: {}
fail_on_findings: true
fail_on_incomplete_scanners: true
content_db_staleness: fail
ash_plugin_modules:
- my_org.ash_plugins
external_reports_to_include: []
converters:
  archive:
    enabled: true
    options: {}
  jupyter:
    enabled: true
    options:
      tool_version: '>=7.16.0,<8.0.0'
      install_timeout: 300
scanners:
  bandit:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      config_file: null
      confidence_level: all
      ignore_nosec: false
      excluded_paths: []
      additional_formats: []
      tool_version: '>=1.7.0,<2.0.0'
      install_timeout: 300
  cdk-nag:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      nag_packs:
        AwsSolutionsChecks: true
        HIPAASecurityChecks: false
        NIST80053R4Checks: false
        NIST80053R5Checks: false
        PCIDSS321Checks: false
      include_compliant_checks: false
  cfn-nag:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
  checkov:
    enabled: false
    options:
      severity_threshold: null
      scan_timeout: 1800
      config_file: null
      skip_path: []
      additional_formats:
      - cyclonedx_json
      offline: false
      frameworks:
      - all
      skip_frameworks: []
      skip_ash_output_dir: true
      tool_version: null
      install_timeout: 300
  detect-secrets:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      baseline_file: null
      scan_settings:
        version: null
        generated_at: null
        plugins_used: []
        filters_used: []
        results: {}
      skip_generated_lockfiles: true
  grype:
    enabled: false
    options:
      severity_threshold: null
      scan_timeout: 1800
      config_file: null
      offline: false
  npm-audit:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
  opengrep:
    enabled: false
    options:
      severity_threshold: null
      scan_timeout: 1800
      config: p/ci
      exclude:
      - '*-converted.py'
      - '*_report_result.txt'
      exclude_rule: []
      severity: []
      metrics: auto
      offline: false
      patterns: []
      version: v1.15.1
      sha256: {}
  semgrep:
    enabled: false
    options:
      severity_threshold: null
      scan_timeout: 1800
      config: p/ci
      exclude:
      - '*-converted.py'
      - '*_report_result.txt'
      exclude_rule: []
      severity: []
      metrics: auto
      offline: false
      tool_version: null
      install_timeout: 300
  syft:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      config_file: null
      exclude: []
      additional_outputs:
      - syft-table
      offline: false
reporters:
  csv:
    enabled: true
    options: {}
  cyclonedx:
    enabled: true
    options: {}
  gitlab-cyclonedx:
    enabled: true
    options:
      category: production
      package_manager_override: null
      language_override: null
      input_file_path_override: null
  html:
    enabled: false
    options: {}
  flat-json:
    enabled: true
    options:
      include_scanner_metrics: true
      include_summary_metrics: true
      include_metadata: true
  gitlab-sast:
    enabled: true
    options:
      exclude_suppressed: false
  github-ghas:
    enabled: true
    options:
      exclude_suppressed: true
  junitxml:
    enabled: true
    options:
      respect_severity_threshold: true
  markdown:
    enabled: true
    options:
      include_summary: true
      include_findings_table: false
      include_detailed_findings: true
      max_detailed_findings: 20
      top_hotspots_limit: 10
      use_collapsible_details: true
      compact: false
  ocsf:
    enabled: true
    options: {}
  sarif:
    enabled: true
    options: {}
  spdx:
    enabled: false
    options: {}
  text:
    enabled: true
    options:
      include_summary: true
      include_findings_table: false
      include_detailed_findings: false
      max_detailed_findings: 20
      top_hotspots_limit: 20
  unused-suppressions:
    enabled: true
    options:
      output_format: both
  yaml:
    enabled: true
    options: {}
workspace:
  max_parallel_projects: null
  project_timeout: null
