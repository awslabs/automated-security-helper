# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
fail_on_findings: false
legacy_option: 1
scanners:
  bandit:
    enabled: true
  cdk-nag:
    enabled: true
  npm-audit:
    enabled: true
  npm_audit:
    enabled: false
reporters:
  html: {}
converters:
  archive: {}
global_settings:
  ignore_paths:
  - path: vendor
    reason: third party code
  suppressions:
  - path: src/app.py
    rule_id: B101
    line_start: 10
    reason: Asserts are stripped in production builds, so this check never runs there.
    line_end: 10
  - path: src/app.py
    rule_id: B106
    symbol: handler(request)
    reason: Not a qualified name
  - path: src/app.py
    rule_id: B107
    expiration: 31/01/2099
    reason: Wrong date format
