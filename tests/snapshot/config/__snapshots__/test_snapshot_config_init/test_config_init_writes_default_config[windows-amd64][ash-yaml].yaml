# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: demo-project
global_settings:
  severity_threshold: MEDIUM
  ignore_paths: []
  suppressions: []
  mcp:
    runtime_overrides:
      enabled: false
      allowed_paths: []
      denied_paths:
      - /fail_on_findings
      - /fail_on_incomplete_scanners
      - /content_db_staleness
      - /content_db_staleness_overrides
      - /honor_ignore_files
      - /content_db_staleness_offline_image_default
      - /sandbox
      - /sandbox/**
      - /ash_plugin_modules
      - /ash_plugin_modules/**
      - /scanners/detect-secrets/options/scan_settings/filters_used
      - /scanners/detect-secrets/options/scan_settings/filters_used/**
      - /scanners/detect-secrets/options/scan_settings/plugins_used
      - /scanners/detect-secrets/options/scan_settings/plugins_used/**
      - /scanners/detect-secrets/options/baseline_file
      - /global_settings/ignore_paths
      - /global_settings/suppressions
      - /global_settings/mcp
      - /global_settings/mcp/**
      - /scanners/opengrep/options/exclude_rule
      - /scanners/semgrep/options/exclude_rule
      - /scanners/bandit/options/confidence_level
      - /scanners/checkov/options/frameworks
      - /scanners/checkov/options/skip_frameworks
      - /scanners/opengrep/options/config
      - /scanners/opengrep/options/patterns
      - /scanners/opengrep/options/severity
      - /scanners/semgrep/options/config
      - /scanners/semgrep/options/severity
      - /scanners/detect-secrets/options/scan_settings
      - /scanners/cdk-nag/options/nag_packs/AwsSolutionsChecks
      - /scanners/ferret-scan/options/checks
      - /scanners/ferret-scan/options/confidence_levels
      - /scanners/ferret-scan/options/disable_ip_types
      - /scanners/ferret-scan/options/enable_preprocessors
      - /scanners/ferret-scan/options/finding_limit
      - /scanners/ferret-scan/options/profile
      - /scanners/ferret-scan/options/recursive
      - /scanners/ferret-scan/options/respect_gitignore
      - /scanners/ferret-scan/options/use_default_config
      - /scanners/ferret-scan/options/validator_budget
      - /scanners/trivy-repo/options/license_full
      - /scanners/trivy-repo/options/scanners
      - /scanners/cfn-guard/options/rule_sets
      - /scanners/cfn-lint/options/ignore_checks
      - /scanners/cfn-lint/options/regions
      - /scanners/gitleaks/options/baseline_path
      - /scanners/trivy/options/scanners
      - /scanners/trivy/options/ignore_unfixed
      - /scanners/*/options/offline
      - /scanners/ferret-scan/options/max_live_bytes
      - /scanners/gitleaks/options/max_target_megabytes
      - /scanners/bandit/options/config_file
      - /scanners/checkov/options/config_file
      - /scanners/ferret-scan/options/config_file
      - /scanners/grype/options/config_file
      - /scanners/syft/options/config_file
      - /scanners/trivy-repo/options/secret_config_file
      - /scanners/trivy-repo/options/config_file
      - /scanners/trivy-repo/options/module_dir
      - /scanners/trivy/options/config_file
      - /scanners/trivy/options/secret_config_file
      - /scanners/actionlint/options/config_file
      - /scanners/actionlint/options/shellcheck
      - /scanners/actionlint/options/pyflakes
      - /scanners/cfn-guard/options/rules_paths
      - /scanners/cfn-lint/options/config_file
      - /scanners/gitleaks/options/config_file
      - /scanners/zizmor/options/config_file
      - /scanners/zizmor/options/online_audits
      - /scanners/snyk-code/options/honor_tree_exclusions
      - /scanners/cfn-lint/options/honor_inline_ignores
      - /scanners/gitleaks/options/honor_inline_ignores
      - /scanners/zizmor/options/honor_inline_ignores
      - /scanners/*/options/tool_version
      - /converters/jupyter/options/tool_version
      - /scanners/opengrep/options/version
      - /scanners/opengrep/options/sha256
      - /scanners/opengrep/options/metrics
      - /scanners/semgrep/options/metrics
      - /reporters/bedrock-summary-reporter/options/aws_*
      - /reporters/cloudwatch-logs/**
      - /reporters/aws-security-hub/**
      - /reporters/bedrock-summary-reporter/options/model_id
      - /reporters/bedrock-summary-reporter/options/output_file
      - /reporters/bedrock-summary-reporter/options/output_executive_file
      - /reporters/bedrock-summary-reporter/options/output_technical_file
      - /reporters/s3/**
      - /reporters/bedrock-summary-reporter/**
      - /reporters/gitlab-sast/options/exclude_suppressed
      - /scanners/detect-secrets/**
      - /scanners/npm-audit/**
      - /scanners/opengrep/**
      - /scanners/semgrep/**
      - /scanners/snyk-code/**
      - /scanners/trivy-repo/**
      - /scanners/trivy/**
      - /scanners/zizmor/**
      - /converters/archive/options/max_members
      - /converters/archive/options/max_member_bytes
      - /converters/archive/options/max_total_bytes
      - /converters/archive/options/max_compression_ratio
      denied_value_patterns: {}
      replace_default_denied_paths: false
fail_on_findings: true
fail_on_incomplete_scanners: true
honor_ignore_files: true
sandbox:
  mode: 'off'
  network_scanners: null
  extra_read_paths: []
  read_path_scanners: []
  env_scanners: []
  environment:
  - ALL_PROXY
  - HTTPS_PROXY
  - HTTP_PROXY
  - NO_PROXY
  - all_proxy
  - http_proxy
  - https_proxy
  - no_proxy
  - SSL_CERT_FILE
  - REQUESTS_CA_BUNDLE
  - CURL_CA_BUNDLE
  - NODE_EXTRA_CA_CERTS
  - SSL_CERT_DIR
content_db_staleness: fail
content_db_staleness_overrides: []
content_db_staleness_offline_image_default: true
ash_plugin_modules: []
external_reports_to_include: []
converters:
  archive:
    enabled: true
    options:
      max_members: 100000
      max_member_bytes: 268435456
      max_total_bytes: 1073741824
      max_compression_ratio: 100
  jupyter:
    enabled: true
    options:
      tool_version: '>=7.16.0,<8.0.0'
      install_timeout: 300
scanners:
  actionlint:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
      shellcheck: null
      pyflakes: null
  bandit:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
      confidence_level: all
      ignore_nosec: false
      excluded_paths: []
      additional_formats: []
      tool_version: '>=1.7.8,<2.0.0'
      install_timeout: 300
  cdk-nag:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      nag_packs:
        AwsSolutionsChecks: true
        HIPAASecurityChecks: false
        NIST80053R4Checks: false
        NIST80053R5Checks: false
        PCIDSS321Checks: false
      include_compliant_checks: false
  cfn-guard:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      rule_sets:
      - wa-Security-Pillar
      rules_paths: []
  cfn-lint:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
      regions: []
      ignore_checks: []
      include_checks: []
      honor_inline_ignores: false
      tool_version: '>=1.43.3,<2.0.0'
      install_timeout: 300
  cfn-nag:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
  checkov:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
      skip_path: []
      additional_formats:
      - cyclonedx_json
      frameworks:
      - all
      skip_frameworks: []
      skip_ash_output_dir: true
      tool_version: null
      install_timeout: 300
  detect-secrets:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      baseline_file: null
      scan_settings:
        version: null
        generated_at: null
        plugins_used: []
        filters_used: []
        results: {}
      skip_generated_lockfiles: true
      max_worker_output_mib: 256
  gitleaks:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
      baseline_path: null
      honor_inline_ignores: false
      max_target_megabytes: null
  grype:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
  npm-audit:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
  opengrep:
    enabled: false
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config: p/ci
      exclude:
      - '*-converted.py'
      - '*_report_result.txt'
      exclude_rule: []
      severity: []
      metrics: auto
      patterns: []
      version: v1.30.2
      sha256: {}
  semgrep:
    enabled: false
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config: p/ci
      exclude:
      - '*-converted.py'
      - '*_report_result.txt'
      exclude_rule: []
      severity: []
      metrics: auto
      tool_version: null
      install_timeout: 300
  syft:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
      exclude: []
      additional_outputs:
      - syft-table
  trivy:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      scanners:
      - vuln
      license_full: false
      ignore_unfixed: false
      disable_telemetry: true
      config_file: null
      ignore_file: null
      secret_config_file: null
  zizmor:
    enabled: true
    options:
      severity_threshold: null
      scan_timeout: 1800
      offline: false
      config_file: null
      persona: regular
      online_audits: false
      honor_inline_ignores: false
      tool_version: '>=1.29.0,<2.0.0'
      install_timeout: 300
reporters:
  csv:
    enabled: true
    options: {}
  cyclonedx:
    enabled: true
    options: {}
  gitlab-cyclonedx:
    enabled: true
    options:
      category: production
      package_manager_override: null
      language_override: null
      input_file_path_override: null
  html:
    enabled: true
    options: {}
  flat-json:
    enabled: true
    options:
      include_scanner_metrics: true
      include_summary_metrics: true
      include_metadata: true
  gitlab-sast:
    enabled: true
    options:
      exclude_suppressed: false
  github-ghas:
    enabled: true
    options:
      exclude_suppressed: true
      emit_automation_details: false
  junitxml:
    enabled: true
    options:
      respect_severity_threshold: true
  markdown:
    enabled: true
    options:
      include_summary: true
      include_findings_table: false
      include_detailed_findings: true
      max_detailed_findings: 20
      top_hotspots_limit: 10
      use_collapsible_details: true
      compact: false
  ocsf:
    enabled: true
    options: {}
  sarif:
    enabled: true
    options: {}
  spdx:
    enabled: false
    options: {}
  text:
    enabled: true
    options:
      include_summary: true
      include_findings_table: false
      include_detailed_findings: false
      max_detailed_findings: 20
      top_hotspots_limit: 20
  unused-suppressions:
    enabled: true
    options:
      output_format: both
  yaml:
    enabled: false
    options: {}
output_formats: []
workspace:
  max_parallel_projects: null
  project_timeout: null
