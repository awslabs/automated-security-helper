# Benign test fixture for the facets program's M0 sample runs (never deployed).
# A minimal template cfn_nag flags (S3 bucket with no encryption and no access
# logging), so captured `cfn_nag_scan` runs show where the logical resource id
# (M0FixtureBucket) appears in the JSON and SARIF output formats.
AWSTemplateFormatVersion: "2010-09-09"
Description: ASH M0 facets fixture - cfn_nag should flag M0FixtureBucket.
Resources:
  M0FixtureBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: ash-m0-facets-fixture-bucket
