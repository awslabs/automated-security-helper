# The record of the 2026-11-25 migration of this repository's own suppression
# configs from line pins to symbol- and resource-scoped references.
#
# Why this file exists
# --------------------
# .ash/.ash.yaml and .ash/.ash_community_plugins.yaml carried 108 line-pinned
# suppression entries. 61 sat inside named Python definitions and were converted
# to `symbol:` references (resolved by tree-sitter at scan time,
# automated_security_helper/utils/symbol_spans.py); 5 CloudFormation-template
# pins were converted to `resource_id:` scopes (the resource identity cdk-nag
# findings carry); 42 stay line-pinned, each with its reason under `kept`.
#
# What reads it
# -------------
# - tests/unit/config/test_symbol_migration_record.py asserts, per converted
#   entry, that the config carries the recorded reference and that the OLD
#   pinned lines lie inside the resolved span of the chosen symbol (the
#   per-entry oracle that catches a wrong symbol pick mechanically). The span
#   check is gated on the recorded span still being one of the symbol's spans,
#   so later edits to a listed file relax that entry's check instead of
#   failing it; `span_at_migration` records the verification at the migration
#   tip (origin/main b7b85bad79561524ea931ec9374b30a71dc805fb).
# - scripts/check_symbols_extra_control.py (the CI red control) probes each
#   converted symbol entry at its old pinned line: without the `symbols` extra
#   every probe must fail closed; with it, every probe must match.
#
# Maintenance
# -----------
# A converted entry that is later removed from a config on purpose drops its
# row here in the same change. New symbol-scoped entries written after the
# migration do not need rows: the tests assert every symbol in the configs
# still resolves, record or no record.
