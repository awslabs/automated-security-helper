# The record of the 2026-11-25 migration of this repository's own suppression
# configs from line pins to symbol- and resource-scoped references.
#
# Why this file exists
# --------------------
# .ash/.ash.yaml and .ash/.ash_alpha_plugins.yaml (then named .ash_community_plugins.yaml)
# carried 108 line-pinned
# suppression entries; one exact duplicate (the SECRET-SECRET-KEYWORD pin on
# redacted_model.py lines 298-299 sat twice in .ash/.ash.yaml) was dropped,
# leaving 107. 59 sat inside named Python definitions and were converted to
# `symbol:` references (resolved by tree-sitter at scan time,
# automated_security_helper/utils/symbol_spans.py); two pairs per config that
# named two lines of ONE definition folded into one entry each, so the configs
# carry 55 symbol-scoped entries (this record keeps a row per OLD pin, so two
# rows can share one entry); 5 CloudFormation-template pins were converted to
# `resource_id:` scopes (the resource identity cdk-nag findings carry); 43 stay
# line-pinned, each with its reason under `kept`. Two of those 43 (the
# package_manager_child.py warning string) were first converted to a 99-line
# symbol and went back to a line pin: a symbol on a high-signal rule covers
# every line of the definition, and a rule that fires on a file read should not
# be silenced for a whole function over one string.
#
# A symbol covers its WHOLE definition. The record's test therefore holds each
# chosen symbol to two bounds: it is the innermost definition that holds the old
# lines, and it runs at most SPAN_BUDGET lines unless the test names it in its
# allowance list with the reason a wider scope is right.
#
# What reads it
# -------------
# - tests/unit/config/test_symbol_migration_record.py asserts, per converted
#   entry, that the config carries the recorded reference and that the OLD
#   pinned lines lie inside the resolved span of the chosen symbol (the
#   per-entry oracle that catches a wrong symbol pick mechanically). The span
#   check is gated on the recorded span still being one of the symbol's spans,
#   so later edits to a listed file relax that entry's check instead of
#   failing it; `span_at_migration` records the verification at the migration
#   tip (origin/main b7b85bad79561524ea931ec9374b30a71dc805fb), except on a
#   row that carries `span_measured_at`, which names the commit that row's span
#   (and `flagged_line`) were measured at instead.
# - scripts/verify_symbol_suppressions_extra.py (the CI control, run by the
#   symbols-extra-control job in .github/workflows/ash-repo-scan.yml) reads the
#   `symbol` rows of this record and builds a suppression from each row's
#   rule_id, path and symbol (it does not read the two configs). Without the
#   `symbols` extra every row, probed at a line known to sit inside its
#   definition (its `flagged_line`, else its `old_line_start`, which must lie
#   inside `span_at_migration` or the row is refused), must match nothing, and
#   the same row with its symbol removed must match (so only the symbol clause
#   rejects it); with the extra, every row probed at the first line of its
#   symbol's current definition must match.
# - Rows marked `old_pin_stale_at_migration` have an old line outside their
#   definition, so they also carry `flagged_line`: the line their flagged code
#   really sits on, inside `span_at_migration`, measured in the same tree as
#   that span. The CI control probes there, and the per-entry oracle and the
#   innermost-definition check hold that line, not the stale one, inside the
#   span.
# - `kept` lists the line pins that stayed, by rule, path and lines. The
#   agreement test requires each one to be a line pin in the config it names, so
#   a pin that moved (or a path that was renamed) fails there until the row is
#   re-measured; a row that was re-measured against a later commit than the
#   migration says so in `remeasured_at`.
#
# Maintenance
# -----------
# A converted entry that is later removed from a config on purpose drops its
# row here in the same change. A new symbol-scoped entry (or resource scope)
# written after the migration needs its row here in the same change: the
# agreement test compares the configs and this record as sets, both ways, and
# the CI control reads only this record. Give it `old_line_start` and
# `old_line_end` (the line of the finding it covers) and `span_at_migration`.
