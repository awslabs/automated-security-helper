version: 0.2

env:
  variables:
    # The ASH release to install. `cz bump` moves this to each new release.
    RELEASE_TAG: v3.7.1
    ASH_MODE: container
    ASH_REPO_CLONE_URL: https://github.com/awslabs/automated-security-helper.git
    COLUMNS: '140'

phases:
  pre_build:
    commands:
      - echo "Installing ASH ${RELEASE_TAG}"
      - pip install "git+${ASH_REPO_CLONE_URL}@${RELEASE_TAG}"
  build:
    commands:
      # CodeBuild runs as root, which builds the ci stage (the image that runs as root).
      - ash --mode container --build-target ci --no-progress --output-dir .ash/ash_output

  # Runs whether or not the scan passed, so a build that fails on findings
  # still prints its summary.
  post_build:
    commands:
      - ash report --output-dir .ash/ash_output

# Paths are named rather than globbed from the repository root: the scan writes
# under .ash/, and the artifact and the report group read exactly that directory.
artifacts:
  base-directory: .ash/ash_output
  files:
    - '**/*'
  name: ash-output-$(date +%Y-%m-%d)

reports:
  junit-security-findings:
    file-format: JUNITXML
    base-directory: .ash/ash_output/reports
    files:
      - ash.junit.xml
