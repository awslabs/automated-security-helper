[project]
name = "my-ash-plugins"
version = "0.1.0"
description = "Example external plugin package for ASH"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Amazon Web Services", email = "aws-security-helper@amazon.com" }]
# The same range as ASH, because the package is installed into ASH's environment.
requires-python = ">=3.10,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# No dependency on automated-security-helper. ASH installs from its git repository,
# and the PyPI project with that name is not published by ASH, so declaring it would
# install the wrong package. Install this package into the environment ASH already
# runs in; see README.md.
dependencies = []

[project.urls]
Repository = "https://github.com/awslabs/automated-security-helper"

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_ash_plugins"]
