# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: local
    hooks:
      - id: generate-schemas
        name: Generate ASH JSON schemas
        entry: uv run python -m automated_security_helper.schemas.generate_schemas
        language: system
        verbose: true
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: pretty-format-json
        # deploy/cdk/templates/*.template.json is `cdk synth` output, and CDK
        # decides its whitespace: `@aws-cdk/core:suppressTemplateIndentation` in
        # deploy/cdk/cdk.json makes it emit one line per template, because
        # CloudFormation's inline `--template-body` cap counts the indentation it
        # then throws away. Reindenting them here would put AshAgentCore back over
        # that cap and fail the IaC drift gate, which compares the committed bytes
        # to a fresh synth. Excluded rather than reformatted for the same reason
        # any generated file is: the generator owns the format.
        #
        # This hook already disagreed with these files before that flag was set --
        # CDK's default indent is one space, not two -- so a contributor running
        # pre-commit locally was already rewriting them. Only the generated pattern
        # is excluded, so a hand-authored JSON file added beside them is still
        # formatted.
        exclude: '\.vscode/.*|^deploy/cdk/templates/.*\.template\.json'
        args:
          - "--autofix"
          - "--indent=2"
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.8.3
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.8
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  # Local ASH development hooks to help validate ASH is running as expected with
  # local versions
  - repo: local
    hooks:
      - id: ash
        name: (manual) ASH dev manual scan
        description: Runs various code scanners from Python directly
        entry: uv run ash --mode=precommit
        pass_filenames: false
        verbose: true
        language: system
        args:
          - --output-dir=.ash/ash_output_precommit_local
