# Old page -> the page it moved to, both relative to docs/content.
#
# docs/hooks/redirects.py writes a page at each old page's URL that sends the reader
# to the new one, so a link or bookmark to a moved page keeps working. The lint job
# checks every entry (scripts/docs_checks.py check_nav): the old page must no longer
# exist, and the new one must, including any #anchor.
#
# docs/contributing.md is not listed: it was served at /contributing/, the URL the new
# contributing/index.md is served at, so that URL keeps working without a redirect.
#
# Entries under docs/development/, docs/plugins/builtin/event-callbacks.md,
# docs/plugins/workflow.md, docs/prerequisites.md, tutorials/ashv3-quick-start-guide.md
# and tutorials/cloud9-quickstart.md cover URLs the site served in earlier releases
# (most of them only in the June-July 2025 v3 betas) whose pages have no one successor,
# so each points at the page that owns its subject today. The full historical URL
# inventory and the dead-URL map these entries materialize live in docs/url-history/,
# and scripts/validate_url_history.py checks in CI that every inventoried URL is
# served, redirected or tombstoned, with no redirect chains or loops.
redirects:
  developer-guide/scanner-validation-system.md: contributing/testing.md
  developer-guide/unified-metrics.md: concepts/how-ash-works.md
  developer-guide/uv-tool-management.md: docs/advanced-usage.md
