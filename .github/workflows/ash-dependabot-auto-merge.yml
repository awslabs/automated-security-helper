name: ASH - Dependabot Auto-Merge
# Approves a dependabot dependency bump and enables native auto-merge on it, so a
# patch or minor update lands once the merge queue's required checks pass, with no
# human click on a PR whose whole content is a version number.
#
# WHY THIS WORKFLOW EXISTS
#
# The repository already has everything else: auto-merge is enabled in the repo
# settings, main's ruleset requires the full status-check set on the queued commit
# (native auto-merge waits for all of it), and dependabot.yml soaks routine bumps
# before a PR is even opened. The two missing pieces for a dependabot PR were the
# ruleset's one approving review and the auto-merge enablement call itself. This
# workflow supplies exactly those two, and nothing else: it changes no repository
# settings and weakens no required check.
#
# THE SCOPE SPLIT, AND WHY
#
# Auto-merge is enabled only for version-update:semver-patch and
# version-update:semver-minor, and never for the github_actions ecosystem
# (.github/dependabot.yml's ecosystems are github_actions, docker, and uv twice --
# the root project and the transpiler; docker and uv bumps are in scope).
#
#   * Majors stay manual because dependabot.yml already files every major in a
#     group of its own so that a human reads the upstream changelog before merge;
#     auto-merging them would undo that file's point.
#   * github_actions bumps stay manual because an action bump changes what code
#     runs INSIDE workflows that hold this repository's tokens. The refs are
#     pinned to commit shas (ash-actions-pinned.yml), so the bump itself is the
#     one moment a human compares the new sha against the upstream tag.
#   * An update dependabot computed no semver level for (dependabot.yml documents
#     the extras-requirement shape that arrives with no from/to version) has an
#     empty update-type, matches neither allowed value, and stays manual too.
#
# Everything out of scope is simply left alone: the job's filter step skips
# without approving and without commenting, so the PR looks exactly like it did
# before this workflow existed.
#
# WHAT PATTERN THIS FOLLOWS
#
# GitHub's documented dependabot auto-merge recipe ("Automating Dependabot with
# GitHub Actions", the "Enable auto-merge on a pull request" example): trigger on
# `pull_request`, gate the job on the actor being dependabot[bot], read the
# update's facts from dependabot/fetch-metadata, then `gh pr merge --auto` with
# GITHUB_TOKEN. A workflow run triggered by dependabot gets a read-only
# GITHUB_TOKEN by default; the job-level permissions block below is what grants
# the two write scopes, to this job only (zizmor's excessive-permissions audit
# flags workflow-level grants, so the workflow level stays `{}` like
# ash-tag-on-merge.yml).
#
# The trigger lists its types explicitly because `synchronize` is load-bearing:
# main's ruleset dismisses stale reviews on push, so every dependabot rebase
# throws away the previous approval, and this workflow's run on the new head is
# what re-approves it. The default types for `pull_request` are exactly these
# three; spelling them out keeps the dependency on `synchronize` visible.
#
# KNOWN LIMIT
#
# The same GitHub page warns that where the target branch uses a merge queue, the
# built-in GITHUB_TOKEN cannot add pull requests to the queue. Enabling auto-merge
# and approving both work with GITHUB_TOKEN; if the final queue-entry step turns
# out to refuse, the PR sits approved with auto-merge requested and a human merge
# click is the fallback -- the failure mode is a PR that waits, never one that
# merges too early. If that is what happens in practice, the fix is a GitHub App
# token with merge rights, which is a credential decision, not a workflow edit.
#
# WHY THERE IS NO CHECKOUT
#
# Nothing here reads the tree. Not checking out means no code from the PR -- or
# from anywhere -- executes in a job that holds a write token: the two steps are a
# metadata read (from the PR's branch name and commit message, via the pinned
# fetch-metadata action) and two gh calls against the API.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# No workflow-level grant: the one job asks for what it uses (see above).
permissions: {}

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, so every PR gets its own
  # group. A superseded run's approval would be dismissed by the newer push
  # anyway (dismiss_stale_reviews_on_push), so there is nothing worth letting it
  # finish for.
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer run on any ref other than main or a tag supersedes the one in
  # progress; this workflow has no push trigger, so the main and tag clauses are
  # the repository-wide spelling rather than live paths here
  # (tests/unit/test_workflows_cancel_superseded_runs_outside_main.py pins the
  # one expression for every superseding workflow).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  auto-merge:
    name: Approve and enable auto-merge for a patch or minor dependency bump
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # dependabot[bot] is the PR author on every PR dependabot opens; the
    # repository guard keeps the job skipped in forks, where the same workflow
    # file would otherwise approve PRs with the fork's token (the shape every
    # guard in GitHub's documented recipe carries).
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'awslabs/automated-security-helper'
    permissions:
      # gh pr merge --auto needs contents: write; gh pr review --approve needs
      # pull-requests: write. Granted to this job only, nothing else in the file.
      contents: write
      pull-requests: write
    steps:
      - name: Read the update's metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2.5.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # update-type is the highest semver change in the PR, so a grouped PR
      # qualifies only when every member is patch or minor. The step's own if:
      # is the whole scope filter; a PR outside it runs the job as a visible
      # skip and no more.
      - name: Approve the PR and enable auto-merge
        if: >-
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
           steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.metadata.outputs.package-ecosystem != 'github_actions'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Taken from the event rather than interpolated into the script, so no
          # PR-controlled text is ever shell syntax (html_url is server-built,
          # but the env route keeps that a fact about GitHub, not a load-bearing
          # assumption of this file).
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Approve first: the ruleset's one required review is what native
          # auto-merge waits for besides the required checks. Re-runs re-approve
          # after a rebase dismissed the stale review. --squash matches the
          # merge queue's configured method.
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
