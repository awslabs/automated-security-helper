name: ASH - Dependabot Auto-Merge
# Approves a dependabot dependency bump and enables native auto-merge on it, but
# only once every OTHER required check on the PR's head has finished green, so a
# PR whose whole content is a version number needs no human click and is never
# approved ahead of its own gates.
#
# WHY THIS WORKFLOW EXISTS
#
# The repository already has everything else: auto-merge is enabled in the repo
# settings, main's ruleset requires the full status-check set on the queued commit
# (native auto-merge waits for all of it), and dependabot.yml soaks routine bumps
# before a PR is even opened. The two missing pieces for a dependabot PR were the
# ruleset's one approving review and the auto-merge enablement call itself. This
# workflow supplies exactly those two, and nothing else: it changes no repository
# settings and weakens no required check.
#
# THE POLICY, AND WHAT CHANGED
#
# The first version approved at pull-request-open time and only for patch and
# minor bumps outside the github_actions ecosystem. That had two faults:
#
#   * It approved before any check had run, so the approval said nothing about
#     the PR's gates. It now approves only AFTER them.
#   * It left every github_actions bump (the bump of an action pin, such as the
#     "actions group" PRs) waiting for a human, and the step skipped without a
#     word on them, although a grouped actions bump of patch and minor updates is
#     exactly as routine as any other. The ecosystem filter is gone.
#
# The policy is now: patch and minor bumps, and grouped bumps, are auto-approved
# in every ecosystem, and a bump with a MAJOR upgrade is not. dependabot.yml files
# every major in a group of its own so that a human reads the upstream changelog
# before merge, and auto-merging one would undo that file's point. A grouped bump
# is eligible only when no update inside it is a major, and an update with no
# semver level (dependabot.yml documents the extras-requirement shape that arrives
# with no from/to version) stays manual too. The protection on top is the
# all-gates-green condition: the PR's required checks (build, tests, the
# action-pinning check, the dependency review, the scans) have all passed on the
# exact head being approved, and the merge queue then re-runs them on the queued
# commit.
#
# The update types come from the metadata block dependabot writes into its commit
# message, one `update-type:` line per update, which is the block
# dependabot/fetch-metadata parses. That action cannot run on workflow_run, so the
# decision step parses the block itself, from every commit on the PR, and only
# when every commit is dependabot's.
#
# HOW THE DECISION IS RE-ARMED
#
# The workflow listens for the completion of every other workflow that runs on a
# pull request (the `workflows:` list below; a test pins that the list is exactly
# those workflows). Each completion evaluates the PR's head from scratch: it
# reads every check context on the head with its required flag, and approves only
# when every REQUIRED context is complete and successful. While any is pending or
# failed the run ends without approving; the last workflow to complete is the run
# that sees the full set green. There is no polling loop and no sleep: the
# trigger is the event.
#
# Required checks are the gate, not every check. A required check is one the
# ruleset blocks the merge on; informational or non-blocking workflows (for
# example the offline-scanner and PR-head repo-scan runs) are allowed to fail
# without making a version bump unmergeable by hand, so they do not hold the
# approval either. An evaluation that finds no required context at all fails
# closed, so a change to how the flag is reported can only stop approvals, never
# grant them.
#
# THE SAFETY OF THE TRIGGER
#
# `workflow_run` runs the workflow file from the default branch with the
# repository's secrets, which is why zizmor flags it. The danger it names is code
# from the pull request running with those secrets, and nothing here does that:
# there is no checkout, nothing from the PR is executed, and the only PR-derived
# strings (the PR number and the head sha) are passed through env, never
# interpolated into a script. The PR's author, head repository and head sha are
# re-read from the API rather than taken from the triggering event, so a fork PR
# (a different head repository) is excluded and a newer push (a different head
# sha) leaves the approval to that push's own run. The commit text is parsed with
# sed and grep only and is never echoed or evaluated.
#
# WHY AN APP TOKEN AND NOT GITHUB_TOKEN FOR THE WRITES
#
# GitHub's documented dependabot auto-merge recipe warns that where the target
# branch uses a merge queue -- this repository's case -- the built-in
# GITHUB_TOKEN cannot add pull requests to the queue, so `gh pr merge --auto`
# under GITHUB_TOKEN leaves a PR that can never enqueue. The approval and the
# auto-merge enablement therefore run under a short-lived installation token for
# ash-automations, the team-managed GitHub App installed on this repository
# (pull-requests: write plus metadata: read), minted by the pinned
# create-github-app-token step from the two repository secrets and scoped to
# this one repository and to pull-requests: write only (the permission-* input;
# a mint with no such input inherits every permission the installation holds,
# which zizmor's github-app audit rightly flags). The token is minted only when
# the decision step approved, so no run that ends without approving ever holds
# it. The check reads use GITHUB_TOKEN with checks: read and statuses: read,
# which the App does not hold and the writes do not need. The workflow level
# stays `{}` like ash-tag-on-merge.yml (zizmor's excessive-permissions audit
# flags workflow-level grants).
#
# The secrets exist both as Actions secrets and as Dependabot secrets. A run
# whose triggering workflow was started by dependabot may be handed only the
# Dependabot set, so both stores must keep both values.
#
# One residual to verify on the first dependabot PR to run through the new
# trigger: if GitHub turns out to require contents: write on the App for the
# queue-entry step itself, the failure is the same safe shape as before (the PR
# sits approved with auto-merge requested and a human click is the fallback). The
# fix is then two small grants, both named here so neither is hunted for later:
# the repository team adds contents: write to the ash-automations registration
# (the App Manager page), and the mint below adds `permission-contents: write`.

on:
  # zizmor's dangerous-triggers audit flags this event; see "THE SAFETY OF THE
  # TRIGGER" above for why nothing it names can happen in this workflow.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - "ASH - Action Pinning Check"
      - "Agent Plugins Drift"
      - "CDK Extra Drift"
      - "Docs CI Runners"
      - "ASH - IaC Drift"
      - "ASH - Image scan against a live engine and registry"
      - "Install Method Validation"
      - "ASH - Offline-capable scanners (non-blocking)"
      - "ASH - Package Build"
      - "ASH - Platform Wheels"
      - "ASH - PR Title Check"
      - "ASH - Scan-Time Benchmark"
      - "Run ASH (pull request head, informational)"
      - "Run ASH"
      - "TypeScript CI"
      - "ASH - Unified CI"
      - "ASH Upgrade Paths"
      - "ASH - Workflow Boolean Input Check"
      - "Dependency Review"
    types: [completed]

# No workflow-level grant: the one job asks for what it uses (see above).
permissions: {}

concurrency:
  # One run per head commit at a time, queued rather than cancelled: every
  # completing workflow of one head must get its turn at the decision, because
  # the last one is the run that sees the full set green. A group keyed on the
  # ref would be wrong here -- github.ref is the default branch on workflow_run,
  # so every pull request would share one group and drop each other's runs. The
  # decision step re-reads the whole state, so a queued run loses nothing by
  # waiting for an earlier one.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only a workflow that ran for a pull request and succeeded can complete the
    # set, and the repository guard keeps the job skipped in forks, where the
    # same workflow file would otherwise approve PRs with the fork's token. The
    # fork-PR exclusion for pull requests from forks is the head-repository
    # comparison in the decision step.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.repository == 'awslabs/automated-security-helper'
    permissions:
      # The decision step's reads only; the approve and the auto-merge
      # enablement run under the app token minted below.
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Decide whether every required check on the head is green
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          # This job's own check name, left out of the gate so the workflow can
          # never wait on itself.
          SELF_CHECK: ${{ github.job }}
        run: |
          set -euo pipefail
          deny() {
            echo "Not approving: $1"
            echo "approve=false" >> "$GITHUB_OUTPUT"
            exit 0
          }

          pr=$(jq -r '.[0].number // empty' <<<"$PULL_REQUESTS")
          [ -n "$pr" ] || deny "the completed run is attached to no pull request"

          pull=$(gh api "repos/$REPO/pulls/$pr")
          author=$(jq -r '.user.login' <<<"$pull")
          [ "$author" = "dependabot[bot]" ] || deny "PR $pr is authored by $author, not dependabot"
          [ "$(jq -r '.state' <<<"$pull")" = "open" ] || deny "PR $pr is not open"
          [ "$(jq -r '.head.repo.full_name' <<<"$pull")" = "$REPO" ] || deny "PR $pr comes from a fork"
          [ "$(jq -r '.head.sha' <<<"$pull")" = "$HEAD_SHA" ] || deny "PR $pr has a newer head than the completed run"

          # No single major upgrade, and no major inside a group. The update types
          # are read from the metadata block dependabot writes into its commit
          # message (one `update-type:` line per update in the PR, the same block
          # dependabot/fetch-metadata parses, which cannot run on workflow_run).
          # Every commit on the PR must be dependabot's, so a human commit cannot
          # add a line of its own; a PR whose commits carry no update-type, or any
          # type other than patch or minor (a major, or the empty type of an update
          # dependabot computed no semver level for), stays manual. The offending
          # text is counted, never echoed, so commit text cannot reach the log as a
          # workflow command.
          commits=$(gh api --paginate "repos/$REPO/pulls/$pr/commits" | jq -s '[.[][]]')
          foreign=$(jq '[.[] | select(.author.login != "dependabot[bot]")] | length' <<<"$commits")
          [ "$foreign" = "0" ] || deny "PR $pr has $foreign commit(s) not authored by dependabot"
          lines=$(jq -r '.[].commit.message' <<<"$commits" | grep -E '^  update-type:' || true)
          total=$(grep -c . <<<"$lines" || true)
          [ "$total" != "0" ] || deny "PR $pr carries no update-type metadata"
          minor_or_patch=$(grep -c -x -E '  update-type: version-update:semver-(patch|minor)' <<<"$lines" || true)
          [ "$total" = "$minor_or_patch" ] || deny "PR $pr has $((total - minor_or_patch)) of $total update(s) that are not patch or minor (a major waits for a human)"

          # Every check context on the head with its required flag. GraphQL is
          # the only API that reports isRequired, and it covers both branch
          # protection and rulesets. --paginate follows the contexts connection.
          # shellcheck disable=SC2016  # $-names inside the query are GraphQL variables
          pages=$(gh api graphql --paginate \
            -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F number="$pr" \
            -f query='
              query($owner: String!, $name: String!, $number: Int!, $endCursor: String) {
                repository(owner: $owner, name: $name) {
                  pullRequest(number: $number) {
                    commits(last: 1) { nodes { commit { statusCheckRollup {
                      contexts(first: 100, after: $endCursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          __typename
                          ... on CheckRun { name status conclusion isRequired(pullRequestNumber: $number) }
                          ... on StatusContext { context state isRequired(pullRequestNumber: $number) }
                        }
                      }
                    } } } }
                  }
                }
              }')

          verdict=$(jq -s -r --arg self "$SELF_CHECK" '
            [ .[].data.repository.pullRequest.commits.nodes[0].commit.statusCheckRollup.contexts.nodes[]? ]
            | map(select(.isRequired == true and (.name // .context) != $self)) as $required
            | if ($required | length) == 0 then "no required check was reported on the head"
              else
                [ $required[]
                  | select(
                      if .__typename == "CheckRun"
                      then (.status != "COMPLETED"
                            or ((.conclusion // "") | IN("SUCCESS", "NEUTRAL", "SKIPPED") | not))
                      else .state != "SUCCESS" end)
                  | (.name // .context) ] as $open
                | if ($open | length) == 0 then "green"
                  else "required checks not green: " + ($open | join(", ")) end
              end' <<<"$pages")

          [ "$verdict" = "green" ] || deny "$verdict"
          echo "Every required check on $HEAD_SHA is green; approving PR $pr."
          {
            echo "approve=true"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"

      # Minted fresh per run, expires on its own, and scoped twice: to this one
      # repository whatever else the installation covers, and to the one
      # permission the two gh calls use, whatever else the App's registration
      # grants now or gains later. Without the permission-* line the token
      # would inherit the installation's full permission set, which is zizmor's
      # github-app finding (this repository's own scan gates on it). The two
      # secrets are the ash-automations App's id and private key.
      - name: Mint an installation token for the automation app
        if: steps.decide.outputs.approve == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.ASH_AUTOMATIONS_APP_ID }}
          private-key: ${{ secrets.ASH_AUTOMATIONS_PRIVATE_KEY }}
          owner: awslabs
          repositories: automated-security-helper
          permission-pull-requests: write

      - name: Approve the PR and enable auto-merge
        if: steps.decide.outputs.approve == 'true'
        env:
          # The app token, not GITHUB_TOKEN: only it can enter the merge queue
          # (the header's token section). It makes ash-automations[bot] the
          # reviewer and the auto-merge enabler.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.decide.outputs.pr }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Approve the exact commit the gates were read on: if a push lands
          # between the decision and here, the review attaches to the old
          # commit and --match-head-commit refuses the enablement, so a head
          # whose gates were never read is never approved. The ruleset's one
          # required review is what native auto-merge waits for besides the
          # required checks. --squash matches the merge queue's configured
          # method.
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f event=APPROVE -f commit_id="$HEAD_SHA"
          gh pr merge --repo "$REPO" --auto --squash --match-head-commit "$HEAD_SHA" "$PR"
