name: Run ASH
on:
  pull_request:
    # "**" not "*": "*" does not match "/", so a pull request whose base is a nested
    # branch would get no scan at all. "**" matches nested branch names too.
    branches:
      - "**"
  merge_group:
  workflow_dispatch: {}
  # For the grype-db-cache job only. The scan job below skips pushes, so a merge does
  # not run a second full scan; see that job for why main has to be where the grype
  # database cache is written.
  push:
    branches: [main]
env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull_request runs may be cancelled. A merge_group run must finish or the
  # queue loses its verdict, and push/tag runs feed docs and releases.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ash:
    # Not on push. The push trigger exists for grype-db-cache; running the scan there too
    # would add a scan per merge and a code-scanning upload for main, neither of which
    # this change is about.
    if: github.event_name != 'push'
    # uses: awslabs/automated-security-helper/.github/workflows/run-ash-security-scan.yml@v3.0.0-beta
    uses: ./.github/workflows/run-ash-security-scan.yml
    permissions:
      contents: read # Required to read the repository contents in order to scan them with ASH
      checks: write # Required for writing CI check runs
      pull-requests: write # Required for writing comments with scan results to pull requests
      # No security-events here. The called workflow drops it, so granting it here
      # never reached the upload step; the sarif job below holds it instead.
    with:
      # This job is the required check `ash / SAST, SCA, and IaC Scan`, so the ASH
      # that judges a pull request is never the one the pull request changes.
      #
      # For PR runs, install ASH from this repository at the pull request's base
      # commit, for same-repo and fork PRs alike. It used to be the PR's head repo
      # and branch, which let a pull request that changes how ASH scans (a scanner
      # that stops reporting, a parser that drops results, a gate that exits 0) be
      # judged by the ASH it ships. ash-repo-scan-pr-head.yml runs the PR's own ASH
      # as an informational check that nothing requires.
      # For merge_group runs, github.head_ref is empty and github.ref_name is the
      # ephemeral gh-readonly-queue/... branch, which GitHub deletes as soon as the
      # queue entry is processed. The scan step's uvx install would win the race and
      # the later report step's would not, failing with "couldn't find remote ref".
      # The commit is unreachable once the branch is gone, so its SHA is not
      # fetchable either - the stable choice is the branch the queue merges into,
      # merge_group.base_ref (refs/heads/<target>). That is the default branch for
      # this repository's queue, but a queue on another branch gets its own.
      # For non-PR runs (workflow_dispatch), use the current repo and ref.
      ash-version: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_ref || github.ref_name }}
      ash-repo: ${{ github.repository }}
      # The config comes from the same place as the ASH: the pull request's base
      # commit, or in the merge queue the branch it merges into. So a pull request
      # cannot add suppressions or ignore paths to its own required check; its
      # config edits apply to this check once merged, and ash-repo-scan-pr-head.yml
      # scans with them before that. workflow_dispatch reads the dispatched ref's
      # config from the checkout.
      #
      # Not merge_group.base_sha: for every entry behind the first, that is the
      # previous entry's temporary merge commit, which carries that entry's
      # unmerged config and sits on a queue branch GitHub deletes. The trailing
      # `|| ''` keeps the input empty on workflow_dispatch.
      config: .ash/.ash.yaml
      config-ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_ref || '' }}
      # The install steps come from the pull request's workflow files and the ASH
      # from its base commit, so a pull request that adds a scanner asks the base
      # ASH for a tool it has no plugin for. That ASH names and skips it rather than
      # failing the check; the informational check installs and runs it.
      skip-unknown-tools: true
      # Off because the sarif job below uploads instead. The upload step inside the
      # called workflow cannot hold security-events: write, so it fails on
      # workflow_dispatch; see upload-ash-sarif.yml for why.
      collect-sarif-report: false
      # Set this to `false` if you would prefer that ASH does not comment on PRs with the findings.
      post-pr-comment: true
      # The repository's own bandit and grype configs, named by the operator: a
      # config file inside the scanned tree no longer chooses a scanner's own
      # config file (config/tool_config_trust.py). .ash/.grype.yaml explains its
      # only-fixed.
      ash-args: >-
        --config-overrides scanners.bandit.options.config_file=.ash/bandit.yaml
        --config-overrides scanners.grype.options.config_file=.ash/.grype.yaml
      # Set this to `false` if you prefer less verbose log output
      verbose: true
      # Install Grype and Syft for comprehensive vulnerability scanning
      install-grype: true
      install-syft: true
      install-opengrep: true
      # .ash/.ash.yaml enables cfn-nag, so the runner has to carry it. Without
      # this the scanner resolves MISSING and the run reports an incomplete
      # scan -- correctly, because the CloudFormation in this repository was
      # never actually being checked.
      install-cfn-nag: true
      # The binary scanners that are on by default and do not install themselves.
      install-actionlint: true
      install-cfn-guard: true
      install-gitleaks: true
      install-trivy: true

  # Uploads the scan's SARIF report to code scanning. It is a separate job because
  # security-events: write has to be granted to a called workflow that declares it,
  # and run-ash-security-scan.yml cannot declare it without breaking callers that
  # never grant it; upload-ash-sarif.yml has the details.
  #
  # Runs when the scan failed as well as when it passed, because a scan that fails
  # on findings has still written its report. Skipped with the scan on push.
  #
  # Fork and Dependabot pull requests still start. The startup check compares what
  # the called workflow requests with what this job DECLARES; the read-only
  # downgrade for those events is applied to the token afterwards. The scan job
  # has always relied on the same thing for checks and pull-requests: write.
  sarif:
    needs: ash
    # After the scan whether it passed or failed: a scan that fails on findings has
    # still written its SARIF. `!cancelled()` is what makes it run after a failure;
    # without a status function GitHub adds an implicit `success() &&`, and the job
    # was skipped after every failed scan. Not when the scan uploaded no ash_output
    # (it failed before ASH wrote its reports): the download would fail too and
    # show a second red check.
    if: ${{ !cancelled() && needs.ash.outputs.artifact-id != '' }}
    uses: ./.github/workflows/upload-ash-sarif.yml
    permissions:
      contents: read # Required for the checkout in the called workflow
      security-events: write # Required to upload SARIF results to code scanning
    with:
      # The exact artifact the scan job uploaded, in whichever attempt it ran.
      artifact-id: ${{ needs.ash.outputs.artifact-id }}

  # WHY THIS JOB EXISTS
  #
  # The grype database cache in run-ash-security-scan.yml is restored on every run
  # and saved only from a push to the default branch, so pull requests stop writing
  # one ~475 MB entry each. That workflow never runs on a push here, so without a
  # writer on main no pull request would ever restore a warm database. This job is
  # that writer: on each push to main it checks whether the current time bucket
  # already has an entry, and if not, installs grype, fetches the database, checks
  # it is fresh enough to be cached, and saves it under exactly the key the scan
  # workflow restores.
  #
  # The bucket, the bound grype is told and the save-side age check all come from
  # automated_security_helper/utils/content_databases.py, the same as in the scan
  # workflow, so the two cannot disagree about the key or the bound.
  #
  # Cadence: one entry per bucket (a day, for grype's bound today), written by the first
  # push to main in that bucket. Before this, the key rotated daily as well, but was
  # written once per pull request per day.
  grype-db-cache:
    name: Refresh the grype database cache (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # The same helper run-ash-security-scan.yml writes, byte for byte (a test holds
      # the copies equal): `built` below comes from the downloaded database's
      # metadata, and one_line keeps it on the line it is printed in.
      - name: Write the one_line helper
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/ash-one-line.sh" <<'EOF'
          one_line() {
            local LC_ALL=C
            local text="${1//[[:cntrl:]]/ }"
            text="${text//$'\xc2'[$'\x80'-$'\x9f']/ }"
            text="${text//$'\xe2\x80'[$'\xa8\xa9']/ }"
            while [[ "${text}" == *::* ]]; do text="${text//::/: :}"; done
            while [[ "${text}" == *'##['* ]]; do text="${text//'##['/'# #['}"; done
            printf '%s' "${text}"
          }
          __wcs_clock() {
            __wcs_now="${EPOCHREALTIME:-}"
            __wcs_now="${__wcs_now//[!0-9]/}"
            if [ -z "${__wcs_now}" ]; then
              __wcs_now=$((SECONDS * 1000000))
            fi
          }
          __wcs_end_group() {
            local __wcs_now="" __wcs_until=""
            if [ -z "${__wcs_pid}" ]; then
              return 0
            fi
            __wcs_clock
            __wcs_until=$((__wcs_now + $1 * 100000))
            while kill -0 -- "-${__wcs_pid}" 2>/dev/null && [ "${__wcs_now}" -lt "${__wcs_until}" ]; do
              sleep 0.1
              __wcs_clock
            done
            if ! kill -0 -- "-${__wcs_pid}" 2>/dev/null; then
              return 0
            fi
            kill -s KILL -- "-${__wcs_pid}" 2>/dev/null || true
            __wcs_until=$((__wcs_now + 500000))
            while kill -0 -- "-${__wcs_pid}" 2>/dev/null && [ "${__wcs_now}" -lt "${__wcs_until}" ]; do
              sleep 0.1
              __wcs_clock
            done
            return 1
          }
          __wcs_on_signal() {
            if [ -z "${__wcs_pid}" ] && [ "${!:-}" != "${__wcs_before}" ]; then
              __wcs_pid="${!:-}"
            fi
            if [ -n "${__wcs_pid}" ]; then
              kill -s "$1" -- "-${__wcs_pid}" 2>/dev/null || kill -s "$1" "${__wcs_pid}" 2>/dev/null || true
            fi
            if [ "$1" = TERM ]; then
              __wcs_end_group 10 || __wcs_left=1
              if [ -n "${__wcs_open}" ]; then
                printf '\n::%s::\n' "${__wcs_token}"
              fi
              if [ -n "${__wcs_left}" ]; then
                printf '%s\n' "::error::processes the command started did not end in time, so they were sent SIGKILL and the step fails"
              fi
              exit 143
            fi
            __wcs_interrupted="$2"
          }
          __wcs_exec() {
            if command -v setsid >/dev/null 2>&1; then
              exec setsid -w "$@"
            fi
            exec perl -MPOSIX -e 'my $s = POSIX::setsid(); exit 127 unless defined $s && $s >= 0; exec { $ARGV[0] } @ARGV; exit 127' -- "$@"
          }
          with_commands_stopped() {
            if [ "${BASH_SUBSHELL:-0}" -gt 0 ]; then
              printf '%s\n' "::error::with_commands_stopped must run in the step's own shell, the one process the runner signals on a cancel, not in a subshell, a pipeline, a command substitution or a background job. For ( cd DIR && ... ), use env -C DIR, or cd at the top level" >&2
              kill -s TERM "$$" 2>/dev/null || true
              return 1
            fi
            local __wcs_out="" __wcs_var="" __wcs_file="" __wcs_token __wcs_status=0
            local __wcs_pid="" __wcs_interrupted="" __wcs_open="" __wcs_left="" __wcs_before="${!:-}"
            case "${1:-}" in
              --stdout) __wcs_out="$2"; shift 2 ;;
              --capture) __wcs_var="$2"; shift 2 ;;
            esac
            __wcs_token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            if [ "${#__wcs_token}" -ne 32 ]; then
              printf '%s\n' "::error::no random token could be read for stop-commands, so the command did not run"
              return 1
            fi
            if [ -n "${__wcs_var}" ]; then
              __wcs_file="$(mktemp "${RUNNER_TEMP:-/tmp}/ash-wcs.XXXXXX")" || return 1
              __wcs_out="${__wcs_file}"
            fi
            trap '__wcs_on_signal INT 130' INT
            trap '__wcs_on_signal QUIT 131' QUIT
            trap '__wcs_on_signal TERM 143' TERM
            __wcs_open=1
            printf '::stop-commands::%s\n' "${__wcs_token}"
            if [ -z "${__wcs_interrupted}" ]; then
              if [ -n "${__wcs_out}" ]; then
                (trap - INT QUIT TERM; __wcs_exec "$@") 2>&1 > "${__wcs_out}" <&0 &
              else
                (trap - INT QUIT TERM; __wcs_exec "$@") 2>&1 <&0 &
              fi
              __wcs_pid=$!
              wait "${__wcs_pid}" || __wcs_status=$?
            fi
            if [ -n "${__wcs_interrupted}" ] && [ -n "${__wcs_pid}" ]; then
              wait "${__wcs_pid}" 2>/dev/null || true
            fi
            __wcs_end_group 50 || __wcs_left=1
            printf '\n::%s::\n' "${__wcs_token}"
            __wcs_open=""
            trap - INT QUIT TERM
            if [ -n "${__wcs_left}" ]; then
              printf '%s\n' "::error::processes the command started did not end in time, so they were sent SIGKILL and the step fails"
              if [ "${__wcs_status}" -eq 0 ]; then
                __wcs_status=1
              fi
            fi
            if [ -n "${__wcs_interrupted}" ]; then
              exit "${__wcs_interrupted}"
            fi
            if [ -n "${__wcs_file}" ]; then
              printf -v "${__wcs_var}" '%s' "$(cat "${__wcs_file}")"
              rm -f -- "${__wcs_file}"
            fi
            return "${__wcs_status}"
          }
          EOF
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # No uv cache: this job adds no cache other than the grype database it exists for.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Compute the grype database cache key
        id: key
        run: |
          set -euo pipefail
          bucket="$(python -m automated_security_helper.utils.content_databases cache-key grype-db)"
          echo "grype-db=${bucket}" >> "$GITHUB_OUTPUT"
          echo "grype database cache bucket: ${bucket}"

      - name: Look up the current bucket's entry
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ steps.key.outputs.grype-db }}
          lookup-only: true

      - name: Install grype and fetch its database
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          ASH_TOOL_BIN: ${{ runner.temp }}/ash-tools
        run: |
          set -euo pipefail
          uvx --from . ash dependencies install --tool grype --bin-path "${ASH_TOOL_BIN}"
          # The bound grype enforces, from the registry rather than grype's default.
          while IFS= read -r assignment; do
            export "${assignment?}"
          done < <(python -m automated_security_helper.utils.content_databases bound-env grype-db)
          "${ASH_TOOL_BIN}/grype" db update
          "${ASH_TOOL_BIN}/grype" db status

      - name: Check the grype database may be saved
        id: fresh
        if: steps.lookup.outputs.cache-hit != 'true'
        env:
          ASH_TOOL_BIN: ${{ runner.temp }}/ash-tools
        run: |
          set -uo pipefail
          . "${RUNNER_TEMP}/ash-one-line.sh"
          built="$("${ASH_TOOL_BIN}/grype" db status -o json 2>/dev/null \
            | python -c 'import json,sys; print(json.load(sys.stdin).get("built",""))' 2>/dev/null)"
          if [ -n "${built}" ] && python -m automated_security_helper.utils.content_databases \
              check-age grype-db --built "${built}" --for save; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::not saving the grype database (built '$(one_line "${built:-unknown}")'): too close to its bound to be cached."
          fi

      - name: Save the grype database cache (main only)
        if: >-
          steps.fresh.outputs.ok == 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ steps.key.outputs.grype-db }}

  # The `ash` job above skips push, so run-ash-security-scan.yml's default-branch
  # save of the OpenGrep binary never fires in this repository. This job is that
  # save, the way grype-db-cache is for the grype database: without it every pull
  # request misses and downloads the binary. The key and path must stay identical
  # to the restore in run-ash-security-scan.yml. A week that already has an entry
  # is a lookup and nothing else.
  opengrep-cache:
    name: Refresh the OpenGrep binary cache (main only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Compute the OpenGrep cache key
        id: key
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Look up this week's entry
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opengrep/cli/latest
          key: opengrep-${{ runner.os }}-${{ steps.key.outputs.week }}
          lookup-only: true
      # The entry written here is what run-ash-security-scan.yml restores, so it has to
      # be the same file that workflow would install: `opengrep` at the version and
      # SHA256 pinned in automated_security_helper/utils/tool_downloads.py. The consumer
      # re-hashes whatever it restores against that pin and discards a mismatch, so this
      # is not the only check -- but a seeder that cached an unverified download (which
      # is what `gh release download --pattern` with no tag was, of whatever release was
      # newest that day) would turn every pull request's cache hit into a re-download.
      #
      # install-pinned-tool.py rather than `ash dependencies install`: it needs only the
      # runner's python3 and the checkout, so this job still installs no ASH and no uv.
      # It reads the same table, verifies before anything lands, and exits 3 on a
      # mismatch.
      - name: Check out the pinned tool table
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned OpenGrep release binary
        if: steps.lookup.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/.opengrep/cli/latest"
          python3 automated_security_helper/assets/install-pinned-tool.py opengrep \
            -b "$INSTALL_DIR" \
            --pins-dir automated_security_helper
          "$INSTALL_DIR/opengrep" --version
      - name: Save the OpenGrep binary cache (main only)
        if: >-
          steps.lookup.outputs.cache-hit != 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opengrep/cli/latest
          key: opengrep-${{ runner.os }}-${{ steps.key.outputs.week }}
