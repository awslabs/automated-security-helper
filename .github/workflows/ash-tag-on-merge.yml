name: ASH - Tag and Publish Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

# No workflow-level write grant: each job asks for what it uses. tag-and-release
# creates the release tag and the GitHub Release, so it holds
# contents: write. This workflow publishes no docs; the docs workflow deploys on
# pushes to main and when run by hand. zizmor (excessive-permissions) flagged the old
# workflow-level `contents: write`, which also reached any job added later without a
# block of its own.
permissions: {}

jobs:
  tag-and-release:
    name: Create tag and GitHub Release
    permissions:
      contents: write
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Release runs do not overlap. The group is not per pull request or per
    # version: the release step reads the remote's tags before it creates anything,
    # so two runs for different versions must not interleave that read with each
    # other's writes. cancel-in-progress stays false because a release run must
    # finish once started.
    #
    # GitHub keeps at most one running and one pending run per group. When a third
    # release run arrives while one runs and one waits, the waiting run is cancelled
    # (cancel-in-progress: false does not change that). A cancelled run creates no
    # release and starts no docs publish, and the only trace is a "cancelled" run in
    # the Actions list. Re-run it by hand. That is safe: the step skips a release that
    # already exists and refuses a release tag that sits at another commit.
    concurrency:
      group: ash-release-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release pull request's merge commit, not the branch: with two release
          # pull requests merged close together, a run that read the version from the
          # current tip of main would release the newer version at the older merge.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # No uv cache in this workflow. It tags and publishes the release with
      # `contents: write`. It runs on the pull_request `closed` event, whose cache
      # scope is the pull request's own ref, so a restore here could read an entry
      # that a CI run of the pull request's branch saved. zizmor's cache-poisoning
      # audit does not model this trigger, so it does not report it.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Read version
        id: version
        run: |
          VERSION=$(uv run cz version --project)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping"
            exit 0
          fi

          # `gh release create --target` is ignored when the tag already exists, so a
          # tag left at another commit would publish this release there. Read the tag
          # on the remote first: absent, or already at the merge commit, is fine. An
          # annotated tag lists its commit on the `^{}` line, which comes last.
          TAG_REFS=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          TAG_SHA=$(printf '%s\n' "$TAG_REFS" | tail -n1 | cut -f1)
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$MERGE_SHA" ]]; then
            echo "::error::Tag ${TAG} already exists at ${TAG_SHA}, but the release pull request merged at ${MERGE_SHA}. Creating the release would publish it at the existing tag's commit. Move or delete the tag, then rerun this job."
            exit 1
          fi

          # The release body leads with this version's CHANGELOG.md entry, and
          # GitHub's generated notes follow it. gh prepends --notes to
          # --generate-notes output. The entry is what commitizen rendered from
          # .github/changelog/CHANGELOG.md.j2, which includes
          # .github/release-notes/<tag>.md when that file exists, so the curated
          # notes reach the release page from the same file as the changelog.
          # v3.8.0 needs this: it ships breaking changes as a minor, and the
          # release page is where users pinned to <4 look.
          #
          # Covered by tests/unit/test_release_notes_workflow.py: the release body,
          # and TestTheCuratedNotesFailureNamesTheRecovery for the curated-notes
          # failure's advice below.
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes-${TAG}.md"
          CURATED=".github/release-notes/${TAG}.md"
          awk -v tag="$TAG" '
            /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ -f "$CURATED" ]]; then
            # No release exists yet, so failing here publishes nothing, while
            # publishing would lose the curated notes. A re-run cannot pick up a
            # fix: the checkout is pinned to this pull request's merge commit, and a
            # re-run replays the same event payload, so it reads the same
            # CHANGELOG.md and fails the same way. Two recoveries change the outcome:
            # a new chore(release): pull request whose regenerated entry includes the
            # file (commitizen regenerates the entry without bumping the version), or
            # keeping this merge commit by creating the release by hand at it
            # (`gh release create <tag> --target <merge sha>` with the notes), after
            # which a run of this job exits at the release-exists check above.
            if ! python3 - "$CURATED" "$NOTES_FILE" <<'PY'
          import sys
          curated = open(sys.argv[1], encoding="utf-8").read().strip()
          notes = open(sys.argv[2], encoding="utf-8").read()
          sys.exit(0 if curated and curated in notes else 1)
          PY
            then
              echo "::error::${CURATED} exists, but the CHANGELOG.md entry for ${TAG} does not contain it. Refusing to publish ${TAG} without its curated notes. Regenerate the entry with commitizen without bumping the version (the template includes the file) and merge it as a new chore(release): pull request, or keep this merge commit: create the release by hand with gh release create ${TAG} --target ${MERGE_SHA} and the entry plus the curated notes as its body, after which a run of this job finds the release and exits without publishing. A plain re-run of this job reads the same CHANGELOG.md from the same merge commit and fails the same way."
              exit 1
            fi
          fi

          NOTES_ARGS=()
          if grep -q '[^[:space:]]' "$NOTES_FILE"; then
            NOTES_ARGS=(--notes "$(cat "$NOTES_FILE")")
          else
            echo "::warning::CHANGELOG.md has no entry for ${TAG}, so the release body is GitHub's generated notes only."
          fi

          # Target the merge commit of the release pull request, not the branch name.
          # `main` is resolved when the release is created, so a pull request merged
          # in between would put the tag on a commit that is not the release.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" \
            --generate-notes \
            "${NOTES_ARGS[@]}" \
            --title "$TAG"

          echo "Created release $TAG"
