name: ASH - Tag and Publish Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

# No workflow-level write grant: each job asks for what it uses. tag-and-release
# pushes the release and floating tags and creates the GitHub Release, so it holds
# contents: write. This workflow publishes no docs; the docs workflow deploys on
# pushes to main and when run by hand. zizmor (excessive-permissions) flagged the old
# workflow-level `contents: write`, which also reached any job added later without a
# block of its own.
permissions: {}

jobs:
  tag-and-release:
    name: Create tag and GitHub Release
    permissions:
      contents: write
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Release runs do not overlap. The group is not per pull request or per
    # version: the floating tag is shared by every release of a major, so two runs
    # for different versions must not read and move it at the same time.
    # cancel-in-progress stays false because cancelling a run between creating the
    # release tag and moving the floating tag would leave the two out of step.
    #
    # GitHub keeps at most one running and one pending run per group. When a third
    # release run arrives while one runs and one waits, the waiting run is cancelled
    # (cancel-in-progress: false does not change that). A cancelled run creates no
    # release and starts no docs publish, and the only trace is a "cancelled" run in
    # the Actions list. Re-run it by hand. That is safe: the step skips a release that
    # already exists, refuses a release tag that sits at another commit, and never
    # moves the floating tag to an older version.
    concurrency:
      group: ash-release-tag
      cancel-in-progress: false
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release pull request's merge commit, not the branch: with two release
          # pull requests merged close together, a run that read the version from the
          # current tip of main would release the newer version at the older merge.
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      # No uv cache in this workflow. It tags and publishes the release with
      # `contents: write`. It runs on the pull_request `closed` event, whose cache
      # scope is the pull request's own ref, so a restore here could read an entry
      # that a CI run of the pull request's branch saved. zizmor's cache-poisoning
      # audit does not model this trigger, so it does not report it.
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Read version
        id: version
        run: |
          VERSION=$(uv run cz version --project)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping"
            exit 0
          fi

          # `gh release create --target` is ignored when the tag already exists, so a
          # tag left at another commit would publish this release there. Read the tag
          # on the remote first: absent, or already at the merge commit, is fine. An
          # annotated tag lists its commit on the `^{}` line, which comes last.
          TAG_REFS=$(git ls-remote origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          TAG_SHA=$(printf '%s\n' "$TAG_REFS" | tail -n1 | cut -f1)
          if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$MERGE_SHA" ]]; then
            echo "::error::Tag ${TAG} already exists at ${TAG_SHA}, but the release pull request merged at ${MERGE_SHA}. Creating the release would publish it at the existing tag's commit. Move or delete the tag, then rerun this job."
            exit 1
          fi

          # The release body leads with this version's CHANGELOG.md entry, and
          # GitHub's generated notes follow it. gh prepends --notes to
          # --generate-notes output. The entry is what commitizen rendered from
          # .github/changelog/CHANGELOG.md.j2, which includes
          # .github/release-notes/<tag>.md when that file exists, so the curated
          # notes reach the release page from the same file as the changelog.
          # v3.8.0 needs this: it ships breaking changes as a minor, and the
          # release page is where users pinned to <4 look.
          #
          # Covered by tests/unit/test_release_notes_workflow.py (the release body) and,
          # for the curated-notes failure's advice below, by
          # tests/unit/test_floating_major_tag_workflow.py
          # (TestTheCuratedNotesFailureNamesTheRecovery).
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes-${TAG}.md"
          CURATED=".github/release-notes/${TAG}.md"
          awk -v tag="$TAG" '
            /^## / { if (found) exit; if ($2 == tag) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$NOTES_FILE"

          if [[ -f "$CURATED" ]]; then
            # No release exists yet, so failing here publishes nothing, while
            # publishing would lose the curated notes. A re-run cannot pick up a
            # fix: the checkout is pinned to this pull request's merge commit, and a
            # re-run replays the same event payload, so it reads the same
            # CHANGELOG.md and fails the same way. Two recoveries change the outcome:
            # a new chore(release): pull request whose regenerated entry includes the
            # file (commitizen regenerates the entry without bumping the version), or
            # keeping this merge commit by creating the release by hand at it
            # (`gh release create <tag> --target <merge sha>` with the notes), after
            # which a run of this job exits at the release-exists check above.
            if ! python3 - "$CURATED" "$NOTES_FILE" <<'PY'
          import sys
          curated = open(sys.argv[1], encoding="utf-8").read().strip()
          notes = open(sys.argv[2], encoding="utf-8").read()
          sys.exit(0 if curated and curated in notes else 1)
          PY
            then
              echo "::error::${CURATED} exists, but the CHANGELOG.md entry for ${TAG} does not contain it. Refusing to publish ${TAG} without its curated notes. Regenerate the entry with commitizen without bumping the version (the template includes the file) and merge it as a new chore(release): pull request, or keep this merge commit: create the release by hand with gh release create ${TAG} --target ${MERGE_SHA} and the entry plus the curated notes as its body, after which a run of this job finds the release and exits without publishing. A plain re-run of this job reads the same CHANGELOG.md from the same merge commit and fails the same way."
              exit 1
            fi
          fi

          NOTES_ARGS=()
          if grep -q '[^[:space:]]' "$NOTES_FILE"; then
            NOTES_ARGS=(--notes "$(cat "$NOTES_FILE")")
          else
            echo "::warning::CHANGELOG.md has no entry for ${TAG}, so the release body is GitHub's generated notes only."
          fi

          # Target the merge commit of the release pull request, not the branch name.
          # `main` is resolved when the release is created, so a pull request merged
          # in between would put the tag on a commit that is not the release.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" \
            --generate-notes \
            "${NOTES_ARGS[@]}" \
            --title "$TAG"

          echo "Created release $TAG"

      # The floating tag is named from the version being released. It used to be the
      # literal `v3`, which meant a 4.x release would have pointed `v3` at a 4.0 commit
      # -- and README.md tells users `@v3` "always points to the latest stable v3.x
      # release", so they would have received 4.0 on their next install with no tag name
      # changing to warn them.
      #
      # $VERSION is the same value the release step above turns into $TAG, rather than a
      # second read of the version: two parsers for one version is how they come to
      # disagree. The major is derived here in the shell for the same reason -- an `if:`
      # on this step would have to re-derive it in an Actions expression.
      #
      # Covered by tests/unit/test_floating_major_tag_workflow.py, which runs this
      # script with `gh` stubbed and asserts which ref each version touches.
      - name: Update floating major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Validate before touching anything: every ref name below is derived from
          # $VERSION, so an unparsable value would otherwise name a ref from garbage.
          # A prerelease such as 4.0.0rc1 is accepted and resolves to v4 -- only the
          # major is read, and refusing one here would stop maintaining the floating
          # tag for a shape this repository has released before (v3.0.0-beta-*).
          # The suffix cannot start with a digit: submatch assignment is up to the
          # regex engine, and a digit-led suffix would let an engine read 3.8.10 as
          # CORE 3.8.1 with suffix 0 -- a stable release treated as a prerelease,
          # whose floating tag then silently does not move.
          if [[ ! "$VERSION" =~ ^(([0-9]+)\.[0-9]+\.[0-9]+)([A-Za-z.+-][0-9A-Za-z.+-]*)?$ ]]; then
            # Fails rather than skips. The GitHub release already exists by now, so a
            # skip would leave a published release whose floating tag silently never
            # moved, on a green run.
            echo "::error::VERSION is '${VERSION}', which is not a release version. Refusing to derive a floating tag name from it. The release itself was created; move the floating tag by hand and fix the 'Read version' step."
            exit 1
          fi
          MAJOR="${BASH_REMATCH[2]}"
          FLOATING="v${MAJOR}"

          # Never move the floating tag to an older release than one that exists. The
          # job is serialized by its concurrency group, but a re-run of an old run, or
          # two runs that finish out of order, still arrive here with an older version
          # after a newer release was tagged. The comparison is one version-order
          # test of VERSION against every tag in the remote listing, which includes
          # this run's own tag, in PEP 440 order via packaging.version (a declared
          # dependency of this project, installed by `uv sync` and reached through
          # `uv run python`): VERSION is older when any tag parses to a newer
          # version. It is deliberately not sort -V and not scoped to stable or
          # same-core tags: sort -V strips a trailing alphanumeric "file suffix" and
          # compares it only on a tie, so it ranks 4.1.0rc1.dev1 after 4.1.0rc1, the
          # inverse of PEP 440, and a suffix rule that calls every suffix a
          # prerelease never moves the tag for 3.8.0.post1 over 3.8.0. A tag the
          # parser refuses fails the step: an order the step cannot read must stop
          # the move, not be skipped over.
          #
          # The remote is read in its own assignment so that a failing `git ls-remote`
          # stops the step under `bash -e`: inside a pipeline its status is lost to the
          # last command, and an empty list would read as "no newer release". Whatever
          # its shape, VERSION must find its own tag in the listing; the check runs on
          # the unfiltered listing, before the stable filter, so an incomplete list
          # stops prerelease runs too. The cause is not knowable from here: the
          # release step exits 0 once `gh release view` finds a release, and a draft
          # release, or one whose tag was deleted (GitHub turns it into a draft), has
          # no tag -- so the error below names the possibilities instead of claiming
          # this run created the tag.
          REMOTE_REFS=$(git ls-remote --tags --refs origin "refs/tags/v${MAJOR}.*")
          if ! printf '%s\n' "$REMOTE_REFS" | sed 's|.*refs/tags/||' \
            | grep -qxF "v${VERSION}"; then
            echo "::error::v${VERSION} is not on the remote: the release may be a draft, or its tag may have been deleted, and neither leaves a tag for ${FLOATING} to follow. Refusing to compare against a tag list that lacks this release."
            exit 1
          fi
          # The comparison program is a file so that the tag list keeps stdin.
          RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
          cat > "$RUNNER_TEMP/compare_versions.py" <<'PY'
          import sys
          from packaging.version import Version
          version = Version(sys.argv[1])
          tags = [line.strip() for line in sys.stdin if line.strip()]
          newer = [tag for tag in tags if Version(tag) > version]
          print(max(newer, key=Version) if newer else "")
          PY
          NEWEST=$(printf '%s\n' "$REMOTE_REFS" \
            | sed 's|.*refs/tags/v||' \
            | uv run python "$RUNNER_TEMP/compare_versions.py" "$VERSION"
          )
          OLDER=false
          if [[ -n "$NEWEST" ]]; then
            OLDER=true
          fi
          if [[ "$OLDER" == true ]]; then
            echo "::notice::v${VERSION} is older than v${NEWEST}, so ${FLOATING} stays where it is."
            exit 0
          fi

          # The floating tag follows the release tag, never the checkout's HEAD. HEAD
          # is whatever main is now, so a merge whose release already existed, or a
          # pull request merged after the release, would otherwise move the floating
          # tag onto unreleased code. The release tag was created server-side after
          # the checkout, so fetch it first.
          git fetch --no-tags origin "refs/tags/v${VERSION}:refs/tags/v${VERSION}"
          MAIN_SHA=$(git rev-list -n1 "refs/tags/v${VERSION}")

          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${FLOATING}" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/${FLOATING}" \
              -X PATCH \
              --field sha="$MAIN_SHA" \
              --field force=true
            echo "Moved ${FLOATING} tag to $MAIN_SHA (v${VERSION})"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -X POST \
              --field ref="refs/tags/${FLOATING}" \
              --field sha="$MAIN_SHA"
            echo "Created ${FLOATING} tag at $MAIN_SHA (v${VERSION})"
          fi
