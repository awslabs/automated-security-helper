name: ASH - Tag and Publish Release

on:
  pull_request:
    types: [closed]
    branches:
      - main

# `contents: write` creates the tag and the release. The other two exist only for
# provenance and are the minimum `actions/attest-build-provenance` accepts:
#
#   id-token: write       mints the OIDC token Sigstore binds the attestation to.
#                         Without it the action fails at signing rather than
#                         silently publishing an unattested asset.
#   attestations: write   writes the attestation to this repository's attestation
#                         store, which is what `gh attestation verify` later reads.
#
# Both were absent from every `permissions:` block in the repository before this
# change, so no artifact ASH has ever released carries provenance. Note the
# default token is NOT sufficient even with these two added at the job level if a
# workflow-level block narrows it further -- this block is workflow-level and is
# the only one here.
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  tag-and-release:
    name: Create tag and GitHub Release
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Read version
        id: version
        run: |
          VERSION=$(uv run cz version --project)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # Asked before building rather than inside the release step, because the
      # build, the contents gate and the attestation are all pointless work if the
      # release already exists -- and an attestation is not free: it writes to the
      # repository's attestation store, so attesting artifacts for a release that
      # is then skipped leaves a signed record of something never published.
      #
      # The previous shape put this check inside the release step and used a bare
      # `exit 0`, which meant the step could not distinguish "already released" from
      # "released just now" for anything downstream.
      - name: Decide whether this release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists, skipping build and publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # The wheel and sdist are built HERE, from the tagged tree, rather than
      # downloaded from the ash-package.yml run on the merge commit. Two reasons:
      # an artifact downloaded across workflow runs is not covered by this run's
      # OIDC identity, so attesting it would bind provenance to a build this job
      # did not perform; and `actions/download-artifact` across runs needs a token
      # and a run id, which adds a failure mode to the publish path for no gain.
      # `uv build` is deterministic from pyproject metadata, so building twice
      # produces the same distribution as the gate already checked on the PR.
      - name: Build distribution artifacts
        if: steps.existing.outputs.skip == 'false'
        run: |
          set -euo pipefail
          uv build --out-dir dist
          # `uv build` exiting 0 is not evidence it wrote anything -- assert the
          # two artifacts exist before anything downstream trusts the directory.
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" \
            || { echo "::error::uv build produced no wheel"; exit 1; }
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            || { echo "::error::uv build produced no sdist"; exit 1; }
          ls -l dist

      # The same gate ash-package.yml runs on every pull request, run again on the
      # exact bytes about to be published. This is the control that matters most for
      # the operator's hard rule -- no GitHub-published artifact may contain
      # third-party scanner source or assets -- because a release asset is the only
      # artifact that actually reaches users. Running it on the PR proves the tree
      # was clean; running it here proves the *published file* is.
      - name: Assert no third-party scanner content in the artifacts
        if: steps.existing.outputs.skip == 'false'
        run: |
          set -euo pipefail
          python .github/scripts/assert-artifact-contents.py dist/*.whl dist/*.tar.gz

      # The MCPB bundle for Claude Desktop. Its backend has declared a
      # release-stage `copy-archive` phase since it was written, and nothing
      # invoked it: `agentic-plugins release` appears nowhere else in .github/, so
      # every ASH release published a wheel and an sdist while the committed
      # ash.mcpb never left the repository. The phase is run here rather than
      # given a workflow of its own because this is the only job that attaches
      # release assets, and an artifact built anywhere else is not covered by this
      # run's OIDC identity -- the same reason the wheel and sdist are built here
      # instead of downloaded, spelled out above.
      #
      # THE DRIFT CHECK IS WHAT MAKES THE STAGED FILE TRUSTWORTHY, and it is not
      # interchangeable with comparing the two copies. copy-archive COPIES the
      # committed archive rather than rebuilding it, so asserting that the staged
      # file matches the committed one only proves shutil.copy2 works -- it would
      # pass just as happily on a committed archive that went stale six releases
      # ago, because the staged copy inherits whatever is committed. The question
      # that can actually be answered wrongly is whether the committed bytes still
      # equal what _base/ generates today, and that is drift. It runs on the pull
      # request through ash-agent-plugins-drift.yml and runs again here for the
      # reason the contents gate does: the pull request proves the tree was clean,
      # this proves the published file is. Measured at well under a second for all
      # 17 backends, so it costs this job nothing.
      #
      # THE MEMBER COUNT IS THE PUBLISHING BOUNDARY. The archive must hold exactly
      # one member, manifest.json, which ASH authors -- see the backend's module
      # docstring. This is the same one-file invariant packaging/README.md holds
      # the .deb and .rpm to by counting bundled wheels, and it is asserted on the
      # bytes about to be uploaded rather than trusted to a comment.
      #
      # NOT passed to assert-artifact-contents.py, and that is a property of the
      # artifact rather than an exemption. That script reads an artifact as a
      # Python distribution: it requires exactly one top-level distribution root
      # and RAISES rather than reporting clean when it finds none, which is
      # deliberate -- an artifact it cannot reason about is one it cannot clear. A
      # .mcpb carries a single loose manifest.json and no package root, so it would
      # exit 2 on a correct archive. Feeding it one would force either a carve-out
      # in that script or a release that cannot publish; the member-count assertion
      # below is the boundary control for this shape, and the script keeps its
      # wheel-and-sdist scope untouched.
      - name: Stage and verify the MCPB bundle
        if: steps.existing.outputs.skip == 'false'
        run: |
          set -euo pipefail
          uv run --project ash-agent-plugins/agentic-coding/transpiler \
            agentic-plugins check --drift-only
          uv run --project ash-agent-plugins/agentic-coding/transpiler \
            agentic-plugins release mcpb --dist dist
          MCPB="$(find dist -maxdepth 1 -name '*.mcpb' -print -quit)"
          test -n "$MCPB" \
            || { echo "::error::agentic-plugins release wrote no .mcpb into dist"; exit 1; }
          python3 - "$MCPB" <<'PY'
          import sys
          import zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as archive:
              members = [i.filename for i in archive.infolist() if not i.is_dir()]
          if members != ["manifest.json"]:
              sys.exit(
                  f"::error::{path} must hold exactly one member, manifest.json. "
                  f"Found {len(members)}: {members}. Anything else in a published "
                  "archive crosses the boundary in packaging/README.md."
              )
          print(f"{path}: 1 member, manifest.json")
          PY

      # Provenance. Attested BEFORE the release is created, so a signing failure
      # blocks publication rather than leaving an unattested asset already public
      # and needing a delete. `subject-path` takes all three artifacts in one call,
      # which produces one attestation per subject.
      - name: Attest build provenance
        if: steps.existing.outputs.skip == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb

      - name: Create tag and GitHub Release
        if: steps.existing.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          # The artifacts are passed as positional arguments, which is the whole
          # point of this change: before it, this command had no file argument at
          # all, so every ASH release since the workflow was written published
          # release notes and nothing installable.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --generate-notes \
            --title "$TAG" \
            dist/*.whl dist/*.tar.gz dist/*.mcpb

          # The .mcpb belongs in this count as well as in the upload. The count is
          # this step's own evidence of how much it attached, so an artifact
          # missing from it is one the log says nothing about.
          echo "Created release $TAG with $(find dist -maxdepth 1 \
            \( -name '*.whl' -o -name '*.tar.gz' -o -name '*.mcpb' \) \
            | wc -l) attached artifact(s)"

      - name: Update v3 floating tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          MAIN_SHA=$(git rev-parse HEAD)

          if gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/v3" >/dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/tags/v3" \
              -X PATCH \
              --field sha="$MAIN_SHA" \
              --field force=true
            echo "Moved v3 tag to $MAIN_SHA (v${VERSION})"
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -X POST \
              --field ref="refs/tags/v3" \
              --field sha="$MAIN_SHA"
            echo "Created v3 tag at $MAIN_SHA (v${VERSION})"
          fi
