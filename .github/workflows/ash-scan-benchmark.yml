name: ASH - Scan-Time Benchmark

# WHY THIS WORKFLOW EXISTS
#
# Nothing else in CI times a scan. The deterministic guards (test_version_startup_budget.py,
# test_polars_import_discipline.py) count imports and calls and cover `ash --version`; a
# staged precommit scan that got a quarter of a second slower trips none of them. The
# precommit work cut a staged commit from about 19 s to about 4 s, and later changes added
# some of it back; each was found by timing by hand. This job times the scan paths on
# every pull request that touches the product and once a night on main, so the number is
# in front of the reviewer and a history exists to look back at. Issue #1099 is the spec.
#
# WHY IT IS INFORMATIONAL AND NEVER REQUIRED
#
# Wall time on a shared runner moves between runs even when the code does not. The job
# carries `continue-on-error`, so even a crash here cannot turn a pull request red, it is
# not listed in the required-checks job of ash-unified-ci.yml, and a warning in its summary
# changes nothing about its result. If the figures prove stable for a few months, a
# threshold can be proposed separately; this job does not set one.
#
# HOW THE NOISE IS HANDLED
#
# The base and the head of the pull request are installed into two virtual environments
# on one runner, and scripts/measure_precommit_cost.py alternates them (base, head, base,
# head, ...) on the same four scenarios, after one discarded warm-up round, five runs per
# build. A runner that speeds up or slows down during the job affects both builds alike,
# which is the largest single reduction in noise. Timing noise only adds, so the minimum
# is the steadiest figure; the median shows the typical run. The summary reports both, for
# each build and as head minus base, and prints a warning for a scenario when the head
# median is more than 10% and 0.2 s above the base median and the head minimum is above
# the base minimum. A run that exits with a code the scenario does not expect (anything
# but 0, or 0 and 2 for scans that find something) stops the script, so an error exit
# is never read as a fast scan.
#
# WHAT RUNS, AND WITH WHAT TOKEN
#
# The job runs the pull request's own code, from a fork too, so it holds a read-only token
# and nothing else: `contents: read` (and `actions: read` to fetch last night's trend
# artifact), no secrets, no trigger that hands fork code a write token, no checkout that
# keeps credentials, and no `${{ }}` expression pasted into a script. The updating pull request comment that
# issue #1099 lists as an option would need a write token and is not implemented.
#
# WHAT IT MEASURES
#
# The fixture is generated by scripts/measure_precommit_cost.py from nothing but that
# file, so it is the same bytes on every run (a unit test pins its digest): ten Python
# files plus one CI config with planted findings. The scenarios are `ash --version`, a
# staged precommit scan with one .py file staged, one with one CI config staged, and a
# precommit scan of the whole fixture. The nightly run on main times the head build alone
# and appends one line to the `scan-benchmark-trend` artifact.

on:
  pull_request:
    paths:
      - "automated_security_helper/**" # the product whose scan time is measured
      - "pyproject.toml" # the dependencies and the entry points the scan starts from
      - ".github/workflows/ash-scan-benchmark.yml" # this workflow
      - "scripts/measure_precommit_cost.py" # the timing engine and the fixture
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per ref: pushing again to a pull request supersedes its run. A run on main is
  # never cancelled, so a night's figure is not lost to a later push.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Scan-time benchmark (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    permissions:
      contents: read # checks out the head and the base
      actions: read # lists and downloads last night's trend artifact; nothing is written
    env:
      HEAD_SHA: ${{ github.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Check out the base
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install the head build
        run: |
          set -euo pipefail
          uv venv --python python3.12 "$RUNNER_TEMP/venv-head"
          uv pip install --python "$RUNNER_TEMP/venv-head/bin/python" "./head[cdk]"
          "$RUNNER_TEMP/venv-head/bin/ash" dependencies install

      - name: Install the base build
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          uv venv --python python3.12 "$RUNNER_TEMP/venv-base"
          uv pip install --python "$RUNNER_TEMP/venv-base/bin/python" "./base[cdk]"
          "$RUNNER_TEMP/venv-base/bin/ash" dependencies install

      - name: Fetch the previous trend
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trend-previous"
          run_id="$(gh run list --repo "$REPO" --workflow ash-scan-benchmark.yml \
            --event schedule --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$REPO" --name scan-benchmark-trend \
              --dir "$RUNNER_TEMP/trend-previous" \
              || echo "no previous trend artifact; starting a new one"
          fi

      - name: Time base against head
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python head/scripts/measure_precommit_cost.py bench "$RUNNER_TEMP/bench" \
            --ash "$RUNNER_TEMP/venv-head/bin/ash" --commit "$HEAD_SHA" \
            --base-ash "$RUNNER_TEMP/venv-base/bin/ash" --base-commit "$BASE_SHA" \
            --repeats 5 --allow-busy \
            --json "$RUNNER_TEMP/out/benchmark.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Time the head and append to the trend
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python head/scripts/measure_precommit_cost.py bench "$RUNNER_TEMP/bench" \
            --ash "$RUNNER_TEMP/venv-head/bin/ash" --commit "$HEAD_SHA" \
            --repeats 5 --allow-busy \
            --json "$RUNNER_TEMP/out/benchmark.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --trend-in "$RUNNER_TEMP/trend-previous/trend.jsonl" \
            --trend-out "$RUNNER_TEMP/out/trend.jsonl"

      - name: Upload the benchmark record
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-benchmark-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/out/benchmark.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the trend
        if: ${{ github.event_name == 'schedule' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-benchmark-trend
          path: ${{ runner.temp }}/out/trend.jsonl
          if-no-files-found: ignore
          retention-days: 90
