name: Docs Deploy
# Publishes the documentation site. It only deploys: the strict site build and the
# versioned-site check run in ash-unified-ci.yml (the build-docs job), on every pull
# request and merge queue entry, where required-checks depends on them.
#
# A tag push never deploys. A tag pushed on any commit runs that commit's own copy of
# this file, and the deploy job holds a contents: write token, so the push trigger
# has no tags filter. Release tags are created by ash-tag-on-merge.yml with
# GITHUB_TOKEN, and a push made with GITHUB_TOKEN starts no workflow. The site is
# deployed from main; a maintainer publishes a release by workflow_dispatch on the
# tag.
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
  # A release is published by calling this workflow with the tag as `ref`, or by
  # running it with workflow_dispatch on the tag. A tag push does neither.
  workflow_call:
    inputs:
      ref:
        description: "The release tag to publish, such as v3.8.0"
        required: true
        type: string
env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  # One in-flight deploy per published ref. A push to main publishes main; a call, or a
  # workflow_dispatch run on a release tag, publishes that tag. In a called workflow
  # github.ref and github.event_name belong to the caller, so the group is keyed on the
  # `ref` input when one is given. A deploy is never cancelled: it is the publish, and
  # the script redoes its version if a concurrent deploy pushed first.
  group: docs-deploy-${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      #checkov:skip=CKV2_GHA_1:The permissions are not set to write-all at the top-level, or any level
      contents: write
    # A push to main publishes the version main; a release tag vX.Y.Z publishes X.Y.Z
    # (scripts/docs_versions.py decides, and publishes nothing for any other tag, such
    # as the floating v3). A tag push never reaches this job: the push trigger has no
    # tags filter, and this condition admits a push only on main, so a tag trigger
    # added later would still start no deploy. A release is published by running
    # this workflow with workflow_dispatch on the tag, or by a workflow_call that
    # passes the tag as `ref`.
    # In a called workflow github.ref and github.event_name belong to the caller, so
    # a call is recognized by its `ref` input, which the other events never set.
    if: >-
      inputs.ref != ''
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    env:
      RELEASE_TAG: ${{ inputs.ref }}

    steps:
      # The same helper run-ash-security-scan.yml writes, byte for byte (a test holds
      # the copies equal): the tag below is a caller's input, and a tag that fails the
      # check is printed in the error, so one_line keeps it on the line it is printed in.
      - name: Write the one_line helper
        if: ${{ inputs.ref != '' }}
        shell: bash
        run: |
          cat > "${RUNNER_TEMP}/ash-one-line.sh" <<'EOF'
          one_line() {
            local LC_ALL=C
            local text="${1//[[:cntrl:]]/ }"
            text="${text//$'\xc2'[$'\x80'-$'\x9f']/ }"
            text="${text//$'\xe2\x80'[$'\xa8\xa9']/ }"
            while [[ "${text}" == *::* ]]; do text="${text//::/: :}"; done
            while [[ "${text}" == *'##['* ]]; do text="${text//'##['/# #[}"; done
            printf '%s' "${text}"
          }
          __wcs_clock() {
            __wcs_now="${EPOCHREALTIME:-}"
            __wcs_now="${__wcs_now//[!0-9]/}"
            if [ -z "${__wcs_now}" ]; then
              __wcs_now=$((SECONDS * 1000000))
            fi
          }
          __wcs_last_bg() {
            case "$-" in
              *u*) set +u; printf '%s' "$!"; set -u ;;
              *) printf '%s' "$!" ;;
            esac
          }
          __wcs_end_group() {
            local __wcs_now="" __wcs_until=""
            if [ -z "${__wcs_pid}" ]; then
              return 0
            fi
            __wcs_clock
            __wcs_until=$((__wcs_now + $1 * 100000))
            while kill -0 -- "-${__wcs_pid}" 2>/dev/null && [ "${__wcs_now}" -lt "${__wcs_until}" ]; do
              sleep 0.1
              __wcs_clock
            done
            if ! kill -0 -- "-${__wcs_pid}" 2>/dev/null; then
              return 0
            fi
            kill -s KILL -- "-${__wcs_pid}" 2>/dev/null || true
            __wcs_until=$((__wcs_now + 500000))
            while kill -0 -- "-${__wcs_pid}" 2>/dev/null && [ "${__wcs_now}" -lt "${__wcs_until}" ]; do
              sleep 0.1
              __wcs_clock
            done
            return 1
          }
          __wcs_on_signal() {
            if [ -z "${__wcs_pid}" ] && [ "$(__wcs_last_bg)" != "${__wcs_before}" ]; then
              __wcs_pid="$(__wcs_last_bg)"
            fi
            if [ -n "${__wcs_pid}" ]; then
              kill -s "$1" -- "-${__wcs_pid}" 2>/dev/null || kill -s "$1" "${__wcs_pid}" 2>/dev/null || true
            fi
            if [ "$1" = TERM ]; then
              __wcs_end_group 10 || __wcs_left=1
              if [ -n "${__wcs_open}" ]; then
                printf '\n::%s::\n' "${__wcs_token}"
              fi
              if [ -n "${__wcs_left}" ]; then
                printf '%s\n' "::error::processes the command started did not end in time, so they were sent SIGKILL and the step fails"
              fi
              exit 143
            fi
            __wcs_interrupted="$2"
          }
          __wcs_exec() {
            if command -v setsid >/dev/null 2>&1; then
              exec setsid -w "$@"
            fi
            exec perl -MPOSIX -e 'my $s = POSIX::setsid(); exit 127 unless defined $s && $s >= 0; exec { $ARGV[0] } @ARGV; exit 127' -- "$@"
          }
          with_commands_stopped() {
            if [ "${BASH_SUBSHELL:-0}" -gt 0 ]; then
              printf '%s\n' "::error::with_commands_stopped must run in the step's own shell, the one process the runner signals on a cancel, not in a subshell, a pipeline, a command substitution or a background job. For ( cd DIR && ... ), use env -C DIR, or cd at the top level" >&2
              kill -s TERM "$$" 2>/dev/null || true
              return 1
            fi
            local __wcs_out="" __wcs_var="" __wcs_file="" __wcs_token __wcs_status=0
            local __wcs_pid="" __wcs_interrupted="" __wcs_open="" __wcs_left="" __wcs_before="$(__wcs_last_bg)"
            case "${1:-}" in
              --stdout) __wcs_out="$2"; shift 2 ;;
              --capture) __wcs_var="$2"; shift 2 ;;
            esac
            __wcs_token="$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            if [ "${#__wcs_token}" -ne 32 ]; then
              printf '%s\n' "::error::no random token could be read for stop-commands, so the command did not run"
              return 1
            fi
            if [ -n "${__wcs_var}" ]; then
              __wcs_file="$(mktemp "${RUNNER_TEMP:-/tmp}/ash-wcs.XXXXXX")" || return 1
              __wcs_out="${__wcs_file}"
            fi
            trap '__wcs_on_signal INT 130' INT
            trap '__wcs_on_signal QUIT 131' QUIT
            trap '__wcs_on_signal TERM 143' TERM
            __wcs_open=1
            printf '::stop-commands::%s\n' "${__wcs_token}"
            if [ -z "${__wcs_interrupted}" ]; then
              if [ -n "${__wcs_out}" ]; then
                (trap - INT QUIT TERM; __wcs_exec "$@") 2>&1 > "${__wcs_out}" <&0 &
              else
                (trap - INT QUIT TERM; __wcs_exec "$@") 2>&1 <&0 &
              fi
              __wcs_pid=$!
              wait "${__wcs_pid}" || __wcs_status=$?
            fi
            if [ -n "${__wcs_interrupted}" ] && [ -n "${__wcs_pid}" ]; then
              wait "${__wcs_pid}" 2>/dev/null || true
            fi
            __wcs_end_group 50 || __wcs_left=1
            printf '\n::%s::\n' "${__wcs_token}"
            __wcs_open=""
            trap - INT QUIT TERM
            if [ -n "${__wcs_left}" ]; then
              printf '%s\n' "::error::processes the command started did not end in time, so they were sent SIGKILL and the step fails"
              if [ "${__wcs_status}" -eq 0 ]; then
                __wcs_status=1
              fi
            fi
            if [ -n "${__wcs_interrupted}" ]; then
              exit "${__wcs_interrupted}"
            fi
            if [ -n "${__wcs_file}" ]; then
              printf -v "${__wcs_var}" '%s' "$(cat "${__wcs_file}")"
              rm -f -- "${__wcs_file}"
            fi
            return "${__wcs_status}"
          }
          EOF

      # A call names the tag it publishes, so check its shape before anything is
      # checked out or pushed. This is the rule the floating-tag step in
      # ash-tag-on-merge.yml applies to the version: a release version, with a
      # prerelease suffix accepted. The input reaches the script only through env.
      - name: Check the release tag
        if: ${{ inputs.ref != '' }}
        run: |
          . "${RUNNER_TEMP}/ash-one-line.sh"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::The release tag is '$(one_line "${RELEASE_TAG}")', which is not a release tag such as v3.8.0. Refusing to publish docs for it."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty for push and workflow_dispatch, which check out the triggering ref
          # as before. A call checks out the tag.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || '' }}

      # No cache in this job. It publishes the site with `contents: write`, on main and
      # on release tags, so nothing a cache entry carries may reach it, and no job reads
      # an entry it would save.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      # Not `mkdocs gh-deploy`: it replaces the whole branch with one unversioned
      # build, which would delete every published version. The script fetches
      # gh-pages itself (this checkout has only the ref being published), commits one
      # version with mike, points the site root at the latest release and pushes, and
      # redoes its version if a concurrent deploy (main and a release tag, when a
      # release merges) pushed first. It never force-pushes.
      - name: Deploy documentation
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # GITHUB_REF is the caller's ref in a call, so a call passes its tag.
          DEPLOY_REF: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
        run: uv run python scripts/docs_versions.py deploy --ref "$DEPLOY_REF" --push
