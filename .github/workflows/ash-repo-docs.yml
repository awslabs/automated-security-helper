name: Docs Build & Deploy
on:
  # No tags. A tag push ran deploy-docs, which holds contents: write and publishes
  # the site from the tagged commit, and with `tags: ["*"]` any tag on any commit
  # did that. Release tags do not need it: ash-tag-on-merge.yml creates them through
  # the API with GITHUB_TOKEN, which starts no workflow, and the release PR's merge
  # to main already published the site. A narrower tag filter would bind only
  # commits that carry it; a tag pushed on an older commit runs that commit's copy
  # of this file, which a tag ruleset has to cover (DEVELOPMENT.md, Releasing).
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}
env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request or branch; pushing again supersedes the previous
  # run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # pull_request runs may be cancelled, and so may push runs on branches other than
  # main: a newer push to the same pull request or branch supersedes the build of its
  # old head, and only a push to main deploys. A push to main must finish, because it is
  # the publish, and a workflow_dispatch run was asked for by a person.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv's cache is restored here and saved by deploy-docs on a push to main, the
      # only job in this workflow that runs there. setup-uv's own `enable-cache:
      # true` restored on every event and saved from every ref, pull requests
      # included; this job now writes nothing to the cache. Tag pushes no longer
      # start this workflow; the restore still skips a tag ref, so a tag run, if
      # one is ever added, reads no cache entry.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      - name: Restore the uv cache
        id: uv-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: "Cache report: uv"
        if: ${{ !cancelled() && steps.uv-cache.outcome == 'success' }}
        shell: bash
        env:
          CACHE_NAME: uv-docs
          CACHE_HIT: ${{ steps.uv-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.uv-cache.outputs.cache-matched-key }}
        run: |
          # One line per cache per job, same shape everywhere, so hit rates can be
          # counted across runs from job summaries.
          if [ "${CACHE_HIT}" = "true" ]; then result=hit
          elif [ -n "${CACHE_MATCHED:-}" ]; then result="partial (${CACHE_MATCHED})"
          else result=miss; fi
          echo "cache ${CACHE_NAME}: ${result}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Build documentation
        run: uv run mkdocs build --clean

  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      #checkov:skip=CKV2_GHA_1:The permissions are not set to write-all at the top-level, or any level
      contents: write
    # A push to main only, so a tag trigger added back to this file later would
    # still start no deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cache restore in this job. It publishes the site with `contents: write`
      # on a push to main, so nothing a cache entry carries may reach it.
      # It still saves uv's cache on a push to main, for build-docs to restore:
      # what it saves is what its own `uv sync` just resolved from uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: false

      # lookup-only reports whether the entry exists and downloads nothing, so the
      # save below can skip an entry main already wrote.
      - name: Look up the uv cache entry (main only)
        id: uv-cache-lookup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          lookup-only: true

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Deploy documentation
        run: uv run mkdocs gh-deploy --clean --force

      - name: Save the uv cache (main only)
        if: >-
          steps.uv-cache-lookup.outputs.cache-hit != 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
