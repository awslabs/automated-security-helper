name: Docs Build & Deploy
on:
  push:
    branches:
      - "*"
    tags:
      - "*"
  pull_request:
    branches:
      - "*"
  workflow_dispatch: {}
env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull_request runs may be cancelled. A merge_group run must finish or the
  # queue loses its verdict, and push/tag runs feed docs and releases.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # uv's cache is restored here and saved by deploy-docs on a push to main, the
      # only job in this workflow that runs there. setup-uv's own `enable-cache:
      # true` restored on every event and saved from every ref, pull requests
      # included; this job now writes nothing to the cache. The `if:` above admits
      # tag pushes too (a tag ref is not refs/heads/main), so the restore is
      # skipped on a tag push: a tag run reads no cache entry.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      - name: Restore the uv cache
        id: uv-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}

      - name: "Cache report: uv"
        if: ${{ !cancelled() && steps.uv-cache.outcome == 'success' }}
        shell: bash
        env:
          CACHE_NAME: uv-docs
          CACHE_HIT: ${{ steps.uv-cache.outputs.cache-hit }}
          CACHE_MATCHED: ${{ steps.uv-cache.outputs.cache-matched-key }}
        run: |
          # One line per cache per job, same shape everywhere, so hit rates can be
          # counted across runs from job summaries.
          if [ "${CACHE_HIT}" = "true" ]; then result=hit
          elif [ -n "${CACHE_MATCHED:-}" ]; then result="partial (${CACHE_MATCHED})"
          else result=miss; fi
          echo "cache ${CACHE_NAME}: ${result}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Build documentation
        run: uv run mkdocs build --clean --strict

      # Publishes two releases and main to a throwaway branch of this checkout with
      # every proxy pointed at a refusing port, and checks what a reader of each would
      # get: the version selector, the notice each kind of version shows, latest/,
      # and the redirects at the site root. It deletes the branch and never pushes,
      # and this job's token could not push anyway.
      - name: Check the versioned site
        run: uv run python scripts/docs_versions.py check

  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      #checkov:skip=CKV2_GHA_1:The permissions are not set to write-all at the top-level, or any level
      contents: write
    # A push to main publishes the version main; a release tag vX.Y.Z publishes X.Y.Z
    # (scripts/docs_versions.py decides, and publishes nothing for any other tag, such
    # as the floating v3). The tag workflow creates release tags with GITHUB_TOKEN,
    # whose pushes start no workflow, so it starts this one with workflow_dispatch on
    # the tag; a maintainer can do the same to publish a tag again.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cache restore in this job. It publishes the site with `contents: write`,
      # on main and on release tags, so nothing a cache entry carries may reach it.
      # It still saves uv's cache on a push to main, for build-docs to restore:
      # what it saves is what its own `uv sync` just resolved from uv.lock.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false

      # lookup-only reports whether the entry exists and downloads nothing, so the
      # save below can skip an entry main already wrote.
      - name: Look up the uv cache entry (main only)
        id: uv-cache-lookup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          lookup-only: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      # Not `mkdocs gh-deploy`: it replaces the whole branch with one unversioned
      # build, which would delete every published version. The script fetches
      # gh-pages itself (this checkout has only the ref being published), commits one
      # version with mike, points the site root at the latest release and pushes, and
      # redoes its version if a concurrent deploy (main and a release tag, when a
      # release merges) pushed first. It never force-pushes.
      - name: Deploy documentation
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: uv run python scripts/docs_versions.py deploy --ref "$GITHUB_REF" --push

      - name: Save the uv cache (main only)
        if: >-
          steps.uv-cache-lookup.outputs.cache-hit != 'true'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-docs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
