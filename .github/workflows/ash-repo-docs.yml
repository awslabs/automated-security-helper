name: Docs Deploy
# Publishes the documentation site. It only deploys: the strict site build and the
# versioned-site check run in ash-unified-ci.yml (the build-docs job), on every pull
# request and merge queue entry, where required-checks depends on them.
on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch: {}
  # The tag workflow calls this one for a release it has just tagged. It does not
  # dispatch it: that would need write access to Actions, which can start any workflow.
  workflow_call:
    inputs:
      ref:
        description: "The release tag to publish, such as v3.8.0"
        required: true
        type: string
env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request or branch; pushing again supersedes the previous
  # run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # pull_request runs may be cancelled, and so may push runs on branches other than
  # main: a newer push to the same pull request or branch supersedes the build of its
  # old head, and only a push to main deploys. A push to main must finish, because it is
  # the publish, and a workflow_dispatch run was asked for by a person.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main') }}

jobs:
  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      #checkov:skip=CKV2_GHA_1:The permissions are not set to write-all at the top-level, or any level
      contents: write
    # A push to main publishes the version main; a release tag vX.Y.Z publishes X.Y.Z
    # (scripts/docs_versions.py decides, and publishes nothing for any other tag, such
    # as the floating v3). The tag workflow creates release tags with GITHUB_TOKEN,
    # whose pushes start no workflow, so it calls this workflow with the tag as
    # `ref`; a maintainer can run workflow_dispatch on the tag to publish it again.
    # In a called workflow github.ref and github.event_name belong to the caller, so
    # a call is recognized by its `ref` input, which the other events never set.
    if: >-
      inputs.ref != ''
      || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    env:
      RELEASE_TAG: ${{ inputs.ref }}

    steps:
      # A call names the tag it publishes, so check its shape before anything is
      # checked out or pushed. This is the rule the floating-tag step in
      # ash-tag-on-merge.yml applies to the version: a release version, with a
      # prerelease suffix accepted. The input reaches the script only through env.
      - name: Check the release tag
        if: ${{ inputs.ref != '' }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+[0-9A-Za-z.+-]*$ ]]; then
            echo "::error::The release tag is '${RELEASE_TAG}', which is not a release tag such as v3.8.0. Refusing to publish docs for it."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Empty for push and workflow_dispatch, which check out the triggering ref
          # as before. A call checks out the tag.
          ref: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || '' }}

      # No cache in this job. It publishes the site with `contents: write`, on main and
      # on release tags, so nothing a cache entry carries may reach it, and no job reads
      # an entry it would save.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      # Not `mkdocs gh-deploy`: it replaces the whole branch with one unversioned
      # build, which would delete every published version. The script fetches
      # gh-pages itself (this checkout has only the ref being published), commits one
      # version with mike, points the site root at the latest release and pushes, and
      # redoes its version if a concurrent deploy (main and a release tag, when a
      # release merges) pushed first. It never force-pushes.
      - name: Deploy documentation
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          # GITHUB_REF is the caller's ref in a call, so a call passes its tag.
          DEPLOY_REF: ${{ inputs.ref && format('refs/tags/{0}', inputs.ref) || github.ref }}
        run: uv run python scripts/docs_versions.py deploy --ref "$DEPLOY_REF" --push
