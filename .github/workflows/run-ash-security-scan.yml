name: "ASH Security Scan"
#  Runs ASH aggregated security scan on a repository and generates various industry
#  standard report formats such as SARIF, OCSF, CycloneDX, JUnitXML, HTML, Markdown
permissions:
  contents: read # Required to read the repository contents in order to scan them with ASH
  checks: write # Required for writing CI check runs
  pull-requests: write # Required for writing comments with scan results to pull requests
on:
  workflow_call:
    inputs:
      ash-version:
        description: "ASH tag or branch to use. Defaults to a beta release until ASHv3 is released."
        required: false
        default: "main"
        type: string
      ash-repo:
        description: "GitHub repository to install ASH from (owner/repo). For fork PRs, pass the fork repo."
        required: false
        default: "awslabs/automated-security-helper"
        type: string
      ash-mode:
        description: 'Mode to run ASH in. Defaults to "local" for CI compatibility. Use "container" for full scanner support.'
        required: false
        default: "local"
        type: string
      config:
        description: "Path to the ASH config file, if any"
        required: false
        default: ""
        type: string
      output-dir:
        description: "Directory where ASH output will be stored"
        required: false
        default: ".ash/ash_output"
        type: string
      fail-on-findings:
        description: "Whether to continue execution even if findings are detected"
        required: false
        default: true
        type: boolean
      verbose:
        description: "Enable verbose output"
        required: false
        default: true
        type: boolean
      ash-args:
        description: "Additional arguments to pass to ASH"
        required: false
        default: ""
        type: string
      collect-sarif-report:
        description: "Whether to collect the ash.ghas.sarif report using github/codeql-action/upload-sarif for GitHub Advanced Security Code Scanning results"
        required: false
        default: true
        type: boolean
      # BEHAVIOR CHANGE -- read this before upgrading if you call this workflow.
      #
      # This input has always defaulted to true, but until now it had no visible
      # effect: the publish step was gated on a permission probe that called a REST
      # route which does not exist, so the probe was false on every run and no
      # `ASH Scan JUnit Test Report` check run was ever created for anyone. That
      # gate is gone and the step now runs.
      #
      # What that means for a downstream caller: the action derives the check run's
      # conclusion from the JUnit failure count, and ASH's JUnit report encodes
      # every ACTIONABLE FINDING as a test failure. So a repository with even one
      # actionable finding goes from "no check at all" to a RED
      # `ASH Scan JUnit Test Report` check, without any change of its own.
      #
      # The step and the job both stay green -- `fail_on_failure` is left at its
      # default of false -- so this does not by itself fail a build. But the check
      # run is red, it appears in the pull request's checks list, and it counts
      # toward the commit's combined status. If a branch protection rule requires
      # this check by name, it will now block; it could not have been required
      # before, because it never existed.
      #
      # Two ways to respond, both supported:
      #   * Leave it on and treat the red check as the finding report it is. The
      #     annotations land inline on the offending lines, which is the whole
      #     point of publishing the report.
      #   * Set `collect-junit-xml-report: false` to opt out entirely. The results
      #     are still in the job summary and in the `ash_output` artifact.
      collect-junit-xml-report:
        description: >-
          Whether to publish the ash.junit.xml report as a check run using
          mikepenz/action-junit-report. Note that ASH encodes actionable findings
          as JUnit test failures, so a scan with actionable findings publishes a
          RED "ASH Scan JUnit Test Report" check (the job itself stays green).
          Set to false to opt out.
        required: false
        default: true
        type: boolean
      post-pr-comment:
        description: "Whether to post scan results as PR comment"
        required: false
        default: true
        type: boolean
      repository-owner:
        description: "Owner of the repository"
        required: false
        default: ${{ github.repository_owner }}
        type: string
      python-version:
        description: "Python version to use"
        required: false
        default: "3.12"
        type: string
      install-grype:
        description: "Whether to install Grype scanner"
        required: false
        default: false
        type: boolean
      install-syft:
        description: "Whether to install Syft scanner"
        required: false
        default: false
        type: boolean
      install-opengrep:
        description: "Whether to install OpenGrep scanner"
        required: false
        default: false
        type: boolean
      install-cfn-nag:
        description: "Whether to install the cfn-nag scanner"
        required: false
        default: false
        type: boolean
      changed-files-only:
        description: "Limit the scan to files changed in the PR (reduces scan time and focuses feedback)"
        required: false
        default: false
        type: boolean
      base-ref:
        description: "Git ref to diff against when changed-files-only is true"
        required: false
        default: "origin/main"
        type: string

env:
  ASH_UVX_SOURCE: git+https://github.com/${{ inputs.ash-repo }}@${{ inputs.ash-version }}
  ASH_OUTPUT_DIR: ${{ inputs.output-dir }}
  ASH_CONFIG: ${{ inputs.config }}

jobs:
  ash:
    name: SAST, SCA, and IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COLUMNS: 140
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Compute cache keys
        id: cachekeys
        run: |
          set -euo pipefail
          # The grype database key rotates daily. grype refuses a database older
          # than db.max-allowed-built-age (default 120h), so a key that never
          # rotated would keep restoring an archive grype then rejects.
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          # Tool binaries rotate weekly, so a cache cannot pin a security scanner
          # to one build indefinitely.
          echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache the grype vulnerability database
        if: inputs.install-grype
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # grype's db.cache-dir default; equivalently GRYPE_DB_CACHE_DIR.
          path: ~/.cache/grype/db
          key: grype-db-${{ runner.os }}-${{ steps.cachekeys.outputs.day }}
          # Falling back to an earlier day is safe: grype sets
          # validate-by-hash-on-start and auto-update by default (throttled to
          # max-update-check-frequency, 2h), so a slightly older database is
          # verified and refreshed rather than trusted blindly.
          restore-keys: |
            grype-db-${{ runner.os }}-

      - name: Cache the OpenGrep binary
        if: inputs.install-opengrep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.opengrep/cli/latest
          key: opengrep-${{ runner.os }}-${{ steps.cachekeys.outputs.week }}

      - name: Install Grype
        if: inputs.install-grype
        run: |
          curl -sSfL https://get.anchore.io/grype | sudo sh -s -- -b /usr/local/bin

      - name: Install Syft
        if: inputs.install-syft
        run: |
          curl -sSfL https://get.anchore.io/syft | sudo sh -s -- -b /usr/local/bin

      - name: Install OpenGrep
        if: inputs.install-opengrep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          INSTALL_DIR="$HOME/.opengrep/cli/latest"
          mkdir -p "$INSTALL_DIR"
          # Only download on a cache miss. The symlink and PATH export run either
          # way, so a cache hit still leaves the job fully set up.
          if [ ! -x "$INSTALL_DIR/opengrep_manylinux_x86" ]; then
            gh release download --repo opengrep/opengrep --pattern 'opengrep_manylinux_x86' --dir "$INSTALL_DIR"
            chmod +x "$INSTALL_DIR/opengrep_manylinux_x86"
          else
            echo "Reusing cached OpenGrep binary"
          fi
          ln -sf "$INSTALL_DIR/opengrep_manylinux_x86" "$INSTALL_DIR/opengrep"
          echo "$INSTALL_DIR" >> $GITHUB_PATH

      # This used to say there was no need for a ruby/setup-ruby step, because
      # ubuntu-latest installed Ruby from apt's `ruby-full`. That stopped being true.
      # Measured on job 104850467087: the guard in the step below found `gem` at
      # /usr/bin/gem and no `bundle` at all, failed at step 11, and took `Run ASH`
      # with it as a skipped step. That is the guard doing its job -- the earlier
      # failure proved only that `sudo` could not find `bundle`, not that the runner
      # user could, and this run settled the second question.
      #
      # A runner-managed Ruby also puts GEM_HOME somewhere the runner owns rather
      # than root, so it does not depend on that detail of the image either way.
      #
      # Pinned to a commit rather than to `v1`, which is a moving major tag on this
      # action: .github/scripts/assert-actions-pinned.mjs requires 40 hex characters
      # plus a trailing version comment, the latter because Dependabot reads that
      # comment to learn which release a sha is. This sha is v1.321.0.
      #
      # No `bundler-cache: true`. That input has the action run `bundle install`
      # itself against BUNDLE_GEMFILE, and this Gemfile is neither at the repository
      # root nor reliably present: the step below resolves it to
      # automated_security_helper/assets/Gemfile or else curls the pin into
      # RUNNER_TEMP, then installs under sudo with BUNDLE_GEMFILE set explicitly.
      # Caching an install other than the one that actually runs is worse than not
      # caching. Bundler itself comes from this action by default, and the guard
      # below checks for it rather than assuming it.
      #
      # If `bundle install` starts failing here rather than the guard, suspect the
      # native gems before the Ruby: this lock builds bigdecimal and psych 3.x, and
      # psych 3.x links system libyaml, which apt's `ruby-dev` used to pull in. gcc
      # and make are still on the image; libyaml-dev is the one to check first.
      - name: Set up Ruby for cfn-nag
        if: inputs.install-cfn-nag
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"

      - name: Install cfn-nag
        if: inputs.install-cfn-nag
        env:
          # Same repo and ref the scan itself is installed from, so the gem
          # version can never disagree with the ASH that invokes it.
          ASH_ASSETS_URL: https://raw.githubusercontent.com/${{ inputs.ash-repo }}/${{ inputs.ash-version }}/automated_security_helper/assets
        run: |
          set -euo pipefail
          # ASH's own Gemfile and Gemfile.lock are the version pin -- naming
          # 0.8.10 here as well would create a second place to update, and the
          # container image already builds cfn-nag from these two files.
          GEMFILE="${GITHUB_WORKSPACE}/automated_security_helper/assets/Gemfile"
          if [ ! -f "${GEMFILE}" ]; then
            # The checkout is the calling repository, not ASH's, so fetch the pin.
            GEMFILE="${RUNNER_TEMP}/ash-cfn-nag/Gemfile"
            mkdir -p "$(dirname "${GEMFILE}")"
            curl -sSfL "${ASH_ASSETS_URL}/Gemfile" -o "${GEMFILE}"
            curl -sSfL "${ASH_ASSETS_URL}/Gemfile.lock" -o "${GEMFILE}.lock"
          fi
          echo "Installing cfn-nag from ${GEMFILE}"
          # Every tool is resolved with `command -v` as the runner user rather than
          # assumed on PATH. The failure this names -- Ruby absent for the runner
          # user -- is otherwise invisible until the scan reports cfn-nag MISSING,
          # which is the silent pass this whole branch exists to remove. It fired
          # for real on job 104850467087, when ubuntu-latest stopped shipping apt's
          # `ruby-full` and left `gem` at /usr/bin/gem with no `bundle` at all.
          #
          # All three are checked even though only `bundle` is invoked directly:
          # `gem` backs the environment dump below, and `ruby` is what the generated
          # binstub's `#!/usr/bin/env ruby` shebang resolves at scan time. Naming a
          # missing interpreter here beats discovering it when the wrapper will not
          # start.
          BUNDLE_BIN="$(command -v bundle || true)"
          GEM_CMD="$(command -v gem || true)"
          RUBY_CMD="$(command -v ruby || true)"
          if [ -z "${BUNDLE_BIN}" ] || [ -z "${GEM_CMD}" ] || [ -z "${RUBY_CMD}" ]; then
            echo "::error::Ruby is not on PATH for the runner user (bundle='${BUNDLE_BIN}' gem='${GEM_CMD}' ruby='${RUBY_CMD}'), so cfn-nag cannot be installed and would be reported MISSING. This image no longer ships ruby-full; add a ruby/setup-ruby step." >&2
            exit 1
          fi

          # No sudo. Bundler itself objects to it -- job 104955423586 printed "Don't
          # run Bundler as root" twice -- and it bought nothing here: the root-owned
          # GEM_HOME that made it necessary belonged to the image's apt Ruby, which is
          # gone. ruby/setup-ruby installs under /opt/hostedtoolcache/Ruby/<v>/x64,
          # owned by the runner user, so the install and everything after it run as
          # one user and cannot answer from different gem environments.
          #
          # Exported rather than prefixed, so `bundle binstubs` below and the failure
          # diagnostics resolve the same Gemfile.
          export BUNDLE_GEMFILE="${GEMFILE}"
          "${BUNDLE_BIN}" install --jobs=4

          # `bundle install` does not put gem executables on PATH, and that -- not
          # sudo, and not the directory this used to guess -- is why the previous form
          # failed. It read the gem executable directory out of `gem environment` and
          # checked there for a wrapper bundler never writes.
          #
          # Measured locally against this exact Gemfile: `bundle install` reports
          # "Bundle complete! 1 Gemfile dependency, 22 gems now installed" and exits
          # 0, and the resulting Gem.bindir holds `bundle` and `bundler` and nothing
          # else -- no cfn_nag_scan, though the cfn-nag gemspec declares cfn_nag,
          # cfn_nag_rules, cfn_nag_scan and spcm_scan as executables. Bundler expects
          # `bundle exec` to supply the context instead. On job 104955423586 that is
          # exactly what the log shows: cfn-nag 0.8.10 installed, then `command -v`
          # found nothing 0.165s later and skipped `Run ASH`.
          #
          # ASH invokes `cfn_nag_scan` as a plain subprocess, so `bundle exec` is not
          # available to it. `bundle binstubs` generates the wrappers explicitly,
          # which makes their existence a product of this step rather than an
          # inference about where RubyGems might have put one.
          #
          # Under RUNNER_TEMP rather than beside the Gemfile on purpose. When ASH
          # scans itself the Gemfile is inside GITHUB_WORKSPACE, and writing four Ruby
          # scripts there would add them to the tree the very next step scans. The
          # generated wrapper bakes an absolute-ized BUNDLE_GEMFILE computed from its
          # own directory, so it does not need to sit next to the Gemfile; verified by
          # running one from `/` with a PATH holding nothing but the binstub directory
          # and the system defaults.
          #
          # This does not make the Gemfile's directory untouched: bundler records
          # settings next to it either way, so `.bundle/config` appears there with
          # BUNDLE_JOBS from the install above and BUNDLE_BIN from `--path`. That file
          # predates this change and is one small YAML; what is kept out of the
          # scanned tree is the executable content.
          #
          # --force so a warm RUNNER_TEMP regenerates against the bundle just
          # installed instead of leaving a stale wrapper in place; without it bundler
          # prints "Skipped ... since they already exist" and exits 0.
          BINSTUB_DIR="${RUNNER_TEMP}/ash-cfn-nag-bin"
          "${BUNDLE_BIN}" binstubs cfn-nag --force --path "${BINSTUB_DIR}"

          # Printed unconditionally, not folded into a failure branch. When this step
          # failed, the log carried the error and nothing about where it had looked,
          # so the cause could not be read off the record at all.
          echo "--- binstub directory ${BINSTUB_DIR} ---"
          ls -la "${BINSTUB_DIR}" || echo "(cannot list '${BINSTUB_DIR}')"
          echo "--- gem environment ---"
          "${GEM_CMD}" environment

          echo "${BINSTUB_DIR}" >> "${GITHUB_PATH}"

          # Two assertions, and both stay assertions. Downgrading either to a warning
          # would be worse than deleting it: the downstream symptom is cfn-nag
          # reported MISSING and a green scan of a tree nothing looked at.
          #
          # First, that the name resolves.
          if ! CFN_NAG_SCAN="$(PATH="${BINSTUB_DIR}:${PATH}" command -v cfn_nag_scan)"; then
            echo "::error::cfn-nag installed but cfn_nag_scan is not on PATH. Looked in '${BINSTUB_DIR}'. ASH invokes it by bare name, so it would report cfn-nag MISSING and pass a tree it never scanned." >&2
            "${BUNDLE_BIN}" info cfn-nag || true
            exit 1
          fi
          echo "cfn_nag_scan resolves to ${CFN_NAG_SCAN}"

          # Second, that it RUNS. Resolving only proves a file is there; a bundler
          # binstub still has to find its Gemfile and activate the bundle at startup,
          # and if it cannot it fails at scan time instead -- where the symptom is
          # again cfn-nag MISSING. `--help` exits 0 and prints the version, so it
          # exercises the whole path without needing a template.
          if ! PATH="${BINSTUB_DIR}:${PATH}" cfn_nag_scan --help >/dev/null 2>&1; then
            echo "::error::cfn_nag_scan is on PATH at '${CFN_NAG_SCAN}' but will not run. Output follows." >&2
            PATH="${BINSTUB_DIR}:${PATH}" cfn_nag_scan --help || true
            exit 1
          fi
          echo "cfn_nag_scan --help exits 0, so the wrapper runs and its bundle activates"

      - name: Run ASH
        id: ash
        shell: bash
        env:
          ASH_MODE: ${{ inputs.ash-mode }}
          ASH_ARGS: ${{ inputs.ash-args }}
          FAIL_ON_FINDINGS_PARAM: ${{ inputs.fail-on-findings == 'true' && '--fail-on-findings' || '--no-fail-on-findings'}}
          VERBOSE: ${{ inputs.verbose }}
          CHANGED_FILES_ONLY: ${{ inputs.changed-files-only == true && '--changed-files-only' || '' }}
          BASE_REF: ${{ inputs.base-ref }}
        run: |-
          uvx --reinstall --from ${ASH_UVX_SOURCE} ash \
            --source-dir . --output-dir ${ASH_OUTPUT_DIR} ${ASH_ARGS} --no-progress ${FAIL_ON_FINDINGS_PARAM} --build-target ci --mode ${ASH_MODE} ${VERBOSE:+--verbose} ${CHANGED_FILES_ONLY:+${CHANGED_FILES_ONLY} --base-ref "${BASE_REF}"}

      - name: Show ASH Summary Report
        if: success() || failure()
        shell: bash
        env:
          ASH_REPO_CLONE_URL: https://github.com/${{ github.repository }}.git
        run: |-
          # No --reinstall here. The Run ASH step above already installed this exact
          # source, so re-forcing a download makes the report step do a second git
          # fetch it does not need - and if the ref has disappeared in the meantime
          # (merge_group queue branches are deleted mid-run) that fetch is what
          # fails, after the scan itself has already succeeded.
          uvx --from ${ASH_UVX_SOURCE} ash \
            --output-dir "${ASH_OUTPUT_DIR}" report

      - name: Update step summary
        if: success() || failure()
        shell: bash
        run: |-
          cat "${ASH_OUTPUT_DIR}/reports/ash.summary.md" >> "${GITHUB_STEP_SUMMARY}"
          tree "${ASH_OUTPUT_DIR}"

      # GITHUB_TOKEN is read-only for pull requests opened from a fork, whatever
      # `permissions:` the caller declares -- GitHub downgrades it so untrusted
      # code cannot write to the base repository. Commenting therefore cannot
      # work on a fork PR, and because this job is a required status check, the
      # failure took the whole check down *after the scan had already passed*:
      #
      #   ##[error]Resource not accessible by integration
      #   https://docs.github.com/rest/issues/comments#create-an-issue-comment
      #
      # That made every external contributor's PR unmergeable for a cosmetic
      # reason. The existing `github.repository_owner == inputs.repository-owner`
      # guard does not catch it: for a fork PR *into* this repo the owner is
      # still the base repo's owner, so the guard passes.
      #
      # Comparing head.repo.full_name against github.repository is the exact test
      # for "same-repo PR". It is scoped to pull_request so merge_group and
      # workflow_dispatch behaviour is unchanged.
      - name: Post ASH MarkdownReporter output as PR comment
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        if: >-
          inputs.post-pr-comment
          && github.repository_owner == inputs.repository-owner
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
          && (success() || failure())
        with:
          message-path: ${{ inputs.output-dir }}/reports/ash.summary.md

      # Say so rather than leaving a contributor wondering why the bot went
      # quiet. The junit publish step below is skipped on the same condition and
      # carries the same notice, for the same reason.
      - name: Note that the PR comment was skipped for a fork
        if: >-
          inputs.post-pr-comment
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
          && (success() || failure())
        shell: bash
        run: |
          echo "::notice::Scan results were not posted as a PR comment: GITHUB_TOKEN is read-only for fork pull requests. The full report is in this job's summary and in the ash_output artifact."

      - name: Collect ASH output artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success() || failure()
        with:
          name: ash_output
          path: ${{ inputs.output-dir }}
          retention-days: 7
          if-no-files-found: error

      # THE CHECKS-PERMISSION PROBE THAT USED TO GATE THIS STEP IS GONE
      #
      # It called GET /repos/{owner}/{repo}/check-runs and read 403 or 404 as "no
      # permission". That route does not exist: the REST API lists check runs per
      # ref or per check suite, never per repository. So it returned 404 on every
      # run for everyone, `has_permission` was always false, and the gate below was
      # never once true -- this call site has never published a junit report at all.
      # Measured with one fully authorized token: the bare route 404s, while
      # /repos/{owner}/{repo}/commits/{sha}/check-runs returns 200.
      #
      # Repointing it at the per-ref route was rejected. A GET cannot establish
      # WRITE access, so the probe could never do the job its name claimed. It would
      # return 200 for a fork's read-only token and let the step run on to a 403
      # regardless, which is the noise the probe existed to avoid.
      #
      # The condition it was reaching for is "is this a fork pull request", and this
      # file already carries the exact test for that on the PR-comment step above.
      # Reusing it removes an API call, a step and a status-code inference.
      #
      # Residual case, deliberately left to the action: a same-repo caller that
      # never granted `checks: write`. The action fails soft and names the real
      # cause, "Resource not accessible by integration", which is better diagnostics
      # than a warning guessed from an HTTP status.
      #
      # Because the probe was always false, removing it means this step publishes a
      # check run where previously none existed -- and the action's conclusion comes
      # from the JUnit failure count, which for ASH is the actionable finding count.
      # A caller with findings therefore sees a red `ASH Scan JUnit Test Report`
      # check for the first time. That is intended, and the trade-off plus the
      # opt-out are written out at the `collect-junit-xml-report` input above.
      - name: Publish JUnit Test Report
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
        if: >-
          inputs.collect-junit-xml-report
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
          && (success() || failure())
        # No `update_check: true`, for the reason spelled out in
        # .github/actions/run-unit-tests/action.yml: it took the action's update path,
        # which resolves an existing check run by `job_name` (default `github.job`, a
        # YAML key) while GitHub names check runs by display name. The lookup matched
        # nothing and the action reads `check_runs[0].id` unguarded, so the step threw
        # a TypeError, swallowed it, reported success, and published no annotations.
        with:
          # An explicit path, not `**/ash.junit.xml`. The report lands in
          # `.ash/ash_output/reports/` by default, and `**` does not descend into
          # hidden directories unless the globber is told to, so the pattern never
          # matched the file it was written for: the step reported "No test results
          # found!" and created an empty check. This was invisible while the broken
          # permission probe above skipped the step entirely.
          #
          # The explicit form also honors a caller that overrides output-dir, which
          # the glob only ever did by accident, and it matches how the PR comment and
          # SARIF upload in this same job already address their own report files.
          report_paths: ${{ inputs.output-dir }}/reports/ash.junit.xml
          include_passed: true
          check_name: ASH Scan JUnit Test Report
          summary: Skipped means passing, suppressed, or ignored findings that are considered non-actionable.

      # Same reason as the PR-comment notice above: an absent junit check should say
      # why rather than just not appear. This is the case the deleted probe was
      # trying to serve, expressed as the condition that actually holds.
      - name: Note that the JUnit report was skipped for a fork
        if: >-
          inputs.collect-junit-xml-report
          && github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
          && (success() || failure())
        shell: bash
        run: |
          echo "::notice::The JUnit test report was not published as a check: GITHUB_TOKEN is read-only for fork pull requests, so check runs cannot be created. The results are in this job's summary and in the ash_output artifact."

      - name: Upload ASH SARIF file
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: inputs.collect-sarif-report && github.event_name != 'merge_group' && (success() || failure())
        with:
          sarif_file: ${{ inputs.output-dir }}/reports/ash.ghas.sarif
          wait-for-processing: true
          category: ash
