name: ASH - Create Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Bump version and create release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # GitHub does not start workflow runs for events authenticated with
      # GITHUB_TOKEN. Pushing the release branch with it therefore produced a PR
      # with none of its required checks, and the ruleset waits for exactly those
      # checks, so the PR could not merge on its own. v3.6.0's release PR needed a
      # manual push before it would go green.
      #
      # An App token is a different identity, so the push it makes does trigger
      # workflows.
      #
      # This runs before checkout on purpose. `gh pr create` reads GH_TOKEN, but
      # `git push` does not: it uses the credential actions/checkout persists.
      # Fixing only GH_TOKEN would leave the push on GITHUB_TOKEN, and the push is
      # what the pull_request event hangs off.
      - name: Detect release App credentials
        id: appcreds
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          if [ -n "$APP_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_APP_ID is not set, so the release PR will be created with GITHUB_TOKEN and will not trigger its required checks. A maintainer will need to push to the branch to start them. See issue #341."
          fi

      - name: Mint a GitHub App token
        id: app-token
        if: steps.appcreds.outputs.present == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Falls back to GITHUB_TOKEN so a release still works before the App
          # secrets exist. A release needing one manual nudge is worse than the
          # status quo; a release that cannot run at all is much worse.
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine bump and create release artifacts
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_VERSION=$(uv run cz version --project)
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"

          uv run cz bump --changelog --yes
          NEW_VERSION=$(uv run cz version --project)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
            echo "::notice::No version bump needed (no conventional commits since last tag)"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate documentation templates
        if: steps.bump.outputs.bumped == 'true'
        run: uv run python scripts/version_template_manager.py generate

      - name: Regenerate JSON schemas
        if: steps.bump.outputs.bumped == 'true'
        run: uv run python -m automated_security_helper.schemas.generate_schemas

      - name: Smoke test release artifacts
        if: steps.bump.outputs.bumped == 'true'
        run: |
          uv run ash --help
          uv run ash config validate
          uv run python -m pytest tests/unit/cli/test_config_init.py -x -q --no-header --no-cov

      - name: Create release PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          ACTOR: ${{ github.actor }}
        run: |
          BRANCH="release/v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): ${OLD_VERSION} -> ${NEW_VERSION}" \
                     -m "Triggered-by: @${ACTOR} via workflow_dispatch"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore(release): ${OLD_VERSION} -> ${NEW_VERSION}" \
            --body "Automated release PR. Merging this will trigger tag creation and GitHub Release publishing." \
            --base main \
            --head "$BRANCH"
