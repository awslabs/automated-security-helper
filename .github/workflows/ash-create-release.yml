name: ASH - Create Release

on:
  workflow_dispatch:

# The release line is committed here rather than offered as a dispatch input, so
# the version a release gets is decided in reviewed history, not by whoever runs
# the workflow. (checkov's CKV_GHA_7 rejects workflow_dispatch inputs for the same
# reason: a build's output should not depend on a parameter typed at run time.)
#
# main carries feat! commits (#640, #696) whose changes ship as 3.x by maintainer
# decision: 4.0.0 is reserved for the v4 packaging work. Left to itself,
# commitizen reads those commits and bumps 3.7.0 to 4.0.0.
#
# `3.x` keeps the release on the 3.x line. When commitizen detects a MAJOR
# increment it is capped to MINOR with `cz bump --increment MINOR`, and the run
# logs a warning naming every breaking commit it overrode. A PATCH or MINOR
# increment passes through untouched. The commits themselves are never rewritten,
# so their BREAKING CHANGE notes still render in CHANGELOG.md.
#
# `auto` is commitizen's own semver: a breaking commit produces a major.
#
# The cap is bounded. `3.x` refuses to run once the current version is not 3.x,
# so it cannot hold a future line back by accident, and after a bump it fails the
# job if the new version left 3.x. To cut 4.0.0 once v4 is on main, set this to
# `auto` in the change that lands v4. See DEVELOPMENT.md "Release line".
env:
  RELEASE_LINE: "3.x"

# Read-only default; the job below declares the write scopes it needs. A
# job-level block replaces this one, so a job added here later starts with
# read access instead of inheriting write.
permissions:
  contents: read

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  create-release-pr:
    name: Bump version and create release PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # contents: write pushes the release branch with GITHUB_TOKEN;
    # pull-requests: write is the fallback PR path when no App token is set.
    permissions:
      contents: write
      pull-requests: write
    steps:
      # A pull request opened with GITHUB_TOKEN does not start its workflows on
      # its own. GitHub used to create no runs at all for it (v3.5.0 through
      # v3.5.3 arrived with none of their required checks, and the ruleset waits
      # for exactly those). Since June 2026 it creates them in an
      # approval-required state instead: the merge box shows a banner, and the
      # checks only start once someone with write access selects "Approve
      # workflows to run". Every release PR from v3.5.4 on was approved that way.
      # https://docs.github.com/en/actions/concepts/security/github_token
      #
      # An App is a separate identity, so a PR it opens starts the checks with no
      # approval step.
      #
      # Only the PR creation needs the App. Both required checks trigger on
      # `pull_request`:
      #
      #   ASH - Unified CI     on: pull_request: branches: ["**"]
      #   ASH - PR Title Check on: pull_request: types: [opened, edited, synchronize]
      #
      # so the event that has to fire is `pull_request` opened, which is generated
      # by whoever *creates* the PR, not by whoever pushed the branch. The push
      # below therefore stays on GITHUB_TOKEN, and the App needs no `contents:
      # write` -- which matters, because Apps with direct write access to code are
      # not granted on these organizations.
      #
      # Nothing is lost by leaving the push as it was: the workflow already sets
      # its git identity to github-actions[bot], so the commit attribution is
      # unchanged either way.
      #
      # Setup steps for the App and its secrets are in DEVELOPMENT.md, under
      # "Release App setup".
      #
      - name: Detect release App credentials
        id: appcreds
        env:
          APP_ID: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            if [ -n "$APP_ID" ] || [ -n "$APP_KEY" ]; then
              echo "::warning::Only one of RELEASE_APP_CLIENT_ID / RELEASE_APP_PRIVATE_KEY is set. Both are required, so the App is being skipped and the release PR will be created with GITHUB_TOKEN. Its required checks will wait for a maintainer to approve them. See DEVELOPMENT.md, Release App setup."
            else
              echo "::warning::RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY are not set, so the release PR will be created with GITHUB_TOKEN. Its required checks will wait for a maintainer to select Approve workflows to run on the PR. See DEVELOPMENT.md, Release App setup."
            fi
          fi

      - name: Mint a GitHub App token
        id: app-token
        if: steps.appcreds.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `app-id` is deprecated in v3 in favor of `client-id`.
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Without this the token carries every permission the installation
          # has. `gh pr create --head <pushed branch>` makes three calls: the
          # RepositoryInfo and PullRequestForBranch GraphQL queries, then the
          # createPullRequest mutation. The first reads repository metadata,
          # which every installation token has; the other two need Pull
          # requests read and write. GitHub lists `POST /repos/{owner}/{repo}/pulls`
          # under "Pull requests: write" with no additional permissions
          # (https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps#repository-permissions-for-pull-requests).
          # So no contents permission is requested, and the App is not granted
          # one: asking for a permission the installation lacks fails the mint.
          # If the App lacks pull-requests: write, this step fails here, before
          # anything is bumped or pushed.
          permission-pull-requests: write

      # Deliberately left on the default GITHUB_TOKEN. Handing the App token to
      # checkout would make `git push` authenticate as the App, which then needs
      # `contents: write`. With an App scoped to `pull-requests: write` the push
      # would 403, and it would not degrade gracefully: the `||` fallback picks the
      # App token whenever one exists, insufficient or not.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Decides whether commitizen's own increment is used or capped, and says so
      # in the log either way. Exercised end to end, against a real commitizen in
      # a scratch repository, by tests/unit/test_release_line_workflow.py.
      - name: Resolve release line
        id: line
        run: |
          OLD_VERSION=$(uv run cz version --project)
          OLD_MAJOR="${OLD_VERSION%%.*}"

          case "$RELEASE_LINE" in
            auto)
              echo "::notice::release-line is auto: commitizen picks the increment, so a breaking change produces a major release."
              echo "increment=" >> "$GITHUB_OUTPUT"
              echo "line_major=" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            3.x)
              LINE_MAJOR=3
              ;;
            *)
              echo "::error::Unknown release-line '${RELEASE_LINE}'. Expected 3.x or auto."
              exit 1
              ;;
          esac

          if [[ "$OLD_MAJOR" != "$LINE_MAJOR" ]]; then
            echo "::error::release-line is ${RELEASE_LINE}, but the current version is ${OLD_VERSION}. The cap only applies while the project is on ${LINE_MAJOR}.x; set RELEASE_LINE to auto in this workflow."
            exit 1
          fi
          echo "line_major=${LINE_MAJOR}" >> "$GITHUB_OUTPUT"

          # A dry run reports the increment commitizen would choose without
          # touching the tree. If it fails (for example, nothing to bump), no
          # override is needed and the real bump below reports the same thing.
          DETECTED=""
          if DRY_RUN=$(uv run cz bump --dry-run --yes 2>&1); then
            DETECTED=$(printf '%s\n' "$DRY_RUN" | sed -n 's/^increment detected: //p' | head -n 1)
          fi
          echo "commitizen would apply: ${DETECTED:-no increment}"

          if [[ "$DETECTED" != "MAJOR" ]]; then
            echo "::notice::release-line is ${RELEASE_LINE} and commitizen detected ${DETECTED:-no} increment, so no override is applied."
            echo "increment=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Name the commits that asked for the major, using the same markers
          # commitizen reads: a `!` before the colon, or a BREAKING CHANGE footer.
          LAST_TAG="v${OLD_VERSION}"
          if ! git rev-parse -q --verify "refs/tags/${LAST_TAG}" >/dev/null; then
            echo "::error::Tag ${LAST_TAG} for the current version does not exist, so the breaking commits cannot be listed. Refusing to override a major bump without naming what it overrides."
            exit 1
          fi
          BREAKING=""
          for SHA in $(git rev-list "${LAST_TAG}..HEAD"); do
            SUBJECT=$(git log -1 --format=%s "$SHA")
            if [[ "$SUBJECT" =~ ^[A-Za-z]+(\([^\)]*\))?!: ]] \
              || git log -1 --format=%b "$SHA" | grep -qE '^BREAKING[ -]CHANGE:'; then
              BREAKING+="$(git log -1 --format='%h %s' "$SHA")"$'\n'
            fi
          done

          COUNT=$(printf '%s' "$BREAKING" | grep -c . || true)
          echo "::warning::release-line is ${RELEASE_LINE}: overriding commitizen's MAJOR bump to MINOR. ${COUNT} commit(s) since ${LAST_TAG} are marked breaking and will ship in a ${LINE_MAJOR}.x minor release; their notes still render in CHANGELOG.md."
          echo "Breaking commits overridden:"
          printf '%s' "$BREAKING" | sed 's/^/  /'
          {
            echo "### Release line ${RELEASE_LINE}: major bump overridden to minor"
            echo
            echo "commitizen detected a MAJOR increment from these commits since \`${LAST_TAG}\`:"
            echo
            printf '%s' "$BREAKING" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "increment=MINOR" >> "$GITHUB_OUTPUT"

      # Contributors write release notes by hand under `## Unreleased` in
      # CHANGELOG.md. In incremental mode commitizen treats that heading as its
      # own placeholder and replaces the whole section with the generated entry,
      # so a bump would silently delete the hand-written text (measured on the
      # 3.8.0 candidate: 539 lines removed). This step moves the section's body
      # into .github/release-notes/<next tag>.md, after any curated notes already
      # there, and removes the section. The changelog template includes that
      # file under the new version heading, and ash-tag-on-merge.yml publishes
      # the same entry as the GitHub Release body.
      #
      # Exercised against the real CHANGELOG.md by
      # tests/unit/test_release_line_workflow.py.
      - name: Fold Unreleased notes into the release notes
        id: unreleased
        env:
          INCREMENT: ${{ steps.line.outputs.increment }}
        run: |
          BODY_FILE=$(mktemp)
          awk '
            /^## / { if (inside) exit; if ($0 ~ /^## Unreleased[[:space:]]*$/) { inside = 1; next } }
            inside { print }
          ' CHANGELOG.md > "$BODY_FILE"

          if ! grep -q '[^[:space:]]' "$BODY_FILE"; then
            echo "::notice::CHANGELOG.md has no Unreleased notes to carry into the release."
            exit 0
          fi

          # The notes file is loaded as a Jinja template by the changelog
          # template, so a delimiter in it would be evaluated, or break the render.
          if grep -nE '\{\{|\{%|\{#' "$BODY_FILE"; then
            echo "::error::The Unreleased section of CHANGELOG.md contains a Jinja delimiter ({{, {% or {#) on the lines above. It would be evaluated by the changelog template. Escape or reword it, then rerun."
            exit 1
          fi

          # The same increment the bump step passes, so the tag named here is
          # the tag the bump creates.
          NEXT_TAG=""
          if DRY_RUN=$(uv run cz bump --dry-run --yes ${INCREMENT:+--increment "$INCREMENT"} 2>&1); then
            NEXT_TAG=$(printf '%s\n' "$DRY_RUN" | sed -n 's/^tag to create: //p' | head -n 1)
          fi
          if [[ ! "$NEXT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::CHANGELOG.md has Unreleased notes, but the next tag could not be determined (commitizen reported '${NEXT_TAG}'). Refusing to bump, because the bump would delete them."
            printf '%s\n' "$DRY_RUN"
            exit 1
          fi

          NOTES=".github/release-notes/${NEXT_TAG}.md"
          mkdir -p "$(dirname "$NOTES")"
          if [[ -s "$NOTES" ]]; then
            printf '\n' >> "$NOTES"
          fi
          # Leading and trailing blank lines dropped; everything between is kept
          # as written.
          awk 'NF { for (; blanks > 0; blanks--) print ""; print; started = 1; next }
               started { blanks++ }' "$BODY_FILE" >> "$NOTES"

          awk '
            /^## / { if (inside) inside = 0; else if ($0 ~ /^## Unreleased[[:space:]]*$/) { inside = 1; next } }
            !inside { print }
          ' CHANGELOG.md > "${BODY_FILE}.changelog"
          mv "${BODY_FILE}.changelog" CHANGELOG.md

          LINES=$(grep -c . "$BODY_FILE" || true)
          echo "::notice::Moved ${LINES} non-blank Unreleased line(s) from CHANGELOG.md into ${NOTES} for ${NEXT_TAG}."

      - name: Determine bump and create release artifacts
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCREMENT: ${{ steps.line.outputs.increment }}
          LINE_MAJOR: ${{ steps.line.outputs.line_major }}
        run: |
          OLD_VERSION=$(uv run cz version --project)
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"

          # --check-consistency makes commitizen raise CurrentVersionNotFoundError
          # when a [tool.commitizen] version_files target exists but does not
          # contain the version being bumped from. Without it that is silent: the
          # target matches no line commitizen can rewrite, the release succeeds,
          # the pin stays behind, and the only signal is a user installing the
          # wrong ASH from a tag that resolves perfectly well. That is how
          # several install commands in docs/ and in the agent plugin sources
          # drifted multiple minor releases behind. Failing here is the right
          # place to stop, because no tag exists yet.
          #
          # What this flag does NOT cover, verified rather than assumed: a
          # version_files entry whose path no longer resolves. Entries are
          # expanded with iglob, so a renamed or deleted target yields no file,
          # and there is nothing left for the consistency check to inspect --
          # `cz bump --check-consistency` exits 0 with the pin silently
          # unmaintained. tests/unit/test_agent_plugin_ash_version.py asserts
          # every configured path exists, which is the half of the problem this
          # flag cannot see.
          #
          # INCREMENT is empty unless the release line capped a major (see the
          # step above), in which case it is MINOR.
          uv run cz bump --changelog --yes --check-consistency ${INCREMENT:+--increment "$INCREMENT"}
          NEW_VERSION=$(uv run cz version --project)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          # The release line's own backstop, independent of how the increment was
          # chosen. Nothing has been pushed or tagged remotely yet, so failing here
          # costs a rerun, not a published release.
          if [[ -n "$LINE_MAJOR" && "${NEW_VERSION%%.*}" != "$LINE_MAJOR" ]]; then
            echo "::error::release-line ${LINE_MAJOR}.x is selected, but the bump produced ${NEW_VERSION}. Refusing to open a release PR that leaves the ${LINE_MAJOR}.x line."
            exit 1
          fi

          if [[ "$OLD_VERSION" == "$NEW_VERSION" ]]; then
            echo "::notice::No version bump needed (no conventional commits since last tag)"
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate documentation templates
        if: steps.bump.outputs.bumped == 'true'
        run: uv run python scripts/version_template_manager.py generate

      - name: Regenerate JSON schemas
        if: steps.bump.outputs.bumped == 'true'
        run: uv run python -m automated_security_helper.schemas.generate_schemas

      - name: Smoke test release artifacts
        if: steps.bump.outputs.bumped == 'true'
        run: |
          uv run ashx --help
          uv run ashx config validate
          uv run python -m pytest tests/unit/cli/test_config_init.py -x -q --no-header --no-cov

      - name: Create release PR
        if: steps.bump.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          ACTOR: ${{ github.actor }}
          APP_TOKEN_USED: ${{ steps.appcreds.outputs.present }}
        run: |
          BRANCH="release/v${NEW_VERSION}"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(release): ${OLD_VERSION} -> ${NEW_VERSION}" \
                     -m "Triggered-by: @${ACTOR} via workflow_dispatch"
          git push -u origin "$BRANCH"

          BODY="Automated release PR. Merging this will trigger tag creation and GitHub Release publishing."
          if [[ "$APP_TOKEN_USED" != "true" ]]; then
            # Said on the PR itself, because that is where the maintainer who has
            # to act will be looking. The run log warning alone was easy to miss.
            NOTE="**Required checks are waiting for approval.** This PR was opened with \`GITHUB_TOKEN\` because the release App secrets are not configured, so GitHub created its workflow runs in an approval-required state. A maintainer with write access needs to select **Approve workflows to run** in the merge box below before the checks start. To remove this step, set up the release App as described in DEVELOPMENT.md under \"Release App setup\"."
            BODY="${BODY}"$'\n\n'"${NOTE}"
          fi

          PR_URL=$(gh pr create \
            --title "chore(release): ${OLD_VERSION} -> ${NEW_VERSION}" \
            --body "$BODY" \
            --base main \
            --head "$BRANCH")
          echo "$PR_URL"
          if [[ "$APP_TOKEN_USED" != "true" ]]; then
            echo "::warning::Release PR ${PR_URL} needs a maintainer to approve its workflow runs before the required checks start."
            {
              echo "### Release PR checks need approval"
              echo
              echo "${PR_URL} was opened with GITHUB_TOKEN. Open it and select **Approve workflows to run** to start its required checks."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
