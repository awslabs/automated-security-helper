name: TypeScript CI
# Runs the repository's jest suites with coverage thresholds.
#
# THE MATRIX IS NOT DEPLOY-ONLY, WHICH IS WHY EACH ENTRY CARRIES A DIRECTORY
#
# It was, and every step interpolated `deploy/${{ matrix.package }}`. editors/vscode
# is a VS Code extension, not deployment infrastructure, so it does not belong under
# deploy/ -- and it does belong under this gate, because it is TypeScript and the
# coverage-completeness-outside job below fails on any tracked production TS that no
# package scope covers. So each entry now names its own `dir` and `package` is only
# a label, used for the job name and the artifact name.
#
# One thing NOT changed alongside that. assert-coverage-completeness.mjs's
# `--scope outside` pass asserts that every directory holding a
# `deploy/<pkg>/package.json` appears in the `--package` list; it does not make the
# same assertion about `editors/<pkg>/package.json`. That is deliberately left
# alone. The primary protection does not depend on it: a package added to the tree
# and to neither list has its sources land in the outside census, which fails on
# them by name. The deploy/-specific pass is a second line for that one directory,
# and widening it is a change to a gate script rather than to this file.
#
# WHY THIS WORKFLOW EXISTS
#
# `jest` appeared nowhere under .github/ before this file, so neither TypeScript
# package was tested in CI at all. Both had real suites -- 352 and 116 tests --
# and both measured above 90% statement coverage, but nothing enforced either
# number, so a regression would have landed unobserved.
#
# WHY THE THRESHOLDS ARE PASSED ON THE COMMAND LINE
#
# Rather than added to each package's jest.config.js. The thresholds are the
# gate's policy, and keeping them here means the gate is readable in one file and
# cannot be relaxed by editing a package's config without touching CI.
#
# WHY A DENOMINATOR CHECK RUNS ALONGSIDE THE THRESHOLD
#
# A percentage threshold on its own can be satisfied by measuring less. Both jest
# configs previously set `roots: ['<rootDir>/test']`, which confines jest's
# crawler so a source file no test imports is omitted from the report entirely
# rather than reported at 0%. deploy/cdk-constructs read 97.35% that way while a
# 0%-covered file sat in src/; the honest figure was 82.51%, and nothing errored.
# assert-coverage-scope.mjs pins the file count, the statement denominator, and
# the presence of specific files, so shrinking the measured scope fails loudly
# instead of raising the percentage.
#
# WHY A COMPLETENESS CHECK RUNS ALONGSIDE THE DENOMINATOR CHECK
#
# Pinning the denominator stops it shrinking, which is the important half and not
# the whole story. A floor on the file count cannot tell "we measure 20 of 21
# production files and the 21st has no harness" from "we measure 20 and lost
# track of one" -- from inside one report the two are identical, because jest
# omits source no test imports ENTIRELY rather than listing it at 0%. Nothing in
# the report's own contents can reveal a file that was never loaded.
#
# So the census has to come from outside the report. assert-coverage-completeness
# .mjs takes it from `git ls-files`, which knows about files no harness has ever
# seen, and requires every tracked production file to be either measured or named
# in .github/typescript-coverage-exclusions.json with a reason. Today that list
# holds three entries: each package's own jest.config.js, which jest loads before
# instrumentation exists, and a node helper under the Python transpiler's tools/
# whose tree has no package.json, tsconfig, jest or vitest config at all. The
# third is the case the check exists to state precisely: "no harness exists to
# measure this" is a different disposition from "measured and uncovered", and it
# should be a committed claim rather than a reviewer's recollection. The entries
# carry a kind, and the kind selects a staleness test, so an exclusion that stops
# being true fails instead of being carried forward.
#
# THE SCOPES, AND THE ONE INVARIANT A REVIEWER HAS TO HOLD
#
# The packages run as a parallel matrix, so no single job holds both reports. A
# whole-repo completeness check would need cross-job artifacts. Instead each
# package job checks its own scope against its own report, and the
# coverage-completeness-outside job checks what is left: production files that no
# package scope covers, which must all be exclusions. That job's --package list
# must name the same packages as the matrix above. A package added to the tree
# but to neither list fails the outside job, which is the accident worth
# catching. A package name added to the --package list without a matrix entry
# would NOT fail -- it is a deliberate edit in this file, next to the matrix, and
# review is what catches it.

# PATH-FILTERED ON PURPOSE, AND THE FILTER IS LOAD-BEARING
#
# `deploy/` did not exist on the default branch when these filters were written --
# it arrived with the pull request that adds the CDK app. Without them this
# workflow would have run on every pull request and failed the presence check
# below on all of them, because there would have been no package to test.
#
# That precondition has since changed: deploy/cdk and deploy/cdk-constructs are
# both on the default branch now, so the presence check no longer depends on the
# filter to avoid firing. The filters are kept because they still scope the job to
# changes that can affect it, not because the packages might be missing. What the
# change does unblock is the self-referencing filter discussed below, and the
# unfiltered merge_group leg added alongside these triggers.
#
# editors/vscode/** is filtered on the same basis and is not a special case: it is
# a package this gate measures, so a change to it must run the gate.
#
# The alternative -- letting the presence check skip quietly when the directory is
# absent -- was rejected. A job that reports success because it found nothing to
# do is indistinguishable from a job that tested something, which is the failure
# mode this repository has hit repeatedly. So the two behaviours are split: the
# filter decides WHETHER the job runs, and the presence check makes it impossible
# for a run to pass without a package. Neither is a silent pass.
#
# This workflow and its helper files are deliberately NOT in their own filter.
# Self-referencing would make the pull request that ADDS this file trigger it,
# against a tree where deploy/ does not exist yet, so the change introducing the
# gate would fail its own gate on arrival. Once deploy/ is on the default branch,
# adding all four back is safe and worth doing so edits to the gate are
# themselves tested:
#
#   .github/workflows/ash-typescript-ci.yml
#   .github/scripts/assert-coverage-scope.mjs
#   .github/scripts/assert-coverage-completeness.mjs
#   .github/scripts/assert-jest-ran.mjs
#   .github/typescript-coverage-exclusions.json
#
# The exclusions file matters most of the four. It is the one place where editing
# a single line widens what the gate tolerates, and until it is in the filter an
# edit to it alone runs nothing.
#
# Consequence to be aware of: a change outside these paths that breaks the
# TypeScript build will not be caught here, because the job will not run.
on:
  push:
    # "**" not "*". GitHub branch filters are glob patterns in which "*" matches any
    # character EXCEPT "/", so "*" matched no branch anyone here actually uses --
    # every one is ci/..., fix/... or feat/... -- and this workflow ran on none of
    # them. Three other files in this repository already carry a comment explaining
    # exactly this about their own filters; this file was the instance that kept the
    # bug while its neighbours documented it.
    #
    # The .nvmrc entry below makes the point concrete. This gate now reads its Node
    # version from .nvmrc, so a pull request editing .nvmrc changes what this gate
    # tests -- and under "*" it would have triggered nothing at all.
    branches:
      - "**"
    tags:
      # Left as "*" deliberately. Every tag this repository publishes is v3.7.0-shaped
      # with no "/" in it, so "*" matches all of them, and widening a tag filter is a
      # separate decision from fixing a branch filter that matched nothing.
      - "*"
    paths:
      - "deploy/cdk/**"
      - "deploy/cdk-constructs/**"
      - "editors/vscode/**"
      # .nvmrc is load-bearing for both jobs below: it is where setup-node reads the
      # Node version from, so editing it changes the toolchain this gate runs on. A
      # file that decides what a gate tests belongs in the gate's own filter.
      - ".nvmrc"
  pull_request:
    # "**" for the same reason as the push filter above: a pull request whose BASE is
    # a nested branch -- a stacked pull request targeting e.g. ci/close-gate-gaps --
    # never matched "*", so it silently got no TypeScript CI at all.
    branches:
      - "**"
    paths:
      - "deploy/cdk/**"
      - "deploy/cdk-constructs/**"
      - "editors/vscode/**"
      - ".nvmrc"
  # THE MERGE QUEUE LEG, AND WHY IT CARRIES NO paths FILTER
  #
  # This repository runs a merge queue -- ash-unified-ci.yml declares merge_group
  # -- and merge_group is a distinct event from both push and pull_request. A
  # workflow that omits it never runs on a queue entry, so once it is a required
  # check the queue waits on a verdict that never arrives. A required check that
  # cannot report does not fail the merge, it blocks it silently.
  #
  # merge_group takes no paths filter. GitHub scopes paths and paths-ignore to
  # push, pull_request and pull_request_target -- the workflow-syntax heading is
  # literally on.<push|pull_request|pull_request_target>.<paths|paths-ignore> --
  # and the merge_group reference documents only types. So this leg cannot
  # reproduce the filter above and runs on every queue entry, including entries
  # that touch nothing under deploy/.
  #
  # That asymmetry is accepted rather than worked around. It costs a jest run on
  # unrelated entries, and it buys the case a per-entry filter cannot see: a queue
  # entry is a merge of several pull requests, so the change that breaks the build
  # may have touched none of the filtered paths. Filtering here, were it possible,
  # would reintroduce the hole this trigger closes.
  #
  # This leg is only safe to leave unfiltered because deploy/cdk and
  # deploy/cdk-constructs are now on the default branch. While they were not, an
  # unfiltered leg would have failed "Confirm the package is present" on every
  # queue entry, trading a silent block for a hard one.
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, so each pull request has its own
  # group. On push it is a plain branch name, which every push to that branch shares --
  # and THAT is why github.sha is appended for push events only.
  #
  # GitHub allows one pending run per group. With cancel-in-progress false (which is
  # what the expression below evaluates to for push), a third run queuing into an
  # occupied group evicts the second before it starts a single job, and on a push there
  # is no pull request for the missing verdict to block. Measured in this repository:
  # run 34418283475, event push, branch main, was cancelled with zero jobs one second
  # after the next main push queued into the same group. Keying on the commit gives
  # every pushed commit its own group, so no pushed commit can lose its verdict to a
  # later one.
  #
  # Deliberately NOT applied to pull_request: superseding is wanted there, and adding
  # the sha would give each PR push its own group and defeat cancel-in-progress
  # entirely -- turning a bounded one-run-per-PR into a run per commit.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  # Only pull_request runs may be cancelled. A push run is the sole verdict for the
  # commit it names, and a workflow_dispatch run was asked for by a person.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript-tests:
    name: ts (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # min-statements and min-files are floors derived from a measured run,
          # not estimates. Adding a source file raises both legitimately and a
          # floor does not need editing for that. REMOVING measured code lowers
          # them and fails, which is the case worth catching -- and it should
          # require an explicit, reviewable edit to this file.
          - package: cdk
            dir: deploy/cdk
            threshold: '{"global":{"statements":90,"lines":90}}'
            min_files: 11
            min_statements: 400
            # bin/ash.ts is the file that disappears first if roots is narrowed,
            # so requiring it by name is the direct guard against that.
            require: "--require bin/ash.ts --require lib/ash-config.ts"
          - package: cdk-constructs
            dir: deploy/cdk-constructs
            threshold: '{"global":{"statements":90,"lines":90}}'
            min_files: 7
            min_statements: 222
            # buildspec-cli.ts is the file that was actually hidden this way.
            require: "--require src/buildspec-cli.ts --require src/index.ts"
          # The VS Code extension. Its own threshold, at the same 90, because the
          # number this gate holds is per package and per language -- a blended
          # figure across the three would let one of them fall while the average
          # held.
          #
          # Measured on the run that added it: 6 files, 309 statements, 99.67%
          # statements and 99.66% lines. The floors below sit just under that for
          # the reason given above -- a source file added later raises both
          # legitimately.
          - package: vscode
            dir: editors/vscode
            threshold: '{"global":{"statements":90,"lines":90}}'
            min_files: 6
            min_statements: 300
            # vsix-contents.ts is this package's equivalent of the file that was
            # actually hidden: nothing in src/ imports it, only src/verify-vsix.ts
            # and a test do, so it is the first thing a narrowed `roots` would drop
            # from the report -- and it is the publishing-boundary check, so losing
            # its coverage silently is the worst of the three.
            require: "--require src/vsix-contents.ts --require src/extension.ts"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails rather than skips when the package is absent. A job that quietly
      # succeeds because it found nothing to test is worse than no job: it
      # reports a green check for work it never did.
      - name: Confirm the package is present
        run: |
          if [ ! -f "${{ matrix.dir }}/package.json" ]; then
            echo "::error::${{ matrix.dir }}/package.json is missing. This gate expects it to exist; it must not pass by finding nothing."
            exit 1
          fi

      # Before this step there was no setup-node anywhere in this file, so both jobs
      # took whatever Node the ubuntu-latest image happened to ship that week. That
      # is a moving toolchain under a gate whose whole purpose is to hold coverage
      # steady, and it disagreed with the rest of the repository: ash-iac-drift.yml
      # pins Node 22 for these same two packages and Dockerfile sets NODE_MAJOR=22.
      # Two workflows built the same TypeScript on two different Node versions, and
      # a runner-image bump could change the result of either without a diff here.
      #
      # The version comes from .nvmrc so there is one source of truth rather than a
      # fifth copy of the literal "22". nvm, `node --version` checks and setup-node
      # all read that file, and ash-iac-drift.yml now reads it too.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix "${{ matrix.dir }}"

      # --json --outputFile is here for the step after this one, not for this one.
      # jest still writes its human-readable report, so the log is unchanged; the
      # JSON is what makes the test count machine-readable. Reading the count out
      # of the text would mean stripping ANSI first -- an anchored grep over
      # coloured jest output matches nothing, and a naive one matches the wrong
      # lines.
      #
      # It goes under RUNNER_TEMP rather than into the package, so no package needs
      # a .gitignore entry for a CI-only file.
      - name: Run tests with coverage thresholds
        run: |
          npm --prefix "${{ matrix.dir }}" test -- \
            --ci \
            --coverage \
            --coverageReporters=text \
            --coverageReporters=json-summary \
            --coverageThreshold='${{ matrix.threshold }}' \
            --json \
            --outputFile="$RUNNER_TEMP/jest-${{ matrix.package }}.json"

      # A jest run that collected no tests exits 0 and prints "Tests: 0 total",
      # which reads as a pass -- this repository has already had a green run that
      # executed nothing. A coverage threshold does not catch it either: with no
      # files instrumented there is no percentage to fall below.
      - name: Assert jest actually ran tests
        run: |
          node .github/scripts/assert-jest-ran.mjs \
            --results "$RUNNER_TEMP/jest-${{ matrix.package }}.json" \
            --min-tests 1

      - name: Assert the coverage scope was not narrowed
        run: |
          node .github/scripts/assert-coverage-scope.mjs \
            --summary "${{ matrix.dir }}/coverage/coverage-summary.json" \
            --min-files ${{ matrix.min_files }} \
            --min-statements ${{ matrix.min_statements }} \
            ${{ matrix.require }}

      # The floors above say the denominator did not shrink. This says nothing in
      # the package is missing from it: every tracked production file under
      # deploy/<package> is in the report, or is a named exclusion that still
      # needs excluding.
      - name: Assert every production file in the package is measured
        run: |
          node .github/scripts/assert-coverage-completeness.mjs \
            --exclusions .github/typescript-coverage-exclusions.json \
            --scope "${{ matrix.dir }}" \
            --summary "${{ matrix.dir }}/coverage/coverage-summary.json"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts-coverage-${{ matrix.package }}
          path: ${{ matrix.dir }}/coverage/
          retention-days: 7
          if-no-files-found: warn

  # The other half of the completeness question: a production file that sits
  # outside every package scope is measured by nothing, and no per-package job
  # would ever look for it. Exactly the shape of
  # transpiler/tools/zod_to_json_schema.mjs, which is why that file is a named
  # exclusion rather than an unremarked absence.
  #
  # Separate from the matrix on purpose: this needs no npm install and no jest
  # run, only the checkout and the git index, so it does not belong behind a
  # per-package dependency install.
  coverage-completeness-outside:
    name: ts (files outside the packages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This job runs no npm install, but it does run `node`, so it needs the same
      # pinned toolchain as the matrix above -- otherwise the two jobs in one
      # workflow execute the coverage scripts on two different Node versions. No
      # `cache:` here for that same reason: there is no single lockfile to key it on.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # --package must name the same directories as the matrix above -- the `dir`
      # values, not the `package` labels. The check itself fails when a
      # deploy/<pkg>/package.json exists that this list does not name, so a new
      # package under deploy/ cannot slip past both. It makes no equivalent
      # assertion about editors/<pkg>, so for that directory the protection is the
      # census below: a package added there and named in neither list has its
      # sources reported as accounted for by nothing.
      - name: Assert no unnamed production file sits outside every package
        run: |
          node .github/scripts/assert-coverage-completeness.mjs \
            --exclusions .github/typescript-coverage-exclusions.json \
            --scope outside \
            --package deploy/cdk \
            --package deploy/cdk-constructs \
            --package editors/vscode
