name: Dependency Review

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer run on any ref other than main or a tag supersedes the one in progress: a
  # fresh push to a pull request or a branch makes the previous head's run moot, and a
  # second dispatch on a branch replaces the first. Runs on main and on tags are never
  # cancelled; each is the only report its commit gets. A merge_group entry has its own
  # per-entry ref, so a second run in its group only means the entry was rebuilt and the
  # earlier run's answer is for a queue entry that no longer exists.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
