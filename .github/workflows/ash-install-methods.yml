name: Install Method Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "hatch_build.py"
      - "automated_security_helper/**"
      - ".pre-commit-hooks.yaml"
      - "Formula/**"
      - ".github/workflows/ash-install-methods.yml"
      # The nix leg's action and the snapshot module it runs, with that module's
      # snapshots: a change to any of them is only checked by this workflow.
      - ".github/actions/validate-nix/**"
      - "tests/snapshot/container/runtime/test_snapshot_container_nix_runtime.py"
      - "tests/snapshot/container/runtime/__snapshots__/test_snapshot_container_nix_runtime.ambr"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull_request runs may be cancelled. A merge_group run must finish or the
  # queue loses its verdict, and push/tag runs feed docs and releases.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The nix install surface. Nothing else lives here any more.
  #
  # This workflow used to be a second copy of ash-unified-ci.yml's
  # `install-validation`: the same os x python-version cells for pip, pipx, uvx,
  # pre-commit, mcp, homebrew, podman, finch and nerdctl, one leg per method, plus
  # the four nix legs. The unified job runs every one of those cells -- pip, pipx,
  # uvx, pre-commit and mcp as steps of one `bundle` leg per cell, and homebrew and
  # the container runtimes as their own legs -- unconditionally, and it is what
  # `required-checks` gates on. So the 96 non-nix legs here re-ran cells the gated
  # surface had already run, on every pull request touching package code.
  #
  # Measured before they were removed, on 2026-10-06 (pull request 717 at f77d0b0f):
  # this workflow was 100 of the 207 jobs one push started, 37 of them macOS, while
  # pull requests were waiting a median 36-48 minutes for ubuntu-latest and macOS
  # runners and spending 3-5 minutes on each job once one arrived. What the 96 legs
  # added over the unified job was a clean runner per method, and the operator
  # accepted losing that: inside `bundle`, pip runs after pipx on the same machine,
  # and the step order there is load-bearing for that reason (see the note above
  # install-validation in ash-unified-ci.yml).
  #
  # nix stays here, path-filtered, because the unified job does not carry it.
  # tests/unit/test_ci_matrix_agreement.py asserts that this job carries nix only,
  # on OSes and a Python version the unified job also runs.
  validate:
    name: ${{ matrix.method }} (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # No windows-latest: native Windows Nix cannot supply the toolchain. It has no
        # fixed-output derivations, which is the mechanism by which the scanners are
        # fetched, and no build sandbox. Windows users go through WSL2, covered by the
        # Linux entries.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-14]
        # Nix supplies the scanners itself, so the host Python version does not change
        # what is under test here. One version per OS is enough.
        python-version: ["3.12"]
        method: [nix]
    steps:
      # FAIL CLOSED BEFORE THE ROUTING CONDITION BELOW
      #
      # The validator step at the end of this job is an `if:` with no else. A method that
      # does not satisfy it -- a new entry on the `method` axis, or one renamed on the axis
      # and not in the condition -- runs checkout and setup-python, does no validation at
      # all, and exits 0. Green, over nothing. Same guard, same reason, as
      # ash-unified-ci.yml's `install-validation` job.
      - name: "Assert this install method is routed to a validator"
        shell: bash
        env:
          METHOD: ${{ matrix.method }}
        run: |
          case "${METHOD}" in
            nix) ;;
            *)
              echo "::error::This workflow has no validator for method '${METHOD}'. The routing conditions on the steps at the end of this job cover none of it, so this leg would run setup-python and then nothing, and exit 0. Route it to a composite action and add it to the case above."
              exit 1
              ;;
          esac
          echo "${METHOD}: routed to a validator"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Asserts no flake-supplied scanner reports MISSING. A Nix job that passes while
      # silently providing no tools is the exact failure this mode exists to prevent, so
      # the assertion reads the per-scanner status table rather than the finding total.
      - name: "Validate Nix mode"
        if: matrix.method == 'nix'
        uses: ./.github/actions/validate-nix
