# TEMPORARY, TEST-ONLY. Removed in the next commit of this pull request.
#
# Warm runs need a saved base-image cache entry, and the real save only fires on a push to
# main, which a pull request cannot produce. This workflow seeds entries in THIS pull
# request's own cache scope (refs/pull/<n>/merge), using the same helper, path and key as
# .github/actions/prepull-base-image, so the next run of this pull request restores them.
# The entries are deleted through the cache API once the warm run has been read.
name: "TEMPORARY: seed the base-image cache for this PR's warm-run test"
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  seed:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: key
        run: |
          set -euo pipefail
          key="$(python3 .github/actions/prepull-base-image/oci_layout.py key --dockerfile Dockerfile --arch "${RUNNER_ARCH}")"
          echo "key=${key}" >> "${GITHUB_OUTPUT}"
          echo "${key}"
      - run: |
          set -euo pipefail
          pin="$(sed -n '/^ARG BASE_IMAGE_DIGEST=/{s/^ARG BASE_IMAGE_DIGEST=//;p;q;}' Dockerfile)"
          python3 .github/actions/prepull-base-image/oci_layout.py fetch \
            --repo public.ecr.aws/docker/library/python --repo docker.io/library/python \
            --pin "${pin}" --arch "${RUNNER_ARCH}" --out "${RUNNER_TEMP}/ash-base-image-oci"
          du -sh "${RUNNER_TEMP}/ash-base-image-oci"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ash-base-image-oci
          key: ${{ steps.key.outputs.key }}
