name: ASH - Action Pinning Check
# Fails when any `uses:` reference names a tag or branch instead of a commit sha.
#
# WHY THIS WORKFLOW EXISTS
#
# Pinning the refs was a one-time act. They drift back the moment someone adds a
# step, because `uses: actions/checkout@v7` is what every example on the internet
# shows and a new unpinned step looks exactly like a new pinned one in review. The
# invariant only holds if something re-tests it, so this runs the check on every
# pull request rather than trusting the commit that established it.
#
# What is being protected: a tag is a mutable pointer, so an upstream force-push --
# or a compromised maintainer account -- changes the code executing inside a
# workflow that already holds this repository's tokens, with no diff here for
# anyone to review.
#
# WHY THERE IS NO paths FILTER
#
# It would be the obvious optimization: only run when .github/ changes. Two reasons
# not to.
#
# First, `merge_group` accepts no `paths` filter at all. A gate filtered on
# pull_request but unfiltered on merge_group runs in one place and not the other,
# and a required check that cannot report for a queued entry blocks the merge queue
# on a verdict that will never arrive. Keeping both triggers unfiltered keeps the
# two events behaving identically, which is one less asymmetry to reason about.
#
# Second, the check censuses the whole tracked tree rather than the diff, so it is
# meaningful on every run regardless of what changed. The job is a checkout and one
# node invocation with no dependency install, so there is nothing to save.
#
# WHY THE EXEMPTION IS A FLAG HERE RATHER THAN A LIST IN THE SCRIPT
#
# Same reason .github/typescript-coverage-exclusions.json is a committed file: the
# carve-out and the reason for it belong where a reviewer reads them, next to the
# call. And like the entries in that file, this exemption carries a staleness test
# -- the script fails when an exempted file has no unpinned refs left, so the
# carve-out cannot outlive its reason by being forgotten.

on:
  pull_request:
  merge_group:
  # Added so this workflow's gates are reachable on a branch that has no pull
  # request open. Both of them are static checks over files in the tree, so a
  # dispatch run against a branch is exactly as meaningful as a pull_request run
  # and costs one ubuntu-latest minute.
  #
  # It was added because the gap had a cost: the two jobs below could not be run
  # against a long-lived feature branch at all, and a merge on that branch shipped
  # a workflow with two empty jobs precisely because the check that would have
  # caught it had no trigger it could fire on. A gate nobody can run is a gate
  # nobody runs.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull_request runs may be cancelled. A merge_group run must finish or the
  # queue loses its verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actions-pinned:
    name: Assert every action is pinned to a commit sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No exemptions. ash-agent-plugins-drift.yml carried the only one, because its
      # two refs were being pinned in a separate change at the same time; that change
      # has since landed with them pinned, so the flag is gone. The gate forced this
      # follow-up rather than waiting to be remembered: it fails on an
      # --allow-unpinned file that has no unpinned refs left, so the carve-out went
      # red the moment it stopped being true.
      - name: Assert no action is referenced by a mutable tag or branch
        run: node .github/scripts/assert-actions-pinned.mjs

      # A structural check on the workflows themselves, in this job because it
      # needs the same thing the pinning gate needs -- the tree, and nothing else.
      #
      # It exists because a merge that added four packaging jobs to
      # ash-package.yml left two of them with `steps:` and nothing under it, and
      # nothing in the repository objected. `yaml.safe_load` reads an empty
      # `steps:` as None and returns a document whose job names are all present,
      # so both a parse check and a job-name listing came out clean. GitHub's own
      # parser refused it -- HTTP 422, `Unexpected value ''` -- only when a
      # workflow_dispatch was attempted, by which point it was pushed.
      #
      # The self-test runs FIRST and separately, for the same reason the
      # artifact-contents gate's does: a structural matcher that silently stopped
      # matching would clear every workflow forever, and that is the failure this
      # check exists to rule out. It plants one fixture per rule and requires each
      # to be rejected by name, plus a well-formed fixture that must be accepted.
      #
      # `uv run --no-project` rather than a bare `python3`: this job runs no
      # setup-python, so `python3` would resolve to whatever the runner image
      # happens to preinstall. The script imports only PyYAML and the standard
      # library, and `--no-project` keeps it from syncing the whole project to run
      # a check that needs none of it.
      # v10.0.1, which is the sha 8 of the repository's 12 setup-uv references use;
      # ash-package.yml still carries v7.6.0 on the other 4. Both are sha-pinned so
      # the pinning gate above is satisfied either way -- this picks the majority
      # and newer of the two rather than copying whichever file was read last.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Prove the workflow-structure check can fail
        run: uv run --no-project --with pyyaml python .github/scripts/assert-workflows-well-formed.py --self-test

      - name: Assert no workflow job has an empty body
        run: uv run --no-project --with pyyaml python .github/scripts/assert-workflows-well-formed.py
