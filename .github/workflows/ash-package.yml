name: ASH - Package Build
# Builds the wheel and sdist, asserts neither ships third-party scanner code, and
# uploads both as workflow artifacts.
#
# WHY THIS WORKFLOW EXISTS
#
# ASH is not on PyPI: the name is held by an unrelated third party, so every
# documented install resolves a git ref instead. The native installers being added
# (deb, rpm, MSIX, Flatpak, Chocolatey, winget) each install ASH from a wheel built
# here, which makes that wheel the artifact the whole distribution story rests on.
#
# Until this workflow, CI never built one. There is no `uv build`, `python -m build`
# or `hatch build` anywhere else under .github/; the only `uv build` in the
# repository is Dockerfile:43, inside the image build, where the wheel is installed
# and then discarded with the build layer. So the artifact every installer will
# depend on was never produced outside a developer's laptop and never inspected.
#
# Two things therefore happen here that could not happen before: the build is
# exercised on every change, and the thing it produces is opened and checked.
#
# WHY THESE TRIGGERS AND NOT THE ONES NEXT DOOR
#
# The trigger is copied from ash-unified-ci.yml's `pull_request`/`merge_group`
# block, deliberately, and NOT from ash-install-methods.yml, which is the closer
# neighbour by subject matter. That workflow declares:
#
#     pull_request:
#       branches: [main]
#       paths: [pyproject.toml, hatch_build.py, automated_security_helper/**, ...]
#
# Both halves of that are wrong for a gate. `branches: [main]` means a pull request
# stacked onto any non-main base -- the normal shape of work in this repository --
# never runs it at all. And there is no `merge_group` trigger, so a queued entry
# gets no verdict: a required check that cannot report for a merge-queue entry
# blocks the queue on an answer that will never arrive.
#
# `branches: ["**"]` and not `["*"]`: GitHub branch filters treat `*` as matching
# any character except `/`, so a PR based on a nested branch like `pr/foo-bar`
# silently matches nothing.
#
# There is no `paths` filter. `merge_group` accepts none, so a gate filtered on
# pull_request but unfiltered on merge_group runs in one place and not the other --
# and packaging depends on more than a path list can capture: pyproject.toml, the
# hatch_build.py hook, every file under automated_security_helper/, and the
# presence or absence of stray files that a build would sweep in. A filter here
# would be an assertion about what cannot affect the wheel, and that assertion
# would be wrong.
#
# Note for anyone comparing against ash-unified-ci.yml: that file also carries
# `push: branches: ["!main"]`, which does not do what it appears to. It is a known
# bug being fixed on another branch and is deliberately NOT reproduced here.
#
# WHY THERE IS NO `push` TRIGGER, WHICH IS A DECISION AND NOT AN OMISSION
#
# The obvious reading is that main gets no artifact gate. It does, via merge_group:
# a queue entry runs on the `gh-readonly-queue/main/pr-<n>-<sha>` ref, which IS
# main with the queued change applied -- the exact tree that becomes main. A
# `push: [main]` leg would re-check a tree this workflow cleared moments earlier
# and would report after the merge, when the verdict can no longer block anything.
#
# It also matches how this repository gates. Six workflows are pull_request +
# merge_group with no push at all -- ash-repo-scan, ash-upgrade-paths,
# ash-pr-title-check, ash-install-methods, dependency-review and this one. The
# only two gate-shaped workflows that do declare a push filter (ash-unified-ci,
# ash-iac-drift) declare `branches: ["!main"]`, a list containing nothing but a
# negative pattern, which matches no branch and fires no run. Copying a push leg
# from a neighbour here means copying that.
#
# The residual gap, stated plainly rather than left implied: if the merge queue is
# ever disabled for this repository, or someone with admin rights pushes straight
# to main, no artifact gate runs on the resulting commit. That is the condition
# under which a push leg becomes worth adding -- not the mere absence of one.
#
# If it is ever added, `concurrency.group` must include github.sha for push
# events. The group below is keyed on github.ref, which is `refs/heads/main` for
# every push to main, and cancel-in-progress is false for non-pull_request events:
# consecutive merges would land in one group where a pending run either queues
# behind its predecessor or, if someone flips cancellation on, gets cancelled and
# never reports -- a required check that never answers.

on:
  pull_request:
    branches:
      - "**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull_request runs may be cancelled. A merge_group run must finish or the
  # queue loses its verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build wheel and sdist, and assert their contents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Default fetch-depth (1) on purpose. hatch_build.py stamps
      # automated_security_helper/assets/ASH_INSTALLED_REVISION during the build,
      # and despite the name of the function that produces it (_get_commit_sha)
      # what it actually runs is `git rev-parse --abbrev-ref HEAD` -- a branch
      # name, deliberately, per the NOTE at hatch_build.py:78 saying the Dockerfile
      # needs the branch rather than a commit. That needs no history, so a full
      # clone would buy nothing here.
      #
      # Worth knowing when reading a built artifact: on a pull_request event the
      # checkout leaves HEAD detached, and `--abbrev-ref HEAD` on a detached HEAD
      # prints the literal string "HEAD". So the wheel this job builds records
      # "HEAD" as its revision. That is pre-existing behavior of the build hook,
      # not something this workflow introduces, and it does not fail the build --
      # "HEAD" is not one of the values the hook's fallback rejects. It is noted
      # here so nobody reads that string as corruption.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # Run before the build, not after. The check's own positive control has to
      # pass before its verdict on a real artifact means anything: a matcher that
      # silently stopped matching would otherwise clear every wheel forever, and
      # that is the failure mode this whole step exists to rule out. It plants
      # known third-party payload in fixture archives -- one member per detector,
      # ten of them -- and requires each to be rejected BY THE INTENDED DETECTOR,
      # so a rule masked by another rule is reported rather than hidden. It pairs
      # that with a fixture of the legitimate lookalikes -- all 14 pinned assets,
      # Gemfile.lock, the ASH-authored cfn-nag rules, the trivy/snyk/bandit
      # adapters -- and requires acceptance.
      #
      # It runs first so an ordering accident cannot leave the control unrun after
      # a build failure short-circuits the job.
      #
      # `uv run --no-project python` rather than bare `python3`. This job runs no
      # actions/setup-python -- its only setup steps are checkout and setup-uv -- so
      # `python3` resolves against whatever the runner image happens to preinstall.
      # That is fine on ubuntu-latest and unmeasured everywhere else, and the
      # packaging work this gate exists for (MSIX, Chocolatey, winget) will add a
      # Windows leg. uv is already installed here, so routing through it removes the
      # assumption at no cost. `--no-project` because the gate imports only the
      # standard library: syncing the project would install every dependency to run
      # a script that needs none.
      - name: Prove the artifact-contents check can fail
        run: uv run --no-project python .github/scripts/assert-artifact-contents.py --self-test

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      # `uv build` exiting 0 is not evidence that it wrote anything, and every
      # step below would read an empty dist/ as success.
      # Also publishes the two resolved paths, so the check below names its inputs
      # instead of globbing for them. That makes this step the single place that
      # decides what "the artifacts" are: it already fails unless there is exactly
      # one of each, so the gate cannot end up checking one artifact when it meant
      # two. `shell: bash` is explicit because this body is bash-specific
      # (`set -euo pipefail`, `nullglob`, arrays) rather than portable.
      - name: Assert the build produced exactly one wheel and one sdist
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          echo "dist/ contains ${#wheels[@]} wheel(s) and ${#sdists[@]} sdist(s):"
          ls -la dist
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 wheel and 1 sdist, got ${#wheels[@]} and ${#sdists[@]}" >&2
            exit 1
          fi
          echo "wheel=${wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "sdist=${sdists[0]}" >> "$GITHUB_OUTPUT"

      # The operator invariant for the whole installer program: no artifact
      # published from this repository may carry third-party scanner source or
      # assets. ASH invokes bandit, checkov, semgrep, grype, syft, trivy,
      # opengrep, npm-audit, detect-secrets, cdk-nag and cfn-nag; it redistributes
      # none of them. Two vendored .jsii.tgz bundles (aws-cdk-lib, cdk-nag) lived
      # in the tree until commit 760f3647, so this is a regression guard rather
      # than a hypothetical.
      #
      # What a green result here does and does not mean is spelled out in the
      # script's own docstring, and it matters: this is a regression guard over
      # known vendoring mechanisms plus a fail-closed allowlist over assets/ and
      # over the set of package subdirectories. It is not a proof that nothing is
      # vendored -- a third-party .py file inside an already-pinned subdirectory,
      # named nothing like a scanner, passes. Read green as "none of the known
      # mechanisms fired", not as "audited clean".
      #
      # Four failure modes are worth recognizing in a log rather than debugging
      # cold. All four mean the same thing -- something arrived in a namespace
      # whose contents are enumerated -- and all four are fixed the same way, by a
      # one-line addition to the corresponding list in the script, in the same
      # commit that adds the file. That diff is the point of the rule, not an
      # obstacle to it.
      #
      #   unpinned-asset                    a file in automated_security_helper/
      #                                     assets/ that is not in
      #                                     ASSETS_ALLOWLIST (14 entries)
      #   unpinned-package-subdirectory     a new directory directly under
      #                                     automated_security_helper/
      #                                     (PACKAGE_SUBDIRECTORIES, 12 entries)
      #   unpinned-distribution-directory   a new directory at the artifact root.
      #                                     A wheel may carry the package and its
      #                                     .dist-info and nothing else; note that
      #                                     a .data/ scheme directory is NOT
      #                                     accepted, because the current build
      #                                     does not produce one
      #   unpinned-dist-info-member         a file in .dist-info/ that is not in
      #                                     DIST_INFO_ALLOWLIST (6 entries). Most
      #                                     likely cause is a hatchling upgrade
      #                                     writing something new
      #
      # Two other verdicts are NOT allowlist misses and should not be answered by
      # widening a list. `malformed-member-path` means a member name is not a
      # plain relative `/`-separated path -- a backslash, an absolute path, a
      # `..` -- which no correct build produces. And the gate exits 2, not 1, if
      # an artifact carries more than one top-level distribution root; that means
      # it cannot tell which members are inside the distribution, so it declines
      # to judge them at all.
      #
      # The paths come from the step above rather than from a glob. `dist/*.whl` is
      # expanded by the SHELL, and the default shell on windows-latest is pwsh, which
      # does not glob for external commands: it would pass the literal `dist/*.whl`
      # through, and the script's own isfile() check would refuse it. That refusal is
      # at least honest -- exit 2 with a named reason, the gate's design working --
      # but the job would still be broken. Naming the inputs removes the dependency
      # on any shell behaving a particular way, rather than pinning which shell.
      #
      # Not hardcoded either: the version in the filename tracks pyproject.toml, so a
      # literal path would break on every release bump.
      #
      # Interpolated directly rather than through `env:`, deliberately. `env:` plus
      # `"$WHEEL"` would reintroduce a shell dependency, since pwsh expands
      # `$env:WHEEL` and not `$WHEEL`. These two values are filenames produced by
      # `uv build` from pyproject metadata in the step above, not event payload, so
      # they are not an injection surface -- unlike anything under github.event.
      - name: Assert no artifact ships third-party scanner code
        run: >-
          uv run --no-project python .github/scripts/assert-artifact-contents.py
          "${{ steps.artifacts.outputs.wheel }}" "${{ steps.artifacts.outputs.sdist }}"

      # Proves the artifact the installers will consume actually installs and runs.
      # Building a wheel nobody installs would leave the one property every
      # downstream installer depends on untested.
      - name: Install the built wheel into a clean environment and run it
        run: |
          set -euo pipefail
          wheel=$(find dist -maxdepth 1 -name '*.whl' -print -quit)
          echo "installing ${wheel}"
          # A fresh venv, and --no-cache so a previously built wheel of the same
          # version cannot be substituted for the one just produced.
          uv venv /tmp/ash-wheel-check
          VIRTUAL_ENV=/tmp/ash-wheel-check uv pip install --no-cache "${wheel}"
          # The console script, not `python -m`: the entry point is what the deb,
          # rpm, MSIX, Flatpak, Chocolatey and winget packages put on PATH, and it
          # is declared in wheel metadata that a plain import would not exercise.
          /tmp/ash-wheel-check/bin/ash --version

      - name: Upload wheel and sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # run_attempt is in the name because artifact names are immutable within a
          # run from upload-artifact v4 onward, and this is pinned at v7. "Re-run all
          # jobs" on a run that already uploaded would otherwise fail the upload with
          # a name conflict and redden a tree that was green -- a re-run that cannot
          # succeed is worse than no re-run button. The sha is kept because it is what
          # a human reads the artifact by; run_attempt only disambiguates retries.
          #
          # `overwrite: true` would also work and is the more common fix, but it
          # depends on an input this pinned version was not verified offline to
          # accept, whereas a different name is just a string and cannot be wrong.
          name: ash-package-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          # An upload that matches nothing must fail rather than produce an empty
          # artifact that a later phase would download and treat as a build.
          if-no-files-found: error
          retention-days: 14

  # Native packages. These are the first jobs in the repository to use a `container:`
  # key -- before this, no workflow had one, none had `services:`, and none ran a bare
  # `docker run`, so building a .deb inside Debian and an .rpm inside Amazon Linux is a
  # new capability rather than a reuse of an existing pattern.
  #
  # Testing inside a distro image PUBLISHES NOTHING. It pulls a public base image, builds
  # a package in it and throws the container away, so it does not touch the project's
  # position that ASH publishes no binary artifacts to public registries.
  #
  # Why a container rather than the ubuntu-latest host, which has dpkg-deb: building the
  # package in the same image that tests it lets a missing dependency pass because the
  # build host happened to provide it. The container starts with neither the interpreter
  # nor pip, so the package's own Depends/Requires have to be right.
  #
  # Both jobs run the same script a developer runs locally, rather than reimplementing
  # the steps in YAML. A verification that exists twice drifts, and the copy in CI is the
  # one nobody runs by hand.
  deb:
    name: "native: deb (debian:bookworm)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: debian:bookworm
    steps:
      # Before checkout, because actions/checkout needs git in the image and
      # debian:bookworm ships none. Without this it silently falls back to a REST API
      # tarball, which works but leaves no git metadata -- and the failure mode when it
      # does not work is an empty workspace rather than an error naming git.
      - name: Install git for actions/checkout
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update >/dev/null
          apt-get -qq install -y --no-install-recommends git ca-certificates >/dev/null
          git --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # download-artifact has no v7. Its major versions are offset from
      # upload-artifact's, so v8 is the current release and is the correct pair for the
      # upload pinned at v7.0.1 above -- both are the v4-generation artifact backend.
      # This looks like a mismatch and is not one.
      - name: Download the wheel built and gated by the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ash-package-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist

      - name: Build the .deb, install it, and run a real scan
        run: bash packaging/deb/verify-in-container.sh
        env:
          REPO: ${{ github.workspace }}

  rpm:
    name: "native: rpm (amazonlinux:2023)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: public.ecr.aws/amazonlinux/amazonlinux:2023
    steps:
      - name: Install git for actions/checkout
        run: |
          set -euo pipefail
          dnf -q -y install git ca-certificates tar gzip >/dev/null
          git --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the wheel built and gated by the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ash-package-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist

      # This job is the reason the rpm's dependency list is correct. On the first run it
      # failed with "python3 >= 3.10 is needed by ash", because Amazon Linux 2023's
      # python3 is 3.9 -- a defect invisible to any amount of spec review and to a build
      # on ubuntu-latest, where python3 is new enough.
      - name: Build the .rpm, install it, and run a real scan
        run: bash packaging/rpm/verify-in-container.sh
        env:
          REPO: ${{ github.workspace }}

  # The Chocolatey nuspec, checked against NuGet's published XSD.
  #
  # One job per format, following deb and rpm, and not one shared "validate the
  # manifests" job holding both this and the winget check. A shared job would be cheaper
  # by about thirty seconds of runner time and would couple the two formats: dropping
  # Chocolatey would delete the job the winget check lives in, so the two could not be
  # landed or reverted independently.
  #
  # It does not need the build job. Nothing here reads the wheel: the script checks a
  # metadata file against a published schema and cross-checks the version it declares
  # against the nuspec itself. So this starts immediately instead of queueing behind a
  # build whose output it would not open.
  #
  # The script rejects two deliberately broken copies of the nuspec before validating
  # the real one, for the reason the "Prove the artifact-contents check can fail" step
  # above gives: xmllint invoked without --schema parses the document and exits 0, so a
  # validator that has never been observed failing may be checking nothing, and its
  # passing output looks identical either way.
  nuspec:
    name: "schema: chocolatey nuspec (NuGet XSD)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # xmllint comes from libxml2-utils, which is NOT in the ubuntu-24.04 runner
      # image's apt package list -- checked against
      # images/ubuntu/Ubuntu2404-Readme.md in actions/runner-images, whose list runs
      # from acl to zsync and contains no libxml2 package. validate-nuspec.sh fails
      # with a named error if xmllint is missing rather than skipping the check, so
      # dropping this step would redden the job rather than quietly pass it, but there
      # is no reason to make anyone read that error.
      - name: Install xmllint
        run: |
          set -euo pipefail
          sudo apt-get -qq update >/dev/null
          sudo apt-get -qq install -y --no-install-recommends libxml2-utils >/dev/null
          xmllint --version

      - name: Validate ash.nuspec against NuGet's published XSD
        run: bash packaging/chocolatey/validate-nuspec.sh

  # The Chocolatey package. Same principle as the deb and rpm jobs: build the package
  # in the environment that will install it, then install it and make it do real work.
  #
  # windows-latest rather than a container, because Chocolatey is a Windows tool and
  # Linux Docker cannot run a Windows image. The runner ships what this needs already:
  # images/windows/Windows2025-VS2026-Readme.md in actions/runner-images lists
  # "Chocolatey 2.7.4" and "Python 3.12.10", and the label table in that repository's
  # README maps windows-latest to Windows Server 2025 with that image. So there is no
  # bootstrap step, and `choco pack` is reachable here and nowhere else in this
  # workflow.
  #
  # The one place this is weaker than the deb and rpm jobs, and it is a property of the
  # runner rather than a choice: those two start from an image with no interpreter, so
  # the package's own dependency declaration is what makes the install work. A
  # windows-latest runner already has Python on PATH and cannot be stripped of it, so
  # verify-on-windows.ps1 instead asserts that Chocolatey resolved and installed the
  # declared python3 dependency. That catches a dependency nothing can satisfy, which
  # is the failure the rpm job found on Amazon Linux, without claiming the host was
  # bare.
  #
  # A plain `run:` step, like deb and rpm use. A Docker-based action would be worse
  # than unnecessary here: its image is pulled in the job's prepare phase, before any
  # `if:` on the step is evaluated, so a conditional container step is an unconditional
  # network dependency.
  chocolatey:
    name: "native: chocolatey (windows-latest)"
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the wheel built and gated by the build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ash-package-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist

      # `shell: pwsh` is the default on windows-latest and is stated anyway, because
      # the body is a PowerShell script invocation and the difference matters: pwsh
      # does not glob for external commands and expands $env:VAR rather than $VAR. See
      # the long note above the artifact-contents step for how that bit this workflow
      # before. Nothing is globbed here; the path is literal and the wheel is found by
      # the script itself.
      #
      # $Repo is interpolated directly rather than passed through env:, for the same
      # reason the artifact-contents step interpolates its two paths: `env:` plus
      # "$REPO" would reintroduce a shell dependency, since pwsh expands $env:REPO and
      # not $REPO. github.workspace is not event payload, so it is not an injection
      # surface.
      - name: Build the Chocolatey package, install it, and run a real scan
        shell: pwsh
        run: ./packaging/chocolatey/verify-on-windows.ps1 -Repo "${{ github.workspace }}"

  # The winget manifest set, checked against Microsoft's published JSON Schemas.
  #
  # This is the whole verification winget gets, and the reason it is a schema check and
  # not `winget validate` is that the Windows Package Manager client is not on the
  # runner images. images/windows/Windows2025-VS2026-Readme.md in actions/runner-images
  # lists Chocolatey and does not mention winget anywhere. The schemas are a real check
  # in its place: they carry every required field, pattern and enum the client enforces.
  #
  # Its own job rather than a step on the nuspec job above, so that the two Windows
  # packaging formats can be landed and reverted independently of each other.
  #
  # No `needs: build` and no artifact download. The manifests describe the MSIX, not the
  # wheel, so there is nothing in the build job's output for this to open; the version
  # they declare is cross-checked against pyproject.toml instead.
  #
  # validate-manifests.py corrupts one field per manifest and requires each broken copy
  # to be rejected before it validates the real ones, and requires the rejection message
  # to name the field that was corrupted. Both halves are load-bearing. A JSON Schema
  # check whose schema fetch returned an error page can exit 0, and a rejection caused by
  # an unrelated error proves nothing about the constraint the control was written for.
  winget:
    name: "schema: winget manifests (published JSON Schemas)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # No --no-project and no `uv sync`. The script carries PEP 723 inline metadata
      # naming the packages it needs, which uv reads and resolves into an ephemeral
      # environment, so the project is never synced. Measured at 0.7 seconds warm,
      # against roughly a minute for a project sync.
      - name: Validate the winget manifests against Microsoft's published JSON Schemas
        run: uv run packaging/winget/validate-manifests.py
