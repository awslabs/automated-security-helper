name: "ASH SARIF Upload"
#  Uploads the ash.ghas.sarif report from a run-ash-security-scan.yml job in the
#  same workflow run to GitHub Advanced Security code scanning.
#
#  WHY THIS IS A SEPARATE WORKFLOW
#
#  A called workflow can only narrow the token its caller grants, never widen it,
#  and run-ash-security-scan.yml declares contents, checks and pull-requests only.
#  So its own "Upload ASH SARIF file" step never holds `security-events: write`,
#  whatever the caller grants. Code scanning accepts an upload without it only
#  from a pull_request run, a fork's included ("code scanning always allows the
#  uploading of results when the `pull_request` event triggers the action run",
#  https://docs.github.com/en/code-security/code-scanning/troubleshooting-code-scanning/resource-not-accessible-by-integration);
#  on push, workflow_dispatch and the other events it fails with "Resource not
#  accessible by integration", so that workflow skips the step there and prints a
#  notice pointing here.
#
#  Adding the permission to that workflow was measured and rejected. GitHub checks
#  every permission a called workflow declares when the run starts, and that
#  includes a job-level `permissions:` on a job whose `if:` is false, whether the
#  `if:` is a literal or an input. A caller that does not grant the permission
#  fails before any job starts:
#
#    The nested job 'upload' is requesting 'security-events: write', but is only
#    allowed 'security-events: none'.
#
#  That would break every existing caller that never granted it, including
#  callers that pass `collect-sarif-report: false`. Keeping the permission in its
#  own workflow means only callers that call this one have to grant it.
#
#  USAGE
#
#    jobs:
#      ash:
#        uses: ./.github/workflows/run-ash-security-scan.yml
#        permissions:
#          contents: read
#          checks: write
#          pull-requests: write
#        with:
#          collect-sarif-report: false # this workflow uploads instead
#      sarif:
#        needs: ash
#        # A scan that fails on findings still wrote its report, so upload on
#        # failure too: `!cancelled()` replaces the success() GitHub adds to an
#        # `if:` that calls no status function. Not when the run was cancelled, or
#        # when the scan job uploaded no ash_output (it was skipped, or failed
#        # before ASH wrote its reports).
#        if: ${{ !cancelled() && needs.ash.outputs.artifact-id != '' }}
#        uses: ./.github/workflows/upload-ash-sarif.yml
#        permissions:
#          contents: read
#          security-events: write
#        with:
#          artifact-id: ${{ needs.ash.outputs.artifact-id }}
#
#  The report is read from the artifact the scan job uploads (`ash_output`, or the
#  artifact-name both jobs are given), so the scan job must have run with the
#  default output layout in the same workflow run.
#
#  `artifact-id` is optional. With it, the download is by the ID the scan job
#  handed out, which names exactly the artifact that job uploaded, in whichever
#  attempt it ran. Without it, the download is by artifact-name, `ash_output` by
#  default; that also works after "Re-run
#  failed jobs", because a re-run scan job replaces the artifact rather than adding
#  a second one.
permissions:
  contents: read # Required for the checkout that upload-sarif reads commit details from
  security-events: write # Required to upload SARIF results to code scanning
on:
  workflow_call:
    inputs:
      artifact-id:
        description: >-
          ID of the scan artifact to upload the report from: the artifact-id
          output of run-ash-security-scan.yml, which is actions/upload-artifact's
          artifact-id. Must be a number. Empty (the default) downloads the
          artifact named by artifact-name instead.
        required: false
        default: ""
        type: string
      artifact-name:
        description: >-
          Name of the artifact to download when artifact-id is empty: the
          artifact-name the scan was called with. A matrix of scans gives each
          leg its own name and passes it here. Defaults to ash_output.
        required: false
        default: "ash_output"
        type: string

jobs:
  upload-sarif:
    name: Upload SARIF to code scanning
    # Not on merge_group: that run is on the merge queue's temporary
    # gh-readonly-queue branch, which GitHub deletes when the entry leaves the
    # queue, so results uploaded for it describe a ref nobody can look at; the
    # pull request's own run uploads the same report. Every other event uploads
    # here, unlike the scan workflow's own step, which runs on pull_request only.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # download-artifact reads an empty artifact-ids as no filter and downloads
      # every artifact of the run, and parses "12abc" as 12, so the ID is held to a
      # number first. It is read from env, never expanded into the script, and the
      # message does not print the value it refused.
      - name: Check the artifact ID
        if: inputs.artifact-id != ''
        shell: bash
        env:
          ARTIFACT_ID: ${{ inputs.artifact-id }}
        run: |
          if [[ ! "${ARTIFACT_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::artifact-id is not an artifact ID (a number). Pass the artifact-id output of run-ash-security-scan.yml, or leave the input empty to download the artifact named by artifact-name."
            exit 1
          fi
          echo "scan artifact ID: ${ARTIFACT_ID}"

      # One artifact by ID is extracted into `path` itself, the same as one by
      # name, so the report sits at the same place either way.
      - name: Download ASH output artifact by ID
        if: inputs.artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact-id }}
          path: ${{ runner.temp }}/ash_output

      - name: Download ASH output artifact
        if: inputs.artifact-id == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/ash_output

      - name: Upload ASH SARIF file
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/ash_output/reports/ash.ghas.sarif
          wait-for-processing: true
          category: ash
