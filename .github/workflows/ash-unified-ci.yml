name: ASH - Unified CI

on:
  # WHY main CARRIES A PUSH TRIGGER, AND WHY THE FILTER IS `[main]`
  #
  # This filter has been wrong in two different directions, so both are recorded.
  #
  # It was `["!main"]`, which reads as "every branch except main" and is not what
  # GitHub does with it. A branch filter built only from negative patterns matches
  # nothing, so the trigger fired on no branch at all -- not on main, and not on the
  # branches the "!" was meant to keep. Measured over this workflow's whole run
  # history: 1 push run against 869 pull_request and 217 merge_group runs, and
  # ash-iac-drift.yml had none. So it was dead config rather than an exemption.
  #
  # It was then removed entirely, on the argument that merge_group already gates the
  # tree that becomes main. That argument is sound for anything that reaches main
  # through the queue, and it is why this trigger is `[main]` and not `["**"]`:
  # pull_request already reports on every branch that has an open pull request, so a
  # wider filter would duplicate those runs and cover nothing new.
  #
  # What it does not cover is the merge that skips the queue. The active "Protect
  # main" ruleset requires the queue (SQUASH, grouping ALLGREEN, up to 10 entries per
  # merge) and names `required-checks` -- this workflow's gate job -- as a required
  # status check, but it also grants one repository role an always-on bypass. A merge
  # taken under that bypass lands on main having run no lint, no unit tests and no
  # scan validation, and the queue cannot report on a tree it never built. That is
  # measured, not hypothetical: pull request 565 merged with no merge_group run of any
  # workflow, and the runs against its commit on main were the docs deploy and the
  # default code-scanning run, nothing else.
  #
  # WHAT THIS COSTS, AND WHAT WAS REJECTED
  #
  # Sized off a count rather than a guess: this workflow expands to 91 jobs and
  # ash-iac-drift.yml to 6, so a queued merge that also pushes to main is ~194 runner
  # jobs instead of ~97. The duplicate verdict on a queued merge is the price of
  # covering the bypassed one, and it was accepted deliberately. It used to be ~350
  # against ~175, before install-validation's five cheap install methods stopped being
  # 105 separate legs, which nearly halves what this deliberate duplication costs.
  # The 91 is derived from a census rather than being one -- see the note on the
  # required-checks job for which link in that chain was actually measured.
  #
  # Both counts are job counts, from
  # `gh api .../actions/runs/<run>/jobs --paginate --jq '.jobs[].name' | wc -l`
  # reconciled against the same endpoint's `total_count`. They are not check-run
  # counts, which are higher -- see the note on the required-checks job for why the
  # two populations differ and why conflating them is what let the old figures rot.
  #
  # The cheaper alternative -- leave both files queue-only and add one small scheduled
  # workflow to check main periodically -- was rejected because a schedule reports on
  # whatever main happens to be at fire time, so it cannot attribute a break to the
  # commit that caused it, and a bypassed merge can be superseded before the next fire.
  #
  # A push trigger reports after the fact rather than blocking, which is all it can do
  # for a merge that bypassed the gate. Reporting is the point: the gap this closes is
  # a main commit about which CI says nothing at all.
  push:
    # `[main]` is a positive filter and matches. See the "!main" note above for what
    # happens when a filter has only negative patterns.
    branches:
      - main
  pull_request:
    # "**" not "*": GitHub branch filters treat "*" as matching any character
    # except "/", so a PR whose BASE is a nested branch (a stacked PR targeting
    # e.g. pr/scan-decomposition) never matched and silently got no CI at all.
    # "**" matches nested refs too.
    branches:
      - "**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

env:
  COLUMNS: 160

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  #
  # On push, github.ref is refs/heads/main for every commit, so ref alone would put
  # every main push in one shared group -- and that is the bug the sha suffix exists to
  # prevent. GitHub allows one pending run per group, and cancel-in-progress is false
  # for push (see below), so a third run queuing into an occupied group evicts the
  # second before it starts a single job, and on a push there is no pull request for
  # the missing verdict to block. Measured in this repository before this trigger was
  # added: run 34418283475 (event push, branch main) was cancelled with zero jobs ever
  # started, one second after the following main push queued into the same group, and
  # run 33515520652 is a second instance. Both were the docs deploy, where superseding
  # an intermediate run is harmless because the newest publish wins. For a gate it
  # would mean a main commit that reports nothing, which is what this workflow exists
  # to prevent.
  #
  # The suffix is empty for every event except push, so pull_request and merge_group
  # keep the grouping described above unchanged. Appending rather than replacing keeps
  # github.ref in the key, so the same commit pushed to two refs still gets two groups.
  # This is the form ash-typescript-ci.yml already uses for its own push trigger.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  # Only pull_request runs may be cancelled. A merge_group run must finish or the
  # queue loses its verdict, a push to main is the verdict on a commit already on main,
  # and a workflow_dispatch run was asked for by a person.
  #
  # Deliberately not extended to push: with the per-commit group above, a main push has
  # no sibling to supersede, and cancelling one would discard the only report that
  # commit will ever get.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Unit tests: all OS x all Python versions (matches ash-repo-unit-tests.yml)
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          # Restore everywhere, save only from main. This setup-uv major defaults
          # prune-cache to false, so the entry is the full wheel set (~254 MB on
          # x86_64), and a pull request saves it under its own ref, where no other
          # pull request can read it. On 2026-10-06 that one key family was 43
          # entries and 3.62 GB, one copy per open pull request, which put the
          # repository at 10.84 GB against its 10 GB quota and evicting. A pull
          # request falls back to its base branch's entry, so saving from main is
          # what every pull request already reads; the per-PR copies only served
          # a second push to the same pull request.
          save-cache: ${{ github.event_name == 'push' }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ASH
        run: uv pip install --system -e .
      - name: Regenerate JSON schemas
        run: python -m automated_security_helper.schemas.generate_schemas
      - name: Check schemas are up to date
        run: |
          # git diff compares the index to the worktree, so it cannot see a file
          # git has never heard of. Generating a schema for a newly registered
          # model produces an untracked .json, which a diff-based check reports
          # as clean -- so the schema would silently never be committed.
          # git status --porcelain reports untracked files too. The pathspec is
          # quoted so git does the matching rather than the shell, which is what
          # lets it match files that do not exist in the index yet.
          changed="$(git status --porcelain -- 'automated_security_helper/schemas/*.json')"
          if [ -n "$changed" ]; then
            echo "::error::JSON schemas are out of date. Run 'python -m automated_security_helper.schemas.generate_schemas' and commit the result."
            echo "$changed"
            git diff -- 'automated_security_helper/schemas/*.json'
            exit 1
          fi
      - name: Verify documentation freshness
        run: uv run python scripts/verify_docs_freshness.py

      # Attached to `lint` rather than given its own job, deliberately. A new job
      # here has to be added to required-checks' `needs` AND have
      # EXPECTED_UPSTREAM_JOBS bumped to match, and forgetting the second half
      # leaves a gate that reports success over a shrinking share of the suite.
      # `lint` is already in that `needs`, carries no job-level `if:`, and this
      # workflow puts no `paths` filter on pull_request -- so the check reports on
      # every pull request and every merge_group entry without touching the count.
      # It also already has the uv environment this script's yaml import needs,
      # which is the same environment verify_docs_freshness.py above relies on.
      #
      # --self-test runs FIRST and is not decoration. The census is a scanner, and
      # the failure mode of a scanner is matching nothing and exiting 0, which
      # reads as evidence of a clean tree. The self-test drives synthetic
      # fixtures through the same detector and comparator and asserts each one
      # still comes back red, so a detector that has degenerated into
      # always-passing fails here instead of at the next incident.
      - name: Assert no unallowlisted artifact upload or cache
        # `set -e` explicitly rather than leaning on the runner's default shell
        # flags: without it a failing self-test would be followed by the census
        # anyway, and the step's verdict would come from whichever ran last.
        run: |
          set -euo pipefail
          uv run python .github/scripts/assert-publish-surfaces.py --self-test
          uv run python .github/scripts/assert-publish-surfaces.py

      # Same placement and the same self-test-first shape as the step above, for the same
      # reasons. This one checks that every cached scanner content database is declared in
      # automated_security_helper/utils/content_databases.py and keyed on the time bucket
      # that module derives from the bound the scanner enforces.
      - name: Assert every cached content database is time-bounded by the registry
        run: |
          set -euo pipefail
          uv run python .github/scripts/assert-content-db-caches.py --self-test
          uv run python .github/scripts/assert-content-db-caches.py

      # ---------------------------------------------------------------------
      # LINT AND TYPE GATES
      #
      # These steps are why this job's name stopped being a lie. Before them, `lint`
      # installed Python, installed ASH, and ran no linter: the repository has had a
      # ruff pre-commit hook and a full [tool.mypy] section with the pydantic plugin
      # enabled for a long time, and nothing in CI ever executed either. Config
      # presence and gate enforcement are separate facts, and this job had only the
      # first -- which is exactly how a lint hook nobody ran could drift five minor
      # versions behind the ruff the project declares without anyone noticing.
      #
      # Steps rather than a new job, deliberately. The required-checks job below
      # asserts len(needs) == EXPECTED_UPSTREAM_JOBS, so a new job has to be added in
      # two places and the constant bumped or the merge-queue gate goes red. Steps
      # inside `lint` are covered by that gate the moment they land, with no constant
      # to keep in sync. Cost is small: measured cold, ruff under 1s, ty 1s, mypy 14s
      # without the cdk extra and about 75s on a runner with it (the mypy step below
      # explains why it is installed), all inside this job's existing 15-minute budget.
      #
      # WHY `uv run --group dev` AND NOT A BARE `ruff`
      #
      # `--group dev` is load-bearing, not decoration. `uv run ruff` WITHOUT it falls
      # back to whatever ruff is on PATH: measured locally, that ran ruff 0.16.3 while
      # the project's own is 0.16.7, silently reproducing the
      # hook-disagrees-with-gate defect one layer down. With the flag uv syncs the dev
      # group from the committed uv.lock and the binary comes from .venv, so the
      # version enforced is the version committed. Each step prints its tool version
      # for the same reason: a failure log that does not say which ruff ran cannot be
      # reproduced locally.
      #
      # No --select, --ignore or per-file scoping is passed here. Those decisions live
      # in pyproject.toml so the hook and this gate read one source; a flag here would
      # be a second, invisible one.
      #
      # mypy in particular cannot reuse the `uv pip install --system -e .` environment
      # above, because [tool.mypy] enables the pydantic.mypy plugin and the plugin has
      # to be importable by the mypy process itself. Stock mypy misreads pydantic
      # model constructors badly enough to be useless on this codebase: 1,330 spurious
      # call-arg errors without the plugin against 78 with it.
      #
      # WHY NOT `pre-commit run --all-files`
      #
      # The hooks already exist, so reusing them would mean less duplication. It is
      # still wrong here. The ruff hook carries `args: [--fix]` and pretty-format-json
      # carries `--autofix`, so the run MUTATES: measured on this tree, one
      # `pre-commit run --all-files` rewrote 569 files (+23,283/-21,679) and exited 1,
      # having reported its verdict over its own edits. It would also give zero type
      # coverage, because mypy is not a hook, and it silently skips the commitizen
      # hook entirely because that one is commit-msg staged. pre-commit stays the
      # local convenience where --fix is a feature; CI runs the tools directly in
      # check-only mode so a violation fails instead of being repaired.
      # ---------------------------------------------------------------------
      - name: ruff check
        run: |
          uv run --group dev ruff --version
          uv run --group dev ruff check .

      - name: ruff format --check
        run: |
          uv run --group dev ruff --version
          uv run --group dev ruff format --check .

      # `--extra cdk` installs aws-cdk-lib and cdk-nag so mypy can resolve their
      # types. Without them every aws_cdk / cdk_nag name in utils/cdk_nag_wrapper.py
      # is Any (its override disables import-not-found), and the gate passes over
      # that module without checking any of its cdk calls: an outdir: Path | None
      # reassigned to a str there was invisible here and caught only locally.
      - name: mypy
        run: |
          uv run --group dev --extra cdk mypy --version
          uv run --group dev --extra cdk mypy automated_security_helper/

      # INFORMATIONAL ONLY. THIS STEP CANNOT BLOCK A MERGE, AND THAT IS ON PURPOSE.
      #
      # ty is Astral's type checker: 4-5x faster than mypy here, with native pydantic
      # support rather than a plugin, and its findings on this tree look substantive
      # -- 312 of its 756 unresolved-attribute diagnostics are "attribute not defined
      # on None in union X | None", the same unguarded-Optional defect class as mypy's
      # union-attr.
      #
      # It does not gate, and its version is pinned exactly, for a reason that is ty's
      # own: "ty does not yet have a stable API; breaking changes, including changes to
      # diagnostics, may occur between any two versions."
      # (https://github.com/astral-sh/ty). At 0.0.x that makes a merge-blocking gate
      # one that can go red on an unrelated bump, so `continue-on-error: true` is what
      # keeps a 0.0.x diagnostic change out of the merge queue. Worth re-evaluating as
      # a real gate once ty reaches a stable release; until then the value is the
      # signal in the log, not a verdict.
      #
      # The step name says informational so nobody reads this job's green tick as ty
      # having passed -- it exits 1 today. It runs through the project environment,
      # not standalone, so ty resolves first- and third-party imports the way mypy
      # does; standalone it cannot see pydantic and the diagnostics change meaning.
      - name: "ty (informational only -- does not gate)"
        continue-on-error: true
        run: |
          uv run --group dev --with 'ty==0.0.84' ty --version
          uv run --group dev --with 'ty==0.0.84' ty check automated_security_helper/

  # A changed snapshot or other golden file must arrive in a commit whose
  # `Snapshot-Update:` trailer says why the output changed; see DEVELOPMENT.md
  # "Snapshot tests" and the docstring of the script below.
  #
  # Its own job rather than a `lint` step because it needs the full history and
  # `lint` does not: `fetch-depth: 0` is what puts both ends of the event's range, and
  # every commit between them, in the clone. It is in required-checks' `needs` like
  # every other job, and it has no job-level `if:` -- the census refuses a skipped
  # result, and every event this workflow runs on has a defined range (the script
  # documents how each one is chosen, including workflow_dispatch).
  #
  # Python on the runner image is enough: the script is stdlib only and calls git, so
  # there is no setup-python or uv step to fail on a registry round trip.
  snapshot-trailers:
    name: snapshot-trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # --self-test runs FIRST, for the reason given on the publish-surfaces step in
      # `lint`: a checker that has degenerated into finding nothing exits 0 and reads
      # as a clean tree. `set -e` so a failing self-test stops the step.
      - name: Assert every golden-file change carries a Snapshot-Update trailer
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-snapshot-trailers.py --self-test
          python3 .github/scripts/check-snapshot-trailers.py
      # syrupy fails the session for a snapshot its collected module no longer asserts,
      # but a snapshot whose module was deleted or renamed is never opened, so it
      # cannot be reported there. This maps each one back to its module.
      - name: Assert every snapshot belongs to an existing test module
        shell: bash
        run: python3 .github/scripts/check-snapshot-trailers.py --orphans

  unit-test:
    name: "unit-test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # No exclusions. macos-14 was excluded from 3.10 and 3.11 on the stated
        # grounds that arm64 macOS "only has 3.12 and 3.13". That is not true, and
        # this job disproves it itself: macos-latest resolves to an arm64 image
        # (macos-26-arm64), and its 3.10 leg installs CPython 3.10.11 from
        # actions/python-versions as python-3.10.11-darwin-arm64.tar.gz, then runs
        # the whole suite green. macos-14 is the same architecture -- macos-14-arm64
        # -- and install-validation already sets up 3.10 and 3.11 on it. So the two
        # cells were excluded for a reason that never applied.
        #
        # What removing this did NOT establish: these two cells had never executed
        # the test suite before, on macOS 14 specifically. The architecture and the
        # interpreters are proven; a Sonoma-only failure was not ruled out in
        # advance.
        #
        # 3.14 needs no exclusion either, and that is measured rather than argued:
        # `unit-test (macos-14, py3.14)` ran green in run 35350532714, alongside
        # macos-latest, ubuntu-latest, ubuntu-24.04-arm and windows-latest. The
        # actions/python-versions manifest carries a darwin/arm64 build for 3.14.7,
        # the newest stable 3.14, which is what makes that resolvable.
        # WHERE THE ARCH LABEL WENT
        #
        # There used to be a five-row `include:` here mapping each `os` to an `arch` label, for
        # artifact and check-run naming. The comment on it was candid that the labels were
        # hand-written rather than read from the runner, "so they can disagree with the machine --
        # and macos-latest did": that label is an alias, GitHub moved it to Apple silicon, and the
        # table said x86_64 while the runner logged `Image: macos-26-arm64`.
        #
        # That table was not merely cosmetic. .github/actions/run-unit-tests/action.yml selects
        # the single leg that renders the coverage summary, and it selected it by comparing the
        # arch LABEL, so a mislabelled Linux row would silently have dropped the step from every
        # leg -- nothing renders it and nothing says so.
        #
        # The table is gone and run-unit-tests derives the label from `runner.arch` instead, so
        # the name on an artifact is a statement the runner made about itself. Removing the
        # include changes no leg count: every entry matched an existing `os` axis value and only
        # added a key, so the matrix was 25 cells with it and is 25 cells without it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: ${{ matrix.python-version }}
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}

  # ---------------------------------------------------------------------------
  # Scan validation: method x platform (matches ash-repo-scan-validation.yml)
  # Uses Python 3.12 exclusively.
  # ---------------------------------------------------------------------------
  scan-validation:
    name: "scan (${{ matrix.method }}, ${{ matrix.os }})${{ matrix.oci-runner && matrix.oci-runner != 'docker' && format(' [{0}]', matrix.oci-runner) || '' }}${{ matrix.offline && ' [offline]' || '' }}${{ matrix.config-file == 'community' && ' - Community Plugins' || '' }}"
    runs-on: ${{ matrix.os }}
    # Container-runtime cells are far slower than docker/python-local and were
    # being cancelled at exactly 20.3 min by the previous flat 20. Measured:
    # docker/python-local peak ~5 min, podman/finch on ubuntu-latest reach 20+.
    timeout-minutes: ${{ (matrix.oci-runner == 'podman' || matrix.oci-runner == 'finch') && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        # WHY THERE IS NO `platform` KEY HERE ANY MORE
        #
        # Every row used to carry one -- `platform: linux/amd64` and so on -- and it was a pure
        # function of `os`: the mapping was total and single-valued, so 24 rows restated four
        # facts. The only consumer was five log lines in .github/actions/run-scan-test/action.yml
        # ("Testing ASH using ... on <os> (<platform>)"), so a wrong value produced a log that
        # lied while the leg stayed green.
        #
        # It was already wrong. `macos-latest` is an alias and GitHub moved it to Apple silicon:
        # the runner logs `Image: macos-26-arm64` and setup-python fetches
        # python-3.10.11-darwin-arm64.tar.gz on it, which is why the `unit-test` job above
        # relabelled it arm64. These rows still said `darwin/amd64`. The same os-to-architecture
        # fact was spelled twice in two vocabularies and the two had come to disagree.
        #
        # The fix is to stop spelling it here. GitHub Actions cannot compute one matrix key from
        # another -- `include:` entries are literals and no expression context holds a sibling
        # key -- so deriving it in YAML is not expressible. run-scan-test derives it instead from
        # `runner.os` and `runner.arch`, which the runner reports about itself, so the log cannot
        # disagree with the machine that printed it. That also fixes the vocabulary: the derived
        # ARM value is `linux/arm64`, which is what an OCI platform string actually looks like,
        # rather than the `linux/aarch64` that was written here.
        #
        # WHY THE python-local ROWS NO LONGER SAY `oci-runner: ""`
        #
        # Same shape, one dimension smaller: `oci-runner` was `""` on exactly the `python-local`
        # rows and non-empty on every other row, so it too was a pure function of `method`. An
        # absent key and an empty-string key render identically in every expression that reads it
        # here -- the job name, the `timeout-minutes` conditional, the `OCI_RUNNER` env and the
        # action input -- so dropping it changes no behaviour and removes the chance of a
        # python-local row acquiring a runner, or a container row losing one, without anything
        # noticing. tests/unit/test_ci_matrix_agreement.py asserts the invariant in both
        # directions.
        include:
          # Linux x86 -- Docker
          - { os: ubuntu-latest, method: bash, config-file: default, oci-runner: docker }
          - { os: ubuntu-latest, method: powershell, config-file: default, oci-runner: docker }
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: docker }
          - { os: ubuntu-latest, method: python-local, config-file: default }
          # Linux x86 -- Podman
          - { os: ubuntu-latest, method: bash, config-file: default, oci-runner: podman }
          - { os: ubuntu-latest, method: powershell, config-file: default, oci-runner: podman }
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: podman }
          # Linux x86 -- Finch
          - { os: ubuntu-latest, method: bash, config-file: default, oci-runner: finch }
          - { os: ubuntu-latest, method: powershell, config-file: default, oci-runner: finch }
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: finch }

          # Linux ARM -- Docker
          - { os: ubuntu-24.04-arm, method: bash, config-file: default, oci-runner: docker }
          - { os: ubuntu-24.04-arm, method: powershell, config-file: default, oci-runner: docker }
          - { os: ubuntu-24.04-arm, method: python-container, config-file: default, oci-runner: docker }
          - { os: ubuntu-24.04-arm, method: python-local, config-file: default }
          # Linux ARM -- Podman
          - { os: ubuntu-24.04-arm, method: bash, config-file: default, oci-runner: podman }
          - { os: ubuntu-24.04-arm, method: powershell, config-file: default, oci-runner: podman }
          - { os: ubuntu-24.04-arm, method: python-container, config-file: default, oci-runner: podman }
          # Linux ARM -- Finch (x86_64 only, skip ARM)
          # - { os: ubuntu-24.04-arm, method: python-container, config-file: default, oci-runner: finch }

          # macOS -- python-local only (Docker disabled on hosted macOS)
          - { os: macos-latest, method: python-local, config-file: default }

          # Windows -- python-local only (Docker disabled on hosted Windows)
          - { os: windows-latest, method: python-local, config-file: default }

          # Offline mode -- validates OFFLINE=YES Docker build (grype db + semgrep rulesets cached at build time)
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: docker, offline: true }

          # Community plugins -- python-local on all platforms
          - { os: ubuntu-latest, method: python-local, config-file: community }
          - { os: ubuntu-24.04-arm, method: python-local, config-file: community }
          - { os: macos-latest, method: python-local, config-file: community }
          - { os: windows-latest, method: python-local, config-file: community }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      - name: Install Podman
        if: matrix.oci-runner == 'podman'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends podman
          podman --version
      - name: Install Finch
        if: matrix.oci-runner == 'finch'
        run: sudo bash scripts/setup-finch-linux.sh
      - uses: ./.github/actions/run-scan-test
        env:
          OCI_RUNNER: ${{ matrix.oci-runner }}
          OCI_RUNNER_WRAPPER: ${{ matrix.oci-runner == 'finch' && 'sudo' || '' }}
        with:
          method: ${{ matrix.method }}
          os: ${{ matrix.os }}
          config-file: ${{ matrix.config-file }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          oci-runner: ${{ matrix.oci-runner }}
          offline: ${{ matrix.offline || 'false' }}

  # ---------------------------------------------------------------------------
  # External-target scan: assert on what comes back when ASH scans a directory
  # that is not its own working directory.
  #
  # Scanning an external target already happens in CI -- validate-install (lines
  # 32, 52, 70), validate-mcp (line 48) and ash-upgrade-paths.yml (line 167) all
  # pass --source-dir. So the gap is NOT the flag, and this job is not redundant
  # with them. The gap is that nothing ever checked the result. Those jobs use a
  # clean one-line fixture that yields zero findings even when everything works,
  # and their only assertion is the step's exit status -- which cannot see a
  # broken scanner, because _compute_exit_code returns 1 only when results is
  # None and otherwise just counts actionable findings.
  #
  # Two bugs lived in that gap: a producer/consumer arity break that left every
  # scanner at status ERROR with zero findings, and a checkov config probe that
  # tested the process cwd while checkov's subprocess ran from source_dir.
  # scripts/verify_external_target_scan.py asserts no scanner errored, that the
  # expected findings came back attributed to the scanner that should have
  # produced them, and that they came from the fixture rather than this checkout.
  #
  # Windows is in the matrix deliberately -- this project's path, encoding and
  # console bugs concentrate there. Python 3.12 only: the gate exercises the scan
  # path, which the unit-test matrix already covers across every version.
  # ---------------------------------------------------------------------------
  external-target-scan:
    name: "external-target scan (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Keep in step with DEFAULT_SCAN_TIMEOUT_SECONDS in the script, which must stay
    # below this budget so the script's own diagnostics win the race against a job
    # cancellation. A unit test ties the two numbers together.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      # bandit and checkov would otherwise install themselves through uv on first
      # use, inside the gate. Doing it here, the way run-scan-test does (lines 226
      # and 260), means an install flake fails as a failed install step with its own
      # log rather than surfacing as "none of the scanners this gate asserts on
      # ran". On the Windows runner only bandit and checkov are available at all, so
      # a single failed install is the difference between green and a confusing red.
      - name: Install scanner dependencies
        shell: bash
        run: ash dependencies install
      # One shell for both platforms, so there is one command to reason about.
      # The path is relative, so Git Bash on Windows does not rewrite it.
      # --timeout is passed explicitly so it sits next to timeout-minutes above.
      - name: Verify ASH can scan a target outside the repository
        shell: bash
        # The gate builds its fixture with tempfile.mkdtemp(). Pointing the temp dir
        # at the runner's own scratch space makes the tree's location predictable
        # enough to upload as an artifact below. All three names because tempfile
        # checks TMPDIR first and TEMP/TMP on Windows. This sits on the step rather
        # than the job because the runner context does not exist in job-level env --
        # a workflow using it there is rejected outright, with no jobs and no
        # annotation, which is a slow thing to diagnose.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python scripts/verify_external_target_scan.py --timeout 1200
      # The gate keeps its fixture and scan output on disk when it fails, and its
      # failure messages tell the reader to go and look at them. Upload them so a
      # red run leaves real evidence instead of a pointer into a deleted runner.
      - name: Collect the kept fixture and scan output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-target-scan-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/ash-external-target-*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Multi-project attribution: assert a workspace scan keeps its projects apart.
  #
  # The sibling of external-target-scan, one dimension up. That job proves ASH
  # can scan a directory that is not its working directory and asserts on what
  # came back; this one proves that scanning N projects at once does not mix them.
  # The four regressions it exists for all produce a complete, well-formed results
  # file, so none of them can be caught by an exit status:
  #
  #   - a finding from project A reported against project B
  #   - project A's suppression silencing the same rule at the same relative path
  #     in project B, which is a silent false negative
  #   - both projects judged against one threshold, so one verdict is wrong
  #   - two projects sharing an output directory, the second overwriting the first
  #
  # The fixture puts a byte-identical file in all three projects, which is what
  # makes attribution testable: with three different files, "attributed to A"
  # would be satisfied by matching on the filename. One project is named 'src' on
  # purpose -- container mode mounts the workspace root at /src, so that project
  # is /src/src, the basename-collision shape from #361.
  #
  # Windows is in the matrix deliberately: this project's path, encoding and
  # console bugs concentrate there, and workspace mode adds a whole path space.
  # ---------------------------------------------------------------------------
  multi-project-attribution:
    name: "multi-project attribution (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    # Keep in step with JOB_TIMEOUT_BUDGET_SECONDS in the script, which a unit
    # test ties to this number. DEFAULT_SCAN_TIMEOUT_SECONDS must stay below it so
    # the script's own diagnostics win the race against a job cancellation.
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      # bandit is the only producer this gate asserts on. Installing it here means
      # an install flake fails as a failed install step with its own log, rather
      # than surfacing as "the fixture produced zero findings".
      - name: Install scanner dependencies
        shell: bash
        run: ash dependencies install
      - name: Verify a workspace scan keeps its projects apart
        shell: bash
        # The gate builds its workspace with tempfile.mkdtemp(). Pointing the temp
        # dir at the runner's scratch space makes the tree's location predictable
        # enough to upload below. All three names because tempfile checks TMPDIR
        # first and TEMP/TMP on Windows. This sits on the step rather than the job
        # because the runner context does not exist in job-level env -- a workflow
        # using it there is rejected outright, with no jobs and no annotation.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: python scripts/verify_multi_project_attribution.py --timeout 1200
      - name: Collect the kept workspace and scan output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-project-attribution-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/ash-multi-project-*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Deploy-tree AWS helpers: run them against a real moto endpoint.
  #
  # The boto3 rewrite replaced `aws s3 cp --recursive` and `aws ssm get-parameter`
  # in the CDK buildspecs, because the ASH image those builds run in ships boto3
  # and no AWS CLI. A deployed pipeline had failed all four shards at `aws: not
  # found` AFTER a successful scan, so the scan stage went red and the merge never
  # ran. The CDK tests assert the rendered template contains the right strings,
  # which is what caught that -- but a string can be present and still wrong. A
  # recursive download that reads only the first ListObjectsV2 page, flattens the
  # key hierarchy, or writes outside its destination renders identically.
  #
  # So this job EXECUTES the command strings extracted from the committed
  # deploy/cdk/templates/*.template.json against a moto server, plus the Terraform
  # sibling helper, with every behavior test parametrized across both copies.
  #
  # WHY IT IS ITS OWN JOB WHEN unit-test ALREADY RUNS THESE: moto is a declared dev
  # dependency, so `uv sync && uv run pytest` in the unit-test matrix does run this
  # suite on all five OSes. That is good, and it is not sufficient -- the matrix's
  # check is pytest's exit status, which stays 0 while the suite shrinks. Measured
  # on this suite: marking one class skip, dropping one parametrization, or
  # renaming one module out of the discovery pattern each deletes about a third of
  # the coverage and leaves pytest exiting 0. scripts/verify_moto_server_suite.py
  # asserts on the run instead -- a floor on tests executed, zero skips, both
  # helper copies exercised, both modules present.
  #
  # Linux only, and deliberately: the buildspec commands under test are POSIX shell
  # destined for a Linux CodeBuild container, and the suite skips those on Windows.
  # The gate refuses ANY skip, so running it here is what makes "zero skips"
  # meaningful. Python 3.12 only for the same reason the other gates pin it -- the
  # unit-test matrix already covers this suite across every version.
  # ---------------------------------------------------------------------------
  deploy-aws-helpers:
    name: deploy-tree AWS helpers (moto server)
    runs-on: ubuntu-latest
    # The suite's own slowest test uploads 1050 objects to force a second
    # ListObjectsV2 page; the whole run measures ~30s at 4 workers. 15 leaves room
    # for a slow runner without letting a hang sit for half an hour.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      # The suite needs the dev group, which is where moto[server] lives. The
      # [server] extra is the part that provides ThreadedMotoServer; bare moto
      # only patches botocore in-process and cannot reach the subprocesses these
      # tests run.
      - name: Install dependencies
        run: uv sync
      # No AWS credentials are configured for this job, and the fixture sets fake
      # ones plus AWS_CONFIG_FILE/AWS_SHARED_CREDENTIALS_FILE pointing at paths
      # that do not exist. Both matter: without AWS_ENDPOINT_URL a bare
      # boto3.client("s3") resolves s3.amazonaws.com and really does send the
      # request, so the fake credentials are the backstop and the suite has a test
      # asserting the endpoint variable is what routes it to moto.
      - name: Verify the deploy-tree AWS helpers against a moto server
        run: uv run python scripts/verify_moto_server_suite.py --workers 4
      # The gate writes its own report so a red run leaves per-test evidence
      # rather than only the summary line that failed the step.
      - name: Collect the suite report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: moto-server-suite-report
          path: test-results/moto-server-suite.junit.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Integration suite: the tests that were skipped in every run until now
  # ---------------------------------------------------------------------------
  #
  # WHAT THIS RECOVERS, AND WHY IT IS NOT A COUNT OF FIXES
  #
  # tests/conftest.py skips every item whose keywords contain "integration" unless
  # --run-integration is passed. Nothing passed it except the single cdk-nag step in
  # run-unit-tests, so the whole set was skipped in every run -- and a skipped suite exits 0,
  # which is why nobody noticed. Measured on this tree at -n 0: with the flags off, 115
  # skipped; with them on, 10 failed, 102 passed, 2 skipped, 1 xfailed, reconciling to the
  # same 115.
  #
  # So the honest account is that the gate was hiding far more working coverage than broken
  # coverage. Around 102 of these pass and have been asserting nothing. The failures are the
  # more visible part and much the smaller one, and two tests in
  # tests/integration/test_global_suppressions.py had never passed since the day they were
  # written -- a skip cannot tell you whether a test ever worked.
  #
  # Every figure here is invocation-dependent and commit-dependent, so treat it as a
  # measurement with a date rather than a property of the suite. The same population was 104
  # items with 39 failures before the resource_management and MCP repairs landed on this
  # branch; those deleted a duplicated test file and added MCP coverage, which is why it is
  # now 115 items with 10 failures. Re-measure rather than adjusting these by arithmetic.
  #
  # POPULATIONS THAT RECONCILE, SO NONE OF THEM HAS TO BE TAKEN ON TRUST
  #
  # A census of what un-skips under --run-integration alone will not match the 115 above, and
  # the difference is the two gates below rather than a disagreement:
  #
  #     115   items whose keywords contain "integration"
  #     - 4   of those also carry @pytest.mark.slow, so --run-integration alone leaves them
  #           skipped; this job passes --run-slow as well, which is why it sees them
  #     - 2   unconditional @pytest.mark.skip in test_detect_secrets_scanner.py, which no
  #           flag reaches
  #     = 109 items that actually run under --run-integration by itself
  #
  # Checked the other direction too: this job's own control ran 113 items (10 failed, 102
  # passed, 1 xfailed), and 113 - 4 = 109. The slow-marked items and the unconditionally
  # skipped ones are disjoint sets, verified rather than assumed, so nothing is subtracted
  # twice. Anyone auditing a count here should be able to land on the same three numbers; if
  # two of them disagree, the gate list above is where the missing items went.
  #
  # WHY THESE SELECTORS AND NOT THE OBVIOUS ONES
  #
  # Both flags, not just --run-integration. Four of the 115 also carry @pytest.mark.slow,
  # which conftest gates separately, so --run-integration alone leaves them skipped -- the
  # same silent pass this job exists to remove. --run-slow costs nothing in scope: measured,
  # there are exactly zero slow-marked items that are not also integration-marked.
  #
  # A path, plus one file outside it. The predicate is keywords, not paths, so it reaches
  # outside tests/integration/: tests/unit/cli/mcp/test_source_delivery_scan_e2e.py carries
  # @pytest.mark.integration at the test. A bare `pytest tests/integration` would leave that
  # one permanently skipped.
  #
  # Not `-k integration`. It selects 126 rather than 115, because -k substring-matches node
  # ids as well as keywords and picks up 11 tests that are not gated and already run in
  # unit-test. That 11-test gap has held across both measurements of this suite while the
  # absolute numbers moved, which is the reason to re-derive the real population with a
  # collection pass asking pytest for `"integration" in item.keywords` rather than trusting
  # any selector to mirror it.
  #
  # Its own job rather than a step in run-unit-tests, because these exercise scanner and MCP
  # integration, not Python-version behavior; at 25 unit-test legs a step there buys 25
  # copies of one signal. -n 0 rather than the inherited -n auto because every cdk-nag test
  # boots a real kernel and jsii extraction is billed per booting worker -- see the table in
  # tests/conftest.py.
  #
  # --no-cov because pytest.ini's --cov plus .coveragerc's fail_under=80 would make this job
  # a second coverage gate that fails on a subset at 100% green.
  #
  # Two items stay skipped with both flags on, at
  # tests/integration/scanners/test_detect_secrets_scanner.py:111 and :139. Those are
  # unconditional @pytest.mark.skip with a written reason, and they report as skipped with
  # that reason rather than vanishing.
  integration-test:
    name: integration-test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - name: Install dependencies
        run: uv sync --extra cdk --extra symbols
      # Opt-in scanners are not installed by default anywhere a default scan would
      # notice, so the integration suite installs the ones it runs for real.
      - name: Install opt-in scanner binaries for the integration suite
        run: uv run ash dependencies install --tool actionlint
      # ASH_REQUIRE_CDK_EXTRA turns a missing cdk extra into a hard failure rather than a
      # skip, so this job cannot quietly stop testing the cdk-nag path if the install above
      # changes. ASH_REQUIRE_SYMBOLS_EXTRA does the same for the symbol-suppression scan,
      # and ASH_REQUIRE_ACTIONLINT for the actionlint tests.
      - name: Run the integration suite
        env:
          ASH_REQUIRE_ACTIONLINT: "1"
          ASH_REQUIRE_CDK_EXTRA: "1"
          ASH_REQUIRE_SYMBOLS_EXTRA: "1"
        run: |
          uv run pytest \
            tests/integration \
            tests/unit/cli/mcp/test_source_delivery_scan_e2e.py \
            --run-integration --run-slow \
            --no-cov -p no:randomly -n 0 \
            --junit-xml=test-results/integration.junit.xml
      # A red run leaves per-test evidence rather than only the summary line.
      - name: Collect the suite report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-suite-report
          path: test-results/integration.junit.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Install methods: method x OS x Python (matches ash-install-methods.yml)
  # ---------------------------------------------------------------------------
  #
  # There are two install-validation surfaces and they are NOT redundant, so both
  # have to carry every supported Python version. This one is unconditional --
  # push, pull_request and merge_group -- and it is the one `required-checks`
  # depends on, so it is what actually gates a merge. ash-install-methods.yml is
  # path-filtered to pyproject.toml, hatch_build.py, automated_security_helper/**
  # and a few others, and it adds the `nix` method this job does not carry.
  #
  # Keep the `python-version` axes of the two identical, deliberately: a version
  # added to one and not the other leaves a supported interpreter untested on
  # whichever surface was missed. The two still agree on which (os, python-version)
  # cells pip, pipx, pre-commit and mcp cover, including macos-14 x {3.10, 3.11} --
  # they just no longer agree on the SHAPE. ash-install-methods.yml keeps one leg
  # per method; this job runs those four, plus uvx, as steps inside one `bundle`
  # leg per cell (see the note above the job). So the thing to keep aligned is the
  # cell coverage, not the leg names, and `method: [bundle, ...]` here against
  # `method: [pip, pipx, ...]` there is not a drift to reconcile.
  #
  # `unit-test` above excludes macos-14 x {3.10, 3.11} on the grounds that macOS
  # ARM only has 3.12 and later. THAT REASON IS FALSE, measured two ways:
  #
  # 1. This job runs macos-14 x {3.10, 3.11} for pip, pipx, pre-commit and mcp on
  #    every pull request, and they pass. Sampled runs 35350532730 and
  #    35351617775: 8 of 8 success in each -- 8 legs then, the same 8 method-on-cell
  #    runs inside 2 `bundle` legs now.
  # 2. The actions/python-versions manifest carries darwin/arm64 builds for
  #    3.10.11 and 3.11.9, so setup-python has something to resolve.
  #
  # Deliberately NOT un-excluded here. The evidence proves those versions run on
  # that platform for *installs*; it does not prove the unit-test suite passes
  # there, and no unit-test leg has ever executed on macos-14 below 3.12, so
  # dropping the exclusion would run them for the first time inside an unrelated
  # change. Un-excluding is its own change, with its own verdict to read.
  #
  # WHY `bundle` IS ONE LEG AND NOT FIVE
  #
  # pip, pipx, uvx, pre-commit and mcp used to be five values on the `method` axis,
  # which made them 105 of this job's 113 legs. They are not 105 legs' worth of
  # work: `validate-install` averages 21 seconds per invocation over 113 of them
  # and `validate-mcp` 14 seconds. The cost was never the work, it was the leg
  # count -- run 36089835349 spent 32.7 minutes of wall clock and 391.2 minutes of
  # machine time behind 1178.2 minutes of queue, because every one of its 196 jobs
  # waited about 6.5 minutes for a runner. Queue time was three times the machine
  # time and it is charged per job, so those 105 legs held runners for 82 minutes
  # of machine time (pip 22.9, pipx 20.3, mcp 30.2, pre-commit 5.9, uvx 3.0) after
  # roughly 10.5 hours of queue, summed across the legs.
  #
  # So those five collapse into one `bundle` leg per (os, python-version), running
  # each method as its own step. 113 legs -> 33, which is 80 fewer runners queued
  # for and the same five methods still executed on all 25 cells. Nothing is
  # cached and nothing is uploaded to get there, deliberately: on a public
  # repository GitHub's caching and artifact-upload actions are both readable by
  # anyone holding a read token, so nothing this repo builds may be put in either,
  # and no image or wheel may be pushed anywhere. The saving is purely fewer queue
  # waits. Do not "improve" it by adding a cache. The caching this workflow already
  # has is setup-uv's `enable-cache` -- in the lint job and in
  # .github/actions/setup-ash -- and it holds third-party wheels that are public
  # already, which is why it is allowed to stay and why it must not be widened to
  # cover anything ASH builds.
  #
  # TWO THINGS THE COLLAPSE HAD TO PRESERVE, both easy to lose silently:
  #
  # 1. Per-method verdicts. Five methods in one job would ordinarily stop at the
  #    first failure, so a pip break would hide whether pipx also broke -- and a
  #    red `bundle` leg that names one method out of five is worse to debug than
  #    five red legs. Each method therefore carries `continue-on-error: true` and
  #    an `id`, and the `bundle: verdict` step below reads every recorded outcome,
  #    prints all five, and fails naming each one that did not match what it was
  #    supposed to report. That step is the leg's verdict; the per-method steps
  #    deliberately do not decide it.
  #
  # 2. Which install each method's `ash` actually is. Five methods in one job share
  #    a PATH, and pip and pipx both put an `ash` on it. The step order below is
  #    load-bearing for that reason: pipx runs FIRST, while its shim is the only
  #    `ash` on the machine, so `pipx: verify` cannot be answered by pip's copy.
  #    pip runs second, and setup-python writes its own bin directory to
  #    GITHUB_PATH, which prepends ahead of the image's default PATH -- so pip's
  #    entry point wins the lookup for every later step. Reordering these two
  #    turns one of them into a duplicate of the other while staying green.
  install-validation:
    name: "${{ matrix.method }} (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    # finch has been observed succeeding at 23 min and hanging past 280; podman is
    # similarly slow, so the container runtimes get enough room to pass
    # legitimately. homebrew is `ruby -c` on one file and keeps the tight 20.
    #
    # `bundle` gets 30. The old 20 bounded a single install method, on the measured
    # grounds that each peaks under 3 min; one leg now runs five of them back to
    # back, so the same headroom needs a bigger number. 30 is still a real bound --
    # a hung pipx build or npm install gets cut rather than burning the job's hour.
    timeout-minutes: ${{ ((matrix.method == 'podman' || matrix.method == 'finch' || matrix.method == 'nerdctl') && 45) || (matrix.method == 'bundle' && 30) || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-14, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # `bundle` is pip + pipx + uvx + pre-commit + mcp, as steps. homebrew and
        # the three container runtimes stay their own legs: they are already
        # trimmed to a single Python version and carry OS-specific excludes, so
        # they are 8 legs in total and none of them is the redundancy.
        method: [bundle, homebrew, podman, finch, nerdctl]
        exclude:
          # Homebrew not on Windows
          - { os: windows-latest, method: homebrew }
          # Podman/Finch/nerdctl not on Windows
          - { os: windows-latest, method: podman }
          - { os: windows-latest, method: finch }
          - { os: windows-latest, method: nerdctl }
          # Finch Linux is x86_64 only
          - { os: ubuntu-24.04-arm, method: finch }
          # nerdctl: x86_64 only for now. An arm64 bundle exists upstream, but
          # scripts/setup-nerdctl-linux.sh verifies a pinned checksum and only the amd64
          # one has been confirmed against the artifact; the script fails rather than
          # downloading unverified bytes for another architecture.
          - { os: ubuntu-24.04-arm, method: nerdctl }
          # nerdctl on macOS needs a Linux VM, and hosted macOS has no nested
          # virtualization -- same reason as podman and finch below.
          - { os: macos-latest, method: nerdctl }
          - { os: macos-14, method: nerdctl }
          # nerdctl only needs Python 3.12
          - { os: ubuntu-latest, python-version: "3.10", method: nerdctl }
          - { os: ubuntu-latest, python-version: "3.11", method: nerdctl }
          - { os: ubuntu-latest, python-version: "3.13", method: nerdctl }
          - { os: ubuntu-latest, python-version: "3.14", method: nerdctl }

          # Container runtimes only need Python 3.12
          - { os: ubuntu-latest, python-version: "3.10", method: podman }
          - { os: ubuntu-latest, python-version: "3.11", method: podman }
          - { os: ubuntu-latest, python-version: "3.13", method: podman }
          - { os: ubuntu-latest, python-version: "3.14", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.10", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.11", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.13", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.14", method: podman }
          # Podman/Finch not on macOS (no nested virtualization on hosted runners)
          - { os: macos-latest, method: podman }
          - { os: macos-14, method: podman }
          - { os: ubuntu-latest, python-version: "3.10", method: finch }
          - { os: ubuntu-latest, python-version: "3.11", method: finch }
          - { os: ubuntu-latest, python-version: "3.13", method: finch }
          - { os: ubuntu-latest, python-version: "3.14", method: finch }
          - { os: macos-latest, method: finch }
          - { os: macos-14, method: finch }

          # Homebrew only needs Python 3.12
          - { os: ubuntu-latest, python-version: "3.10", method: homebrew }
          - { os: ubuntu-latest, python-version: "3.11", method: homebrew }
          - { os: ubuntu-latest, python-version: "3.13", method: homebrew }
          - { os: ubuntu-latest, python-version: "3.14", method: homebrew }
          - { os: ubuntu-24.04-arm, python-version: "3.10", method: homebrew }
          - { os: ubuntu-24.04-arm, python-version: "3.11", method: homebrew }
          - { os: ubuntu-24.04-arm, python-version: "3.13", method: homebrew }
          - { os: ubuntu-24.04-arm, python-version: "3.14", method: homebrew }
          - { os: macos-latest, python-version: "3.10", method: homebrew }
          - { os: macos-latest, python-version: "3.11", method: homebrew }
          - { os: macos-latest, python-version: "3.13", method: homebrew }
          - { os: macos-latest, python-version: "3.14", method: homebrew }
          - { os: macos-14, python-version: "3.10", method: homebrew }
          - { os: macos-14, python-version: "3.11", method: homebrew }
          - { os: macos-14, python-version: "3.13", method: homebrew }
          - { os: macos-14, python-version: "3.14", method: homebrew }

          # uvx used to need 20 exclude entries of its own to stay at 3.12, because
          # it bundles its own interpreter and so does identical work on every
          # python-version cell. It is now a step inside `bundle` carrying the same
          # 3.12-only condition, so the exclusions are expressed once, at the step,
          # instead of 20 times here. The `bundle` value itself is excluded nowhere:
          # pip, pipx, pre-commit and mcp all ran on all 25 cells before this and
          # all 25 after.
    steps:
      # FAIL CLOSED BEFORE ANY OF THE ROUTING CONDITIONS BELOW
      #
      # The three `uses:` steps at the end of this job are mutually exclusive `if:`s with no
      # else. A method that satisfies none of them -- a new entry on the `method` axis, or one
      # renamed on the axis and not in the conditions -- runs checkout and setup-python, does no
      # validation at all, and exits 0. `required-checks` then counts that leg as a success, so
      # the method reads as validated on every pull request while nothing has ever installed it.
      #
      # This is the same guard .github/actions/validate-container/action.yml carries for its
      # `runtime` input ("Assert this runtime has a scan leg"), for the same reason: a routing
      # table with no default arm is a silent no-op, and a silent no-op inside a gate is worse
      # than a missing leg because it reports the opposite of the truth.
      #
      # It runs first so the leg dies before spending a checkout on work it will not do.
      # tests/unit/test_ci_matrix_agreement.py reconciles the arms below against the routing
      # conditions AND against the `method` axis, so none of the three can drift from the other
      # two without a unit-test failure.
      - name: "Assert this install method is routed to a validator"
        shell: bash
        env:
          METHOD: ${{ matrix.method }}
        run: |
          # The arms are the `method` axis above, and nothing else. They were
          # `pip | pipx | uvx | homebrew | pre-commit`, `podman | finch | nerdctl` and
          # `mcp`, which was the axis before those five cheap methods became steps
          # inside a single `bundle` leg. After that change the list named five values
          # that can no longer occur while omitting the one that does, so every bundle
          # leg -- 25 of the job's 33 -- fell through to the `*)` below and exited 1.
          # Measured by extracting this shell and running it with METHOD=bundle.
          #
          # The five folded methods are NOT listed here. They are steps, and the steps
          # carry their own `if: matrix.method == 'bundle'`; naming them would make this
          # guard accept values the matrix cannot produce, which is the direction that
          # hides a problem rather than causing one.
          case "${METHOD}" in
            bundle) ;;
            homebrew) ;;
            podman | finch | nerdctl) ;;
            *)
              echo "::error::install-validation has no validator for method '${METHOD}'. The routing conditions on the steps at the end of this job cover none of it, so this leg would run setup-python and then nothing, and exit 0. Route it to a composite action and add it to the case above."
              exit 1
              ;;
          esac
          echo "${METHOD}: routed to a validator"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every method still on the axis needs an interpreter, so this is no longer
      # conditional. The `matrix.method != 'uvx'` it used to carry existed solely
      # for the uvx leg, and uvx is not a leg any more. It does mean uv now resolves
      # against a Python that setup-python put there rather than whatever the image
      # shipped -- the same uvx install and the same scan, from a slightly
      # friendlier starting state than the old bare leg.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # --- bundle: five install methods, five recorded verdicts, one runner ------
      #
      # `continue-on-error: true` on each is what keeps the later methods running
      # after an earlier one breaks. It makes the step's *conclusion* success while
      # leaving its *outcome* failure, so `success()` still holds for the steps that
      # follow and none of them gets skipped. The outcome is the part that matters
      # and `bundle: verdict` is the only step that acts on it.
      #
      # pipx is deliberately first: see the ordering note above the job.
      - name: pipx
        id: pipx
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: pipx

      - name: pip
        id: pip
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: pip

      - name: mcp
        id: mcp
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-mcp

      - name: pre-commit
        # The id has no hyphen on purpose. `steps.pre-commit.outcome` parses as a
        # subtraction in a GitHub expression, not as a step lookup.
        id: precommit
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: pre-commit

      - name: uvx
        id: uvx
        # 3.12 only, because uvx brings its own interpreter and the other four cells
        # would repeat this run verbatim. This is the same coverage the 20 deleted
        # `method: uvx` excludes bought: five uvx runs, one per OS.
        if: matrix.method == 'bundle' && matrix.python-version == '3.12'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: uvx

      # The leg's actual verdict. Asserting an EXPECTED outcome per method, rather
      # than "nothing said failure", is what stops this from failing open: a step
      # whose `if` someone later breaks reports `skipped`, and a check that waves
      # skipped through would keep printing green over a method that stopped
      # running. Only uvx is allowed to be skipped, only off 3.12, and the
      # expression below says so rather than the shell inferring it.
      - name: "bundle: verdict"
        if: matrix.method == 'bundle'
        shell: bash
        env:
          # method, outcome, required outcome -- one method per line.
          BUNDLE_OUTCOMES: |
            pipx ${{ steps.pipx.outcome }} success
            pip ${{ steps.pip.outcome }} success
            mcp ${{ steps.mcp.outcome }} success
            pre-commit ${{ steps.precommit.outcome }} success
            uvx ${{ steps.uvx.outcome }} ${{ matrix.python-version == '3.12' && 'success' || 'skipped' }}
        run: |
          set -eu
          # No bash arrays: hosted macOS runners are still on bash 3.2, where
          # ${#arr[@]} on an empty array is an unbound-variable error under `set -u`.
          failed=""
          while read -r method outcome required; do
            [ -n "$method" ] || continue
            if [ "$outcome" = "$required" ]; then
              printf '%-12s %s\n' "$method" "$outcome"
            else
              printf '%-12s %s   (required: %s)\n' "$method" "$outcome" "$required"
              failed="$failed $method=$outcome"
            fi
          done <<EOF
          $BUNDLE_OUTCOMES
          EOF
          if [ -n "$failed" ]; then
            echo "::error::install-validation bundle failed:$failed"
            exit 1
          fi
          echo "all five bundled install methods reported their required outcome"

      # --- the legs that stay legs ---------------------------------------------
      - uses: ./.github/actions/validate-install
        if: matrix.method == 'homebrew'
        with:
          method: homebrew

      - uses: ./.github/actions/validate-container
        if: matrix.method == 'podman' || matrix.method == 'finch' || matrix.method == 'nerdctl'
        with:
          runtime: ${{ matrix.method }}

  # ---------------------------------------------------------------------------
  # One check name that can actually be required
  # ---------------------------------------------------------------------------
  #
  # Most jobs above name themselves from their matrix, so this workflow contributes 116 check
  # runs to a pull request and few of their names are stable. A ruleset's
  # required_status_checks list holds literal context strings with no wildcard, so requiring
  # `unit-test` means enumerating all 25 of its names -- and then any matrix edit either orphans
  # a required context that no longer runs, which leaves a pull request pending forever, or
  # quietly adds a leg that nothing requires. That maintenance cost is why the ruleset requires
  # two contexts today while every other check on the pull request is advisory -- a count that
  # moves with the trigger set, as the 186 below explains.
  #
  # Those two numbers count different populations, which is how the previous pair of them went
  # stale unnoticed. Both were measured on pull request 599 at b5111830, and both are
  # re-derivable:
  #
  #   gh api repos/<owner>/<repo>/actions/runs/<run>/jobs --paginate --jq '.jobs[].name'
  #   gh api repos/<owner>/<repo>/commits/<sha>/check-runs --paginate --jq '.check_runs[].name'
  #
  # 116 is this workflow's own contribution: 91 jobs, plus the 25 `PyTest - ...` check runs
  # that mikepenz/action-junit-report publishes from inside the unit-test legs -- one per leg.
  # Those 25 are not jobs and land in a separate check suite, so a job census alone undercounts
  # what this file puts on a pull request -- that gap is most of why the old figure of 84 looked
  # defensible.
  #
  # The 91 is arithmetic on a measured anchor, and the chain is worth keeping because each link
  # is a different kind of claim. Run 35370310502 reported `total_count` 168 with 168 rows
  # received, `unit-test` 25 and `install-validation` 113 by name, and `required-checks` absent
  # because it is `needs`-gated and is not created until the run resolves: 168 + 1 = 169 jobs,
  # measured. `integration-test` landed after that run, so the pre-collapse figure is 170, and
  # the run has never been re-taken to confirm it. Folding pip, pipx, uvx, pre-commit and mcp
  # into the single `bundle` method took install-validation from 113 legs to 33, so 170 - 80 = 90,
  # and the unmatrixed snapshot-trailers job makes it 91. Only the 169 was counted; 170, 90 and
  # 91 are derived, and a fresh census is what would settle them. The 25 `PyTest - ...` runs are derived from the unit-test leg count by the one-per-leg
  # rule #602 measured at 20 legs, not counted again, and the collapse does not touch them.
  #
  # Where 91 comes from, per job: lint 1, snapshot-trailers 1, unit-test 25,
  # scan-validation 24, external-target-scan 2, multi-project-attribution 2,
  # deploy-aws-helpers 1, integration-test 1, install-validation 33, required-checks 1.
  #
  # unit-test reached 25 from three independent changes that all had to land: adding 3.14 to the
  # axis (18 -> 23), removing the macos-14 exclusion for 3.10 and 3.11 (#599), and nothing in
  # #601, which relabels `macos-latest` as arm64 and moves no count. Either matrix change alone
  # gives 23 or 20, so a merge or rebase that keeps one side's intent would look clean and be
  # wrong by two legs. The check is the count and the leg NAMES, not the diff.
  #
  # 186 is every check run on that commit, from every workflow the commit triggered plus the
  # GitHub Advanced Security app. It is 185 distinct names over 186 check runs, because
  # `Validate PR title` gets published by two check suites.
  #
  # That total depends on WHICH workflows a commit triggers, so it is not one number for all
  # pull requests. This file and ash-install-methods.yml name their install jobs from the same
  # template -- `${{ matrix.method }} (${{ matrix.os }}, py${{ matrix.python-version }})`, here
  # and at ash-install-methods.yml:34 -- so every cell the two matrices share produces two
  # check runs under one name whenever both run. The collision is structural, not incidental,
  # but the collapse shrank it: this file's install legs are now named `bundle (...)`,
  # `homebrew (...)`, `podman (...)`, `finch (...)` and `nerdctl (...)`, and the only values
  # ash-install-methods.yml still shares are those last four. Its pip, pipx, uvx, pre-commit,
  # mcp and nix legs now have the namespace to themselves.
  # ash-install-methods.yml is path-filtered to pyproject.toml, hatch_build.py,
  # automated_security_helper/**, .pre-commit-hooks.yaml, Formula/**, itself, and the nix
  # leg's action and snapshot module, so whether it runs is decided by whether the commit
  # touches those paths. A CI-plumbing commit like the
  # one measured here triggers no run of it -- confirmed by querying that workflow for runs on
  # the branch and getting zero, rather than assuming the filter excluded it -- and sees 186
  # check runs over 185 names. A commit touching package code triggers both surfaces and sees
  # 278 check runs over the same 185 names, 93 of them duplicated, all cross-workflow.
  #
  # So a count over this namespace has to name three things to mean anything: check runs or
  # distinct names, which trigger set, and which commit.
  #
  # Reconcile the row count against the endpoint's own `total_count` before trusting either
  # query. Both routes cap at `per_page` and report the true total alongside a short page.
  #
  # The 186 and 185 above are left exactly as measured, on pull request 599 at b5111830, and are
  # NOT restated for this branch -- that commit predates Python 3.14, so re-labelling its numbers
  # would be inventing a measurement rather than citing one. What can be said is the delta this
  # file contributes: 25 more jobs and 5 more `PyTest - ...` runs than at b5111830, then one more
  # job for integration-test, 80 fewer for the install-validation collapse and one more for
  # snapshot-trailers, so a comparable CI-plumbing commit would see 138 rather than 186. That is arithmetic on a measured baseline,
  # not a count anyone has taken, and it is why the 186 keeps its own commit's name.
  #
  # This job's name does not depend on the matrix, so it can be required once and stay correct
  # across matrix changes. It reports the verdict the individual legs already computed.
  #
  # THE TWO WAYS A GATE LIKE THIS FAILS OPEN
  #
  # `always()` is load-bearing, not defensive. Without it a failed dependency makes this job
  # *skipped*, and GitHub counts a skipped required check as a pass -- so the gate would
  # disappear at exactly the moment it is supposed to speak. That is the whole failure mode this
  # job exists to remove, so it must not reproduce it.
  #
  # WHY THE GATE ONLY TAKES A RUNNER WHEN SOMETHING DID NOT SUCCEED
  #
  # The rest of the condition is `contains(needs.*.result, ...)` over failure, cancelled and
  # skipped, so the job runs -- and fails, in the census step below -- whenever any dependency
  # reported anything but success, which is every case the census's own result check rejects.
  # It is skipped in exactly one case: every dependency succeeded. That is the one case where
  # running it could only print a pass, and GitHub reports a skipped job as Success and does
  # not let it block a merge even when it is a required check:
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
  # So the verdict is unchanged in both directions: red whenever it was red before, and green
  # without waiting for a runner when it was green.
  #
  # The waiting was most of the wall clock. This job is created the moment its last dependency
  # finishes and then queues for an ubuntu-latest runner like any other job, behind every other
  # open pull request's legs, to run for about five seconds. Measured over nine pull_request and
  # push runs on 2026-10-06 (37485671493 through 37499915881): it waited a median 84 minutes and
  # up to 105, against a median of 129 minutes for the whole run, and the gate was the last job
  # to start in every one of them. In run 37499915881, 102 of its 194 minutes were this job
  # waiting to execute a five-second script.
  #
  # The drift half of the census does not depend on this job running. The census script still
  # runs here whenever the gate does, and tests/unit/test_required_checks_census.py takes the
  # same census against the committed `needs` list -- read with yaml.safe_load, a stronger
  # instrument than the script's scanner -- inside every unit-test leg, and unit-test is one of
  # this job's dependencies. A job added to the workflow without being added to `needs` fails
  # those tests, which fails unit-test, which makes this job run and fail.
  #
  # The second way is drift: a job added to this workflow and not added to `needs` escapes the
  # gate silently, and the gate keeps reporting success over a shrinking share of the suite. So
  # the census is asserted rather than assumed. A census beats a list that nobody re-checks --
  # the same reason .github/scripts/assert-coverage-completeness.mjs takes its file list from
  # `git ls-files` rather than from the coverage report.
  #
  # WHAT THE CENSUS REPLACED, AND WHY THE OLD FORM COULD ONLY CATCH THE HARMLESS DIRECTION
  #
  # This job used to carry `EXPECTED_UPSTREAM_JOBS: "8"` and compare it against `len(needs)`.
  # Both sides of that comparison lived inside the gate job, so it was blind to the drift it
  # existed to prevent: adding a tenth job to this workflow without adding it to `needs` leaves
  # `len(needs)` at 8 and the literal at 8, and the check passes over shrunk coverage. The one
  # direction it did catch -- updating `needs` and forgetting to bump the literal -- is the
  # harmless one, because it fails loudly and the fix is to bump a number.
  #
  # The literal was never actually wrong on this tree: this workflow has 9 jobs, 8 of them are
  # in `needs`, and the 9th is this gate itself, so coverage has been complete throughout. The
  # defect was latent rather than a live hole, which is exactly why nothing surfaced it.
  #
  # .github/scripts/assert-required-checks-census.py now takes the census from this file's own
  # `jobs:` mapping and requires every job other than the gate to be in `needs`, unless it is
  # named in that script's `_UNGATED` map with a reason -- empty today, and re-checked for
  # staleness on every run. So a new job is covered by construction, and a deliberately
  # advisory one is covered by a written statement rather than by a count that cannot tell the
  # two apart.
  required-checks:
    name: required-checks
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
    needs:
      - lint
      - snapshot-trailers
      - unit-test
      - scan-validation
      - external-target-scan
      - multi-project-attribution
      - deploy-aws-helpers
      - integration-test
      - install-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This job needed no checkout while its only input was the `needs` context. It needs one
      # now, because the census is this file, and the whole point is that the list of jobs is
      # read from the workflow rather than restated inside the job that depends on them. A
      # checkout that fails takes the gate red, which is the safe direction.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert this gate depends on every job in the workflow, and that all of them succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # `github.job` is this job's own YAML key, so the script is told which job to exclude
          # from the census by the run rather than by a third copy of the name. Passed through
          # the environment rather than interpolated into the `run:` body, which is this
          # repository's convention for every context value a shell reads.
          GATE_JOB: ${{ github.job }}
        shell: bash
        # The script is dependency-free on purpose -- see its module docstring for why the gate
        # does not reach the network for PyYAML.
        run: |
          python3 .github/scripts/assert-required-checks-census.py \
            --workflow .github/workflows/ash-unified-ci.yml \
            --gate-job "$GATE_JOB"
