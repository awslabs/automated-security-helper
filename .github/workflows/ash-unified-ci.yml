name: ASH - Unified CI

on:
  # WHY main CARRIES A PUSH TRIGGER, AND WHY THE FILTER IS `[main]`
  #
  # This filter has been wrong in two different directions, so both are recorded.
  #
  # It was `["!main"]`, which reads as "every branch except main" and is not what
  # GitHub does with it. A branch filter built only from negative patterns matches
  # nothing, so the trigger fired on no branch at all -- not on main, and not on the
  # branches the "!" was meant to keep. Measured over this workflow's whole run
  # history: 1 push run against 869 pull_request and 217 merge_group runs, and
  # ash-iac-drift.yml had none. So it was dead config rather than an exemption.
  #
  # It was then removed entirely, on the argument that merge_group already gates the
  # tree that becomes main. That argument is sound for anything that reaches main
  # through the queue, and it is why this trigger is `[main]` and not `["**"]`:
  # pull_request already reports on every branch that has an open pull request, so a
  # wider filter would duplicate those runs and cover nothing new.
  #
  # What it does not cover is the merge that skips the queue. The active "Protect
  # main" ruleset requires the queue (SQUASH, grouping ALLGREEN, up to 10 entries per
  # merge) and names `required-checks` -- this workflow's gate job -- as a required
  # status check, but it also grants one repository role an always-on bypass. A merge
  # taken under that bypass lands on main having run no lint, no unit tests and no
  # scan validation, and the queue cannot report on a tree it never built. That is
  # measured, not hypothetical: pull request 565 merged with no merge_group run of any
  # workflow, and the runs against its commit on main were the docs deploy and the
  # default code-scanning run, nothing else.
  #
  # WHAT THIS COSTS, AND WHAT WAS REJECTED
  #
  # Sized off a count rather than a guess: this workflow expands to 291 jobs on a push
  # to main, 289 on a merge-queue run, where warm-image-layers does not run, and 136 on a
  # pull request, where the matrices run the pull-request cover (the note on ensure-cache),
  # and ash-iac-drift.yml to 6, so a queued merge that also pushes to main is
  # ~592 runner jobs instead of ~295. The duplicate result on a queued merge is the
  # price of covering the bypassed one, and it was accepted deliberately. With
  # install-validation's five cheap install methods each as its own leg -- 4 methods x
  # 25 cells + uvx x 5 OS = 105 legs in place of the 25 bundled cells (uvx ran on 3.12
  # only) -- it would be ~590 against ~294, so running them as one leg per combination nearly
  # halves what this deliberate duplication costs. Most of the 291 is the unit-test and
  # integration-test families, which are 205 legs since the suite was split by tier: the
  # unit tier is 100 legs (5 operating systems x 5 Python versions x 4 shards), the
  # integration tier is 100 (the same 25 x 4 shards) and the e2e tier is 5 (one per runner
  # label, Python 3.12 only; see the notes on those jobs). The unit family was 200 legs
  # when every OS and Python version ran eight shards of the whole suite, 25 when the tier
  # ran unsharded and timed out, and 100 since it was cut into four shards. Each shard
  # repeats the checkout and dependency install, so the job
  # count rises faster than the test time does. The 291-job push figure is
  # derived from a census rather than being one -- see the note on the required-checks job for
  # which link in that chain was actually measured, and
  # tests/unit/test_unified_ci_job_counts.py, which recounts both figures from the
  # matrices.
  #
  # Both counts are job counts, from
  # `gh api .../actions/runs/<run>/jobs --paginate --jq '.jobs[].name' | wc -l`
  # reconciled against the same endpoint's `total_count`. They are not check-run
  # counts, which are higher -- see the note on the required-checks job for why the
  # two populations differ and why conflating them is what let the old figures rot.
  #
  # The cheaper alternative -- leave both files queue-only and add one small scheduled
  # workflow to check main periodically -- was rejected because a schedule reports on
  # whatever main happens to be at fire time, so it cannot attribute a break to the
  # commit that caused it, and a bypassed merge can be superseded before the next fire.
  #
  # A push trigger reports after the fact rather than blocking, which is all it can do
  # for a merge that bypassed the gate. Reporting is the point: the gap this closes is
  # a main commit about which CI says nothing at all.
  push:
    # `[main]` is a positive filter and matches. See the "!main" note above for what
    # happens when a filter has only negative patterns.
    branches:
      - main
  pull_request:
    # "**" not "*": GitHub branch filters treat "*" as matching any character
    # except "/", so a PR whose BASE is a nested branch (a stacked PR targeting
    # e.g. pr/scan-decomposition) never matched and silently got no CI at all.
    # "**" matches nested refs too.
    branches:
      - "**"
  merge_group:
    types: [checks_requested]
  workflow_dispatch: {}

env:
  COLUMNS: 160

permissions:
  contents: read

concurrency:
  # One in-flight run per pull request; pushing again supersedes the previous run.
  #
  # github.ref is refs/pull/<n>/merge on pull_request, and on merge_group it is the
  # per-entry gh-readonly-queue/main/pr-<n>-<sha> branch, so every queue entry lands
  # in its own group and entries never serialize behind one another.
  #
  # On push, github.ref is refs/heads/main for every commit, so ref alone would put
  # every main push in one shared group -- and that is the bug the sha suffix exists to
  # prevent. GitHub allows one pending run per group, and cancel-in-progress is false
  # for push (see below), so a third run queuing into an occupied group evicts the
  # second before it starts a single job, and on a push there is no pull request for
  # the missing verdict to block. Measured in this repository before this trigger was
  # added: run 34418283475 (event push, branch main) was cancelled with zero jobs ever
  # started, one second after the following main push queued into the same group, and
  # run 33515520652 is a second instance. Both were the docs deploy, where superseding
  # an intermediate run is harmless because the newest publish wins. For a gate it
  # would mean a main commit that reports nothing, which is what this workflow exists
  # to prevent.
  #
  # The suffix is empty for every event except push, so pull_request and merge_group
  # keep the grouping described above unchanged. Appending rather than replacing keeps
  # github.ref in the key, so the same commit pushed to two refs still gets two groups.
  # This is the form ash-typescript-ci.yml already uses for its own push trigger.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || '' }}
  # A newer run on any ref other than main or a tag supersedes the one in progress: a
  # fresh push to a pull request or a branch makes the previous head's run moot, and a
  # second dispatch on a branch replaces the first. Runs on main and on tags are never
  # cancelled; each is the only report its commit gets, and the per-commit group above
  # means a main push has no sibling to supersede anyway. A merge_group entry has its
  # own per-entry ref, so a second run in its group only means the entry was rebuilt and
  # the earlier run's answer is for a queue entry that no longer exists.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Unit tests: all OS x all Python versions (matches ash-repo-unit-tests.yml)
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    # The single-runner gate jobs (lint, actionlint, snapshot-trailers, required-checks)
    # run on the arm64 Ubuntu label rather than ubuntu-latest. Nothing in them depends on
    # the architecture: lint installs ASH with uv from the same dependency closure that
    # ensure-cache already resolves on ubuntu-24.04-arm, and the other three run stdlib
    # Python scripts. Measured once, 2026-10-29 19:24Z to 20:31Z on run 40939758029:
    # the ubuntu-latest hosted pool queued jobs a median 4310 s (n=46) while
    # ubuntu-24.04-arm queued them a median 21 s (n=76); at 13Z the same label had queued
    # in 4 s, so this is the pool's variance, not the repository's. The label choice
    # trades a 72-minute tail on a bad hour for a different pool; it is not a measured
    # guarantee that the arm pool stays quiet. ensure-cache keeps its ubuntu-latest
    # matrix entry on push and merge-queue runs because that entry writes the x86 caches
    # every ubuntu-latest job reads; a pull request leaves it out (the pull-request cover,
    # the note on ensure-cache) and its ubuntu-latest jobs read main's entry.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # Restore everywhere, save only from main. This setup-uv major defaults
          # prune-cache to false, so the entry is the full wheel set (~254 MB on
          # x86_64), and a pull request saves it under its own ref, where no other
          # pull request can read it. On 2026-10-06 that one key family was 43
          # entries and 3.62 GB, one copy per open pull request, which put the
          # repository at 10.84 GB against its 10 GB quota and evicting. A pull
          # request falls back to its base branch's entry, so saving from main is
          # what every pull request already reads; the per-PR copies only served
          # a second push to the same pull request.
          save-cache: ${{ github.event_name == 'push' }}

      - name: "Cache report: uv-lint"
        if: ${{ !cancelled() && steps.setup-uv.outcome == 'success' }}
        shell: bash
        env:
          CACHE_NAME: uv-lint
          CACHE_HIT: ${{ steps.setup-uv.outputs.cache-hit }}
        run: |
          # One line per cache per job, same shape everywhere, so hit rates can be
          # counted across runs from job summaries.
          if [ "${CACHE_HIT}" = "true" ]; then result=hit
          elif [ -n "${CACHE_MATCHED:-}" ]; then result="partial (${CACHE_MATCHED})"
          else result=miss; fi
          echo "cache ${CACHE_NAME}: ${result}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ASH
        run: uv pip install --system -e .
      - name: Regenerate JSON schemas
        run: python -m automated_security_helper.schemas.generate_schemas
      - name: Check schemas are up to date
        run: |
          # git diff compares the index to the worktree, so it cannot see a file
          # git has never heard of. Generating a schema for a newly registered
          # model produces an untracked .json, which a diff-based check reports
          # as clean -- so the schema would silently never be committed.
          # git status --porcelain reports untracked files too. The pathspec is
          # quoted so git does the matching rather than the shell, which is what
          # lets it match files that do not exist in the index yet.
          changed="$(git status --porcelain -- 'automated_security_helper/schemas/*.json')"
          if [ -n "$changed" ]; then
            echo "::error::JSON schemas are out of date. Run 'python -m automated_security_helper.schemas.generate_schemas' and commit the result."
            echo "$changed"
            git diff -- 'automated_security_helper/schemas/*.json'
            exit 1
          fi
      - name: Verify documentation freshness
        run: uv run python scripts/verify_docs_freshness.py

      # Attached to `lint` rather than given its own job, deliberately. A new job
      # here has to be added to required-checks' `needs` AND have
      # EXPECTED_UPSTREAM_JOBS bumped to match, and forgetting the second half
      # leaves a gate that reports success over a shrinking share of the suite.
      # `lint` is already in that `needs`, carries no job-level `if:`, and this
      # workflow puts no `paths` filter on pull_request -- so the check reports on
      # every pull request and every merge_group entry without touching the count.
      # It also already has the uv environment this script's yaml import needs,
      # which is the same environment verify_docs_freshness.py above relies on.
      #
      # --self-test runs FIRST and is not decoration. The census is a scanner, and
      # the failure mode of a scanner is matching nothing and exiting 0, which
      # reads as evidence of a clean tree. The self-test drives synthetic
      # fixtures through the same detector and comparator and asserts each one
      # still comes back red, so a detector that has degenerated into
      # always-passing fails here instead of at the next incident.
      - name: Assert no unallowlisted artifact upload or cache
        # `set -e` explicitly rather than leaning on the runner's default shell
        # flags: without it a failing self-test would be followed by the census
        # anyway, and the step's verdict would come from whichever ran last.
        run: |
          set -euo pipefail
          uv run python .github/scripts/assert-publish-surfaces.py --self-test
          uv run python .github/scripts/assert-publish-surfaces.py

      # Same placement and the same self-test-first shape as the step above, for the same
      # reasons. This one checks that every cached scanner content database is declared in
      # automated_security_helper/utils/content_databases.py and keyed on the time bucket
      # that module derives from the bound the scanner enforces.
      - name: Assert every cached content database is time-bounded by the registry
        run: |
          set -euo pipefail
          uv run python .github/scripts/assert-content-db-caches.py --self-test
          uv run python .github/scripts/assert-content-db-caches.py

      # ---------------------------------------------------------------------
      # LINT AND TYPE GATES
      #
      # These steps are why this job's name stopped being a lie. Before them, `lint`
      # installed Python, installed ASH, and ran no linter: the repository has had a
      # ruff pre-commit hook and a full [tool.mypy] section with the pydantic plugin
      # enabled for a long time, and nothing in CI ever executed either. Config
      # presence and gate enforcement are separate facts, and this job had only the
      # first -- which is exactly how a lint hook nobody ran could drift five minor
      # versions behind the ruff the project declares without anyone noticing.
      #
      # Steps rather than a new job, deliberately. The required-checks job below
      # asserts len(needs) == EXPECTED_UPSTREAM_JOBS, so a new job has to be added in
      # two places and the constant bumped or the merge-queue gate goes red. Steps
      # inside `lint` are covered by that gate the moment they land, with no constant
      # to keep in sync. Cost is small: measured cold, ruff under 1s, ty 1s, mypy 14s
      # without the cdk extra and about 75s on a runner with it (the mypy step below
      # explains why it is installed), all inside this job's existing 15-minute budget.
      #
      # WHY `uv run --group dev` AND NOT A BARE `ruff`
      #
      # `--group dev` is load-bearing, not decoration. `uv run ruff` WITHOUT it falls
      # back to whatever ruff is on PATH: measured locally, that ran ruff 0.16.3 while
      # the project's own is 0.16.7, silently reproducing the
      # hook-disagrees-with-gate defect one layer down. With the flag uv syncs the dev
      # group from the committed uv.lock and the binary comes from .venv, so the
      # version enforced is the version committed. Each step prints its tool version
      # for the same reason: a failure log that does not say which ruff ran cannot be
      # reproduced locally.
      #
      # No --select, --ignore or per-file scoping is passed here. Those decisions live
      # in pyproject.toml so the hook and this gate read one source; a flag here would
      # be a second, invisible one.
      #
      # mypy in particular cannot reuse the `uv pip install --system -e .` environment
      # above, because [tool.mypy] enables the pydantic.mypy plugin and the plugin has
      # to be importable by the mypy process itself. Stock mypy misreads pydantic
      # model constructors badly enough to be useless on this codebase: 1,330 spurious
      # call-arg errors without the plugin against 78 with it.
      #
      # WHY NOT `pre-commit run --all-files`
      #
      # The hooks already exist, so reusing them would mean less duplication. It is
      # still wrong here. The ruff hook carries `args: [--fix]` and pretty-format-json
      # carries `--autofix`, so the run MUTATES whatever it finds: on a tree that needs
      # formatting it rewrites what it flags and exits 1, reporting its verdict over its
      # own edits, and on a clean tree a violation is repaired rather than reported.
      # It would also give zero type
      # coverage, because mypy is not a hook, and it silently skips the commitizen
      # hook entirely because that one is commit-msg staged. pre-commit stays the
      # local convenience where --fix is a feature; CI runs the tools directly in
      # check-only mode so a violation fails instead of being repaired.
      # ---------------------------------------------------------------------
      - name: ruff check
        run: |
          uv run --group dev ruff --version
          uv run --group dev ruff check .

      - name: ruff format --check
        run: |
          uv run --group dev ruff --version
          uv run --group dev ruff format --check .

      # `--extra cdk` installs aws-cdk-lib and cdk-nag so mypy can resolve their
      # types. Without them every aws_cdk / cdk_nag name in utils/cdk_nag_wrapper.py
      # is Any (its override disables import-not-found), and the gate passes over
      # that module without checking any of its cdk calls: an outdir: Path | None
      # reassigned to a str there was invisible here and caught only locally.
      - name: mypy
        run: |
          uv run --group dev --extra cdk mypy --version
          uv run --group dev --extra cdk mypy automated_security_helper/

      # INFORMATIONAL ONLY. THIS STEP CANNOT BLOCK A MERGE, AND THAT IS ON PURPOSE.
      #
      # ty is Astral's type checker: 4-5x faster than mypy here, with native pydantic
      # support rather than a plugin, and its findings on this tree look substantive
      # -- 312 of its 756 unresolved-attribute diagnostics are "attribute not defined
      # on None in union X | None", the same unguarded-Optional defect class as mypy's
      # union-attr.
      #
      # It does not gate, and its version is pinned exactly, for a reason that is ty's
      # own: "ty does not yet have a stable API; breaking changes, including changes to
      # diagnostics, may occur between any two versions."
      # (https://github.com/astral-sh/ty). At 0.0.x that makes a merge-blocking gate
      # one that can go red on an unrelated bump, so `continue-on-error: true` is what
      # keeps a 0.0.x diagnostic change out of the merge queue. Worth re-evaluating as
      # a real gate once ty reaches a stable release; until then the value is the
      # signal in the log, not a verdict.
      #
      # The step name says informational so nobody reads this job's green tick as ty
      # having passed -- it exits 1 today. It runs through the project environment,
      # not standalone, so ty resolves first- and third-party imports the way mypy
      # does; standalone it cannot see pydantic and the diagnostics change meaning.
      - name: "ty (informational only -- does not gate)"
        continue-on-error: true
        run: |
          uv run --group dev --with 'ty==0.0.84' ty --version
          uv run --group dev --with 'ty==0.0.84' ty check automated_security_helper/

      # scripts/verify_workspace_policy.py runs four real scans of a generated
      # workspace and asserts that a workspace policy's severity ceiling and its
      # suppressions reach exactly the projects they name. Until this step the
      # script existed and no job ran it, so its own defects (a check no correct
      # scan could satisfy) went unnoticed. A step of `lint` rather than a job of
      # its own, for the reasons the publish-surfaces step above gives: `lint` is
      # already in required-checks' `needs`, so no EXPECTED_UPSTREAM_JOBS bump, and
      # it already carries the installed ASH. Last in the job so the cheap lint
      # and type verdicts above are reported before the scans run. `uv pip
      # install -e .` brings ASH and not its scanner tools, and the gate reads the
      # fixture as broken (exit 3) when bandit reports nothing, so bandit and
      # checkov are installed first, the two tools the attribution gates install
      # for the same reason. No tool cache and no evidence upload here: both are
      # publish surfaces the census above would have to allowlist, and the script
      # prints the tail of the child's output on every failure path itself.
      #
      # --timeout bounds EACH of the four scans, not the run; a unit test ties four
      # of them plus a setup margin to this job's timeout-minutes so the script's
      # own diagnostics win the race against a job cancellation.
      - name: Install the workspace policy gate's scanners
        run: python -m automated_security_helper.cli.main dependencies install --tool bandit --tool checkov
      - name: Verify the workspace policy end to end on a real scan
        env:
          TMPDIR: ${{ runner.temp }}
        run: python scripts/verify_workspace_policy.py --timeout 120

  # ---------------------------------------------------------------------------
  # ensure-cache: the one job that writes uv's cache
  # ---------------------------------------------------------------------------
  #
  # What it writes: uv's download cache, which holds third-party packages that are
  # already published on PyPI. Nothing ASH builds goes into it. The sync below leaves ASH
  # itself out (--no-install-project), so the cache holds the packages ASH depends on and
  # not ASH, and .github/scripts/assert-publish-surfaces.py still allows nothing else.
  #
  # Why it exists: every job that sets up uv used to restore this cache on its own. A
  # pull request paid every miss in every job, 130 times for the unit, integration and e2e
  # matrices alone (it was 200 for the unit-test matrix before the suite was split by tier),
  # and a push to main had the whole matrix racing to save the same keys. Now this job
  # runs first and is the only one that saves. Every other job here that uses
  # .github/actions/setup-ash needs it and only restores: setup-ash saves nothing unless
  # it is passed `save-cache: "true"`, and only this job passes it.
  #
  # Why one leg per runner image: the key setup-uv builds is the runner image plus a hash
  # of the dependency files. It does not carry the matrix Python version, because
  # setup-uv looks up the interpreter the image ships before setup-python has run. A leg
  # per Python version would write each key five times, so the legs are the five images.
  #
  # It saves on every event. A pull request that leaves the dependency files alone finds
  # main's entry by exact key and saves nothing. One that changes them saves one entry per
  # image under its own ref, and its later jobs read those. An entry is about 14 MB on
  # x86_64 Linux and macOS and nearly empty elsewhere, because setup-uv prunes pre-built
  # wheels before it saves, so five entries per changed dependency set stay far from the
  # repository's 10 GB cache quota. On 2026-10-06 the unpruned cache in `lint`, one copy
  # per open pull request, was 43 entries and 3.62 GB and put the repository at 10.84 GB.
  #
  # `lint` is not part of this. It calls setup-uv itself, from a release that does not
  # prune, so its key is its own and nothing here writes it. It still saves from a push,
  # which is one writer. warm-image-layers is left alone too: its image layers are a
  # different cache, and it already has one writer per key through its concurrency group,
  # which is the model this job follows.
  #
  # This job has no `if:`, so it runs on every event this workflow runs on. A failure
  # here fails the run through required-checks, and skips the jobs that need it unless
  # they run under `!cancelled()`.
  ensure-cache:
    name: "ensure-cache (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # All five at once: the jobs that need this one wait for the slowest of them.
      max-parallel: 5
      matrix:
        # The runner images the other jobs set up uv on through setup-ash. The unit-test
        # jobs use all five, and no job that calls setup-ash uses an image outside them.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15, windows-latest]
        # THE PULL REQUEST COVER
        #
        # On a pull_request event the `exclude` entries below evaluate to the saturated
        # runner images and drop them from this job; on every other event (push to main,
        # merge_group, workflow_dispatch) each entry evaluates to '' and matches no
        # combination, so the full matrix above runs unchanged. The same overlay sits on the nine tier jobs,
        # on unit-coverage and on install-validation, each naming this note. The static axes
        # stay the truth the tests read; tests/unit/test_unified_ci_job_counts.py expands
        # the overlay for both events and holds the comments to both figures.
        #
        # Why: the hosted ubuntu-latest and macOS pools were the whole wall clock. On the
        # first tiered run of main (40939758029, 2026-10-29 19:24Z) every job that needs this
        # one was created at 20:40:42Z, 76 minutes after the run, because this job's
        # ubuntu-latest leg queued 3660 s and its macos-latest leg 4557 s while the arm64 and
        # Windows legs started in 26 s and 8 s. The tier legs then queued again on the same
        # labels (ubuntu-latest median 2605 s over 56 jobs in that run, macos-latest 5022 s
        # over 7, macOS 14 1982 s over 14; arm64 786 s over 42 and Windows 29 s over 36). A
        # pull request now runs ensure-cache on the two labels with headroom and starts its
        # tier legs within a minute; the macOS legs it keeps (macos-15) read the uv cache
        # main's pushes write, since a pull request falls back to its base branch's entries
        # (see the note on `lint`), and fetch from the index only when the pull request
        # changed the lock file.
        #
        # Which macOS image a pull request keeps: macos-15, the pinned image, not the
        # macos-latest alias. Both are Apple silicon (the notes under unit-test-macos), so the
        # cover loses no architecture; the alias is the label every repository's default
        # macOS job asks for, and on the first pull-request run of the cover (2026-10-29) the
        # seven jobs still queued after 66 minutes were all macos-latest legs, while macOS 14
        # had read a median queue of 1982 s against macos-latest's 5022 s in run 40939758029.
        # The cost is one gate: unit-coverage's axis names macos-latest and no pinned image,
        # so a pull request runs no macOS coverage gate; the merge_group entry and the push
        # to main run it. GitHub retires pinned images, and when macos-15 goes the five
        # `exclude` entries below that name macos-latest (the three macOS tier jobs,
        # unit-coverage and install-validation) flip back to it, one value each;
        # tests/unit/test_unified_ci_job_counts.py pins which image the cover keeps, so the
        # flip is one list there too.
        #
        # What a pull request stops running, and where it still runs: the ubuntu-latest (x86_64)
        # legs of the unit, integration and e2e tiers and of the install bundle, the macos-latest
        # legs, and Python 3.11 and 3.13 everywhere (3.12 stays because unit-coverage gates it
        # and the pre-commit hooks run on it). All of it runs on the merge_group entry that
        # gates main and on the push to main, so nothing merges without the full matrix; a
        # pull request shows one Linux (arm64), one macOS and one Windows leg per tier on the
        # lowest, the gated and the highest Python. It runs no x86_64 Linux leg of any tier,
        # no Linux or macOS pre-commit hook run (the bundle's hook step keys on ubuntu-latest
        # and macos-latest) and no x86_64 Linux or macOS unit-coverage gate; those are the
        # merge-queue entry's and the push's. The container-runtime legs (docker, podman, finch, nerdctl)
        # and the sandbox legs are x86_64-only or runtime-specific and are not thinned.
        #
        # If GitHub ever stopped evaluating expressions inside `exclude`, the literal string
        # would match no combination and the full matrix would run: the failure direction is a slower
        # pull request, never a missing leg. The contexts reference lists github, needs, vars
        # and inputs as available to `strategy`.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || '' }}
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
          - os: ${{ github.event_name == 'pull_request' && 'macos-15' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: setup
        uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
          save-cache: "true"
      - name: "Cache report: uv-ensure"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        shell: bash
        env:
          CACHE_NAME: uv-ensure
          CACHE_HIT: ${{ steps.setup.outputs.uv-cache-hit }}
        run: |
          # One line per cache per job, same shape everywhere, so hit rates can be
          # counted across runs from job summaries.
          if [ "${CACHE_HIT}" = "true" ]; then result=hit
          elif [ -n "${CACHE_MATCHED:-}" ]; then result="partial (${CACHE_MATCHED})"
          else result=miss; fi
          echo "cache ${CACHE_NAME}: ${result}" | tee -a "$GITHUB_STEP_SUMMARY"
      # The same extras the unit-test jobs install (run-unit-tests), so the packages this
      # job fetches are the ones they would otherwise fetch themselves. --frozen reads
      # uv.lock as written, so it resolves nothing new.
      - name: Fetch the packages the other jobs install
        shell: bash
        run: uv sync --frozen --no-install-project --extra cdk --extra symbols

  # ---------------------------------------------------------------------------
  # actionlint over every workflow, with shellcheck on every `run:` script
  # ---------------------------------------------------------------------------
  #
  # Nothing in CI linted the workflows, and on 2026-10-06 main carried eight
  # findings: two empty `needs:` in ash-repo-docs.yml, and six unquoted
  # expansions in run-ash-security-scan.yml -- the published reusable workflow,
  # where an unquoted `ash-args` was glob-expanded against the caller's checkout.
  #
  # Both binaries are pinned by version and sha256 and verified before they run.
  # shellcheck is pinned too, not taken from the runner image, because actionlint
  # reports whatever the shellcheck it finds reports and an image update would
  # otherwise change this gate's verdict with no diff here.
  #
  # The self-test step is the reason this job can be trusted. actionlint SKIPS the
  # shellcheck rule silently when it cannot find shellcheck, and reports nothing
  # for a script it did not check, so a wrong path would turn this job green over
  # no shell checking at all. The step lints a fixture with an unquoted `$VAR` and
  # fails the job unless SC2086 is reported.
  #
  # One file per invocation, each under its own timeout. actionlint 1.7.12 writes a
  # script into shellcheck's stdin pipe before starting shellcheck
  # (process.go, cmdExecution.run), so a script larger than the pipe's capacity
  # blocks forever. A hosted runner's pipes hold 64 KiB and the largest `run:`
  # block in these workflows is about 9 KiB, so it should not happen here -- but on
  # a host whose user has exceeded fs.pipe-user-pages-soft, new pipes hold a page or
  # two and ash-iac-drift.yml's 8.9 KiB cdk-nag script hangs (measured: scripts of
  # 8 KB pass, 9.6 KB hang). Per file, a hang names its file and fails instead of
  # stalling the job.
  actionlint:
    name: actionlint
    # arm64 for the reason given on `lint`. The two tool downloads below are the
    # linux_arm64 actionlint asset and the linux.aarch64 shellcheck asset at the same
    # versions, each pinned by the digest of its own tarball; the actionlint one is the
    # digest tool_downloads.py already pins for that asset.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    # The digests are release checksums, which detect-secrets reads as high-entropy
    # hex. Marked with the trailing pragma, not the `nextline` form: detect-secrets
    # parses YAML into values and drops comment lines, so in a .yml file a pragma on
    # the line above is never seen (measured with detect-secrets 1.5.0).
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6  # pragma: allowlist secret
      SHELLCHECK_VERSION: "0.11.0"
      SHELLCHECK_SHA256: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint and shellcheck, verified against their pinned digests
        shell: bash
        run: |
          set -euo pipefail
          bin="${RUNNER_TEMP}/lint-bin"
          mkdir -p "${bin}"
          cd "${RUNNER_TEMP}"
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_arm64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C "${bin}" actionlint
          curl -fsSL --retry 3 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.aarch64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz -C "${bin}" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          "${bin}/actionlint" -version
          "${bin}/shellcheck" --version
          echo "${bin}" >> "$GITHUB_PATH"
      - name: Self-test -- an unquoted expansion must be reported
        shell: bash
        run: |
          set -uo pipefail
          fixture="${RUNNER_TEMP}/actionlint-selftest.yml"
          cat > "${fixture}" <<'YAML'
          on: push
          jobs:
            j:
              runs-on: ubuntu-latest
              steps:
                - run: echo $UNQUOTED >> $GITHUB_ENV
          YAML
          # GitHub runs `shell: bash` as `bash -e -o pipefail`, and `set -uo pipefail`
          # does not turn -e off, so a bare assignment from a command that exits 1 --
          # which this one must -- ends the step before rc is read. Capture it instead.
          rc=0
          out="$(actionlint -no-color -shellcheck="$(command -v shellcheck)" "${fixture}" 2>&1)" || rc=$?
          printf '%s\n' "${out}"
          if [ "${rc}" -eq 0 ] || ! grep -q 'SC2086' <<< "${out}"; then
            echo "::error::actionlint did not report SC2086 for an unquoted \$UNQUOTED (exit ${rc}). It skips the shellcheck rule silently when it cannot run shellcheck, so the lint below would pass without checking any script."
            exit 1
          fi
          echo "self-test ok: the unquoted expansion was reported and actionlint exited ${rc}"
      - name: Lint every workflow
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no workflow files found; the lint would pass over nothing"
            exit 1
          fi
          failed=0
          for f in "${files[@]}"; do
            # `|| rc=$?`, not a bare command then rc=$?: under the runner's -e the first
            # file with a finding would end the loop, and every file after it would go
            # unlinted while the job still reported only that one.
            rc=0
            timeout 120 actionlint -color -shellcheck="$(command -v shellcheck)" "${f}" || rc=$?
            if [ "${rc}" -eq 124 ]; then
              echo "::error file=${f}::actionlint timed out on ${f}. See the note on this job about scripts larger than a pipe's capacity."
              failed=1
            elif [ "${rc}" -ne 0 ]; then
              failed=1
            fi
          done
          echo "linted ${#files[@]} workflow file(s)"
          exit "${failed}"

  # A changed snapshot or other golden file must arrive in a commit whose
  # `Snapshot-Update:` trailer says why the output changed; see DEVELOPMENT.md
  # "Snapshot tests" and the docstring of the script below.
  #
  # Its own job rather than a `lint` step because it needs the full history and
  # `lint` does not: `fetch-depth: 0` is what puts both ends of the event's range, and
  # every commit between them, in the clone. It is in required-checks' `needs` like
  # every other job, and it has no job-level `if:` -- the census refuses a skipped
  # result, and every event this workflow runs on has a defined range (the script
  # documents how each one is chosen, including workflow_dispatch).
  #
  # Python on the runner image is enough: the script is stdlib only and calls git, so
  # there is no setup-python or uv step to fail on a registry round trip.
  snapshot-trailers:
    name: snapshot-trailers
    # arm64 for the reason given on `lint`; the script is stdlib Python plus git.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # --self-test runs FIRST, for the reason given on the publish-surfaces step in
      # `lint`: a checker that has degenerated into finding nothing exits 0 and reads
      # as a clean tree. `set -e` so a failing self-test stops the step.
      - name: Assert every golden-file change carries a Snapshot-Update trailer
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-snapshot-trailers.py --self-test
          python3 .github/scripts/check-snapshot-trailers.py
      # syrupy fails the session for a snapshot its collected module no longer asserts,
      # but a snapshot whose module was deleted or renamed is never opened, so it
      # cannot be reported there. This maps each one back to its module.
      - name: Assert every snapshot belongs to an existing test module
        shell: bash
        run: python3 .github/scripts/check-snapshot-trailers.py --orphans

  # WHY THE UNIT TIER IS NOT SHARDED AND THE INTEGRATION TIER IS
  #
  # Every test carries exactly one of three tier markers (unit, integration, e2e), and the
  # jobs below select by marker (`-m unit`, `-m integration`, `-m e2e`) instead of running
  # the whole tests/ tree as one family. The maintainer's reasoning, as asked for: "at the
  # ci level we should separate our testing groups and require categorizing tests as unit
  # vs integration vs e2e", and "integration needs shards, unit should not".
  #
  # The numbers behind it come from the timing analysis of one run of the earlier layout
  # (every OS and Python version running eight shards of the whole suite, 200 legs).
  # Summing each test file's serial seconds by tier: the files that run in process, which
  # is the unit tier, took 1,079 serial seconds per pass. On one 4-worker ubuntu runner
  # that is 7.6 minutes of wall time, and 9.5 minutes on Windows. That read as fitting one
  # job per OS and Python version inside the 30-minute timeout, so the unit tier first ran
  # unsharded: one job per leg of the matrix, 25 legs, with the setup repeated 25 times
  # instead of 200.
  #
  # The first tiered run of main (40939758029, 2026-10-29) measured that reading wrong. The
  # unsharded unit legs ran 1837 to 1972 s of wall on ubuntu-latest, macOS 14 and
  # windows-latest and 13 of those 20 legs were cancelled at the 30-minute timeout with
  # "Run PyTest" still running (the x86_64 py3.12 leg at 1798 s of pytest when it was cut);
  # only the arm64 legs finished, in 838 to 1710 s. The sums of the earlier eight-shard
  # layout per OS and Python version were 2955 to 6953 s, so no unsharded leg of this suite
  # fits 30 minutes on a hosted x86_64, Windows or macOS runner. The unit tier is therefore
  # cut into four shards per OS and Python version, the integration tier's shape: by those
  # walls two shards would read about 950 s on x86_64 and 860 s on arm64, four about 480 s,
  # and four leaves the margin the macOS and Windows legs need, whose unsharded walls were
  # still running at the cut. The cost is 75 more legs per push or merge-queue run (25 to
  # 100) and 27 more on a pull request; under the per-pool `max-parallel` caps the tier's
  # wall is about the same at two or four shards, so the extra legs buy margin against the
  # timeout, not speed. A raised timeout would have kept a 30-minute-plus leg on the
  # critical path of every run and was not taken.
  #
  # A first estimate summed the serial seconds of the files that start real processes, call
  # real tools or talk to a service in one run of the earlier layout (22,195 on ubuntu,
  # 26,110 on Windows, 16,045 on macOS) and, because a shard owns whole modules chosen by a
  # hash of the path, found the shard that owns tests/unit/docs/test_page_claims.py (3,708
  # serial seconds on ubuntu) over the 30-minute timeout at four shards, so it set eight.
  # That estimate came before the tests were classified. Read from the real classification
  # (a test is integration only when it starts a process or uses a real tool, so most
  # in-process tests are unit, and test_page_claims.py contributes only its 118 integration
  # tests, about 1,500 serial seconds, to one shard), the integration tier is 485 modules
  # carrying about 6,300 serial seconds. With the per-file medians of that run placed under
  # the hash rule, the worst of four shards is about 10.6 minutes of wall time at 4 workers
  # and the worst of eight about 8.9; scaled by the factors measured for ubuntu (1.5) and
  # Windows (1.18) those read about 16 and 19 minutes at four shards against the 30-minute
  # timeout, and 14 and 16 at eight. Eight would add 100 legs per run, each paying its own
  # checkout and install, for about two minutes, so the tier is cut into four shards per OS
  # and Python version. This is a reading from the classification and the per-file medians,
  # not a measurement of this layout: the first run on this branch is the measurement, and
  # the shard count moves with it.
  #
  # A shard owns the test modules whose path hashes to its number, and ignores the others
  # at collection time (tests/utils/sharding.py, through the ASH_TEST_SHARD variable the
  # action sets), so pytest still applies its own testpaths, python_files and ignore
  # rules. Because a shard owns modules and not tiers, a shard can hold none of a tier's
  # tests; with a `-m` expression that is not a failure, and the sharding module turns
  # pytest's "no tests collected" exit status into success for that shard and says so.
  # Each entry of a shard axis is its own literal and carries the total it was cut for
  # (`3of4`), so no second number has to agree with the list. A shard dropped from the
  # list is caught by tests/unit/test_unit_test_shards.py, which holds the three unit and
  # the three integration jobs to one axis and to one another. The e2e jobs pass no shard,
  # which the action reads as the whole tier. GitHub rejects a matrix of more than 256 jobs;
  # the largest matrix here is 40 legs, and test_unified_ci_job_counts.py fails before the
  # workflow does.
  #
  # The 80% total-coverage gate is the `unit-coverage` job's, once per OS family on the
  # unit tier's data. The base gated the coverage of the whole suite; this gates the unit
  # tier alone, and the integration and e2e tiers measure no coverage. The 95% core target
  # and a coverage configuration per tier are separate follow-up work, not part of this
  # split.
  # One of three unit-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  unit-test-linux:
    name: "unit-test (${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      # cap the Linux unit-test fan-out; the Linux runner pool is the largest
      max-parallel: 24
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Four shards per OS and Python version, the integration tier's shape (the note
        # above this job on why the unsharded tier did not fit its timeout).
        shard: [1of4, 2of4, 3of4, 4of4]
        # The pull-request cover (the note on ensure-cache): on a pull_request event these
        # drop the x86_64 image and Python 3.11 and 3.13; on every other event they match
        # nothing and the full matrix runs.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.11' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || '' }}
        # No static exclusions. macOS 14 was excluded from 3.10 and 3.11 on the stated
        # grounds that arm64 macOS "only has 3.12 and 3.13". That is not true, and
        # this job disproves it itself: macos-latest resolves to an arm64 image
        # (macos-26-arm64), and its 3.10 leg installs CPython 3.10.11 from
        # actions/python-versions as python-3.10.11-darwin-arm64.tar.gz, then runs
        # the whole suite green. macOS 14 is the same architecture -- macOS 14 arm64
        # -- and install-validation already sets up 3.10 and 3.11 on it. So the two
        # cells were excluded for a reason that never applied.
        #
        # What removing this did NOT establish: these two cells had never executed
        # the test suite before, on macOS 14 specifically. The architecture and the
        # interpreters are proven; a Sonoma-only failure was not ruled out in
        # advance.
        #
        # 3.14 needs no exclusion either, and that is measured rather than argued:
        # `unit-test (macOS 14, py3.14)` ran green in run 35350532714, alongside
        # macos-latest, ubuntu-latest, ubuntu-24.04-arm and windows-latest. The
        # actions/python-versions manifest carries a darwin/arm64 build for 3.14.7,
        # the newest stable 3.14, which is what makes that resolvable.
        # WHERE THE ARCH LABEL WENT
        #
        # There used to be a five-row `include:` here mapping each `os` to an `arch` label, for
        # artifact and check-run naming. The comment on it was candid that the labels were
        # hand-written rather than read from the runner, "so they can disagree with the machine --
        # and macos-latest did": that label is an alias, GitHub moved it to Apple silicon, and the
        # table said x86_64 while the runner logged `Image: macos-26-arm64`.
        #
        # That table was not merely cosmetic. .github/actions/run-unit-tests/action.yml selects
        # the single leg that renders the coverage summary, and it selected it by comparing the
        # arch LABEL, so a mislabelled Linux row would silently have dropped the step from every
        # leg -- nothing renders it and nothing says so.
        #
        # The table is gone and run-unit-tests derives the label from `runner.arch` instead, so
        # the name on an artifact is a statement the runner made about itself. Removing the
        # include changes no leg count: every entry matched an existing `os` axis value and only
        # added a key, so the matrix was 25 cells with it and is 25 cells without it.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: ${{ matrix.python-version }}
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          marker: unit
          shard: ${{ matrix.shard }}

  # One of three unit-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  unit-test-macos:
    name: "unit-test (${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      # cap the macOS unit-test fan-out because the macOS runner pool is the smallest
      max-parallel: 10
      matrix:
        os: [macos-latest, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Four shards, as on unit-test-linux.
        shard: [1of4, 2of4, 3of4, 4of4]
        # The pull-request cover (the note on ensure-cache): macos-latest and Python 3.11 and
        # 3.13 drop out on a pull_request event only.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.11' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || '' }}
        # No static exclusions; the notes under the unit-test-linux matrix apply here too.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: ${{ matrix.python-version }}
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          marker: unit
          shard: ${{ matrix.shard }}

  # One of three unit-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  unit-test-windows:
    name: "unit-test (${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      # cap the Windows unit-test fan-out between the macOS and Linux caps
      max-parallel: 12
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Four shards, as on unit-test-linux.
        shard: [1of4, 2of4, 3of4, 4of4]
        # The pull-request cover (the note on ensure-cache): Python 3.11 and 3.13 drop out
        # on a pull_request event only. One image, so no os entry.
        exclude:
          - python-version: ${{ github.event_name == 'pull_request' && '3.11' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || '' }}
        # No static exclusions; the notes under the unit-test-linux matrix apply here too.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: ${{ matrix.python-version }}
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          marker: unit
          shard: ${{ matrix.shard }}

  # Applies the 80% total-coverage gate to the unit tier's coverage, once per OS family.
  #
  # Each leg combines the unit artifacts of one runner type on Python 3.12 (four artifacts,
  # `shard1of4` to `shard4of4`; the combine script checks that the set is complete and
  # refuses a partial one) and fails below 80%. The gate applies to the UNIT tier only: the
  # base gated the coverage of the whole suite, and the integration and e2e tiers measure
  # no coverage. The 95% core target and a coverage configuration per tier are follow-up
  # work, not part of this change. The gate is kept for each OS family at one Python
  # version, which is where the platform specific code paths differ. The other Python
  # versions' unit coverage is measured and uploaded by their legs and gated nowhere.
  #
  # WHY A COMBINE JOB. While the unit tier ran unsharded, each leg could have applied
  # `--cov-fail-under` itself and this job could have been dropped (four small jobs, one
  # artifact round trip and the `--marker` plumbing). It stayed for two reasons, and the
  # first one has since paid off: the threshold lives in one place that does not care
  # whether the tier is sharded, so cutting the unit tier into four shards changed no gate
  # (no shard of a split run can meet the threshold on its own, so this combine is now the
  # only place the number can be read). And the run-unit-tests action gates nothing,
  # whatever tier it runs, which keeps "tests failed" and "coverage fell" two separate
  # signals: this job runs under `!cancelled()` and reports the coverage even when a test
  # failed. The cost is the extra jobs and the per-shard tables the action renders on its
  # ubuntu-latest, Python 3.12 legs (each from one shard's data; this job's table is the
  # whole tier's).
  #
  # Each leg runs on the same kind of runner as the runs it combines. Coverage data
  # records absolute source paths, and a runner of one image has one workspace path
  # (/home/runner/work/... on Linux, /Users/runner/work/... on macOS, D:\a\... on Windows),
  # so the combine finds every source file where the shard recorded it and no path
  # remapping is needed. Combining across operating systems would need it, and is not done.
  # A path that did not match would fail `coverage report` with "No source for code".
  #
  # `!cancelled()` and not the default `success()`: when a shard fails on a test, its
  # coverage data is still uploaded, and this job should still say whether the combination
  # as a whole meets the threshold. It is not `always()` because a cancelled run has nothing
  # to gate. tests/unit/test_required_checks_census.py requires every gated job with
  # `needs` to carry one of the two.
  unit-coverage:
    name: "unit-coverage (${{ matrix.os }})"
    needs: [ensure-cache, unit-test-linux, unit-test-macos, unit-test-windows]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # run all four coverage jobs at once, one per OS family
      max-parallel: 4
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        # The pull-request cover (the note on ensure-cache): the unit tier runs no
        # ubuntu-latest and no macos-latest leg on a pull request (its macOS legs run on
        # macos-15, which this axis does not name), so there is no x86_64 Linux and no
        # macOS coverage data to combine there; both legs drop out on a pull_request event
        # only, and the merge_group entry and the push to main run all four.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || '' }}
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      # Plain `uv sync`: this job runs coverage.py and reads the package's source, and
      # imports neither the extras nor the scanners.
      - name: Install dependencies
        shell: bash
        run: uv sync
      # The architecture label sits between the OS and the Python version in the artifact
      # name and is derived by the runner, so the pattern leaves it as a wildcard; the
      # script rebuilds the exact name from RUNNER_ARCH and checks the shards against it.
      - name: Download this OS's Python 3.12 unit results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-${{ matrix.os }}-*-py3.12-unit-shard*
          path: shard-results
      - name: Combine the unit tier's coverage and apply the threshold
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          uv run python .github/scripts/combine-unit-coverage.py --self-test
          uv run python .github/scripts/combine-unit-coverage.py \
            --results-dir shard-results \
            --os "${MATRIX_OS}" \
            --python-version 3.12 \
            --marker unit \
            --fail-under 80 \
            --summary "$GITHUB_STEP_SUMMARY"

  # THE INTEGRATION TIER: SHARDED, ONE JOB FAMILY PER RUNNER POOL
  #
  # Runs `-m integration` (the tests that start a real tool or a product subprocess, or
  # use boto3 or moto) on the same OS and Python matrix as the unit tier, with the shard
  # axis the unit tier does not need. Four shards: by the classification and the per-file
  # medians of one run of the earlier layout the worst shard reads about 16 minutes on
  # ubuntu and 19 on Windows against the 30-minute timeout (eight was the figure before the
  # tests were classified); the arithmetic is in the note above the unit-test jobs. It is a
  # reading, so the first run on this branch is the measurement and the count moves with
  # it. A shard whose modules hold no integration test (every item deselected by `-m`) is
  # admitted by tests/utils/sharding.py, so the count can be raised without a leg failing
  # for having nothing to run. A shard that collects nothing at all still fails with
  # pytest's exit 5.
  #
  # The tiers run in parallel: each tier job waits only for ensure-cache, not for the unit
  # job of its pool. A wait on the unit job would only add the slowest unit leg (about 8
  # minutes on ubuntu, 10 on Windows, plus queueing) to the critical path, and it would
  # save no runner time, because a failed unit leg must not skip the other tiers' signal.
  # Like the unit jobs, these carry no job-level `if:`. `needs` alone gives the one skip
  # that does save runners: a job that needs ensure-cache and carries no status function
  # is skipped when a leg of ensure-cache fails (GitHub applies `success()` to a job whose
  # `if:` names no status function, and to a job with none), so a run that is already red
  # does not pay for these 105 legs, and a re-run of failed jobs does not pay for them
  # twice. The gate sees that skip through ensure-cache, which is in its own `needs`. An
  # `if: ${{ !cancelled() && needs.ensure-cache.result == 'success' }}` used to spell the
  # same rule out and was dropped: it added no case the default lacks, and it taught the
  # census test a longer spelling of the default. The per-job
  # `max-parallel` caps below stay per job, so the macOS pool can now see up to 22 legs
  # at once (10 unit, 10 integration, 2 e2e) where it saw at most 12; the caps were chosen
  # per job and the repository's macOS concurrency limit is not read from here, so extra
  # legs queue rather than fail.
  # ASH_REQUIRE_CDK_EXTRA is set by the action, and
  # tests/integration/scanners/test_cdk_nag_real_pack.py carries the integration marker,
  # so the cdk-nag path runs on every OS and Python version here. The separate
  # `integration-test` job further down is not replaced by these.
  # One of three integration-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  integration-test-linux:
    name: "integration-test (${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      # cap the Linux integration-test fan-out like the Linux unit-test fan-out
      max-parallel: 24
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [1of4, 2of4, 3of4, 4of4]
        # The pull-request cover (the note on ensure-cache); the same entries as the unit
        # job of this pool.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.11' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || '' }}
        # No static exclusions; the notes under the unit-test-linux matrix apply here too.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: ${{ matrix.python-version }}
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          marker: integration
          shard: ${{ matrix.shard }}

  # One of three integration-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  integration-test-macos:
    name: "integration-test (${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      # cap the macOS integration-test fan-out because the macOS runner pool is the smallest
      max-parallel: 10
      matrix:
        os: [macos-latest, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [1of4, 2of4, 3of4, 4of4]
        # The pull-request cover (the note on ensure-cache); the same entries as the unit
        # job of this pool.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.11' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || '' }}
        # No static exclusions; the notes under the unit-test-linux matrix apply here too.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: ${{ matrix.python-version }}
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          marker: integration
          shard: ${{ matrix.shard }}

  # One of three integration-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  integration-test-windows:
    name: "integration-test (${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      # cap the Windows integration-test fan-out between the macOS and Linux caps
      max-parallel: 12
      matrix:
        os: [windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        shard: [1of4, 2of4, 3of4, 4of4]
        # The pull-request cover (the note on ensure-cache); the same entries as the unit
        # job of this pool.
        exclude:
          - python-version: ${{ github.event_name == 'pull_request' && '3.11' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || '' }}
        # No static exclusions; the notes under the unit-test-linux matrix apply here too.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: ${{ matrix.python-version }}
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: ${{ matrix.python-version }}
          marker: integration
          shard: ${{ matrix.shard }}

  # THE E2E TIER: THE WHOLE PRODUCT, ONCE PER RUNNER LABEL
  #
  # Runs `-m e2e` (the `ash` command run as a subprocess against a real target tree with
  # real scanners, the container image, the MCP server driven through a client) on Python
  # 3.12 only. The tier drives the whole product once per operating system; the Python
  # version axis is the unit and integration tiers' job. It is unsharded because the tier
  # is small by the reading of the test files, and the first run on this branch measures
  # it. Like the integration tier, it waits only for ensure-cache and runs alongside the
  # unit tier.
  # One of three e2e-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  e2e-test-linux:
    name: "e2e-test (${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # The pull-request cover (the note on ensure-cache): the x86_64 image drops out on
        # a pull_request event only. No Python axis here, so no python-version entry.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: "3.12"
          marker: e2e

  # One of three e2e-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  e2e-test-macos:
    name: "e2e-test (${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15]
        # The pull-request cover (the note on ensure-cache): macos-latest drops out on a
        # pull_request event only.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: "3.12"
          marker: e2e

  # One of three e2e-test jobs split by OS so each runner pool has its own cap. Edit all three alike.
  e2e-test-windows:
    name: "e2e-test (${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - uses: ./.github/actions/run-unit-tests
        with:
          os: ${{ matrix.os }}
          python-version: "3.12"
          marker: e2e

  # ---------------------------------------------------------------------------
  # Warm the ASH image's layer cache before the scan legs build it
  # ---------------------------------------------------------------------------
  #
  # The python-container docker legs build the ASH image with buildx and a GitHub
  # Actions layer cache (run_ash_container._gha_layer_cache_args). On a push to
  # main they would all start cold at once and each export the same layers. This
  # job builds once per architecture first and exports with mode=max, and
  # scan-validation `needs` it, so on main the legs restore a warm cache instead.
  #
  # Pushes to main only. A pull request never exports layers (the legs read with
  # ASH_GHA_BUILD_CACHE_EXPORT=none), so warming would build an image for nothing.
  # Skipped, this job costs no runner and delays nothing: scan-validation's
  # `!cancelled()` runs it either way.
  #
  # The concurrency group is the cache key -- one per architecture -- so at most one
  # cold build per key runs at a time across runs; a later push to main waits for
  # the first to finish and then builds against a warm cache. GitHub keeps one
  # pending job per group and cancels an older pending one when a newer queues,
  # which is harmless here: the cancelled run's scan legs still run, against
  # whatever the cache holds. That is also why this job is not in required-checks'
  # `needs` -- its verdict is speed, never correctness (see _UNGATED in
  # .github/scripts/assert-required-checks-census.py).
  #
  # Layers are exported to the repository's Actions cache, which any workflow run
  # in this repository can restore, approved fork pull requests included. The
  # maintainer accepted that exposure for build layers only; pushing the image to a
  # registry and uploading it as an artifact stay forbidden. See the
  # ASH_GHA_BUILD_CACHE_EXPORT entries in .github/scripts/assert-publish-surfaces.py.
  warm-image-layers:
    name: "warm image layers (${{ matrix.os }})"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ash-image-layer-cache-${{ matrix.os }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      # warm both architectures at once; each already has its own cache group
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same hand-off, with the same masking, as run-scan-test's step of this name;
      # its comment carries the trade-off.
      - name: Expose the Actions cache credentials to ASH's build
        id: cache-creds
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name]
              if (value) {
                core.setSecret(value)
                core.setOutput(name, value)
              } else {
                core.info(`${name} is not set on this runner; skipping`)
              }
            }
      # The legs build FROM the verified base-image layout this action hands over,
      # so the warm build has to as well, or its layers key differently and nothing
      # it exports is ever reused.
      - name: Pre-pull the base image
        id: prepull
        uses: ./.github/actions/prepull-base-image
        with:
          oci-runner: docker
          runner-wrapper: ""
      - name: Build the image and export its layers
        shell: bash
        env:
          ASH_GHA_BUILD_CACHE_EXPORT: max
          ACTIONS_RUNTIME_TOKEN: ${{ steps.cache-creds.outputs.ACTIONS_RUNTIME_TOKEN }}
          ACTIONS_CACHE_URL: ${{ steps.cache-creds.outputs.ACTIONS_CACHE_URL }}
          ACTIONS_RESULTS_URL: ${{ steps.cache-creds.outputs.ACTIONS_RESULTS_URL }}
          ASH_BASE_OCI_LAYOUT: ${{ steps.prepull.outputs.oci-layout }}
          ASH_BASE_IMAGE_OVERRIDE: ${{ steps.prepull.outputs.base-image-override }}
        run: |
          start=$(date +%s)
          ash build-image --oci-runner docker --build-target ci --ash-revision-to-install LOCAL --no-run --verbose 2>&1 | tee "${RUNNER_TEMP}/ash-container-build.log"
          echo "image build took $(( $(date +%s) - start ))s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: "Cache report: image-layers"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          log="${RUNNER_TEMP}/ash-container-build.log"
          total=$(grep -cE '^#[0-9]+ \[' "$log" || true)
          cached=$(grep -cE '^#[0-9]+ CACHED' "$log" || true)
          echo "cache image-layers: ${cached}/${total} build steps cached" | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Scan validation: method x platform (matches ash-repo-scan-validation.yml)
  # Uses Python 3.12 exclusively.
  # ---------------------------------------------------------------------------
  scan-validation:
    name: "scan (${{ matrix.method }}, ${{ matrix.os }})${{ matrix.oci-runner && matrix.oci-runner != 'docker' && format(' [{0}]', matrix.oci-runner) || '' }}${{ matrix.offline && ' [offline]' || '' }}${{ matrix.config-file == 'community' && ' - Community Plugins' || '' }}"
    # After ensure-cache and the layer-cache warm-up on main; on a pull request the
    # warm-up is skipped and this runs as soon as ensure-cache is done. `!cancelled()`
    # rather than the implicit success(), so a skipped, failed or concurrency-cancelled
    # warm-up never stops a scan leg. A failed ensure-cache does not either: the run
    # still fails, through required-checks, and the legs read what the cache holds.
    needs: [ensure-cache, warm-image-layers]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    # Container-runtime cells are far slower than docker/python-local and were
    # being cancelled at exactly 20.3 min by the previous flat 20. Measured:
    # docker/python-local peak ~5 min, podman/finch on ubuntu-latest reach 20+.
    timeout-minutes: ${{ (matrix.oci-runner == 'podman' || matrix.oci-runner == 'finch') && 45 || 20 }}
    strategy:
      fail-fast: false
      # cap the scan matrix so the container-runtime scan jobs do not crowd out other runs
      max-parallel: 8
      matrix:
        # WHY THERE IS NO `platform` KEY HERE ANY MORE
        #
        # Every row used to carry one -- `platform: linux/amd64` and so on -- and it was a pure
        # function of `os`: the mapping was total and single-valued, so 24 rows restated four
        # facts. The only consumer was five log lines in .github/actions/run-scan-test/action.yml
        # ("Testing ASH using ... on <os> (<platform>)"), so a wrong value produced a log that
        # lied while the leg stayed green.
        #
        # It was already wrong. `macos-latest` is an alias and GitHub moved it to Apple silicon:
        # the runner logs `Image: macos-26-arm64` and setup-python fetches
        # python-3.10.11-darwin-arm64.tar.gz on it, which is why the `unit-test` job above
        # relabelled it arm64. These rows still said `darwin/amd64`. The same os-to-architecture
        # fact was spelled twice in two vocabularies and the two had come to disagree.
        #
        # The fix is to stop spelling it here. GitHub Actions cannot compute one matrix key from
        # another -- `include:` entries are literals and no expression context holds a sibling
        # key -- so deriving it in YAML is not expressible. run-scan-test derives it instead from
        # `runner.os` and `runner.arch`, which the runner reports about itself, so the log cannot
        # disagree with the machine that printed it. That also fixes the vocabulary: the derived
        # ARM value is `linux/arm64`, which is what an OCI platform string actually looks like,
        # rather than the `linux/aarch64` that was written here.
        #
        # WHY THE python-local ROWS NO LONGER SAY `oci-runner: ""`
        #
        # Same shape, one dimension smaller: `oci-runner` was `""` on exactly the `python-local`
        # rows and non-empty on every other row, so it too was a pure function of `method`. An
        # absent key and an empty-string key render identically in every expression that reads it
        # here -- the job name, the `timeout-minutes` conditional, the `OCI_RUNNER` env and the
        # action input -- so dropping it changes no behaviour and removes the chance of a
        # python-local row acquiring a runner, or a container row losing one, without anything
        # noticing. tests/unit/test_ci_matrix_agreement.py asserts the invariant in both
        # directions.
        include:
          # Linux x86 -- Docker
          - { os: ubuntu-latest, method: bash, config-file: default, oci-runner: docker }
          - { os: ubuntu-latest, method: powershell, config-file: default, oci-runner: docker }
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: docker }
          - { os: ubuntu-latest, method: python-local, config-file: default }
          # Linux x86 -- Podman
          - { os: ubuntu-latest, method: bash, config-file: default, oci-runner: podman }
          - { os: ubuntu-latest, method: powershell, config-file: default, oci-runner: podman }
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: podman }
          # Linux x86 -- Finch
          - { os: ubuntu-latest, method: bash, config-file: default, oci-runner: finch }
          - { os: ubuntu-latest, method: powershell, config-file: default, oci-runner: finch }
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: finch }

          # Linux ARM -- Docker
          - { os: ubuntu-24.04-arm, method: bash, config-file: default, oci-runner: docker }
          - { os: ubuntu-24.04-arm, method: powershell, config-file: default, oci-runner: docker }
          - { os: ubuntu-24.04-arm, method: python-container, config-file: default, oci-runner: docker }
          - { os: ubuntu-24.04-arm, method: python-local, config-file: default }
          # Linux ARM -- Podman
          - { os: ubuntu-24.04-arm, method: bash, config-file: default, oci-runner: podman }
          - { os: ubuntu-24.04-arm, method: powershell, config-file: default, oci-runner: podman }
          - { os: ubuntu-24.04-arm, method: python-container, config-file: default, oci-runner: podman }
          # Linux ARM -- Finch (x86_64 only, skip ARM)
          # - { os: ubuntu-24.04-arm, method: python-container, config-file: default, oci-runner: finch }

          # macOS -- python-local only (Docker disabled on hosted macOS)
          - { os: macos-latest, method: python-local, config-file: default }

          # Windows -- python-local only (Docker disabled on hosted Windows)
          - { os: windows-latest, method: python-local, config-file: default }

          # Offline mode -- validates OFFLINE=YES Docker build (grype db + semgrep rulesets cached at build time)
          - { os: ubuntu-latest, method: python-container, config-file: default, oci-runner: docker, offline: true }

          # Community plugins -- python-local on all platforms
          - { os: ubuntu-latest, method: python-local, config-file: community }
          - { os: ubuntu-24.04-arm, method: python-local, config-file: community }
          - { os: macos-latest, method: python-local, config-file: community }
          - { os: windows-latest, method: python-local, config-file: community }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      - name: Install Podman
        if: matrix.oci-runner == 'podman'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends podman
          podman --version
      - name: Install Finch
        if: matrix.oci-runner == 'finch'
        run: sudo bash scripts/setup-finch-linux.sh
      - uses: ./.github/actions/run-scan-test
        env:
          OCI_RUNNER: ${{ matrix.oci-runner }}
          OCI_RUNNER_WRAPPER: ${{ matrix.oci-runner == 'finch' && 'sudo' || '' }}
        with:
          method: ${{ matrix.method }}
          os: ${{ matrix.os }}
          config-file: ${{ matrix.config-file }}
          snyk-token: ${{ secrets.SNYK_TOKEN }}
          oci-runner: ${{ matrix.oci-runner }}
          offline: ${{ matrix.offline || 'false' }}

  # ---------------------------------------------------------------------------
  # The default image stage's permissions.
  #
  # `ash build-image` and `ash --mode container` build the `non-root` stage when no
  # --build-target is given, and that is the image an operator runs. Every scan leg
  # above builds `ci` (validate-container and run-scan-test pass --build-target ci),
  # so the steps only `non-root` has -- its user's home, the grype cache handed to
  # that user, ASH_BIN_PATH handed back to root, its closing sweep of what an install
  # left writable by every user -- are checked here in a built image. This builds
  # the stage with no target, as an operator does, and runs the image permissions
  # probe against the tag that build produces.
  #
  # No layer cache: the cache scope is per stage and only `ci`'s is warmed, so this
  # leg would read nothing, and leaving the cache credentials out keeps the build
  # step from holding them. tests/unit/test_ci_builds_and_probes_the_default_stage.py
  # holds this job's shape.
  # ---------------------------------------------------------------------------
  non-root-image-permissions:
    name: "non-root image permissions (ubuntu-latest)"
    needs: [ensure-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      - name: Pre-pull the base image
        id: prepull
        uses: ./.github/actions/prepull-base-image
        with:
          oci-runner: docker
          runner-wrapper: ""
      - name: Build the default stage
        shell: bash
        env:
          ASH_BASE_OCI_LAYOUT: ${{ steps.prepull.outputs.oci-layout }}
          ASH_BASE_IMAGE_OVERRIDE: ${{ steps.prepull.outputs.base-image-override }}
        run: ash build-image --oci-runner docker --ash-revision-to-install LOCAL --no-run --verbose
      - name: Check who can write to the image
        shell: bash
        env:
          ASH_IMAGE_NAME: automated-security-helper:non-root
          OCI_RUNNER: docker
        run: >-
          uv run --extra cdk pytest
          tests/snapshot/container/runtime/test_container_image_permissions.py
          --run-container-snapshots --no-cov -n 0

  # ---------------------------------------------------------------------------
  # External-target scan: assert on what comes back when ASH scans a directory
  # that is not its own working directory.
  #
  # Scanning an external target already happens in CI -- validate-install (lines
  # 32, 52, 70), validate-mcp (line 48) and ash-upgrade-paths.yml (line 167) all
  # pass --source-dir. So the gap is NOT the flag, and this job is not redundant
  # with them. The gap is that nothing ever checked the result. Those jobs use a
  # clean one-line fixture that yields zero findings even when everything works,
  # and their only assertion is the step's exit status -- which cannot see a
  # broken scanner, because _compute_exit_code returns 1 only when results is
  # None and otherwise just counts actionable findings.
  #
  # Two bugs lived in that gap: a producer/consumer arity break that left every
  # scanner at status ERROR with zero findings, and a checkov config probe that
  # tested the process cwd while checkov's subprocess ran from source_dir.
  # scripts/verify_external_target_scan.py asserts no scanner errored, that the
  # expected findings came back attributed to the scanner that should have
  # produced them, and that they came from the fixture rather than this checkout.
  #
  # Windows is in the matrix deliberately -- this project's path, encoding and
  # console bugs concentrate there. Python 3.12 only: the gate exercises the scan
  # path, which the unit-test matrix already covers across every version.
  # ---------------------------------------------------------------------------
  external-target-scan:
    name: "external-target scan (${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    # Keep in step with JOB_TIMEOUT_BUDGET_SECONDS in the script, which a unit test ties
    # to this number, and above DEFAULT_SCAN_TIMEOUT_SECONDS (1200 s) by enough for the
    # setup before the scan (checkout, setup-ash with install-ash true, the tool download
    # cache restore, the bandit and checkov installs and the fixture build) plus the 60 s
    # the script spends stopping and draining a timed-out scan. At 25 the setup's share
    # was 240 s, which a cold Windows runner used up, and then GitHub cancelled the job
    # before the script's own timeout and its diagnostics fired; 30 leaves it 540 s. The
    # cost is a hung job holding a runner five minutes longer.
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # run both external-target scan jobs at once, one per OS
      max-parallel: 2
      matrix:
        # The Linux leg runs on the arm64 label for the reason given on `lint`: nothing
        # here depends on the architecture (bandit and checkov are Python tools that uv
        # installs from wheels, and the tool download cache is keyed on runner.arch),
        # and on run 40939758029 this job's ubuntu-latest leg queued 2598 s while the
        # arm64 label queued 10 to 31 s.
        os: [ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      # bandit and checkov would otherwise install themselves through uv on first
      # use, inside the gate. Doing it here, the way run-scan-test does (lines 226
      # and 260), means an install flake fails as a failed install step with its own
      # log rather than surfacing as "none of the scanners this gate asserts on
      # ran". On the Windows runner only bandit and checkov are available at all, so
      # a single failed install is the difference between green and a confusing red.
      # Only those two, the gate's GATE_SCANNERS (a unit test ties them together): a
      # plain install also needs cfn-nag, which this job gives no Ruby DevKit to
      # build on windows-latest, and fails there as a scan selecting it would.
      - id: tool-cache
        uses: ./.github/actions/tool-download-cache
        with:
          mode: restore
      - name: Install scanner dependencies
        shell: bash
        env:
          ASH_TOOL_DOWNLOAD_CACHE: ${{ steps.tool-cache.outputs.dir }}
        run: ash dependencies install --tool bandit --tool checkov
      - uses: ./.github/actions/tool-download-cache
        with:
          mode: save
          cache-hit: ${{ steps.tool-cache.outputs.cache-hit }}
      # One shell for both platforms, so there is one command to reason about.
      # The path is relative, so Git Bash on Windows does not rewrite it.
      # --timeout is passed explicitly so it sits next to timeout-minutes above.
      - name: Verify ASH can scan a target outside the repository
        shell: bash
        # The gate builds its fixture with tempfile.mkdtemp(). Pointing the temp dir
        # at the runner's own scratch space makes the tree's location predictable
        # enough to upload as an artifact below. All three names because tempfile
        # checks TMPDIR first and TEMP/TMP on Windows. This sits on the step rather
        # than the job because the runner context does not exist in job-level env --
        # a workflow using it there is rejected outright, with no jobs and no
        # annotation, which is a slow thing to diagnose.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          ASH_TOOL_DOWNLOAD_CACHE: ${{ steps.tool-cache.outputs.dir }}
        run: python scripts/verify_external_target_scan.py --timeout 1200
      # The gate keeps its fixture and scan output on disk when it fails, and its
      # failure messages tell the reader to go and look at them. Upload them so a
      # red run leaves real evidence instead of a pointer into a deleted runner.
      - name: Collect the kept fixture and scan output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: external-target-scan-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/ash-external-target-*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Scanner sandbox: escape tests on real backends, and scanner parity under bwrap
  # on Linux and sandbox-exec on macOS.
  #
  # tests/integration/sandbox runs a malicious fixture scanner through a real
  # `ash scan` and requires every escape attempt to fail under each backend and to
  # succeed with --sandbox off (the negative control). ASH_REQUIRE_SANDBOX_BACKENDS
  # makes a backend the runner should have a failure rather than a skip, so a
  # runner image that drops bubblewrap goes red instead of quietly testing less.
  #
  # bubblewrap and firejail come from the Ubuntu archive, so there is no action to
  # pin. The container image does not need either: container mode forces
  # sandbox.mode=off for the inner run, because the container is the boundary.
  # ---------------------------------------------------------------------------
  sandbox:
    name: "sandbox escape (${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # run both sandbox escape jobs at once, one per OS
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            require: "bwrap,firejail,landlock"
          - os: macos-latest
            require: "sandbox-exec"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job uses git credentials after checkout.
          persist-credentials: false
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - name: Install bubblewrap and firejail
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap firejail
          bwrap --version
          firejail --version | head -1
      # Ubuntu 23.10+ restricts unprivileged user namespaces through AppArmor. The
      # packaged bwrap is meant to be allowed by its profile, but the hosted runner
      # image has been seen to refuse it. Lifting the restriction is runner setup,
      # the same thing docs/content/docs/scanner-sandbox.md tells a user to do; the
      # tests themselves are unchanged and still require bwrap to work.
      - name: Let bwrap create user namespaces
        if: runner.os == 'Linux'
        run: |
          if bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true; then
            echo "bwrap can create a sandbox as-is"
          else
            echo "::notice::bwrap refused by the AppArmor userns restriction; lifting it for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true
          fi
      - name: Install dependencies
        run: uv sync
      - name: Run the sandbox escape and unit suites
        env:
          ASH_REQUIRE_SANDBOX_BACKENDS: ${{ matrix.require }}
          # The escape suite may plant a file in this runner account's own home
          # (the passwd entry's, not $HOME) and remove it: this job's runner is
          # thrown away with it. tests/utils/throwaway_runner.py.
          ASH_ESCAPE_TEST_WRITES_PASSWD_HOME: "1"
        run: |
          uv run pytest \
            tests/integration/sandbox \
            tests/unit/utils/test_sandbox_policy.py \
            tests/unit/utils/test_sandbox_choke_point.py \
            --run-integration --no-cov -p no:randomly -n 0 -v \
            --junit-xml=test-results/sandbox.junit.xml
      # A Mach service or exec path the macOS profile does not allow shows up in the
      # unified log as a deny line naming it, which is the first thing to look at
      # when a macOS image update turns this job red.
      - name: Show what sandbox-exec denied
        if: failure() && runner.os == 'macOS'
        run: |
          sudo log show --last 30m --predicate 'sender == "Sandbox"' --style compact \
            | grep -E 'deny\(1\) (mach-lookup|process-exec)' | tail -n 200 || true
      - name: Collect the suite report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-escape-report-${{ matrix.os }}
          path: test-results/sandbox.junit.xml
          retention-days: 7
          if-no-files-found: warn

  sandbox-scanner-parity:
    name: "sandbox scanner parity (${{ matrix.sandbox }}, ${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # run both scanner parity jobs at once, one per OS
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-latest
            sandbox: bwrap
          # sandbox-exec has no throwaway overlay and runs programs only from tool
          # paths, so on macOS each scanner's cache and unpack locations are
          # declared per scanner; this leg is what proves the declarations right.
          - os: macos-latest
            sandbox: sandbox-exec
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job uses git credentials after checkout.
          persist-credentials: false
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - name: Set up Ruby for cfn-nag
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: "3.3"
      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if ! bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true; then
            echo "::notice::bwrap refused by the AppArmor userns restriction; lifting it for this runner"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true
          fi
      - name: Install ASH with the cdk extra, and every scanner
        run: |
          pip install ".[cdk]"
          ash dependencies install
      # trivy-repo is a plugin scanner, so ASH knows its name only once its module is
      # loaded (`ash dependencies install --tool trivy-repo` without it exits 2,
      # "Unknown tool(s)"): the install loads it with an override, and the config
      # written here loads it for the parity runs. Its database and checks bundle are
      # then fetched into
      # trivy's own default cache, so that the offline pair has them: offline, ASH
      # updates nothing, and under sandbox-exec the cache is read-only, which an
      # offline trivy-repo scan must survive.
      - name: Install trivy-repo, enable it, and seed trivy's cache
        env:
          TMPDIR: ${{ runner.temp }}
          PARITY_CONFIG: ${{ runner.temp }}/parity-ash.yaml
          EMPTY_TARGET: ${{ runner.temp }}/trivy-empty-target
        run: |
          printf '%s\n' \
            'ash_plugin_modules:' \
            '  - automated_security_helper.plugin_modules.ash_trivy_plugins' \
            'scanners:' \
            '  trivy-repo:' \
            '    enabled: true' > "$PARITY_CONFIG"
          ash dependencies install --tool trivy-repo \
            --config-overrides "ash_plugin_modules+=[automated_security_helper.plugin_modules.ash_trivy_plugins]"
          trivy="$(python -c 'from automated_security_helper.utils.subprocess_utils import find_executable; print(find_executable("trivy") or "")')"
          test -n "$trivy" || { echo "::error::trivy was not installed"; exit 1; }
          "$trivy" --version
          "$trivy" image --download-db-only --no-progress
          mkdir -p "$EMPTY_TARGET"
          "$trivy" config "$EMPTY_TARGET"
      # The unit tests that run the real syft and trivy offline (a fake `go` on PATH
      # must record no call from syft; trivy must fetch no Terraform module source).
      # Every other job skips them, because only this one installs the tools. The
      # tools' directories go first on PATH, and ASH_REQUIRE_REAL_SCANNER_TESTS turns
      # a skip into a failure, so a change to the install above cannot pass by
      # skipping them (the ASH_REQUIRE_SYMBOLS_EXTRA pattern).
      - name: Run the real-scanner offline tests
        env:
          TMPDIR: ${{ runner.temp }}
          ASH_REQUIRE_REAL_SCANNER_TESTS: "1"
        run: |
          tools="$(python -c 'import os; from automated_security_helper.utils.subprocess_utils import find_executable; print(os.pathsep.join(os.path.dirname(find_executable(n) or "") for n in ("syft", "trivy")))')"
          export PATH="${tools}${PATH:+:${PATH}}"
          uv sync --frozen --extra cdk
          uv run --frozen pytest \
            tests/unit/plugin_modules/test_offline_go_toolchain.py \
            tests/unit/plugin_modules/test_offline_trivy_terraform_modules.py \
            --no-cov -p no:randomly -n 0
      # Every scanner runs twice over one fixture, with --sandbox off and under the
      # backend, offline and online, and status plus findings must match per scanner.
      # --require names the scanners that must actually have run, so a scanner that
      # is MISSING in both runs cannot pass parity by being absent; --require-offline
      # holds trivy-repo to that in the offline pair too. The config loads the Trivy
      # community module, so trivy-repo, which shares the builtin trivy's code, is
      # compared too.
      - name: Compare every scanner with and without the sandbox
        # The report path through the environment, not interpolated into the script,
        # which is this repository's convention for every context value a shell reads.
        env:
          TMPDIR: ${{ runner.temp }}
          PARITY_REPORT: ${{ runner.temp }}/sandbox-parity.json
          PARITY_CONFIG: ${{ runner.temp }}/parity-ash.yaml
          SANDBOX: ${{ matrix.sandbox }}
        run: |
          python scripts/verify_sandbox_scanner_parity.py \
            --sandbox "$SANDBOX" --online --ash ash \
            --config "$PARITY_CONFIG" \
            --require bandit,cdk-nag,cfn-nag,checkov,detect-secrets,grype,npm-audit,opengrep,semgrep,syft,actionlint,cfn-lint,cfn-guard,gitleaks,zizmor,trivy,trivy-repo \
            --require-offline trivy-repo \
            --report "$PARITY_REPORT"
      # What a sandboxed scanner was refused, from the unified log, and the end of
      # each sandboxed scanner's stderr. System daemons log their own sandbox
      # denials too, so only the processes the scanners run are kept.
      - name: Show what sandbox-exec denied the scanners
        if: failure() && runner.os == 'macOS'
        env:
          WORK: ${{ runner.temp }}
        run: |
          sudo log show --last 60m --predicate 'sender == "Sandbox"' --style compact \
            | grep -E 'Sandbox: (Python|python3?[.0-9]*|uv|node|npm|grype|syft|trivy|semgrep-core|pysemgrep|opengrep|opengrep\.bin|opengrep-core|ruby|bash|sh|git|security|env)\([0-9]+\) deny' \
            | sed -E 's/^.*Sandbox: //; s/\([0-9]+\) / /' | sort | uniq -c | sort -rn | head -n 150 || true
          for log in "$WORK"/ash-sandbox-parity-*/out-*-sandbox-exec/ash.log; do
            echo "::group::$log (errors and warnings)"
            grep -E "ERROR|WARNING|MISSING" "$log" | cut -c1-400 | head -n 80
            echo "::endgroup::"
          done
          for log in "$WORK"/ash-sandbox-parity-*/out-*-sandbox-exec/scanners/*/*/*stderr*; do
            [ -s "$log" ] || continue
            echo "::group::$log"
            tail -n 40 "$log"
            echo "::endgroup::"
          done
      - name: Collect the parity report and scan output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-scanner-parity-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/sandbox-parity.json
            ${{ runner.temp }}/ash-sandbox-parity-*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Multi-project attribution: assert a workspace scan keeps its projects apart.
  #
  # The sibling of external-target-scan, one dimension up. That job proves ASH
  # can scan a directory that is not its working directory and asserts on what
  # came back; this one proves that scanning N projects at once does not mix them.
  # The four regressions it exists for all produce a complete, well-formed results
  # file, so none of them can be caught by an exit status:
  #
  #   - a finding from project A reported against project B
  #   - project A's suppression silencing the same rule at the same relative path
  #     in project B, which is a silent false negative
  #   - both projects judged against one threshold, so one verdict is wrong
  #   - two projects sharing an output directory, the second overwriting the first
  #
  # The fixture puts a byte-identical file in all three projects, which is what
  # makes attribution testable: with three different files, "attributed to A"
  # would be satisfied by matching on the filename. One project is named 'src' on
  # purpose -- container mode mounts the workspace root at /src, so that project
  # is /src/src, the basename-collision shape from #361.
  #
  # Windows is in the matrix deliberately: this project's path, encoding and
  # console bugs concentrate there, and workspace mode adds a whole path space.
  # ---------------------------------------------------------------------------
  multi-project-attribution:
    name: "multi-project attribution (${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    # Keep in step with JOB_TIMEOUT_BUDGET_SECONDS in the script, which a unit
    # test ties to this number. DEFAULT_SCAN_TIMEOUT_SECONDS must stay below it so
    # the script's own diagnostics win the race against a job cancellation; 30 leaves
    # the scan's 1200 s a 540 s margin for the setup before it once the 60 s the
    # script spends stopping and draining a timed-out scan is counted (the note on
    # external-target-scan, which runs the same shape).
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # run both attribution jobs at once, one per OS
      max-parallel: 2
      matrix:
        # arm64 for the Linux leg, as on external-target-scan: the same two Python
        # tools, the same arch-keyed tool download cache, and a 2598 s ubuntu-latest
        # queue on run 40939758029 against 10 to 31 s on the arm64 label.
        os: [ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "true"
      # bandit is the only producer this gate asserts on. Installing it here means
      # an install flake fails as a failed install step with its own log, rather
      # than surfacing as "the fixture produced zero findings". bandit and checkov
      # only, the gate's GATE_SCANNERS (a unit test ties them together): a plain
      # install also needs cfn-nag, which this job gives no Ruby DevKit to build on
      # windows-latest, and fails there as a scan selecting it would.
      - id: tool-cache
        uses: ./.github/actions/tool-download-cache
        with:
          mode: restore
      - name: Install scanner dependencies
        shell: bash
        env:
          ASH_TOOL_DOWNLOAD_CACHE: ${{ steps.tool-cache.outputs.dir }}
        run: ash dependencies install --tool bandit --tool checkov
      - uses: ./.github/actions/tool-download-cache
        with:
          mode: save
          cache-hit: ${{ steps.tool-cache.outputs.cache-hit }}
      - name: Verify a workspace scan keeps its projects apart
        shell: bash
        # The gate builds its workspace with tempfile.mkdtemp(). Pointing the temp
        # dir at the runner's scratch space makes the tree's location predictable
        # enough to upload below. All three names because tempfile checks TMPDIR
        # first and TEMP/TMP on Windows. This sits on the step rather than the job
        # because the runner context does not exist in job-level env -- a workflow
        # using it there is rejected outright, with no jobs and no annotation.
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          ASH_TOOL_DOWNLOAD_CACHE: ${{ steps.tool-cache.outputs.dir }}
        run: python scripts/verify_multi_project_attribution.py --timeout 1200
      - name: Collect the kept workspace and scan output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-project-attribution-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/ash-multi-project-*
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Deploy-tree AWS helpers: run them against a real moto endpoint.
  #
  # The boto3 rewrite replaced `aws s3 cp --recursive` and `aws ssm get-parameter`
  # in the CDK buildspecs, because the ASH image those builds run in ships boto3
  # and no AWS CLI. A deployed pipeline had failed all four shards at `aws: not
  # found` AFTER a successful scan, so the scan stage went red and the merge never
  # ran. The CDK tests assert the rendered template contains the right strings,
  # which is what caught that -- but a string can be present and still wrong. A
  # recursive download that reads only the first ListObjectsV2 page, flattens the
  # key hierarchy, or writes outside its destination renders identically.
  #
  # So this job EXECUTES the command strings extracted from the committed
  # deploy/cdk/templates/*.template.json against a moto server, plus the Terraform
  # sibling helper, with every behavior test parametrized across both copies.
  #
  # WHY IT IS ITS OWN JOB WHEN unit-test ALREADY RUNS THESE: moto is a declared dev
  # dependency, so `uv sync && uv run pytest` in the unit-test matrix does run this
  # suite on all five OSes. That is good, and it is not sufficient -- the matrix's
  # check is pytest's exit status, which stays 0 while the suite shrinks. Measured
  # on this suite: marking one class skip, dropping one parametrization, or
  # renaming one module out of the discovery pattern each deletes about a third of
  # the coverage and leaves pytest exiting 0. scripts/verify_moto_server_suite.py
  # asserts on the run instead -- a floor on tests executed, zero skips, both
  # helper copies exercised, both modules present.
  #
  # Linux only, and deliberately: the buildspec commands under test are POSIX shell
  # destined for a Linux CodeBuild container, and the suite skips those on Windows.
  # The gate refuses ANY skip, so running it here is what makes "zero skips"
  # meaningful. Python 3.12 only for the same reason the other gates pin it -- the
  # unit-test matrix already covers this suite across every version.
  # ---------------------------------------------------------------------------
  deploy-aws-helpers:
    name: deploy-tree AWS helpers (moto server)
    needs: [ensure-cache]
    # arm64 for the reason given on `lint`: moto and the suite are pure Python, and on
    # run 40939758029 this job queued 2598 s on ubuntu-latest for an 18 s run.
    runs-on: ubuntu-24.04-arm
    # The suite's own slowest test uploads 1050 objects to force a second
    # ListObjectsV2 page; the whole run measures ~30s at 4 workers. 15 leaves room
    # for a slow runner without letting a hang sit for half an hour.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      # The suite needs the dev group, which is where moto[server] lives. The
      # [server] extra is the part that provides ThreadedMotoServer; bare moto
      # only patches botocore in-process and cannot reach the subprocesses these
      # tests run.
      - name: Install dependencies
        run: uv sync
      # No AWS credentials are configured for this job, and the fixture sets fake
      # ones plus AWS_CONFIG_FILE/AWS_SHARED_CREDENTIALS_FILE pointing at paths
      # that do not exist. Both matter: without AWS_ENDPOINT_URL a bare
      # boto3.client("s3") resolves s3.amazonaws.com and really does send the
      # request, so the fake credentials are the backstop and the suite has a test
      # asserting the endpoint variable is what routes it to moto.
      - name: Verify the deploy-tree AWS helpers against a moto server
        run: uv run python scripts/verify_moto_server_suite.py --workers 4
      # The gate writes its own report so a red run leaves per-test evidence
      # rather than only the summary line that failed the step.
      - name: Collect the suite report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moto-server-suite-report
          path: test-results/moto-server-suite.junit.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Integration suite: the tests that were skipped in every run until now
  # ---------------------------------------------------------------------------
  #
  # WHAT THIS RECOVERS, AND WHY IT IS NOT A COUNT OF FIXES
  #
  # THE FIGURES BELOW ARE A DATED MEASUREMENT UNDER THE GATE THAT PRECEDED THE TIERS. When
  # this job was added, tests/conftest.py skipped every item whose keywords contained
  # "integration" unless --run-integration was passed, and the counts here were taken
  # under that keyword gate. The gate is the tier marker now: tests/conftest.py skips the
  # items that carry the `integration` or `e2e` marker unless --run-integration is passed,
  # whatever their names, and the `slow` marker is gated by --run-slow as before. So the
  # set --run-integration un-skips today is the two marked tiers, e2e included, and it is
  # not the 115 below; the integration-test-linux, -macos and -windows jobs select that
  # population by marker across the whole tree. This job's own population is tests/
  # integration/ by path (the command below), so its count is a property of that
  # directory. Nothing below has been re-measured under the marker gate; the figures stay
  # as the record of what the job recovered when it was added, and of how they reconcile.
  #
  # Nothing passed --run-integration except the single cdk-nag step in run-unit-tests, so
  # the whole set was skipped in every run -- and a skipped suite exits 0, which is why
  # nobody noticed. Measured on the tree of that day at -n 0: with the flags off, 115
  # skipped; with them on, 10 failed, 102 passed, 2 skipped, 1 xfailed, reconciling to the
  # same 115.
  #
  # So the honest account is that the gate was hiding far more working coverage than broken
  # coverage. Around 102 of these pass and have been asserting nothing. The failures are the
  # more visible part and much the smaller one, and two tests in
  # tests/integration/test_global_suppressions.py had never passed since the day they were
  # written -- a skip cannot tell you whether a test ever worked.
  #
  # Every figure here is invocation-dependent and commit-dependent, so treat it as a
  # measurement with a date rather than a property of the suite. The same population was 104
  # items with 39 failures before the resource_management and MCP repairs landed on this
  # branch; those deleted a duplicated test file and added MCP coverage, which is why it
  # read 115 items with 10 failures when last counted, under the keyword gate. Re-measure
  # under the marker gate rather than adjusting these by arithmetic.
  #
  # POPULATIONS THAT RECONCILED, SO NONE OF THEM HAD TO BE TAKEN ON TRUST
  #
  # Under the keyword gate, a census of what un-skipped under --run-integration alone did not
  # match the 115 above, and the difference was the two gates below rather than a
  # disagreement (under the marker gate the un-skip set is the two marked tiers, so these
  # three numbers describe the keyword-gate measurement only):
  #
  #     115   items whose keywords contained "integration"
  #     - 4   of those also carried an explicit @pytest.mark.slow, so --run-integration alone
  #           left them skipped; this job passes --run-slow as well, which is why it sees them.
  #           Counted as explicit marks only: at that time a slow mark that
  #           tests/integration/cli/conftest.py adds by test name (workflow, lifecycle,
  #           end_to_end) was a label the --run-slow gate did not read, and today it is a
  #           second gate (the slow skip reads the mark, explicit or added by name), so the
  #           109 below does not reconcile under the current rule by this method
  #     - 2   unconditional @pytest.mark.skip in test_detect_secrets_scanner.py, which no
  #           flag reaches
  #     = 109 items that actually run under --run-integration by itself
  #
  # Checked the other direction too: this job's own control ran 113 items (10 failed, 102
  # passed, 1 xfailed), and 113 - 4 = 109. The slow-marked items and the unconditionally
  # skipped ones are disjoint sets, verified rather than assumed, so nothing is subtracted
  # twice. Anyone auditing a count here should be able to land on the same three numbers; if
  # two of them disagree, the gate list above is where the missing items went.
  #
  # WHY THESE SELECTORS AND NOT THE OBVIOUS ONES
  #
  # Both flags, not just --run-integration. Four of the 115 carried an explicit
  # @pytest.mark.slow, which conftest gates separately, so --run-integration alone left them
  # skipped -- the same silent pass this job exists to remove. The slow gate reads the mark,
  # explicit or added by name: tests/integration/cli/conftest.py adds `slow` to every test
  # under tests/integration whose function name contains "workflow", "lifecycle" or
  # "end_to_end", and such a test needs both flags too. The census above counted explicit
  # marks only, so a re-measure counts the gate as "slow mark, explicit or added by name".
  # --run-slow costs nothing in scope: a `unit` test may not carry `slow` (tests/conftest.py
  # refuses the pair at collection, since the unit tier runs without --run-slow), so every
  # slow-marked item is integration or e2e.
  #
  # One path: this job runs the tests under tests/integration/, the source-delivery
  # end-to-end test included (tests/integration/cli/). Tests under tests/unit/ that carry
  # the integration marker (the CI-workflow pins that run a bash step, for example) are
  # not in this job's population; the integration-test-linux, -macos and -windows jobs
  # select them by marker. They run under the same unit-suite tool guard
  # (tests/unit/conftest.py) as before the split, because that guard is an autouse fixture
  # keyed on the directory, not on the marker: a test there that starts a real scanner on
  # purpose still has to say so with `runs_real_tools` and be listed in REAL_TOOL_MODULES.
  #
  # Not `-k integration`. Under the keyword gate it selected 126 rather than 115, because -k
  # substring-matches node ids as well as keywords and picked up 11 tests that were not gated
  # and already ran in unit-test. That 11-test gap held across both measurements of this
  # suite while the absolute numbers moved, which is the reason to re-derive a population
  # with a collection pass asking pytest for the marker (`item.get_closest_marker`, what the
  # gate reads now) rather than trusting any name-based selector to mirror it.
  #
  # Its own job rather than a step in run-unit-tests, because these exercise scanner and MCP
  # integration, not Python-version behavior; when run-unit-tests ran the whole suite in 200
  # legs, a step there bought 200 copies of one signal. -n 0 rather than the inherited
  # -n auto because every cdk-nag test boots a real kernel and jsii extraction is billed per
  # booting worker -- see the table in tests/conftest.py.
  #
  # --no-cov: the 80% coverage gate belongs to the unit tier. The "Run PyTest" step of
  # run-unit-tests measures coverage for `-m unit` only, and the unit-coverage job applies
  # the gate to that data. pytest.ini carries no coverage options, so this only keeps the
  # job from measuring anything if they are ever added there again.
  #
  # Two items stay skipped with both flags on, at
  # tests/integration/scanners/test_detect_secrets_scanner.py:111 and :139. Those are
  # unconditional @pytest.mark.skip with a written reason, and they report as skipped with
  # that reason rather than vanishing.
  #
  # THE DOCS EXAMPLES ARE A SECOND STEP, NOT PART OF THE POPULATIONS ABOVE
  #
  # tests/integration/docs runs every runnable shell and python block in the docs
  # (scripts/docs_checks.py decides which), one test per page. The integration step
  # passes --ignore for that directory, so every figure above still describes the same
  # population it was measured on, and the docs examples run in their own step with
  # their own time limit. Two reasons for the split: their population is a property of
  # the docs, not of the test code, and moves with every page added; and a page whose
  # commands hang must not take the integration suite's verdict down with it when the
  # job times out. It collects one test per page with a runnable block, the proofs in
  # test_docs_runner_can_fail.py that the runner reports each kind of failure, and a
  # guard that discovery found any page at all. No count is written here, because it
  # changes whenever a page gains or loses a runnable block.
  # -n 4 because pages are independent sessions in their own directories and the
  # runner is mostly waiting on subprocesses; ubuntu-latest has 4 vCPUs.
  #
  # This job stays beside the integration-test-linux, -macos and -windows families because
  # it is the one job that installs the real scanners and sets
  # ASH_REQUIRE_PREINSTALLED_TOOLS. The tier jobs select by marker across the whole tree
  # and skip a real-tool test whose tool is absent.
  integration-test:
    name: integration-test (ubuntu-latest)
    needs: [ensure-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      # The second line completes the cfn-lint the project environment already
      # carries: moto (dev group) depends on cfn-lint, so `.venv/bin/cfn-lint` exists
      # without the `sarif` extra, and `uv run` puts `.venv/bin` ahead of every other
      # PATH entry, so the cfn-lint scanner finds that copy before the uv tool the
      # step below installs. Its pre-installed check requires `cfn-lint[sarif]`, and
      # offline (the cfn-lint tests scan with ASH_OFFLINE) a missing extra makes the
      # scanner MISSING. The spec is the scanner's own; it adds the extra's packages
      # and leaves the locked cfn-lint version in place. `uv run` syncs inexactly, so
      # the added packages survive it.
      - name: Install dependencies
        run: |
          uv sync --extra cdk --extra symbols
          uv pip install 'cfn-lint[sarif]>=1.43.3,<2.0.0'
      # The integration suite runs bandit, actionlint, cfn-lint, cfn-guard and gitleaks
      # for real, and nothing else in this job installs them: the first test that
      # needed bandit ran `uv tool install` from inside the suite. This is the
      # installer users run, it installs before any test starts, and it also exercises
      # the pinned downloads and the cfn-guard rules-bundle install.
      # ASH_REQUIRE_ACTIONLINT, ASH_REQUIRE_CFN_TOOLS and ASH_REQUIRE_GITLEAKS below make
      # a missing tool fail those tests instead of skipping them. Without gitleaks here,
      # both tests in test_repo_tool_configs_are_not_read.py skipped.
      # tests/unit/test_integration_job_installs_required_tools.py holds this list.
      #
      # checkov, semgrep and zizmor are installed here too. The links-leaving-the-tree
      # scan runs every scanner with a home of its own, so a uv tool a test installed
      # under the suite's private home is invisible to it and the scanner records
      # MISSING; a tool on PATH is seen by both. Without these three that test cannot
      # tell a scanner that could not run from one that should have.
      - name: Install the scanners the integration suite runs for real
        run: uv run ash dependencies install --tool bandit --tool actionlint --tool cfn-lint --tool cfn-guard --tool gitleaks --tool checkov --tool semgrep --tool zizmor
      # ASH_REQUIRE_CDK_EXTRA turns a missing cdk extra into a hard failure rather than a
      # skip, so this job cannot quietly stop testing the cdk-nag path if the install above
      # changes. ASH_REQUIRE_SYMBOLS_EXTRA does the same for the symbol-suppression scan,
      # ASH_REQUIRE_ACTIONLINT for the actionlint tests, and ASH_REQUIRE_GITLEAKS for the
      # tests that run gitleaks from PATH. ASH_REQUIRE_PREINSTALLED_TOOLS names every
      # tool the step above installed: the suite fails at start if it cannot find one the
      # way its scanner looks (the uv tools by `uv tool list` or PATH, the pinned
      # binaries on PATH), and a test fails if it `uv tool install`s one, so a
      # pre-install that stops reaching the scanner shows up instead of being redone.
      #
      # The installs above put the pinned binaries in ~/.ash/bin and the uv tools in
      # ~/.local/bin. PATH gains both for this step only, not through GITHUB_PATH, so no
      # later step of the job runs an executable by name from either directory.
      #
      # The cfn-guard rules bundle the install above put under ~/.ash/share is named
      # by ASH_CFN_GUARD_RULES_DIR for the same reason: tests/conftest.py gives every
      # test a home of its own, and without the variable the scanner (and the cfn-lint
      # and cfn-guard tests' own tool check) look for the bundle under that home, where
      # nothing installed it. The container image sets the same variable.
      - name: Run the integration suite
        env:
          ASH_REQUIRE_ACTIONLINT: "1"
          ASH_REQUIRE_CDK_EXTRA: "1"
          ASH_REQUIRE_CFN_TOOLS: "1"
          ASH_REQUIRE_GITLEAKS: "1"
          ASH_REQUIRE_SYMBOLS_EXTRA: "1"
          ASH_REQUIRE_PREINSTALLED_TOOLS: bandit,actionlint,cfn-lint,cfn-guard,gitleaks,checkov,semgrep,zizmor
        run: |
          export PATH="$HOME/.ash/bin:$HOME/.local/bin:$PATH"
          export ASH_CFN_GUARD_RULES_DIR="$HOME/.ash/share/cfn-guard-rules"
          uv run pytest \
            tests/integration \
            --ignore=tests/integration/docs \
            --run-integration --run-slow \
            --no-cov -p no:randomly -n 0 \
            --junit-xml=test-results/integration.junit.xml
      # Runs even when the step above failed, so the two verdicts stay separate.
      # PATH gains the same two directories as in the step above, for this step only:
      # the local tutorial's twin and the tutorial page's bandit scan look for the bandit
      # the install step put in ~/.local/bin, and fail when it is not on PATH.
      - name: Run the docs examples
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          export PATH="$HOME/.ash/bin:$HOME/.local/bin:$PATH"
          uv run pytest \
            tests/integration/docs \
            --run-integration \
            --no-cov -p no:randomly -n 4 \
            --junit-xml=test-results/docs-examples.junit.xml
      # A red run leaves per-test evidence rather than only the summary line.
      - name: Collect the suite report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-suite-report
          path: test-results/integration.junit.xml
          retention-days: 7
          if-no-files-found: warn
      - name: Collect the docs examples report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-examples-report
          path: test-results/docs-examples.junit.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Documentation site: the strict build and the versioned-site check
  # ---------------------------------------------------------------------------
  #
  # The third docs layer, after the static checks in lint and the docs examples in
  # integration-test (docs/content/contributing/documentation.md). It runs here, on every
  # pull request and merge queue entry, so required-checks depends on it and a page that
  # breaks the site build cannot merge. It used to run only in ash-repo-docs.yml, which no
  # required check depends on, so a failed build there did not block a merge.
  # ash-repo-docs.yml now only deploys.
  #
  # `mkdocs build --strict` fails on every warning that mkdocs.yml's validation settings
  # raise: broken links and anchors, nav entries with no page, and pages missing from the
  # nav. scripts/docs_checks.py (check_site_build) keeps those settings strict and reads
  # this job's steps, so neither can be relaxed without lint failing.
  #
  # `docs_versions.py check` publishes two releases and main to a throwaway branch of this
  # checkout, with every proxy pointed at a port that refuses connections, and checks what
  # a reader of each version gets: the version selector, each version's notice, latest/,
  # and the redirects at the site root. It deletes the branch and never pushes, and this
  # job's token could not push anyway.
  #
  # One block on purpose: the job reads nothing from the jobs around it, so it merges as a
  # unit when other changes rewrite this file.
  build-docs:
    name: build-docs
    needs: [ensure-cache]
    # arm64 for the reason given on `lint`: mkdocs and the versions check are pure
    # Python, and on run 40939758029 this job queued 2601 s on ubuntu-latest for a 32 s run.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # The versions check commits to a local branch and never fetches or pushes, so
      # the checkout keeps no credentials.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - name: Install dependencies
        run: uv sync
      - name: Build the documentation site
        run: uv run mkdocs build --clean --strict
      - name: Check the versioned site
        run: uv run python scripts/docs_versions.py check

  # The Jupyter converter's integration tests on the two platforms integration-test does
  # not run. Only these, because they provision their tool the way ASH does -- the
  # converter's own validate_plugin_dependencies runs `uv tool install nbconvert` -- and
  # that works the same on macOS and Windows; the rest of tests/integration has not been
  # made portable. Windows is the one that matters most here: it looks for a program
  # started by name in the working directory before PATH.
  converter-integration:
    name: "converter-integration (${{ matrix.os }})"
    needs: [ensure-cache]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # run both converter integration jobs at once, one per OS
      max-parallel: 2
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-ash
        with:
          python-version: "3.12"
          install-ash: "false"
      - name: Install dependencies
        run: uv sync
      - name: Run the converter integration tests
        run: uv run pytest tests/integration/converters --run-integration --no-cov -p no:randomly -n 0

  # ---------------------------------------------------------------------------
  # Install methods: method x OS x Python (matches ash-install-methods.yml)
  # ---------------------------------------------------------------------------
  #
  # There are two install-validation surfaces and they are NOT redundant, so both
  # have to carry every supported Python version. This one is unconditional --
  # push, pull_request and merge_group -- and it is the one `required-checks`
  # depends on, so it is what actually gates a merge. ash-install-methods.yml is
  # path-filtered to pyproject.toml, hatch_build.py, automated_security_helper/**
  # and a few others, and it adds the `nix` method this job does not carry.
  #
  # Keep the `python-version` axes of the two identical, deliberately: a version
  # added to one and not the other leaves a supported interpreter untested on
  # whichever surface was missed. The two still agree on which (os, python-version)
  # cells pip, pipx, pre-commit and mcp cover, including macOS 14 x {3.10, 3.11} --
  # they just no longer agree on the SHAPE. ash-install-methods.yml keeps one leg
  # per method; this job runs those four, plus uvx, as steps inside one `bundle`
  # leg per cell (see the note above the job). So the thing to keep aligned is the
  # cell coverage, not the leg names, and `method: [bundle, ...]` here against
  # `method: [pip, pipx, ...]` there is not a drift to reconcile.
  #
  # `unit-test` above excludes macOS 14 x {3.10, 3.11} on the grounds that macOS
  # ARM only has 3.12 and later. THAT REASON IS FALSE, measured two ways:
  #
  # 1. This job runs macOS 14 x {3.10, 3.11} for pip, pipx, pre-commit and mcp on
  #    every pull request, and they pass. Sampled runs 35350532730 and
  #    35351617775: 8 of 8 success in each -- 8 legs then, the same 8 method-on-cell
  #    runs inside 2 `bundle` legs now.
  # 2. The actions/python-versions manifest carries darwin/arm64 builds for
  #    3.10.11 and 3.11.9, so setup-python has something to resolve.
  #
  # Deliberately NOT un-excluded here. The evidence proves those versions run on
  # that platform for *installs*; it does not prove the unit-test suite passes
  # there, and no unit-test leg has ever executed on macOS 14 below 3.12, so
  # dropping the exclusion would run them for the first time inside an unrelated
  # change. Un-excluding is its own change, with its own verdict to read.
  #
  # WHY `bundle` IS ONE LEG AND NOT FIVE
  #
  # pip, pipx, uvx, pre-commit and mcp used to be five values on the `method` axis,
  # which made them 105 of this job's 113 legs. They are not 105 legs' worth of
  # work: `validate-install` averages 21 seconds per invocation over 113 of them
  # and `validate-mcp` 14 seconds. The cost was never the work, it was the leg
  # count -- run 36089835349 spent 32.7 minutes of wall clock and 391.2 minutes of
  # machine time behind 1178.2 minutes of queue, because every one of its 196 jobs
  # waited about 6.5 minutes for a runner. Queue time was three times the machine
  # time and it is charged per job, so those 105 legs held runners for 82 minutes
  # of machine time (pip 22.9, pipx 20.3, mcp 30.2, pre-commit 5.9, uvx 3.0) after
  # roughly 10.5 hours of queue, summed across the legs.
  #
  # So those five collapse into one `bundle` leg per (os, python-version), running
  # each method as its own step. 113 legs -> 33, which is 80 fewer runners queued
  # for and the same five methods run on all 25 cells. (32 with the
  # ubuntu-24.04-arm homebrew leg excluded: that image has no Homebrew.) Nothing is
  # cached and nothing is uploaded to get there, deliberately: on a public
  # repository GitHub's caching and artifact-upload actions are both readable by
  # anyone holding a read token, so nothing this repo builds may be put in either,
  # and no image or wheel may be pushed anywhere. The saving is purely fewer queue
  # waits. Do not "improve" it by adding a cache. The caching this workflow already
  # has is setup-uv's `enable-cache` -- in the lint job and in
  # .github/actions/setup-ash -- and it holds third-party wheels that are public
  # already, which is why it is allowed to stay and why it must not be widened to
  # cover anything ASH builds.
  #
  # TWO THINGS THE COLLAPSE HAD TO PRESERVE, both easy to lose silently:
  #
  # 1. Per-method verdicts. Five methods in one job would ordinarily stop at the
  #    first failure, so a pip break would hide whether pipx also broke -- and a
  #    red `bundle` leg that names one method out of five is worse to debug than
  #    five red legs. Each method therefore carries `continue-on-error: true` and
  #    an `id`, and the `bundle: verdict` step below reads every recorded outcome,
  #    prints all five, and fails naming each one that did not match what it was
  #    supposed to report. That step is the leg's verdict; the per-method steps
  #    deliberately do not decide it.
  #
  # 2. Which install each method's `ash` actually is. Five methods in one job share
  #    a PATH, and pip and pipx both put an `ash` on it. The step order below is
  #    load-bearing for that reason: pipx runs FIRST, while its shim is the only
  #    `ash` on the machine, so `pipx: verify` cannot be answered by pip's copy.
  #    pip runs second, and setup-python writes its own bin directory to
  #    GITHUB_PATH, which prepends ahead of the image's default PATH -- so pip's
  #    entry point wins the lookup for every later step. Reordering these two
  #    turns one of them into a duplicate of the other while staying green.
  install-validation:
    name: "${{ matrix.method }} (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    # finch has been observed succeeding at 23 min and hanging past 280; podman is
    # similarly slow, so the container runtimes get enough room to pass
    # legitimately. homebrew installs the formula from source (bottles for its
    # python@3.12, uv and node, then the locked wheels), runs `brew test` and five
    # scans. validate-install/homebrew.sh took 294 seconds in a homebrew/brew
    # container on Homebrew 7.0.9 with python@3.12 already present, so it keeps
    # the tight 20.
    #
    # `bundle` gets 30. The old 20 bounded a single install method, on the measured
    # grounds that each peaks under 3 min; one leg now runs five of them back to
    # back, so the same headroom needs a bigger number. 30 is still a real bound --
    # a hung pipx build or npm install gets cut rather than burning the job's hour.
    timeout-minutes: ${{ ((matrix.method == 'podman' || matrix.method == 'finch' || matrix.method == 'nerdctl') && 45) || (matrix.method == 'bundle' && 30) || 20 }}
    strategy:
      fail-fast: false
      # cap the install-validation fan-out so one run leaves room on the shared runner pool
      max-parallel: 20
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # `bundle` is pip + pipx + uvx + pre-commit + mcp, as steps. homebrew and
        # the three container runtimes stay their own legs: they are already
        # trimmed to a single Python version and carry OS-specific excludes, so
        # they are 7 legs in total (homebrew 3, podman 2, finch 1, nerdctl 1) and
        # none of them is the redundancy. tests/unit/test_unified_ci_job_counts.py
        # holds that number to the matrix.
        method: [bundle, homebrew, podman, finch, nerdctl]
        exclude:
          # The pull-request cover (the note on ensure-cache). On a pull_request event the
          # bundle and homebrew legs leave the ubuntu-latest image, every leg leaves
          # macos-latest (the bundle and the Homebrew formula run on macos-15 there), and
          # Python 3.11 and 3.13 leave the bundle (the other methods already run on 3.12
          # only). The podman, finch and nerdctl legs are container runtimes pinned to
          # x86_64 images and keep their ubuntu-latest legs on every event. Homebrew on
          # macOS stays covered by the homebrew-macos job as well. On every other event
          # these five entries evaluate to '' and match no combination.
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || '' }}
            method: bundle
          - os: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || '' }}
            method: homebrew
          - os: ${{ github.event_name == 'pull_request' && 'macos-latest' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.11' || '' }}
          - python-version: ${{ github.event_name == 'pull_request' && '3.13' || '' }}
          # Homebrew not on Windows
          - { os: windows-latest, method: homebrew }
          # Nor on the Arm Linux image (actions/partner-runner-images lists it under
          # omitted tools, "no packages for Arm Linux"). The leg installs the formula
          # for real, so it needs a brew.
          - { os: ubuntu-24.04-arm, method: homebrew }
          # Podman/Finch/nerdctl not on Windows
          - { os: windows-latest, method: podman }
          - { os: windows-latest, method: finch }
          - { os: windows-latest, method: nerdctl }
          # Finch Linux is x86_64 only
          - { os: ubuntu-24.04-arm, method: finch }
          # nerdctl: x86_64 only for now. An arm64 bundle exists upstream, but
          # scripts/setup-nerdctl-linux.sh verifies a pinned checksum and only the amd64
          # one has been confirmed against the artifact; the script fails rather than
          # downloading unverified bytes for another architecture.
          - { os: ubuntu-24.04-arm, method: nerdctl }
          # nerdctl on macOS needs a Linux VM, and hosted macOS has no nested
          # virtualization -- same reason as podman and finch below.
          - { os: macos-latest, method: nerdctl }
          - { os: macos-15, method: nerdctl }
          # nerdctl only needs Python 3.12
          - { os: ubuntu-latest, python-version: "3.10", method: nerdctl }
          - { os: ubuntu-latest, python-version: "3.11", method: nerdctl }
          - { os: ubuntu-latest, python-version: "3.13", method: nerdctl }
          - { os: ubuntu-latest, python-version: "3.14", method: nerdctl }

          # Container runtimes only need Python 3.12
          - { os: ubuntu-latest, python-version: "3.10", method: podman }
          - { os: ubuntu-latest, python-version: "3.11", method: podman }
          - { os: ubuntu-latest, python-version: "3.13", method: podman }
          - { os: ubuntu-latest, python-version: "3.14", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.10", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.11", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.13", method: podman }
          - { os: ubuntu-24.04-arm, python-version: "3.14", method: podman }
          # Podman/Finch not on macOS (no nested virtualization on hosted runners)
          - { os: macos-latest, method: podman }
          - { os: macos-15, method: podman }
          - { os: ubuntu-latest, python-version: "3.10", method: finch }
          - { os: ubuntu-latest, python-version: "3.11", method: finch }
          - { os: ubuntu-latest, python-version: "3.13", method: finch }
          - { os: ubuntu-latest, python-version: "3.14", method: finch }
          - { os: macos-latest, method: finch }
          - { os: macos-15, method: finch }

          # Homebrew only needs Python 3.12 (the formula brings its own python@3.12)
          - { os: ubuntu-latest, python-version: "3.10", method: homebrew }
          - { os: ubuntu-latest, python-version: "3.11", method: homebrew }
          - { os: ubuntu-latest, python-version: "3.13", method: homebrew }
          - { os: ubuntu-latest, python-version: "3.14", method: homebrew }
          - { os: macos-latest, python-version: "3.10", method: homebrew }
          - { os: macos-latest, python-version: "3.11", method: homebrew }
          - { os: macos-latest, python-version: "3.13", method: homebrew }
          - { os: macos-latest, python-version: "3.14", method: homebrew }
          - { os: macos-15, python-version: "3.10", method: homebrew }
          - { os: macos-15, python-version: "3.11", method: homebrew }
          - { os: macos-15, python-version: "3.13", method: homebrew }
          - { os: macos-15, python-version: "3.14", method: homebrew }

          # uvx used to need 20 exclude entries of its own to stay at 3.12, because
          # it bundles its own interpreter and so does identical work on every
          # python-version cell. It is now a step inside `bundle` carrying the same
          # 3.12-only condition, so the exclusions are expressed once, at the step,
          # instead of 20 times here. The `bundle` value itself has no static exclusion:
          # pip, pipx, pre-commit and mcp all ran on all 25 cells before this and
          # all 25 after; the pull-request cover at the top of this list is the one
          # event-conditioned exception, and it leaves the push and merge-queue runs at 25.
    steps:
      # FAIL CLOSED BEFORE ANY OF THE ROUTING CONDITIONS BELOW
      #
      # The three `uses:` steps at the end of this job are mutually exclusive `if:`s with no
      # else. A method that satisfies none of them -- a new entry on the `method` axis, or one
      # renamed on the axis and not in the conditions -- runs checkout and setup-python, does no
      # validation at all, and exits 0. `required-checks` then counts that leg as a success, so
      # the method reads as validated on every pull request while nothing has ever installed it.
      #
      # This is the same guard .github/actions/validate-container/action.yml carries for its
      # `runtime` input ("Assert this runtime has a scan leg"), for the same reason: a routing
      # table with no default arm is a silent no-op, and a silent no-op inside a gate is worse
      # than a missing leg because it reports the opposite of the truth.
      #
      # It runs first so the leg dies before spending a checkout on work it will not do.
      # tests/unit/test_ci_matrix_agreement.py reconciles the arms below against the routing
      # conditions AND against the `method` axis, so none of the three can drift from the other
      # two without a unit-test failure.
      - name: "Assert this install method is routed to a validator"
        shell: bash
        env:
          METHOD: ${{ matrix.method }}
        run: |
          # The arms are the `method` axis above, and nothing else. They were
          # `pip | pipx | uvx | homebrew | pre-commit`, `podman | finch | nerdctl` and
          # `mcp`, which was the axis before those five cheap methods became steps
          # inside a single `bundle` leg. After that change the list named five values
          # that can no longer occur while omitting the one that does, so every bundle
          # leg -- 25 of the 33 the job had then -- fell through to the `*)` below and
          # exited 1.
          # Measured by extracting this shell and running it with METHOD=bundle.
          #
          # The five folded methods are NOT listed here. They are steps, and the steps
          # carry their own `if: matrix.method == 'bundle'`; naming them would make this
          # guard accept values the matrix cannot produce, which is the direction that
          # hides a problem rather than causing one.
          case "${METHOD}" in
            bundle) ;;
            homebrew) ;;
            podman | finch | nerdctl) ;;
            *)
              echo "::error::install-validation has no validator for method '${METHOD}'. The routing conditions on the steps at the end of this job cover none of it, so this leg would run setup-python and then nothing, and exit 0. Route it to a composite action and add it to the case above."
              exit 1
              ;;
          esac
          echo "${METHOD}: routed to a validator"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every method still on the axis needs an interpreter, so this is no longer
      # conditional. The `matrix.method != 'uvx'` it used to carry existed solely
      # for the uvx leg, and uvx is not a leg any more. It does mean uv now resolves
      # against a Python that setup-python put there rather than whatever the image
      # shipped -- the same uvx install and the same scan, from a slightly
      # friendlier starting state than the old bare leg.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # --- bundle: five install methods, five recorded verdicts, one runner ------
      #
      # `continue-on-error: true` on each is what keeps the later methods running
      # after an earlier one breaks. It makes the step's *conclusion* success while
      # leaving its *outcome* failure, so `success()` still holds for the steps that
      # follow and none of them gets skipped. The outcome is the part that matters
      # and `bundle: verdict` is the only step that acts on it.
      #
      # pipx is deliberately first: see the ordering note above the job.
      - name: pipx
        id: pipx
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: pipx

      - name: pip
        id: pip
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: pip

      - name: mcp
        id: mcp
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-mcp

      - name: pre-commit
        # The id has no hyphen on purpose. `steps.pre-commit.outcome` parses as a
        # subtraction in a GitHub expression, not as a step lookup.
        id: precommit
        if: matrix.method == 'bundle'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: pre-commit
          # Every cell checks the manifest; the hooks themselves run on one cell per
          # OS, because each run installs ASH with the cdk extra into a fresh hook
          # environment and then bandit and checkov from PyPI. Same expression as
          # ash-install-methods.yml (tests/unit/test_pre_commit_hooks_manifest.py).
          # A pull request runs no ubuntu-latest and no macos-latest bundle leg (the
          # pull-request cover, the note on ensure-cache), so the hooks run on Windows
          # there; the Linux and macOS hook runs are the merge-queue entry's and the push's.
          pre-commit-run-hooks: ${{ matrix.python-version == '3.12' && contains(fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]'), matrix.os) }}

      - name: uvx
        id: uvx
        # 3.12 only, because uvx brings its own interpreter and the other four cells
        # would repeat this run verbatim. This is the same coverage the 20 deleted
        # `method: uvx` excludes bought: five uvx runs, one per OS.
        if: matrix.method == 'bundle' && matrix.python-version == '3.12'
        continue-on-error: true
        uses: ./.github/actions/validate-install
        with:
          method: uvx

      # The leg's actual verdict. Asserting an EXPECTED outcome per method, rather
      # than "nothing said failure", is what stops this from failing open: a step
      # whose `if` someone later breaks reports `skipped`, and a check that waves
      # skipped through would keep printing green over a method that stopped
      # running. Only uvx is allowed to be skipped, only off 3.12, and the
      # expression below says so rather than the shell inferring it.
      - name: "bundle: verdict"
        if: matrix.method == 'bundle'
        shell: bash
        env:
          # method, outcome, required outcome -- one method per line.
          BUNDLE_OUTCOMES: |
            pipx ${{ steps.pipx.outcome }} success
            pip ${{ steps.pip.outcome }} success
            mcp ${{ steps.mcp.outcome }} success
            pre-commit ${{ steps.precommit.outcome }} success
            uvx ${{ steps.uvx.outcome }} ${{ matrix.python-version == '3.12' && 'success' || 'skipped' }}
        run: |
          set -eu
          # No bash arrays: hosted macOS runners are still on bash 3.2, where
          # ${#arr[@]} on an empty array is an unbound-variable error under `set -u`.
          failed=""
          while read -r method outcome required; do
            [ -n "$method" ] || continue
            if [ "$outcome" = "$required" ]; then
              printf '%-12s %s\n' "$method" "$outcome"
            else
              printf '%-12s %s   (required: %s)\n' "$method" "$outcome" "$required"
              failed="$failed $method=$outcome"
            fi
          done <<EOF
          $BUNDLE_OUTCOMES
          EOF
          if [ -n "$failed" ]; then
            echo "::error::install-validation bundle failed:$failed"
            exit 1
          fi
          echo "all five bundled install methods reported their required outcome"

      # --- the legs that stay legs ---------------------------------------------
      - uses: ./.github/actions/validate-install
        if: matrix.method == 'homebrew'
        with:
          method: homebrew

      - uses: ./.github/actions/validate-container
        if: matrix.method == 'podman' || matrix.method == 'finch' || matrix.method == 'nerdctl'
        with:
          runtime: ${{ matrix.method }}

  # ---------------------------------------------------------------------------
  # Homebrew on macOS, a supported install method, in a job of its own
  # ---------------------------------------------------------------------------
  #
  # install-validation's matrix carries Homebrew legs too (ubuntu-latest, macos-latest,
  # macos-15), and this job does not replace them. It exists so Homebrew on macOS stays
  # tested whatever happens to that matrix: one exclude entry drops a matrix cell, and
  # nobody has to decide to stop testing macOS for that to happen.
  # tests/unit/test_homebrew_macos_ci_job.py holds what it runs.
  #
  # The install is the formula's tested path, the same validate-install step the matrix
  # legs run: a `git archive` of this commit, Formula/ash.rb rendered onto it and
  # installed from a local tap with `brew install --build-from-source`, `brew test`, and
  # homebrew.sh's scans, among them the committed fixture tests/test_data/homebrew_scan.
  # Not `brew install ./Formula/ash.rb`: Homebrew refuses a formula outside a tap, and
  # the committed formula builds the release tag on its `url` line, so it would test the
  # last release instead of this commit.
  #
  # macos-15 is a pinned image, so what `macos-latest` names can move without changing
  # what this job tests. No secrets: the install and the scans read only public package
  # indexes. nektos act cannot run a macOS job, so off GitHub this job is checked only by
  # that test and by actionlint.
  homebrew-macos:
    name: "homebrew (macos-15, in-repo formula)"
    runs-on: macos-15
    # The same budget as install-validation's Homebrew legs, which run the same script.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this job uses git credentials after checkout.
          persist-credentials: false
      # homebrew.sh runs the formula renderer and the result checks on this Python; the
      # formula itself installs on Homebrew's python@3.12.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: ./.github/actions/validate-install
        with:
          method: homebrew

  # ---------------------------------------------------------------------------
  # One check name that can actually be required
  # ---------------------------------------------------------------------------
  #
  # Most jobs above name themselves from their matrix, so this workflow contributes 211 check
  # runs to a pull request (494 to a merge-queue run, which runs the full matrices) and few of
  # their names are stable. A ruleset's
  # required_status_checks list holds literal context strings with no wildcard, so requiring
  # `unit-test` and the integration and e2e families means enumerating all 130 of their names -- and then any matrix edit either orphans
  # a required context that no longer runs, which leaves a pull request pending forever, or
  # quietly adds a leg that nothing requires. That maintenance cost is why the ruleset requires
  # two contexts today while every other check on the pull request is advisory -- a count that
  # moves with the trigger set, as the 186 below explains.
  #
  # Those two numbers count different populations, which is how the previous pair of them went
  # stale unnoticed. The 186 was measured on pull request 599, the 344 is derived
  # below, and both are re-derivable:
  #
  #   gh api repos/<owner>/<repo>/actions/runs/<run>/jobs --paginate --jq '.jobs[].name'
  #   gh api repos/<owner>/<repo>/commits/<sha>/check-runs --paginate --jq '.check_runs[].name'
  #
  # 211 is this workflow's own contribution to a pull request: the 136 jobs that run there,
  # plus the 75 `PyTest - ...` check runs that mikepenz/action-junit-report publishes from
  # inside the unit, integration and e2e legs -- one per leg. A merge-queue run, which runs
  # the full matrices, is 494: the 289 jobs that run there plus 205 check runs.
  # warm-image-layers runs only on a push to main and is in neither; whether GitHub still
  # lists it as skipped on a pull request was not checked. The check runs are not jobs and
  # land in a separate check suite, so a job census alone undercounts what this file puts on
  # a pull request -- that gap is most of why the old figure of 84 looked defensible.
  #
  # The figures below are arithmetic on a measured anchor, and the chain is worth keeping
  # because each link is a different kind of claim. Run 35370310502 reported `total_count` 168
  # with 168 rows received, `unit-test` 25 and `install-validation` 113 by name, and
  # `required-checks` absent because it is `needs`-gated and is not created until the run
  # resolves: 168 + 1 = 169 jobs, measured. `integration-test` landed after that run, so the
  # pre-collapse figure is 170, and the run has never been re-taken to confirm it. Folding pip,
  # pipx, uvx, pre-commit and mcp into the single `bundle` method took install-validation from
  # 113 legs to 33, so 170 - 80 = 90. Jobs added since: snapshot-trailers, homebrew-macos and
  # actionlint (1 each), and sandbox and sandbox-scanner-parity (2 each), which makes 97.
  # Excluding the ubuntu-24.04-arm homebrew leg took install-validation to 32: 96 on a pull
  # request. warm-image-layers' 2 legs run only on a push to main: 98 there. Only the 169 was
  # counted; every later figure is derived, and a fresh census is what would settle them.
  # Jobs added after that figure was written: non-root-image-permissions (1) and
  # converter-integration (2), which make 101 on a push and 99 on a pull request. Then the
  # unit-test job went from 25 legs to 200 (eight shards in each of the 25 combinations, +175) and
  # unit-coverage was added (one leg per OS family, +4): 280 on a push and 278 on a pull
  # request. The list below had left out build-docs (1), which makes 281 and 279. Then
  # ensure-cache was added (one leg per runner image, +5): 286 on a push and 284 on a pull
  # request. Then the suite was split by tier: the unit tier went from 200 legs to 25
  # (unsharded, -175), the integration tier was added as four shards of each of the 25
  # combinations (+100) and the e2e tier as one leg per runner label (+5), a net of -70:
  # 216 on a push and 214 on a merge-queue run. (At eight integration shards, the round-two
  # figure before the tests were classified, these were 316 and 314.) A pull request then
  # ran the merge-queue shape; with the pull-request cover (the note on ensure-cache) it
  # ran 110, derived by the same test from the overlay rather than counted. Then the unit
  # tier was cut into four shards (25 legs to 100, +75): 291 on a push, 289 on a merge-queue
  # run, and a pull request ran 137. Then the cover's macOS image moved from macos-latest to
  # macOS 14, and unit-coverage, whose axis names no pinned image, lost its macOS leg on a
  # pull request (-1): 136 there, the push and merge-queue figures unchanged.
  # tests/unit/test_unified_ci_job_counts.py recounts the list below from the matrices, so
  # these figures can drift from GitHub's census but not from this file. The 205 `PyTest - ...`
  # runs are derived from the leg count of the unit, integration and e2e jobs by the
  # one-per-leg rule #602 measured at 20 legs, not counted again, and the collapse does not
  # touch them.
  #
  # Where 291 comes from, per job, on a push to main: lint 1, ensure-cache 5, actionlint 1,
  # snapshot-trailers 1, unit-test 100, unit-coverage 4,
  # integration-test-linux 40, integration-test-macos 40, integration-test-windows 20,
  # e2e-test-linux 2, e2e-test-macos 2, e2e-test-windows 1, warm-image-layers 2,
  # scan-validation 24, non-root-image-permissions 1, external-target-scan 2, sandbox 2,
  # sandbox-scanner-parity 2, multi-project-attribution 2, deploy-aws-helpers 1,
  # integration-test 1, build-docs 1, converter-integration 2, install-validation 32, homebrew-macos 1,
  # required-checks 1.
  #
  # Where 136 comes from, per job, on a pull request (the pull-request cover, the note on
  # ensure-cache): lint 1, ensure-cache 2, actionlint 1, snapshot-trailers 1, unit-test 36,
  # unit-coverage 2, integration-test-linux 12, integration-test-macos 12,
  # integration-test-windows 12, e2e-test-linux 1, e2e-test-macos 1, e2e-test-windows 1,
  # scan-validation 24, non-root-image-permissions 1, external-target-scan 2, sandbox 2,
  # sandbox-scanner-parity 2, multi-project-attribution 2, deploy-aws-helpers 1,
  # integration-test 1, build-docs 1, converter-integration 2, install-validation 14,
  # homebrew-macos 1, required-checks 1. warm-image-layers is push-only and absent. The
  # same test expands the overlay for the pull_request event and holds this list to it.
  #
  # unit-test reached 25 combinations from three independent changes that all had to land:
  # adding 3.14 to the axis (18 -> 23), removing the macOS 14 exclusion for 3.10 and 3.11
  # (#599), and nothing in #601, which relabels `macos-latest` as arm64 and moves no count.
  # Either matrix change alone gives 23 or 20, so a merge or rebase that keeps one side's
  # intent would look clean and be wrong by two combinations. The integration families
  # multiply each combination by four shards. The check is the count and the leg NAMES, not
  # the diff.
  #
  # 186 is every check run on that commit, from every workflow the commit triggered plus the
  # GitHub Advanced Security app. It is 185 distinct names over 186 check runs, because
  # `Validate PR title` gets published by two check suites.
  #
  # That total depends on WHICH workflows a commit triggers, so it is not one number for all
  # pull requests. This file and ash-install-methods.yml name their install jobs from the same
  # template -- `${{ matrix.method }} (${{ matrix.os }}, py${{ matrix.python-version }})`, here
  # and at ash-install-methods.yml:34 -- so every cell the two matrices share produces two
  # check runs under one name whenever both run. The collision is structural, not incidental,
  # but the collapse shrank it: this file's install legs are now named `bundle (...)`,
  # `homebrew (...)`, `podman (...)`, `finch (...)` and `nerdctl (...)`, and the only values
  # ash-install-methods.yml still shares are those last four. Its pip, pipx, uvx, pre-commit,
  # mcp and nix legs now have the namespace to themselves.
  # ash-install-methods.yml is path-filtered to pyproject.toml, hatch_build.py,
  # automated_security_helper/**, .pre-commit-hooks.yaml, Formula/**, itself, and the nix
  # leg's action and snapshot module, so whether it runs is decided by whether the commit
  # touches those paths. A CI-plumbing commit like the
  # one measured here triggers no run of it -- confirmed by querying that workflow for runs on
  # the branch and getting zero, rather than assuming the filter excluded it -- and sees 186
  # check runs over 185 names. A commit touching package code triggers both surfaces and sees
  # 278 check runs over the same 185 names, 93 of them duplicated, all cross-workflow.
  #
  # So a count over this namespace has to name three things to mean anything: check runs or
  # distinct names, which trigger set, and which commit.
  #
  # Reconcile the row count against the endpoint's own `total_count` before trusting either
  # query. Both routes cap at `per_page` and report the true total alongside a short page.
  #
  # The 186 and 185 above are left exactly as measured, on pull request 599 at b5111830, and are
  # NOT restated for this branch -- that commit predates Python 3.14, so re-labelling its numbers
  # would be inventing a measurement rather than citing one. What can be said is the delta this
  # file contributes: 25 more jobs and 5 more `PyTest - ...` runs than at b5111830, then one more
  # job for integration-test, 80 fewer for the install-validation collapse, one more for
  # snapshot-trailers and one more for homebrew-macos, so a comparable CI-plumbing commit would
  # see 139 rather than 186. That 139 predates the unit-test shards and the jobs added after
  # it; the 494 above is the current merge-queue figure and 211 the pull-request one. That
  # is arithmetic on a measured baseline,
  # not a count anyone has taken, and it is why the 186 keeps its own commit's name.
  #
  # This job's name does not depend on the matrix, so it can be required once and stay correct
  # across matrix changes. It reports the verdict the individual legs already computed.
  #
  # THE TWO WAYS A GATE LIKE THIS FAILS OPEN
  #
  # `always()` is load-bearing, not defensive. Without it a failed dependency makes this job
  # *skipped*, and GitHub counts a skipped required check as a pass -- so the gate would
  # disappear at exactly the moment it is supposed to speak. That is the whole failure mode this
  # job exists to remove, so it must not reproduce it.
  #
  # WHY THE GATE ONLY TAKES A RUNNER WHEN SOMETHING DID NOT SUCCEED
  #
  # The rest of the condition is `cancelled()` or `contains(needs.*.result, ...)` over failure
  # and cancelled, so the job runs -- and fails, in the census step below -- whenever the run
  # was cancelled or any dependency failed or was cancelled. A dependency can be skipped only
  # when the run is cancelled, or when ensure-cache failed: the jobs that need it and carry no
  # `if:` are skipped then, and ensure-cache's own failure is in `needs`, so the `failure` term
  # covers it. The only other job-level condition among the dependencies is
  # `if: ${{ !cancelled() }}`, on scan-validation and unit-coverage. The six integration-test
  # and e2e-test jobs carry none, like the unit jobs: they wait only for ensure-cache and are
  # skipped when it fails, a skip the `failure` term above covers. The rule in
  # tests/unit/test_required_checks_census.py is that every gated job with `needs` carries
  # `!cancelled()` or `always()`, or else carries no `if:` at all and waits only for jobs that
  # always run and have no `needs` of their own. So `cancelled()` and `failure` between them
  # cover skipped too.
  #
  # The condition used to name `skipped` directly, and that term had to go. With
  # warm-image-layers skipped upstream of scan-validation, `contains(needs.*.result, 'skipped')`
  # evaluated true while `toJSON(needs)` showed every direct dependency as success -- measured
  # on throwaway probe runs 37631261974 and 37631443473 (a skipped grandparent; a gate with only
  # the `skipped` term ran, gates without it skipped), and on run 37542075722, where this job
  # waited 31 minutes for a runner to report nine successes.
  #
  # It is skipped in exactly one case: every dependency succeeded. That is the one case where
  # running it could only print a pass, and GitHub reports a skipped job as Success and does
  # not let it block a merge even when it is a required check:
  # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-jobs-with-conditions
  # So the verdict is unchanged in both directions: red whenever it was red before, and green
  # without waiting for a runner when it was green.
  #
  # The waiting was most of the wall clock. This job is created the moment its last dependency
  # finishes and then queues for an ubuntu-latest runner like any other job, behind every other
  # open pull request's legs, to run for about five seconds. Measured over nine pull_request and
  # push runs on 2026-10-06 (37485671493 through 37499915881): it waited a median 84 minutes and
  # up to 105, against a median of 129 minutes for the whole run, and the gate was the last job
  # to start in every one of them. In run 37499915881, 102 of its 194 minutes were this job
  # waiting to execute a five-second script.
  #
  # The drift half of the census does not depend on this job running. The census script still
  # runs here whenever the gate does, and tests/unit/test_required_checks_census.py takes the
  # same census against the committed `needs` list -- read with yaml.safe_load, a stronger
  # instrument than the script's scanner -- inside every unit-test leg, and unit-test is one of
  # this job's dependencies. A job added to the workflow without being added to `needs` fails
  # those tests, which fails unit-test, which makes this job run and fail.
  #
  # The second way is drift: a job added to this workflow and not added to `needs` escapes the
  # gate silently, and the gate keeps reporting success over a shrinking share of the suite. So
  # the census is asserted rather than assumed. A census beats a list that nobody re-checks --
  # the same reason .github/scripts/assert-coverage-completeness.mjs takes its file list from
  # `git ls-files` rather than from the coverage report.
  #
  # WHAT THE CENSUS REPLACED, AND WHY THE OLD FORM COULD ONLY CATCH THE HARMLESS DIRECTION
  #
  # This job used to carry `EXPECTED_UPSTREAM_JOBS: "8"` and compare it against `len(needs)`.
  # Both sides of that comparison lived inside the gate job, so it was blind to the drift it
  # existed to prevent: adding a tenth job to this workflow without adding it to `needs` leaves
  # `len(needs)` at 8 and the literal at 8, and the check passes over shrunk coverage. The one
  # direction it did catch -- updating `needs` and forgetting to bump the literal -- is the
  # harmless one, because it fails loudly and the fix is to bump a number.
  #
  # The literal was never actually wrong on this tree: this workflow has 9 jobs, 8 of them are
  # in `needs`, and the 9th is this gate itself, so coverage has been complete throughout. The
  # defect was latent rather than a live hole, which is exactly why nothing surfaced it.
  #
  # .github/scripts/assert-required-checks-census.py now takes the census from this file's own
  # `jobs:` mapping and requires every job other than the gate to be in `needs`, unless it is
  # named in that script's `_UNGATED` map with a reason -- empty today, and re-checked for
  # staleness on every run. So a new job is covered by construction, and a deliberately
  # advisory one is covered by a written statement rather than by a count that cannot tell the
  # two apart.
  required-checks:
    name: required-checks
    if: ${{ always() && (cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    needs:
      - lint
      - ensure-cache
      - actionlint
      - snapshot-trailers
      - unit-test-linux
      - unit-test-macos
      - unit-test-windows
      - unit-coverage
      - integration-test-linux
      - integration-test-macos
      - integration-test-windows
      - e2e-test-linux
      - e2e-test-macos
      - e2e-test-windows
      - scan-validation
      - non-root-image-permissions
      - external-target-scan
      - multi-project-attribution
      - deploy-aws-helpers
      - integration-test
      - converter-integration
      - build-docs
      - install-validation
      - homebrew-macos
      - sandbox
      - sandbox-scanner-parity
    # arm64 for the reason given on `lint`; the census script is stdlib Python.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      # This job needed no checkout while its only input was the `needs` context. It needs one
      # now, because the census is this file, and the whole point is that the list of jobs is
      # read from the workflow rather than restated inside the job that depends on them. A
      # checkout that fails takes the gate red, which is the safe direction.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert this gate depends on every job in the workflow, and that all of them succeeded
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # `github.job` is this job's own YAML key, so the script is told which job to exclude
          # from the census by the run rather than by a third copy of the name. Passed through
          # the environment rather than interpolated into the `run:` body, which is this
          # repository's convention for every context value a shell reads.
          GATE_JOB: ${{ github.job }}
        shell: bash
        # The script is dependency-free on purpose -- see its module docstring for why the gate
        # does not reach the network for PyYAML.
        run: |
          python3 .github/scripts/assert-required-checks-census.py \
            --workflow .github/workflows/ash-unified-ci.yml \
            --gate-job "$GATE_JOB"
