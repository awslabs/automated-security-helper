# Two facts about grouping that this file depends on, and that cost a wrong fix to learn.
#
# 1. A group that declares `update-types` admits an update only if Dependabot computed a
#    semantic-version level for it. An update with no level matches no such group, and the
#    documented fallback then applies: "Any outdated dependencies that do not match a rule are
#    updated in individual pull requests."
#
# 2. Dependabot could not compute a level for a requirement written with extras. On 2026-09-08
#    one run raised the floor on six dependencies in this project. The three written bare --
#    importlib-metadata, typer, ruff -- were each described as "Updates `importlib-metadata`
#    from 9.0.0 to 9.0.1" and batched into a single grouped pull request. The three written with
#    extras -- mkdocstrings[python], pydantic[email], types-boto3[...] -- were each described as
#    "Updates the requirements on [pydantic[email]] to permit the latest version", carried no
#    from/to version pair anywhere, and each arrived in a pull request of its own. Six for six,
#    one run, the same floor-raising operation on both sides.
#
# Note what the discriminator is not, because both wrong answers look convincing. It is not
# "requirement changes carry no level": all six were requirement changes and three of them had a
# level. It is not a pattern-matching failure either; Dependabot matches group patterns by
# escaping every character except `*`, so `"*"` does match a bracketed name. Extras is what is
# left. The mechanism behind it is not documented anywhere and is not proven here -- only the
# correlation is, and it is exact.
#
# So the fix lives upstream of this file rather than in it. No requirement in either project is
# written with extras any more; each former extra is declared as its own bare requirement, so
# every monitored dependency has a name Dependabot can resolve a version for. That is what lets
# the groups below keep `update-types`, and they must keep it: it is the only thing holding a
# major out of a minor pull request. Reintroduce a bracketed requirement and expect it to escape
# its group and arrive alone.
#
# Cooldown, recorded here so the next reader is not misled. Dependabot applies a default
# cooldown of three days to version updates even when `cooldown` is absent, and that default
# does not apply to security updates. The seven-day `default-days` below therefore lengthens a
# soak that already existed rather than creating one, and deleting `cooldown` would not make
# updates arrive immediately.
#
# The root uv entry's `cooldown` is scoped by `include` to the CDK packages, which is what
# replaced their `ignore` rules: a cooldown never applies to security updates, an `ignore` does.
#
# Security updates are deliberately left ungrouped. `applies-to` defaults to `version-updates`,
# so every group here batches version updates only and advisories keep arriving one at a time.
# Batching them would let a single failing check hold up every fix in the batch, and `cooldown`
# does not apply to security updates at all, so a security group could not inherit the soak the
# rest of this file is built around.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"

  # This entry had no groups, so every base image change arrived on its own. Same two-group
  # shape as the Python entries below: a major on its own, everything else together.
  #
  # `base-image-major-upgrade` is close to unreachable in practice rather than load-bearing. The
  # Dockerfile pins ARG BASE_IMAGE to a CPython 3.12 slim tag, and CPython does not publish a
  # 4.x tag, so nothing is expected to match it. It is kept because it costs nothing and because
  # the base image is editable, not because it is doing work today.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    groups:
      base-image-major-upgrade:
        patterns:
          - "*"
        update-types:
          - "major"
      base-image:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # There is deliberately no docker entry for automated_security_helper/assets. One was here and
  # was removed after checking what that directory contains: a Gemfile and Gemfile.lock, six Ruby
  # rule files, a YAML rule set, a README and a shell script. No Dockerfile, and no other
  # container manifest. The repository's only Dockerfile is the root one above, so the entry was
  # monitoring nothing.
  #
  # Its Gemfile is not monitored by anything in this file either. Adding a `bundler` entry for it
  # is a real gap but a separate decision, deliberately not taken here.

  # Python dependencies, split so a scanner upgrade is never mistaken for an engine upgrade
  # and a major is never mistaken for a routine bump.
  #
  # Why this shape rather than separate `updates:` entries per category: `commit-message.prefix`
  # and `labels` are per-entry options, and two entries cannot share the same
  # package-ecosystem and directory on one target branch. For grouped pull requests the branch
  # name and title come from the group IDENTIFIER, so the group name is the only per-category
  # label available -- hence names that read as prefixes.
  #
  # Group order is significant: a dependency lands in the FIRST group it matches, so the
  # scanner groups must precede the catch-all engine groups or the wildcards would swallow
  # them.
  #
  # Scope limit worth knowing before trusting this. Only these five scanner-related packages
  # are declared in pyproject.toml. bandit, checkov, semgrep, grype, syft, trivy and opengrep
  # are installed at runtime via utils/uv_tool_runner.py, so no Dependabot configuration can
  # gate their upgrades. This file narrows the blast radius of the upgrades it can see; it is
  # not a substitute for tests that detect a scanner that has stopped working.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      # Majors wait the same week before a PR is opened, so a same-day upstream regression is
      # not proposed immediately.
      semver-major-days: 7
      semver-minor-days: 90
      semver-patch-days: 90
      include:
        - "aws-cdk-lib*"
        - "cdk-nag*"
        - "constructs*"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    # Leave a floor alone when the new release already satisfies it, and move the locked
    # version instead. The default strategy for an application is `increase`, which raises
    # the minimum to match every release -- that is what turned each upstream patch into a
    # pull request whose whole diff was one digit of a lower bound. Out-of-range releases
    # still widen the requirement, so a major is not silently skipped the way
    # `lockfile-only` would skip it.
    #
    # This pairs with the ecosystem above being `uv` rather than `pip`. Under `pip` this
    # repository's uv.lock was never updated -- 22 of the last 22 Python bumps changed
    # pyproject.toml alone -- so a strategy that only moves the locked version would have
    # had nothing to move, and updates would have stopped instead of flowing.
    #
    # THIS SETTING DOES NOT TAKE EFFECT TODAY, and the paragraphs above describe what it is
    # meant to do, not what happens. Dependabot drops it before the uv updater runs: every
    # uv job definition for this repository carries `"requirements-update-strategy": null`
    # (for example the job behind PR #702), so the updater falls back to its own guess. For
    # this project the guess is "application", and the log says `Requirements update
    # strategy bump_versions` once per dependency. That is why patch releases still raise
    # floors. The updater itself handles increase-if-necessary correctly, in every section
    # this file has: fed the strategy directly, it leaves all six of #702's requirements
    # unchanged, including the [dependency-groups] dev and [build-system] hatchling entries.
    # The value is lost between this file and the job, which is GitHub's side and not
    # anything this repository can configure. Upstream report:
    # https://github.com/dependabot/dependabot-core/issues/16112
    #
    # It is kept so it takes effect once that is fixed. `lockfile-only` is the one value that
    # does reach a uv job (it travels as a separate `lockfile-only` flag), and it is still
    # rejected, for the reason above, which holds for uv too: a release outside the declared
    # range ends with the log line "No update possible" and no pull request. Almost every
    # requirement in pyproject.toml has an upper bound, so that would cover every major and,
    # for the `<X.Y` caps, every minor. It also blocks transitive security updates for uv
    # (dependabot-core#16449).
    versioning-strategy: increase-if-necessary
    # 5 is the default open-pull-requests-limit, it counts version updates only, and on
    # reaching it Dependabot stops raising them -- silently, since nothing reports a
    # suppressed update. Four were open at once on 2026-09-28, so the cap was one PR away
    # from holding back every subsequent bump in this ecosystem. Set explicitly so the
    # number is a decision rather than a default nobody chose. Security updates are exempt
    # from the limit and do not count toward it, so this does not gate advisories.
    open-pull-requests-limit: 10
    # aws-cdk-lib publishes a minor most days -- 2.269.0 to 2.270.0 was one of them, and it
    # arrived as a pull request of its own because it was the only member of scanner-minor
    # that run. CDK v2 minors are additive, so the ones worth a human are the majors, which
    # scanner-major-upgrade below still files on their own.
    #
    # These three entries used to be `ignore` rules for minor and patch. `ignore` also
    # suppresses SECURITY updates for the versions it covers, so an advisory fixed in a CDK
    # minor or patch never produced a pull request (a brace-expansion fix bundled inside
    # aws-cdk-lib had to be done by hand). `ignore` has no option to limit it to version
    # updates, and `applies-to` exists only on `groups`. The `cooldown` block above is
    # documented as "only available for version updates, not security updates", so it can
    # slow these packages down without touching advisories. Security updates for aws-cdk-lib,
    # cdk-nag and constructs now open pull requests again.
    #
    # Known limits of that swap. 90 days is the largest value the published dependabot.yml
    # schema accepts, so this delays CDK minors and patches rather than skipping them: once a
    # release is 90 days old it is proposed, and CDK releases nearly daily. Also, `include`
    # scopes the whole `cooldown` block, so the 7-day soak above now applies to these three
    # packages only, and every other dependency in this entry falls back to no configured
    # cooldown.
    groups:
      # A major bump of a scanner or its engine is the case that needs a human reading the
      # upstream changelog before merge, so it gets its own PR with a name that says so.
      #
      # The trailing `*` on each scanner name is deliberate and is not cosmetic. A bare
      # `cdk-nag` stops matching the moment anyone writes `cdk-nag[something]`, and the
      # dependency would then fall through to the engine groups and be filed as an engine
      # change. Extras are the known failure mode in this file, so these patterns are written
      # to survive one being added.
      scanner-major-upgrade:
        patterns:
          - "cdk-nag*"
          - "aws-cdk-lib*"
          - "constructs*"
          - "detect-secrets*"
          - "cfn-flip*"
        update-types:
          - "major"

      scanner-minor:
        patterns:
          - "cdk-nag*"
          - "aws-cdk-lib*"
          - "constructs*"
          - "detect-secrets*"
          - "cfn-flip*"
        update-types:
          - "minor"
          - "patch"

      engine-major-upgrade:
        patterns:
          - "*"
        update-types:
          - "major"

      engine-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # The transpiler is a separate uv project with its own pyproject.toml and uv.lock, and
  # nothing above covers it: `directory` scopes an ecosystem entry to one manifest, so the
  # root entry monitors the root project only. Its dependencies were unmonitored entirely.
  #
  # Same strategy as the root project, for the same reason: leave a requirement alone when
  # it already admits the new release and move the locked version instead.
  #
  # It is dropped here too (`"requirements-update-strategy": null` in this entry's jobs). This
  # project still keeps its floors, but only because the updater's fallback guesses "library"
  # for it and logs `Requirements update strategy widen_ranges`, which also leaves a satisfied
  # requirement alone. The guess comes from a PyPI lookup of the project name, so the setting
  # below is not what decides the outcome. See the root uv entry above.
  - package-ecosystem: "uv"
    directory: "/ash-agent-plugins/agentic-coding/transpiler"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 7
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
    versioning-strategy: increase-if-necessary
    groups:
      # No scanner packages here -- this project depends on templating and codegen
      # libraries only -- so the split is major versus everything else, with no
      # scanner/engine distinction to draw.
      transpiler-major-upgrade:
        patterns:
          - "*"
        update-types:
          - "major"
      transpiler-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
