name: Bug Report
description: Report a bug in ASH
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: ASH Version
      description: Run `ash --version` and paste the version.
      placeholder: "3.7.1"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did this happen?
      options:
        - Scan or CLI
        - Installation or dependencies
        - Terminal findings explorer
        - HTML report
        - Markdown report or GitHub summary
        - MCP or an AI coding assistant
        - Documentation
        - Other

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      options:
        - uvx
        - pip
        - pipx
        - container
        - homebrew
        - source checkout
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Include the command or interaction, execution mode, and relevant configuration.
      placeholder: |
        1. Run `ash ...`
        2. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Include the relevant error and its surrounding lines. For a visual issue, include the theme and viewport or terminal size.
      render: shell
