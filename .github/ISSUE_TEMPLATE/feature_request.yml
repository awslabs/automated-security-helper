name: Feature Request
description: Suggest a new feature
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: What are you trying to accomplish, and where does the current workflow get in the way?
      placeholder: "When I… I need to… so that…"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior or interaction you want, including what a successful result would look like.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Other approaches you've thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other information that helps explain the request.
