name: "Validate Container Runtime"
description: "Validate that ASH can build its container image with podman, finch or nerdctl, and then actually scan with it"

inputs:
  runtime:
    description: "Container runtime: podman, finch or nerdctl"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install ASH
      shell: bash
      run: pip install .

    # Same fixture, same path, as .github/actions/validate-install/action.yml creates
    # for the pip/pipx/uvx legs. Created here because this action is routed to on its
    # own -- the matrix picks exactly one of validate-install, validate-mcp,
    # validate-nix or this file per cell, so nothing else has run to make it.
    - name: Create test fixture
      shell: bash
      run: |
        mkdir -p /tmp/ash-selftest
        echo 'print("hello")' > /tmp/ash-selftest/test_sample.py

    # WHY A SCAN LEG EXISTS AT ALL
    #
    # This action used to end at `ash build-image --force`. `build-image` proves the
    # Dockerfile still builds under a given runtime; it says nothing about whether ASH
    # can scan with the result, which is the only reason the image is built. So podman
    # and finch were the two runtimes in the matrix whose image nobody ever ran, while
    # the five methods that do scan (pip, pipx, uvx, mcp, nix) all exercise
    # `ash scan --source-dir /tmp/ash-selftest ... --phases scan --phases report`.
    #
    # A runtime with a build leg and no scan leg is precisely that defect, so the
    # runtimes carrying one are named here rather than assumed. Adding a runtime to the
    # matrix without adding it below fails loudly instead of quietly reverting this
    # action to build-only for that runtime.
    - name: "Assert this runtime has a scan leg"
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
      run: |
        case "${RUNTIME}" in
          podman | finch | nerdctl) ;;
          *)
            echo "::error::validate-container has no scan leg for runtime '${RUNTIME}'. Add one rather than leaving this action build-only for it."
            exit 1
            ;;
        esac
        echo "${RUNTIME}: scan leg present"

    # WHY EVERY BUILD STEP PASSES --no-run
    #
    # `ash build-image` defaults to building AND scanning: cli/image.py passes
    # `run=not no_run`, and it never passes `source_dir`, so run_ash_scan.py resolves
    # the source to `Path.cwd()` -- this checkout. A build step written as a plain
    # `run:` therefore scanned ASH's own repository and exited with that scan's status,
    # which is 2 on actionable findings. The build leg failed for a reason that has
    # nothing to do with whether the image built.
    #
    # `--no-run` takes the `if run:` branch in run_ash_container.py, which returns
    # returncode 0 immediately after the build instead of assembling a run command. So
    # the build step now reports only the build.
    #
    # No coverage is lost. The scan below is the deliberate one: it targets
    # /tmp/ash-selftest, a fixture that is a single print statement, precisely so that
    # only exit 0 is acceptable. A checkout scan cannot be held to that bar -- its
    # status depends on what happens to be committed -- so it was never the thing
    # proving the image can scan.
    #
    # Mirrors the scan-leg assertion above: a build step that loses --no-run should
    # fail here rather than quietly go back to scanning the checkout.
    - name: "Assert no build step scans the checkout"
      shell: bash
      run: |
        python3 <<'PY'
        import pathlib
        import sys

        action = pathlib.Path(".github/actions/validate-container/action.yml")
        lines = action.read_text().splitlines()

        # WHY THIS MATCHES TWO SHAPES AND COUNTS WHAT IT FOUND
        #
        # An earlier version of this check tested `stripped.startswith("run:")`. That
        # covered podman and finch, whose builds are one-liners, and silently stopped
        # covering nerdctl the moment its build was wrapped in the retry loop below --
        # the invocation moved inside a `run: |` block, so the line no longer begins
        # with `run:`. The check still passed, on two legs out of three, which is the
        # worst way for it to be wrong: it read as a guard while covering the one leg
        # most likely to be edited.
        #
        # So the shape test is "the command is the first thing on the line, after an
        # optional `run:`", which catches both forms. Four kinds of line in this file
        # name `ash build-image` without being an invocation of it, and all four must
        # stay excluded: the prose at the top, the two comment blocks, this check's own
        # source, and the `echo "::error::ash build-image ..."` in the retry loop.
        #
        # The count is asserted too. Without it a future edit that hides an invocation
        # from the shape test would leave this passing on whatever it still sees, which
        # is exactly how the `run:`-only version failed.
        expected = ("podman", "finch", "nerdctl")
        found, offenders = {}, []
        for line in lines:
            stripped = line.strip()
            command = stripped[4:].strip() if stripped.startswith("run:") else stripped
            if not command.startswith("ash build-image"):
                continue
            runtime = next((r for r in expected if f"--oci-runner {r}" in command), None)
            found.setdefault(runtime, []).append(command)
            if "--no-run" not in command:
                offenders.append(command)

        if offenders:
            sys.exit(
                "FAIL: build invocations missing --no-run, so they scan this checkout "
                "and fail on its findings: " + "; ".join(offenders)
            )

        missing = [r for r in expected if r not in found]
        if missing:
            sys.exit(
                f"FAIL: found no build invocation for {missing}. Either a leg was "
                "removed, or its invocation changed shape and this check has stopped "
                "measuring it -- both must fail rather than pass on the rest."
            )

        for runtime in expected:
            print(f"  {runtime:<8} --no-run present")
        print(f"PASS: all {len(expected)} build invocations pass --no-run")
        PY

    # One place decides the wrapper, so the build and the scan cannot disagree about
    # it -- and they must agree. An image built rootless is invisible to
    # `sudo <runtime>`, which reads root's image store instead, so a mismatch surfaces
    # at the scan as a missing-image error a long way from its cause.
    #
    # podman is rootless on the hosted runners and must NOT be wrapped. finch and
    # nerdctl both drive a root-owned containerd socket and must be.
    - name: "Resolve the OCI runner wrapper"
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
      run: |
        case "${RUNTIME}" in
          finch | nerdctl) echo "OCI_RUNNER_WRAPPER=sudo" >> "$GITHUB_ENV" ;;
          *) echo "${RUNTIME}: no wrapper" ;;
        esac

    # === podman ===
    - name: "podman: install (macOS)"
      if: inputs.runtime == 'podman' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install podman
        podman machine init
        podman machine start
    - name: "podman: verify"
      if: inputs.runtime == 'podman'
      shell: bash
      run: podman --version
    - name: "podman: build image"
      if: inputs.runtime == 'podman'
      shell: bash
      run: ash build-image --oci-runner podman --force --no-run

    # === finch ===
    - name: "finch: install (macOS)"
      if: inputs.runtime == 'finch' && runner.os == 'macOS'
      shell: bash
      run: brew install --cask finch
    - name: "finch: install (Linux)"
      if: inputs.runtime == 'finch' && runner.os == 'Linux'
      shell: bash
      run: sudo bash scripts/setup-finch-linux.sh
    - name: "finch: init and start VM (macOS only)"
      if: inputs.runtime == 'finch' && runner.os == 'macOS'
      shell: bash
      run: |
        finch vm init
        finch vm start
    # OCI_RUNNER_WRAPPER comes from the resolve step above rather than an inline `env:`
    # here, so this build and the scan below read one value.
    - name: "finch: build image"
      if: inputs.runtime == 'finch'
      shell: bash
      run: ash build-image --oci-runner finch --force --no-run

    # === nerdctl ===
    #
    # Linux only. nerdctl drives containerd directly, and on hosted macOS there is no
    # nested virtualization to run a Linux VM in -- the same reason podman and finch are
    # excluded there. The support matrix's nerdctl entries are Rancher Desktop on macOS,
    # which supplies that VM itself and is not reproducible on a hosted runner; this
    # leg covers the same `--oci-runner nerdctl` code path natively instead.
    - name: "nerdctl: install (Linux)"
      if: inputs.runtime == 'nerdctl' && runner.os == 'Linux'
      shell: bash
      run: sudo bash scripts/setup-nerdctl-linux.sh
    - name: "nerdctl: verify"
      if: inputs.runtime == 'nerdctl'
      shell: bash
      run: sudo nerdctl --version
    # WHY THIS ONE BUILD IS RETRIED WHEN THE OTHER TWO ARE NOT
    #
    # `nerdctl build` loses a race with containerd's garbage collector roughly one
    # run in forty-six, and loses it after the image has already been built. The
    # failure looks like this, and it is worth reading closely because everything
    # below turns on which process emits it:
    #
    #   #48 exporting to docker image format
    #   #48 exporting manifest sha256:29750fcb... done
    #   #48 sending tarball 3.7s done
    #   #48 DONE 37.8s
    #   level=fatal msg="apply layer error for \"...:ci\": failed to prepare
    #     extraction snapshot \"extract-...\": parent snapshot sha256:594f27ed...
    #     does not exist: not found"
    #   unpacking docker.io/library/automated-security-helper:ci (sha256:29750fcb...)...
    #
    # The build succeeded. Every stage completed, all 11 scanner tools verified on
    # PATH, the manifest and config exported, the tarball sent. What failed is the
    # step after: loading that tarball into containerd.
    #
    # WHERE THE RACE LIVES, TRACED RATHER THAN GUESSED
    #
    # nerdctl asks buildkit whether its worker shares containerd's image store
    # (pkg/cmd/builder/build.go, `isImageSharable`). The nerdctl-full bundle's
    # buildkit runs the oci worker, which does not, so nerdctl takes the else
    # branch: `--output type=docker` plus `needsLoading`. It then pipes the
    # resulting docker-format tarball through its own `loadImage`, which calls
    # containerd's client `Unpack`. `apply layer error for` is that function's
    # message -- it lives in containerd's client/image.go, not in nerdctl and not
    # in buildkit. `Unpack` walks the layers with the per-layer `rootfs.ApplyLayer`,
    # whose Stat-then-Prepare window does not hold the parent snapshot under a
    # lease, so a concurrent GC pass can collect the parent between the two calls.
    #
    # That window is a known upstream defect: containerd/nerdctl#3420 reported this
    # exact string and traced it to the containerd GC race, and moby/buildkit#6521
    # reported it from the other direction. moby/buildkit#6558 fixed it -- but only
    # in buildkit's own exporter, for the `type=image,unpack=true` path. That fix is
    # present in the bundled buildkit 0.31.2, which is consistent with `#48 DONE`
    # above: the exporter side works. Nothing has landed for the containerd-client
    # side that the tarball round trip routes us through, so there is no version to
    # bump to.
    #
    # WHY A RETRY, AND WHY IT IS NOT A BARE ONE
    #
    # Measured across every Unified CI run since this leg landed, with the
    # arithmetic spelled out because a denominator nobody can reproduce is not a
    # measurement: 168 runs swept, of which 158 produced a nerdctl job (7 produced
    # none and 3 returned HTTP 502 on every retry and are counted as unknown rather
    # than as passes -- 158 + 7 + 3 = 168). Those 158 split 136 success, 8 failure,
    # 14 cancelled, so 144 terminal outcomes.
    #
    # Five of the eight failures are not this race and are excluded from both
    # halves of the ratio. On those five runs the podman and finch legs failed too,
    # in exactly the same five runs and no others, which no nerdctl-specific cause
    # can produce; they are a branch whose `build-image` runs a full scan that
    # reports findings and exits 2.
    #
    # That leaves 3 failures of this shape in 144 - 5 = 139 terminal outcomes:
    # 2.2%, one run in forty-six. It is not deterministic and this leg is not newly
    # broken. The sharpest evidence is pull request 608's merge queue, which
    # built this image five times from the same content -- four passed, one hit this
    # error. Nothing in the repository distinguishes the four from the one.
    #
    # Two things make the retry honest rather than a way of turning a hard failure
    # into a slow one:
    #
    # First, it only retries THIS error. Any other non-zero status exits
    # immediately with its own code, so a real build break still fails on the first
    # attempt and fails fast.
    #
    # Second, retries deliberately drop `--force`. `--force` is `--no-cache`
    # (run_ash_container.py), so attempt 1 still proves a from-scratch build works;
    # that is the gate's actual job and it is not weakened. Dropping it on retry
    # means buildkit reuses the layers it just finished building, so the retry costs
    # about a minute instead of seven and spends that minute re-running precisely
    # the operation that raced: export, then load. This works because
    # BUILD_DATE_EPOCH -- the one build-arg that changes per invocation -- is
    # consumed on the last line of the `core` stage rather than near its top, so the
    # apt, node, ruby and pinned-binary layers above it all stay cacheable.
    #
    # The partially-imported image is removed before each retry. containerd's
    # `Import` can leave an image record behind whose snapshot chain is incomplete,
    # and a retry over that record would take the same Stat shortcut that skips the
    # lease -- the racy path -- rather than rebuilding the chain. So the retry is
    # given clean preconditions instead of being handed the wreckage of the attempt
    # that just failed.
    #
    # WHAT WAS REJECTED
    #
    # Configuring buildkitd with the containerd worker would make `isImageSharable`
    # true and route the unpack through buildkit's fixed exporter, skipping the
    # tarball entirely. Rejected because it would have this gate test a
    # configuration no nerdctl-full user has: the bundle ships the oci worker, so
    # the default path -- the one a user actually runs -- would stop being measured
    # while CI went green. A gate that passes by avoiding the user's code path is
    # the defect this action was rewritten to remove, not a fix for it.
    #
    # Marking the leg continue-on-error was rejected for the same reason in
    # stronger form: it discards the signal rather than relocating it.
    #
    # KNOWN LIMITATION, STATED SO IT CAN BE CHECKED
    #
    # No CI re-run of a job that hit this error exists in the history, so "a retry
    # succeeds" rests on the cross-run evidence above and on ddev/ddev#8142, which
    # carried a max-3 retry keyed to this same error text until ddev/ddev#8637
    # removed it once their path got its upstream fix. It is not a directly observed
    # flip. The ::warning:: below is what closes that gap: it makes every retry
    # countable in the Actions UI, so how often the race fires and whether the retry
    # clears it both become measurable instead of argued.
    #
    # The retries share a runner and a containerd state with the attempt that
    # failed, so the per-attempt failures may not be independent and the effective
    # rate may be worse than 3 successive draws at 1-in-46 would suggest. The
    # warning is also how that gets found out.
    #
    # The strongest lead for a real root-cause fix, for whoever picks this up: the
    # finch leg drives containerd through buildkit too and took zero failures of
    # this shape across 138 passes. The scripts differ in that setup-finch-linux.sh
    # removes Docker Engine and containerd.io outright, while setup-nerdctl-linux.sh
    # only stops the Docker units and lets the bundle's containerd adopt a state
    # root still full of Docker's now-unreferenced snapshots -- which is exactly the
    # kind of GC backlog that would widen the window above. That is a hypothesis
    # about the trigger, not a measurement, and `apt-get remove` does not clear
    # /var/lib/containerd, so it is deliberately not acted on here.
    - name: "nerdctl: build image"
      if: inputs.runtime == 'nerdctl'
      shell: bash
      env:
        # The tag ash build-image applies: build_target is forced to "ci" whenever
        # CI is set, so this is the image the load above would have created.
        IMAGE: automated-security-helper:ci
        ATTEMPTS: "3"
      run: |
        log="${RUNNER_TEMP:-/tmp}/nerdctl-build.log"
        rc=0
        for n in $(seq 1 "${ATTEMPTS}"); do
          # Attempt 1 only. See the --force note above.
          force_args=()
          if [ "${n}" -eq 1 ]; then
            force_args=(--force)
          fi

          echo "=== nerdctl build image: attempt ${n} of ${ATTEMPTS} ${force_args[*]} ==="
          set +e
          # --no-run for the same reason the podman and finch legs carry it, and it
          # matters more here: without it every attempt would scan the checkout, so
          # the retry loop would re-run a scan whose exit 2 on findings is not the
          # race being matched below -- it would fail the first `grep` and abort,
          # reporting a build break that never happened. Flag order matches those
          # two legs on attempt 1: --oci-runner nerdctl --force --no-run.
          ash build-image --oci-runner nerdctl "${force_args[@]}" --no-run 2>&1 | tee "${log}"
          rc="${PIPESTATUS[0]}"
          set -e

          if [ "${rc}" -eq 0 ]; then
            if [ "${n}" -gt 1 ]; then
              echo "::warning::nerdctl build succeeded on attempt ${n} after the containerd snapshot GC race. See containerd/nerdctl#3420."
            fi
            break
          fi

          # Not the race: fail now, with the build's own status, rather than
          # spending two more attempts on a break that will not fix itself.
          #
          # ONE LINE, NOT TWO GREPS, AND THE DIFFERENCE IS LOAD-BEARING
          #
          # The first version of this tested `grep -q 'parent snapshot'` and
          # `grep -q 'does not exist'` as two separate searches over the whole
          # build output, which is also how ddev/ddev#8142 matched it. That is
          # wrong, and demonstrably so: a genuine break printing "reusing parent
          # snapshot layer cache" on one line and "requirements.txt: does not
          # exist" three lines later satisfies both searches with no race
          # anywhere. Measured against exactly that fixture, the two-grep form
          # spent both retries and then reported "this is containerd/nerdctl#3420,
          # not an ASH defect" about a real ASH defect -- the exit code survived,
          # so it stayed red, but the log told the next reader the wrong cause.
          #
          # Requiring both on ONE line matches the signature instead of two of its
          # words. containerd emits it as a single message -- client/image.go:349
          # wraps the snapshotter error as `apply layer error for %q: %w`, and the
          # whole thing arrives on one log line -- verified against all three
          # observed failures, where `parent snapshot <digest> does not exist`
          # appears exactly once per log and never split.
          #
          # Still unanchored, so a leading ANSI sequence cannot hide the match.
          # `apply layer error` is deliberately NOT also required: it is nerdctl's
          # wrapper rather than the race itself, and the match should survive
          # nerdctl rewording its wrapper while the upstream race is still open.
          if ! grep -qE 'parent snapshot.*does not exist' "${log}"; then
            echo "::error::ash build-image --oci-runner nerdctl exited ${rc} for a reason other than the containerd snapshot GC race. Not retried."
            exit "${rc}"
          fi

          if [ "${n}" -eq "${ATTEMPTS}" ]; then
            echo "::error::nerdctl hit the containerd snapshot GC race on all ${ATTEMPTS} attempts. The image built every time and failed to load every time; this is containerd/nerdctl#3420, not an ASH defect. If this is no longer rare, the buildkit-worker question in the comment above is the next thing to settle."
            exit "${rc}"
          fi

          echo "::warning::nerdctl build hit the containerd snapshot GC race on attempt ${n} (containerd/nerdctl#3420). The image built; loading it into containerd lost a race with the GC. Retrying."

          # Clear the half-imported record so the retry rebuilds the snapshot chain
          # instead of taking the Stat shortcut over it. Absence is normal -- the
          # load may have failed before any record was written -- so it is reported
          # rather than treated as an error, and a removal that genuinely fails is
          # still left to fail.
          if [ -n "$(sudo nerdctl images --quiet "${IMAGE}" 2>/dev/null)" ]; then
            echo "  ${IMAGE}: partial image present, removing before retry"
            sudo nerdctl rmi --force "${IMAGE}"
          else
            echo "  ${IMAGE}: no image record to remove"
          fi

          # Let any in-flight GC pass finish rather than racing it again at once.
          sleep 10
        done
        exit "${rc}"

    # === the built image has to run ===
    #
    # Shared rather than per-runtime: the whole point is that every runtime with a
    # build leg gets scanned, and a shared step cannot be the one somebody forgets.
    - name: "Scan with the built image"
      shell: bash
      env:
        RUNTIME: ${{ inputs.runtime }}
      # WHY THE ONLY ACCEPTED STATUS IS 0
      #
      # An earlier version of this step accepted 0 or 2, copied from
      # validate-nix/action.yml. That tolerance is correct there and wrong here, and
      # the difference is the fixture. validate-nix scans a deliberately flawed tree
      # -- a shell=True call and a hardcoded credential -- so its scanners are meant
      # to report findings and 2 is its success case. The fixture above is
      # `print("hello")`. validate-install/action.yml scans that same file at that
      # same path with these same `--simple --phases scan --phases report` flags, as
      # a plain `run:` under `bash -e` with no tolerance at all, and its pip, pipx
      # and uvx legs pass -- so 0 is what this fixture produces. Measured directly
      # rather than inferred: that scan was run locally and exited 0.
      #
      # So every 2 accepted here was an anomaly recorded as a pass. Two anomalies in
      # particular. A findings-producing 2 would mean a scanner flagged a one-line
      # print statement, which is worth a red build. And click raises UsageError with
      # exit_code 2, so renaming `--simple`, `--mode`, `--phases` or
      # `--fail-on-incomplete-scanners`, or removing an `--oci-runner` value, would
      # exit 2 with the scan never having started -- and the old tolerance called
      # that success.
      #
      # 1 stays rejected, and now has something to reject: see the flag below.
      run: |
        set +e
        ash scan \
          --mode container \
          --oci-runner "${RUNTIME}" \
          --source-dir /tmp/ash-selftest \
          --output-dir /tmp/ash-selftest/output \
          --simple \
          --fail-on-incomplete-scanners \
          --phases scan \
          --phases report
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "::error::ash scan --mode container --oci-runner ${RUNTIME} exited $rc; this fixture and these flags exit 0 when the scan works."
          case "$rc" in
            1) echo "::error::1 is ASH's 'error during execution', which --fail-on-incomplete-scanners also uses for a scan where a selected scanner reported ERROR or MISSING. Read the per-scanner table below." ;;
            2) echo "::error::2 means either actionable findings on a fixture that is one print statement, or a click UsageError -- a flag above was renamed or removed and the scan never ran." ;;
          esac
          exit "$rc"
        fi
        echo "scan exited $rc"

    # WHY THE FLAG ABOVE IS LOAD-BEARING, AND WHY THIS STEP IS NOT REDUNDANT WITH IT
    #
    # `--fail-on-incomplete-scanners` is what makes an unusable image fail. Without
    # it the completeness check inside ASH is off: _resolve_fail_on_incomplete_scanners
    # (automated_security_helper/interactions/run_ash_scan.py) returns False unless the
    # flag or a config file says otherwise, and /tmp/ash-selftest has no .ash.yaml. So
    # a container scan in which EVERY scanner reported MISSING exited 0 and wrote a
    # well-formed ash_aggregated_results.json -- passing both the status check and a
    # bare json.load. Measured, not argued: with a PATH holding only python3 the same
    # scan exits 0 with 8 of 10 scanners MISSING, and exits 1 once the flag is passed.
    #
    # This step then reads the per-scanner statuses out of that report. It overlaps
    # with the flag deliberately, and they fail for different reasons: the flag is
    # ASH judging its own run, and this is CI judging whether ASH's judgement still
    # happens. A renamed or dropped flag makes the gate above silently permissive
    # again -- exactly the state this action shipped in -- and only a check that reads
    # the statuses itself notices. Neither one alone is sufficient, so neither should
    # be deleted as duplicate.
    #
    # Ported from validate-nix, which had this assertion while this action had only
    # its exit-code tolerance. The verdict is the point: "the JSON parsed" says
    # nothing about whether any scanner ran.
    - name: "Assert every image-supplied scanner participated"
      shell: bash
      run: |
        python3 <<'PY'
        import json
        import pathlib
        import sys

        results = pathlib.Path("/tmp/ash-selftest/output/ash_aggregated_results.json")
        if not results.exists() or results.stat().st_size == 0:
            listing = sorted(p.name for p in results.parent.glob("*")) if results.parent.is_dir() else "(no output directory)"
            sys.exit(f"FAIL: no usable results at {results}; the container scan did not complete even though it exited 0. Output dir holds: {listing}")

        data = json.loads(results.read_text())
        raw = data.get("scanner_results") or {}
        rows = raw.items() if isinstance(raw, dict) else (
            (r.get("scanner_name"), r) for r in raw
        )
        statuses = {
            name: str(res.get("status", "?"))
            for name, res in rows
            if isinstance(res, dict)
        }

        if not statuses:
            sys.exit(
                "FAIL: the report carried no per-scanner statuses. Either the scan "
                "recorded none, or scanner_results changed shape and this check has "
                "stopped measuring anything -- both must fail rather than pass."
            )

        # Every built-in scanner, because the container image supplies every one of
        # them: the Dockerfile installs syft and grype as pinned binaries, cfn-nag
        # via its Gemfile, node/npm/pnpm through corepack for npm-audit, and the
        # wheel with its [cdk] extra, which is what cdk-nag imports.
        #
        # cdk-nag is INCLUDED here where validate-nix excludes it, and the asymmetry
        # is the point rather than an oversight. Its scanner sets command = "python"
        # and runs out of ASH's own environment; under Nix that environment is not
        # the flake, so its status says nothing about the flake. In container mode
        # ASH's own environment IS the image, so its status is exactly as much a
        # statement about the image as any other scanner's.
        image_supplied = [
            "bandit",
            "cdk-nag",
            "cfn-nag",
            "checkov",
            "detect-secrets",
            "grype",
            "npm-audit",
            "opengrep",
            "semgrep",
            "syft",
        ]

        for name in sorted(statuses):
            print(f"  {name:<18} {statuses[name]}")
        print()

        # MISSING means the tool was absent, so the scanner contributed nothing and
        # said so only in this table; ERROR means it ran and produced nothing usable.
        # Those are the two statuses that make a clean report a lie, and they are the
        # two the flag above gates on.
        #
        # SKIPPED is accepted, and has to be. This fixture is a single .py file, so a
        # scanner with no matching input -- npm-audit with no package.json, cfn-nag
        # with no template -- reports SKIPPED via the evaluated_nothing branch in
        # core/unified_metrics.py. That is a scanner working correctly on a fixture
        # with nothing for it to read, which is a different fact from a missing tool,
        # and conflating the two would make this check fail on a healthy image.
        broken = {
            n: statuses[n]
            for n in image_supplied
            if statuses.get(n, "MISSING").upper() in ("MISSING", "ERROR")
        }
        absent = [n for n in image_supplied if n not in statuses]

        if absent:
            sys.exit(
                f"FAIL: scanners absent from the report entirely: {absent}. The image "
                "is expected to supply every built-in scanner; if one has been removed "
                "from ASH, remove it here too."
            )
        if broken:
            sys.exit(
                "FAIL: image-supplied scanners did not complete: "
                + ", ".join(f"{n} ({s})" for n, s in sorted(broken.items()))
                + ". The image built, so this is a tool missing from the image or "
                "failing inside it -- fix the Dockerfile rather than excluding the "
                "scanner here."
            )

        print(f"PASS: all {len(image_supplied)} image-supplied scanners participated")
        PY
