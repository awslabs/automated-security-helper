name: "Run Scan Test"
description: "Run ASH scan with a configurable method and validate results"

inputs:
  method:
    description: "Scan method: python-local, python-container, bash, powershell"
    required: true
  os:
    description: "Runner OS label"
    required: true
  platform:
    description: "Platform string (linux/amd64, darwin/amd64, etc.)"
    required: true
  config-file:
    description: "Config variant: default or community"
    required: false
    default: "default"
  snyk-token:
    description: "Snyk token for community plugin validation"
    required: false
    default: ""
  oci-runner:
    description: "OCI container runtime: docker, podman, or finch"
    required: false
    default: "docker"
  offline:
    description: "Build and run in offline/airgapped mode"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    # Only the docker cells have anything to do with a buildx builder. The two
    # steps below that consume what this bootstraps are both gated
    # `oci-runner == 'docker'`, and ASH's own container build shells out to
    # `<runner> build` -- `podman build`, never `docker buildx` -- on every
    # entrypoint (utils/ash_helpers.ps1, ./ash, run_ash_container.py). So on the
    # podman cells this used to boot a `docker-container` buildkit builder and
    # pull moby/buildkit:buildx-stable-1 from Docker Hub that nothing then used:
    # six matrix cells paying a network round trip purely as failure surface. One
    # such pull returned a 500 and took the whole job with it. Matching the gate
    # the credential steps already use keeps docker unchanged and drops the
    # dependency everywhere it was never earned.
    - name: Set up Docker Buildx on Linux
      if: contains(inputs.os, 'ubuntu') && inputs.method != 'python-local' && inputs.oci-runner == 'docker'
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    # ASH's container build exports and restores its layers through the GitHub
    # Actions cache (buildx type=gha) when it can see the cache credentials. Actions
    # does not put these in the environment of `run:` steps, so they are exported
    # here deliberately; without this the build silently falls back to an uncached
    # `docker build`.
    #
    # Nothing is published: type=gha writes to the Actions cache service, not a
    # registry, and entries are scoped to this repository and readable only with the
    # run's own token.
    #
    # Trade-off, stated plainly: exporting ACTIONS_RUNTIME_TOKEN into the job
    # environment makes it visible to later steps in the job, including the scanners
    # ASH runs over the checked-out code. What that token grants is read and write
    # access to this repository's Actions cache - not code, not secrets, not package
    # publishing.
    #
    # Two mitigations, because "it is only the cache token" is not a reason to be
    # careless with a JWT in a public repository:
    #
    # 1. core.setSecret registers the value with the runner's log filter before it is
    #    exported. Values written to GITHUB_ENV are NOT masked automatically, so
    #    without this any later step that echoed its environment - a stray printenv,
    #    a tool that logs its own env on error - would put the token into a log that
    #    anyone can read on a public repository.
    # 2. The companion step after the scan clears these back out, so the token is
    #    live for the build and scan only and is gone before the report, artifact
    #    upload and PR-comment steps run.
    - name: Expose the Actions cache credentials to ASH's build
      if: >-
        contains(inputs.os, 'ubuntu')
        && inputs.method != 'python-local'
        && inputs.oci-runner == 'docker'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_CACHE_URL', 'ACTIONS_RESULTS_URL']) {
            const value = process.env[name]
            if (value) {
              // Mask before export. The URLs are not sensitive, but the token is,
              // and masking all three is simpler than reasoning about which is which
              // every time this list changes.
              core.setSecret(value)
              core.exportVariable(name, value)
            } else {
              core.info(`${name} is not set on this runner; skipping`)
            }
          }

    - name: Create output directory
      shell: bash
      run: mkdir -p .ash/ash_output

    # cfn-nag is a Ruby gem, so `ash dependencies install` can only provision it
    # where a usable Ruby exists. This is the python-local legs' problem alone: the
    # container legs get cfn-nag from the image and are unaffected.
    #
    # Needed even though the hosted runners ship a Ruby, because the preinstalled
    # interpreter's GEM_HOME is root-owned on Linux. ASH passes --user-install so it
    # does not need sudo, but a runner-managed Ruby avoids depending on that detail
    # of the image.
    #
    # Windows gets its own copy of this step further down rather than sharing this
    # one, and the reason is position rather than configuration. setup-ruby prepends
    # its MSYS2 directories to PATH, so every later `shell: bash` step resolves to
    # C:\hostedtoolcache\windows\Ruby\3.3.12\x64\msys64\usr\bin\bash.EXE instead of
    # Git Bash. Run from here, that put MSYS2 bash ahead of the pre-existing
    # "Validate ASH config files" step, which then exited 2 in 176ms. The Windows
    # copy sits after that step instead. See the comment on it for the rest.
    # Pinned to a commit, not to `v1`. `v1` on this action is a moving major tag, and
    # this repository gates on full-SHA pins for third-party actions
    # (.github/scripts/assert-actions-pinned.mjs, COMMIT_SHA = /^[0-9a-fA-F]{40}$/).
    # This SHA is v1.321.0, which is what `v1` resolved to when this was added.
    - name: Set up Ruby for cfn-nag
      if: inputs.method == 'python-local' && runner.os != 'Windows'
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: "3.3"

    # Community plugin tools
    - name: Install Community Plugin Tools
      if: inputs.config-file == 'community'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Installing tools needed for community plugins..."

        # Every install below pulls a third-party binary over the network, and none
        # of them had a retry. Observed failure: snyk's npm post-install wrapper hit
        # ECONNRESET part-way through downloading snyk-win.exe, retried the download
        # successfully (shasums matched), then died renaming a temp file the failed
        # attempt had already cleaned up - taking the whole
        # `scan (python-local, windows-latest) - Community Plugins` job with it,
        # before ASH was even invoked.
        retry() {
          local attempts=3 n=1
          until "$@"; do
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::'$*' failed after ${attempts} attempts"
              return 1
            fi
            echo "::warning::'$*' failed (attempt ${n}/${attempts}); retrying in $((n * 10))s"
            sleep $((n * 10))
            n=$((n + 1))
          done
        }

        retry npm install -g snyk
        snyk version

        # trivy is installed further down by `ash dependencies install --tool
        # trivy-repo`, against a version and SHA256 pinned in the repository.
        #
        # What was here before: three per-platform installs -- `curl … | sh` on
        # Linux, `brew install trivy` on macOS, and an unzip-and-move on Windows.
        # None of them pinned a version, so the three legs could run three different
        # trivy builds, and the Linux one piped a remote script into a shell inside a
        # supply-chain scanner's own CI. The unpinned `brew install` is also why the
        # macOS leg could pick up a trivy newer than any the scanner was tested
        # against.
        #
        # snyk and ferret-scan stay here: neither has an ASH install path, snyk
        # arrives through npm, and ferret-scan through pip against the constraint its
        # own plugin declares.

        # `pip install ferret-scan` resolves to whatever is newest, which is not
        # a version anyone chose. ferret-scan 2.3.3 was published at
        # 2026-08-20T21:14:59Z; jobs whose install step ran after that installed
        # it, picked up a new API_KEY_OR_SECRET detector that matches
        # `session: Optional[Session]` in generated Pydantic schemas, and failed
        # on 2 findings. Runs from 40 minutes earlier passed on 2.3.2. Three
        # unrelated merge-queue branches broke in the same window with no source
        # change.
        #
        # The plugin already declares the range it is tested against, so read it
        # from there rather than repeating it here -- one source of truth, and if
        # the constant moves this fails loudly instead of silently reverting to
        # installing latest.
        FERRET_CONSTRAINT="$(python -c 'from automated_security_helper.plugin_modules.ash_ferret_plugins.ferret_scanner import DEFAULT_VERSION_CONSTRAINT as c; print(c)')"
        if [ -z "$FERRET_CONSTRAINT" ]; then
          echo "::error::Could not read ferret-scan's declared version constraint from its ASH plugin. Refusing to install an unconstrained version."
          exit 1
        fi
        echo "Installing ferret-scan against its plugin-declared constraint: ${FERRET_CONSTRAINT}"
        retry pip install "ferret-scan${FERRET_CONSTRAINT}"
        ferret-scan --version

    # trivy is the one community-plugin tool ASH can provision itself, so it is
    # installed through ASH against a pinned version and SHA256 rather than by the
    # three unpinned per-platform installs this replaces.
    #
    # --config is required and not decorative: trivy-repo arrives through
    # `ash_plugin_modules` in the community config, and without that flag the
    # installer only sees the built-in scanners and rejects `--tool trivy-repo` as an
    # unknown name.
    #
    # Scoped to --tool trivy-repo rather than installing the whole community set,
    # because snyk arrives through npm and ferret-scan through pip against the
    # constraint its own plugin declares; both are handled in the step above and
    # neither belongs in a binary download path.
    - name: Install trivy through ASH for the community plugin legs
      if: inputs.config-file == 'community' && inputs.method == 'python-local'
      shell: bash
      run: |
        # No `trivy --version` follow-up on purpose. ASH installs into ASH_BIN_PATH,
        # which is not on the shell PATH, and ASH finds it there rather than through
        # PATH. The installer's own post-install sweep already resolves the binary
        # and exits non-zero if it cannot -- a PATH-dependent version check here
        # would fail for a working install and pass for none.
        ash dependencies install \
          --config .ash/.ash_community_plugins.yaml \
          --tool trivy-repo

    # Validate config
    - name: Validate ASH config files
      if: contains(inputs.method, 'python')
      shell: bash
      run: |
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ash config validate --config .ash/.ash_community_plugins.yaml
        else
          ash config validate --config .ash/.ash.yaml
        fi

    # The Windows half of "Set up Ruby for cfn-nag" above, deliberately placed here
    # rather than next to it. setup-ruby prepends its MSYS2 directories to PATH, and
    # the runner resolves `shell: bash` through PATH -- actions/runner
    # src/Runner.Worker/Handlers/ScriptHandler.cs calls
    # WhichUtil.Which("bash", ..., prependPath) -- so running this any earlier makes
    # MSYS2 bash the shell for "Validate ASH config files" just above, which exited 2
    # in 176ms when that happened. Everything between here and the precedence restore
    # below is `shell: pwsh`, which does not care which bash is first.
    #
    # What the toolchain is actually for, and it is not a missing libyaml. cfn-nag
    # pins cfn-model 0.6.6, which requires `psych ~> 3`; psych 3.3.4 has a C
    # extension, and no psych 3.x publishes a precompiled gem for this ABI (3.1.0 is
    # the newest 3.x with any Windows binary and it is tagged x64-mingw32, while Ruby
    # 3.1+ needs x64-mingw-ucrt). psych vendors libyaml under ext/psych/yaml and its
    # extconf.rb falls back to that bundled copy, which is exactly what happened on
    # 18e5cba9: "checking for yaml.h... yes", "creating Makefile". The build then
    # died one step later, in make:
    #
    #   make: *** No rule to make target
    #   '/C/hostedtoolcache/windows/Ruby/3.3.12/x64/include/ruby-3.3.0/ruby.h',
    #   needed by 'api.o'.  Stop.
    #
    # That is an MSYS-translated path handed to a make from a different tree -- Git's
    # sh rewrote C:/... to /C/..., and the make that consumed it did not share that
    # mount table. So the requirement is one coherent MSYS2 environment, not an extra
    # package. setup-ruby's default `windows-toolchain` produces exactly that: it
    # unpacks the ucrt64 gcc bundle and runs `ridk enable`, leaving sh, make and gcc
    # all from the same tree. `ridk enable` is also what exports RI_DEVKIT
    # (rubyinstaller2, lib/ruby_installer/build/msys2_installation.rb), which is the
    # variable cfn_nag_scanner.py's prerequisite check reads -- so this step is what
    # lets that check pass rather than decline.
    #
    # Same full-SHA pin as the step above, for the same reason.
    - name: Set up Ruby and MSYS2 toolchain for cfn-nag (Windows)
      if: inputs.method == 'python-local' && runner.os == 'Windows'
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: "3.3"

    # Python Container scan
    - name: Validate ASH using Python + Container
      if: inputs.method == 'python-container'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Testing ASH using Python (Container) on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        ash --version
        OFFLINE_FLAG=""
        if [ "${{ inputs.offline }}" = "true" ]; then
          OFFLINE_FLAG="--offline"
        fi
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ash --mode container --build-target ci --verbose --no-progress --ash-revision-to-install LOCAL $OFFLINE_FLAG --config .ash/.ash_community_plugins.yaml
        else
          ash --mode container --build-target ci --verbose --no-progress --ash-revision-to-install LOCAL $OFFLINE_FLAG
        fi

    - name: Validate No Plugin Errors (Python Container)
      if: inputs.method == 'python-container'
      shell: bash
      run: |
        echo "Checking for plugin execution errors..."
        export PATH="$HOME/.local/bin:$PATH"
        if command -v ash >/dev/null 2>&1; then
          REPORT_CMD="ash report --format text"
        else
          REPORT_CMD="python -m automated_security_helper report --format text"
        fi
        # Still printed, because it is what a human reads when this step fails.
        # It is no longer what the check is computed from; see the script's module
        # docstring for why counting "ERROR" in rendered prose was off by one.
        $REPORT_CMD
        python3 "${{ github.action_path }}/count_scanner_errors.py" \
          .ash/ash_output/ash_aggregated_results.json

    # Python Local scan (Windows)
    - name: Validate ASH using Python Local (Windows)
      if: inputs.method == 'python-local' && runner.os == 'Windows'
      shell: pwsh
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        Write-Host "Testing ASH using Python (Local) on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        ash --version
        ash --help
        ash dependencies install
        ash config get
        if ("${{ inputs.config-file }}" -eq "community") {
          ash --mode local --build-target ci --verbose --no-progress --config .ash/.ash_community_plugins.yaml
        } else {
          ash --mode local --build-target ci --verbose --no-progress
        }

    - name: Validate No Plugin Errors (Python Local Windows)
      if: inputs.method == 'python-local' && runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "Checking for plugin execution errors..."
        # Printed for a human reading a failure, not parsed. Select-String "ERROR"
        # used to be the check, and it is case-insensitive by default, so any
        # report line containing lower-case "error" inflated the count on top of
        # the legend-line offset the other legs carried.
        & ash report --format text 2>&1 | Write-Host
        $null = $LASTEXITCODE
        # setup-python puts `python` on PATH everywhere and `python3` only on
        # Unix, so resolve rather than assuming either.
        $Python = if (Get-Command python3 -ErrorAction SilentlyContinue) { "python3" } else { "python" }
        & $Python "${{ github.action_path }}/count_scanner_errors.py" `
          .ash/ash_output/ash_aggregated_results.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Hand PATH precedence back to Git Bash now that psych is built. MSYS2 has to be
    # first while the gem compiles and must not still be first for the `shell: bash`
    # steps below it -- "Revoke the Actions cache credentials from the job
    # environment" and "Validate GitLab SAST Report Schema Compliance" both run on
    # this leg and both expect Git Bash.
    #
    # Re-adding the directory is enough to move it, rather than merely duplicating
    # it. GITHUB_PATH lines accumulate in a list that the runner reverses before
    # joining, so the last entry added ends up first
    # (actions/runner src/Runner.Worker/Handlers/Handler.cs,
    # PrependPath.Reverse<string>()), and each line is removed from the list before
    # being appended (src/Runner.Worker/FileCommandManager.cs, RemoveAll then Add),
    # so an entry already present is promoted instead of repeated.
    - name: Restore Git Bash precedence after the Ruby toolchain (Windows)
      if: inputs.method == 'python-local' && runner.os == 'Windows'
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\bin'

    # Python Local scan (Unix)
    - name: Validate ASH using Python Local (Unix)
      if: inputs.method == 'python-local' && runner.os != 'Windows'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Testing ASH using Python (Local) on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        ash --version
        ash --help
        ash dependencies install
        ash config get
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ash --mode local --build-target ci --verbose --no-progress --config .ash/.ash_community_plugins.yaml
        else
          ash --mode local --build-target ci --verbose --no-progress
        fi

    - name: Validate No Plugin Errors (Python Local Unix)
      if: inputs.method == 'python-local' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "Checking for plugin execution errors..."
        # Still printed, because it is what a human reads when this step fails.
        # It is no longer what the check is computed from; see the script's module
        # docstring for why counting "ERROR" in rendered prose was off by one.
        ash report --format text
        python3 "${{ github.action_path }}/count_scanner_errors.py" \
          .ash/ash_output/ash_aggregated_results.json

    # PowerShell scan
    - name: Validate ASH using PowerShell
      if: inputs.method == 'powershell'
      shell: pwsh
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        Write-Host "Testing ASH using PowerShell on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        . ./utils/ash_helpers.ps1
        Get-Help Invoke-ASH -Full
        $runner = if ($env:OCI_RUNNER) { $env:OCI_RUNNER } else { "docker" }
        if ("${{ inputs.config-file }}" -eq "community") {
          Invoke-ASH -BuildTarget ci -SourceDir "$($PWD.Path)" -OutputDir "$($PWD.Path)/.ash/ash_output" -Verbose -Debug -OCIRunner $runner -ConfigFile ".ash/.ash_community_plugins.yaml"
        } else {
          Invoke-ASH -BuildTarget ci -SourceDir "$($PWD.Path)" -OutputDir "$($PWD.Path)/.ash/ash_output" -Verbose -Debug -OCIRunner $runner
        }

    # This step used to read `$Results.scanners.<name>.result`. Neither the key nor
    # the field exists: AshAggregatedResults declares `scanner_results`, keyed by
    # scanner name, and each entry carries `status`, not `result`. So the foreach
    # iterated an empty property set, $ErrorCount stayed 0, and this step reported
    # "SUCCESS: No plugin execution errors found" on every run without ever having
    # looked at a scanner. It was the same silent always-pass as the grep legs, one
    # layer deeper -- and it was the implementation the others were about to be
    # modelled on. Replaced with the same shared counter, which fails when
    # `scanner_results` is missing or empty rather than reporting zero.
    - name: Validate No Plugin Errors (PowerShell)
      if: inputs.method == 'powershell'
      shell: pwsh
      run: |
        Write-Host "Checking for plugin execution errors..."
        # setup-python puts `python` on PATH everywhere and `python3` only on
        # Unix, so resolve rather than assuming either. This method runs only on
        # Linux cells today, but the resolution costs nothing and removes a trap
        # if a Windows cell is ever added.
        $Python = if (Get-Command python3 -ErrorAction SilentlyContinue) { "python3" } else { "python" }
        & $Python "${{ github.action_path }}/count_scanner_errors.py" `
          .ash/ash_output/ash_aggregated_results.json
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Bash scan
    - name: Validate ASH using Bash
      if: inputs.method == 'bash'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Testing ASH using Bash on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        chmod +x ./ash
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ./ash --build-target ci --verbose --config .ash/.ash_community_plugins.yaml
        else
          ./ash --build-target ci --verbose
        fi

    - name: Validate No Plugin Errors (Bash)
      if: inputs.method == 'bash'
      shell: bash
      run: |
        echo "Checking for plugin execution errors..."
        # Still printed, because it is what a human reads when this step fails.
        # It is no longer what the check is computed from; see the script's module
        # docstring for why counting "ERROR" in rendered prose was off by one.
        ./ash report --format text
        python3 "${{ github.action_path }}/count_scanner_errors.py" \
          .ash/ash_output/ash_aggregated_results.json

    # Companion to "Expose the Actions cache credentials to ASH's build". The build
    # is done by now, so clear the credentials back out rather than leaving them in
    # the environment for the artifact upload, the PR comment and anything else a
    # caller adds after this action.
    #
    # Writing an empty value to GITHUB_ENV is how a composite action unsets a
    # variable for subsequent steps; there is no delete verb. `always()` so the
    # cleanup still happens when a scan fails, which is exactly when extra debug
    # output is most likely to be flowing.
    - name: Revoke the Actions cache credentials from the job environment
      if: >-
        always()
        && contains(inputs.os, 'ubuntu')
        && inputs.method != 'python-local'
        && inputs.oci-runner == 'docker'
      shell: bash
      run: |
        for name in ACTIONS_RUNTIME_TOKEN ACTIONS_CACHE_URL ACTIONS_RESULTS_URL; do
          echo "${name}=" >> "$GITHUB_ENV"
        done
        echo "Cleared the buildx cache credentials from the job environment"

    # Common post-scan validation
    - name: Collect ASH output artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      if: success() || failure()
      with:
        name: ash_output-${{ inputs.os }}-${{ inputs.method }}-${{ inputs.config-file }}${{ inputs.oci-runner && format('-{0}', inputs.oci-runner) || '' }}${{ inputs.offline == 'true' && '-offline' || '' }}
        path: .ash/ash_output
        retention-days: 7
        if-no-files-found: warn

    - name: Verify scan completed
      shell: pwsh
      run: |
        Write-Host "Verifying scan completed on ${{ inputs.os }} using method '${{ inputs.method }}' with config: ${{ inputs.config-file }}"
        $PathsToValidate = @(
          ".ash/ash_output/ash_aggregated_results.json"
          ".ash/ash_output/reports/ash.sarif"
        )
        foreach ($ValPath in $PathsToValidate) {
          if (Test-Path $ValPath) {
            Write-Host "$ValPath found"
          } else {
            Write-Host "$ValPath NOT found"
            exit 1
          }
        }

    - name: Validate GitLab SAST Report Schema Compliance
      shell: bash
      run: |
        echo "Validating GitLab SAST report schema compliance..."
        GITLAB_REPORTS=$(find .ash/ash_output -name "*.gl-sast-report.json")
        if [ -z "$GITLAB_REPORTS" ]; then
          echo "ERROR: GitLab SAST report not found in .ash/ash_output"
          exit 1
        fi
        echo "Found GitLab SAST reports to validate:"
        echo "$GITLAB_REPORTS"
        npm install -g ajv-cli
        curl -o gitlab-sast-schema.json "https://gitlab.com/gitlab-org/security-products/security-report-schemas/-/raw/master/dist/sast-report-format.json"
        VALIDATION_FAILED=false
        for report in $GITLAB_REPORTS; do
          echo "Validating $report..."
          if ajv validate -s gitlab-sast-schema.json -d "$report" --strict=false --all-errors; then
            echo "PASS: $report passed schema validation"
          else
            echo "FAIL: $report failed schema validation"
            VALIDATION_FAILED=true
          fi
        done
        if [ "$VALIDATION_FAILED" = true ]; then
          echo "ERROR: One or more GitLab SAST reports failed schema validation"
          exit 1
        else
          echo "SUCCESS: All GitLab SAST reports passed schema validation"
        fi
