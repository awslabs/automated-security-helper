name: "Run Scan Test"
description: "Run ASH scan with a configurable method and validate results"

inputs:
  method:
    description: "Scan method: python-local, python-container, bash, powershell"
    required: true
  os:
    description: "Runner OS label"
    required: true
  platform:
    description: "Platform string (linux/amd64, darwin/amd64, etc.)"
    required: true
  config-file:
    description: "Config variant: default or community"
    required: false
    default: "default"
  snyk-token:
    description: "Snyk token for community plugin validation"
    required: false
    default: ""
  oci-runner:
    description: "OCI container runtime: docker, podman, or finch"
    required: false
    default: "docker"
  offline:
    description: "Build and run in offline/airgapped mode"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx on Linux
      if: contains(inputs.os, 'ubuntu') && inputs.method != 'python-local' && inputs.oci-runner != 'finch'
      uses: docker/setup-buildx-action@v4

    - name: Create output directory
      shell: bash
      run: mkdir -p .ash/ash_output

    # Community plugin tools
    - name: Install Community Plugin Tools
      if: inputs.config-file == 'community'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Installing tools needed for community plugins..."

        # Every install below pulls a third-party binary over the network, and none
        # of them had a retry. Observed failure: snyk's npm post-install wrapper hit
        # ECONNRESET part-way through downloading snyk-win.exe, retried the download
        # successfully (shasums matched), then died renaming a temp file the failed
        # attempt had already cleaned up - taking the whole
        # `scan (python-local, windows-latest) - Community Plugins` job with it,
        # before ASH was even invoked.
        retry() {
          local attempts=3 n=1
          until "$@"; do
            if [ "$n" -ge "$attempts" ]; then
              echo "::error::'$*' failed after ${attempts} attempts"
              return 1
            fi
            echo "::warning::'$*' failed (attempt ${n}/${attempts}); retrying in $((n * 10))s"
            sleep $((n * 10))
            n=$((n + 1))
          done
        }

        retry npm install -g snyk
        snyk version

        if [[ "$RUNNER_OS" == "Linux" ]]; then
          # -o pipefail on the inner shell, not just this one: pipefail is a
          # shell option and does not cross a `bash -c` boundary. Without it
          # `sh` exits 0 on the empty stdin curl leaves behind when it fails,
          # retry() sees success, and the missing binary surfaces later.
          retry bash -o pipefail -c 'curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin'
          trivy version
        elif [[ "$RUNNER_OS" == "macOS" ]]; then
          retry brew install trivy
          trivy version
        elif [[ "$RUNNER_OS" == "Windows" ]]; then
          retry curl -sfL -o trivy.zip "https://get.trivy.dev/trivy?type=zip&os=windows&arch=amd64"
          mkdir -p /tmp/trivy-install
          mv trivy.zip /tmp/trivy-install/
          cd /tmp/trivy-install
          unzip trivy.zip
          mkdir -p /c/tools
          mv trivy.exe /c/tools/
          echo "C:\tools" >> $GITHUB_PATH
          export PATH="/c/tools:$PATH"
          trivy version
        fi

        # `pip install ferret-scan` resolves to whatever is newest, which is not
        # a version anyone chose. ferret-scan 2.3.3 was published at
        # 2026-08-20T21:14:59Z; jobs whose install step ran after that installed
        # it, picked up a new API_KEY_OR_SECRET detector that matches
        # `session: Optional[Session]` in generated Pydantic schemas, and failed
        # on 2 findings. Runs from 40 minutes earlier passed on 2.3.2. Three
        # unrelated merge-queue branches broke in the same window with no source
        # change.
        #
        # The plugin already declares the range it is tested against, so read it
        # from there rather than repeating it here -- one source of truth, and if
        # the constant moves this fails loudly instead of silently reverting to
        # installing latest.
        FERRET_CONSTRAINT="$(python -c 'from automated_security_helper.plugin_modules.ash_ferret_plugins.ferret_scanner import DEFAULT_VERSION_CONSTRAINT as c; print(c)')"
        if [ -z "$FERRET_CONSTRAINT" ]; then
          echo "::error::Could not read ferret-scan's declared version constraint from its ASH plugin. Refusing to install an unconstrained version."
          exit 1
        fi
        echo "Installing ferret-scan against its plugin-declared constraint: ${FERRET_CONSTRAINT}"
        retry pip install "ferret-scan${FERRET_CONSTRAINT}"
        ferret-scan --version

    # Validate config
    - name: Validate ASH config files
      if: contains(inputs.method, 'python')
      shell: bash
      run: |
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ash config validate --config .ash/.ash_community_plugins.yaml
        else
          ash config validate --config .ash/.ash.yaml
        fi

    # Python Container scan
    - name: Validate ASH using Python + Container
      if: inputs.method == 'python-container'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Testing ASH using Python (Container) on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        ash --version
        OFFLINE_FLAG=""
        if [ "${{ inputs.offline }}" = "true" ]; then
          OFFLINE_FLAG="--offline"
        fi
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ash --mode container --build-target ci --verbose --no-progress --ash-revision-to-install LOCAL $OFFLINE_FLAG --config .ash/.ash_community_plugins.yaml
        else
          ash --mode container --build-target ci --verbose --no-progress --ash-revision-to-install LOCAL $OFFLINE_FLAG
        fi

    - name: Validate No Plugin Errors (Python Container)
      if: inputs.method == 'python-container'
      shell: bash
      run: |
        echo "Checking for plugin execution errors..."
        export PATH="$HOME/.local/bin:$PATH"
        if command -v ash >/dev/null 2>&1; then
          REPORT_CMD="ash report --format text"
        else
          REPORT_CMD="python -m automated_security_helper report --format text"
        fi
        REPORT_OUTPUT=$($REPORT_CMD)
        echo "$REPORT_OUTPUT"
        ERROR_COUNT=$(echo "$REPORT_OUTPUT" | grep -c "ERROR" | head -1)
        if [ "$ERROR_COUNT" -gt 1 ]; then
          echo "ERROR: Found $((ERROR_COUNT - 1)) plugin execution errors"
          exit 1
        fi

    # Python Local scan (Windows)
    - name: Validate ASH using Python Local (Windows)
      if: inputs.method == 'python-local' && runner.os == 'Windows'
      shell: pwsh
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        Write-Host "Testing ASH using Python (Local) on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        ash --version
        ash --help
        ash dependencies install
        ash config get
        if ("${{ inputs.config-file }}" -eq "community") {
          ash --mode local --build-target ci --verbose --no-progress --config .ash/.ash_community_plugins.yaml
        } else {
          ash --mode local --build-target ci --verbose --no-progress
        }

    - name: Validate No Plugin Errors (Python Local Windows)
      if: inputs.method == 'python-local' && runner.os == 'Windows'
      shell: pwsh
      run: |
        Write-Host "Checking for plugin execution errors..."
        $ReportText = & ash report --format text 2>&1; $null = $LASTEXITCODE
        $ErrorOutput = $ReportText | Select-String "ERROR"
        if ($ErrorOutput -and $ErrorOutput.Count -gt 1) {
          Write-Host "ERROR: Found plugin execution errors in the scan results (excluding legend)"
          $ErrorOutput | Select-Object -Skip 1
          exit 1
        } else {
          Write-Host "SUCCESS: No plugin execution errors found"
          exit 0
        }

    # Python Local scan (Unix)
    - name: Validate ASH using Python Local (Unix)
      if: inputs.method == 'python-local' && runner.os != 'Windows'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Testing ASH using Python (Local) on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        ash --version
        ash --help
        ash dependencies install
        ash config get
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ash --mode local --build-target ci --verbose --no-progress --config .ash/.ash_community_plugins.yaml
        else
          ash --mode local --build-target ci --verbose --no-progress
        fi

    - name: Validate No Plugin Errors (Python Local Unix)
      if: inputs.method == 'python-local' && runner.os != 'Windows'
      shell: bash
      run: |
        echo "Checking for plugin execution errors..."
        REPORT_OUTPUT=$(ash report --format text)
        echo "$REPORT_OUTPUT"
        ERROR_COUNT=$(echo "$REPORT_OUTPUT" | grep -c "ERROR" | head -1)
        if [ "$ERROR_COUNT" -gt 1 ]; then
          echo "ERROR: Found $((ERROR_COUNT - 1)) plugin execution errors"
          exit 1
        fi

    # PowerShell scan
    - name: Validate ASH using PowerShell
      if: inputs.method == 'powershell'
      shell: pwsh
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        Write-Host "Testing ASH using PowerShell on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        . ./utils/ash_helpers.ps1
        Get-Help Invoke-ASH -Full
        $runner = if ($env:OCI_RUNNER) { $env:OCI_RUNNER } else { "docker" }
        if ("${{ inputs.config-file }}" -eq "community") {
          Invoke-ASH -BuildTarget ci -SourceDir "$($PWD.Path)" -OutputDir "$($PWD.Path)/.ash/ash_output" -Verbose -Debug -OCIRunner $runner -ConfigFile ".ash/.ash_community_plugins.yaml"
        } else {
          Invoke-ASH -BuildTarget ci -SourceDir "$($PWD.Path)" -OutputDir "$($PWD.Path)/.ash/ash_output" -Verbose -Debug -OCIRunner $runner
        }

    - name: Validate No Plugin Errors (PowerShell)
      if: inputs.method == 'powershell'
      shell: pwsh
      run: |
        Write-Host "Checking for plugin execution errors..."
        $ResultsFile = ".ash/ash_output/ash_aggregated_results.json"
        if (Test-Path $ResultsFile) {
          $Results = Get-Content $ResultsFile | ConvertFrom-Json
          $ErrorCount = 0
          foreach ($Scanner in $Results.scanners.PSObject.Properties) {
            if ($Scanner.Value.result -eq "ERROR") {
              $ErrorCount++
              Write-Host "ERROR: Scanner $($Scanner.Name) failed with error"
            }
          }
          if ($ErrorCount -gt 0) {
            Write-Host "ERROR: Found $ErrorCount plugin execution errors"
            exit 1
          } else {
            Write-Host "SUCCESS: No plugin execution errors found"
          }
        } else {
          Write-Host "ERROR: Results file not found at $ResultsFile"
          exit 1
        }

    # Bash scan
    - name: Validate ASH using Bash
      if: inputs.method == 'bash'
      shell: bash
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        echo "Testing ASH using Bash on ${{ inputs.os }} (${{ inputs.platform }}) with config: ${{ inputs.config-file }}"
        chmod +x ./ash
        if [ "${{ inputs.config-file }}" = "community" ]; then
          ./ash --build-target ci --verbose --config .ash/.ash_community_plugins.yaml
        else
          ./ash --build-target ci --verbose
        fi

    - name: Validate No Plugin Errors (Bash)
      if: inputs.method == 'bash'
      shell: bash
      run: |
        echo "Checking for plugin execution errors..."
        REPORT_OUTPUT=$(./ash report --format text)
        echo "$REPORT_OUTPUT"
        ERROR_COUNT=$(echo "$REPORT_OUTPUT" | grep -c "ERROR" | head -1)
        if [ "$ERROR_COUNT" -gt 1 ]; then
          echo "ERROR: Found $((ERROR_COUNT - 1)) plugin execution errors"
          exit 1
        fi

    # Common post-scan validation
    - name: Collect ASH output artifact
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: ash_output-${{ inputs.os }}-${{ inputs.method }}-${{ inputs.config-file }}${{ inputs.oci-runner && format('-{0}', inputs.oci-runner) || '' }}${{ inputs.offline == 'true' && '-offline' || '' }}
        path: .ash/ash_output
        retention-days: 7
        if-no-files-found: warn

    - name: Verify scan completed
      shell: pwsh
      run: |
        Write-Host "Verifying scan completed on ${{ inputs.os }} using method '${{ inputs.method }}' with config: ${{ inputs.config-file }}"
        $PathsToValidate = @(
          ".ash/ash_output/ash_aggregated_results.json"
          ".ash/ash_output/reports/ash.sarif"
        )
        foreach ($ValPath in $PathsToValidate) {
          if (Test-Path $ValPath) {
            Write-Host "$ValPath found"
          } else {
            Write-Host "$ValPath NOT found"
            exit 1
          }
        }

    - name: Validate GitLab SAST Report Schema Compliance
      shell: bash
      run: |
        echo "Validating GitLab SAST report schema compliance..."
        GITLAB_REPORTS=$(find .ash/ash_output -name "*.gl-sast-report.json")
        if [ -z "$GITLAB_REPORTS" ]; then
          echo "ERROR: GitLab SAST report not found in .ash/ash_output"
          exit 1
        fi
        echo "Found GitLab SAST reports to validate:"
        echo "$GITLAB_REPORTS"
        npm install -g ajv-cli
        curl -o gitlab-sast-schema.json "https://gitlab.com/gitlab-org/security-products/security-report-schemas/-/raw/master/dist/sast-report-format.json"
        VALIDATION_FAILED=false
        for report in $GITLAB_REPORTS; do
          echo "Validating $report..."
          if ajv validate -s gitlab-sast-schema.json -d "$report" --strict=false --all-errors; then
            echo "PASS: $report passed schema validation"
          else
            echo "FAIL: $report failed schema validation"
            VALIDATION_FAILED=true
          fi
        done
        if [ "$VALIDATION_FAILED" = true ]; then
          echo "ERROR: One or more GitLab SAST reports failed schema validation"
          exit 1
        else
          echo "SUCCESS: All GitLab SAST reports passed schema validation"
        fi
