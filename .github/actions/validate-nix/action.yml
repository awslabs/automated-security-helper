name: "Validate Nix Mode"
description: "Installs Nix, scans a fixture with --mode nix, and asserts every flake-supplied scanner participated"

runs:
  using: "composite"
  steps:
    - name: "nix: install"
      # Pinned to a published tag rather than a floating major, matching how the other
      # workflows in this repository pin actions.
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        # Both features are disabled by default on a stock install, and every flake
        # operation fails with "experimental Nix feature 'nix-command' is disabled"
        # without them. ASH passes these per-invocation too, so this is belt and braces
        # for anything in this job that calls nix directly.
        extra_nix_config: |
          experimental-features = nix-command flakes

    - name: "nix: verify"
      shell: bash
      run: |
        nix --version
        # Evaluates every flake output for this system. Catches an unbuildable derivation
        # before a scan does, where it would surface as a confusing scanner failure.
        nix flake check --no-build .

    - name: "nix: install ASH"
      shell: bash
      # The `cdk` extra, not a bare `pip install .`, and this is a correctness fix
      # rather than a convenience. cdk-nag is the one scanner Nix cannot supply -- it
      # runs in-process through jsii rather than as an external binary, which is why
      # flake.nix omits it and why the assertion below excludes it. But "Nix does not
      # supply it" is not the same claim as "it need not be installed": the scan step
      # selects every enabled scanner, and with cdk-nag's three distributions absent it
      # reported MISSING. That was tolerated only while the completeness gate was
      # opt-in; with fail_on_incomplete_scanners on by default the scan exits 1, so a
      # bare install now fails this job for a reason that has nothing to do with Nix.
      #
      # Installing it is the honest close rather than excluding cdk-nag from the scan.
      # `node` comes from `pkgs.nodejs` in the flake's dev shell -- already there for
      # `npm audit` -- and ASH re-execs itself inside `nix develop`, so the in-process
      # scanner finds the pinned interpreter on PATH. Measured against this action's own
      # fixture: cdk-nag evaluates template.yaml across all five packs and classifies
      # package.json as not-CloudFormation, so it attempts one target and fails none.
      run: pip install '.[cdk]'

    - name: "nix: create test fixture"
      shell: bash
      run: |
        mkdir -p /tmp/ash-nix-selftest
        # Deliberately flawed inputs so scanners have something to report. A fixture that
        # triggers nothing would let this job pass while every scanner sat idle -- which is
        # the exact failure mode Nix mode exists to prevent, so it must not be the shape of
        # the test for it.
        #
        # These are scanner FIXTURES, never executed: the shell=True call and the
        # hardcoded credential are the patterns bandit and detect-secrets should flag.
        cat > /tmp/ash-nix-selftest/app.py <<'PY'
        import subprocess
        PASSWORD = "hunter2"
        def run(cmd):
            subprocess.call(cmd, shell=True)
        PY
        cat > /tmp/ash-nix-selftest/template.yaml <<'YAML'
        Resources:
          Bucket:
            Type: AWS::S3::Bucket
            Properties:
              BucketName: ash-nix-selftest-bucket
        YAML
        printf '{ "name": "ash-nix-selftest", "version": "1.0.0", "dependencies": {} }\n' \
          > /tmp/ash-nix-selftest/package.json
        # For hadolint, a community scanner whose module the scan below lists. Unpinned base
        # image tag, so DL3007 fires and the scanner has something to report.
        printf 'FROM ubuntu:latest\nRUN echo fixture\n' > /tmp/ash-nix-selftest/Dockerfile

    - name: "nix: scan"
      shell: bash
      env:
        # Point at the flake in THIS checkout. ASH is pip-installed above, so it lives in
        # site-packages with no flake beside it, and resolve_flake_ref correctly falls back
        # to the published repository at the running version. That fallback cannot work
        # here: flake.nix exists only on this branch, so the released tag has no flake and
        # nix fails with "path '«github:...»/flake.nix' does not exist". CI must exercise
        # the flake under review in any case, not a previously released one.
        ASH_NIX_FLAKE_REF: "path:${{ github.workspace }}"
      # ASH's documented exit codes: 0 success, 1 error during execution, 2 actionable
      # findings with fail_on_findings. This fixture is built to produce findings, so 2 is
      # the expected success case and gating on zero would fail precisely when the scan
      # worked.
      #
      # Distinguishing 2 from 1 rather than using `|| true`: an earlier version swallowed
      # every status, so when the scan died on a bad flake reference the job carried on and
      # failed later at the assertion with "no results ... the scan did not complete". That
      # reports a symptom and hides the cause, which cost a full CI round trip to diagnose.
      run: |
        set +e
        ash scan \
          --mode nix \
          --source-dir /tmp/ash-nix-selftest \
          --output-dir /tmp/ash-nix-selftest/output \
          --ash-plugin-modules automated_security_helper.plugin_modules.ash_hadolint_plugins \
          --simple
        rc=$?
        set -e
        if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
          echo "::error::ash scan --mode nix exited $rc (expected 0, or 2 for findings)"
          exit "$rc"
        fi
        echo "scan exited $rc"

    - name: "nix: assert every flake-supplied scanner participated"
      shell: bash
      run: |
        python3 <<'PY'
        import json
        import pathlib
        import sys

        results = pathlib.Path("/tmp/ash-nix-selftest/output/ash_aggregated_results.json")
        if not results.exists():
            sys.exit(f"FAIL: no results at {results}; the scan did not complete")

        data = json.loads(results.read_text())
        raw = data.get("scanner_results") or {}
        rows = raw.items() if isinstance(raw, dict) else (
            (r.get("scanner_name"), r) for r in raw
        )
        statuses = {
            name: str(res.get("status", "?"))
            for name, res in rows
            if isinstance(res, dict)
        }

        if not statuses:
            sys.exit("FAIL: the report carried no per-scanner statuses")

        # The scanners this flake is responsible for supplying. cdk-nag is excluded
        # deliberately: its scanner sets self.command = "python" and runs from ASH's own
        # environment, so Nix never supplies it and its status says nothing about whether
        # the flake worked. Gating on it would make this job fail for an unrelated reason.
        #
        # It stays off this list even though the install step above now installs it. The
        # list's question is "did the flake hand ASH a working binary", and for cdk-nag
        # there is no binary either way. What keeps cdk-nag honest here is the scan step's
        # own exit code: fail_on_incomplete_scanners is on by default, so a cdk-nag that
        # goes MISSING or leaves a target unevaluated fails the step before this
        # assertion runs.
        #
        # cfn-guard comes from nix/cfn-guard.nix (nixpkgs has no package), with the Guard
        # Rules Registry seeded by the shellHook; trivy's vulnerability database is
        # seeded the same way. Without the seeding both would be MISSING here.
        #
        # hadolint is a community scanner, so the scan above lists its module with
        # --ash-plugin-modules; otherwise it would be absent from the report and this
        # list could not check that the flake supplies it. The GuardDog module is not
        # listed: nixpkgs has no GuardDog package, so the flake does not supply it.
        flake_supplied = [
            "actionlint",
            "bandit",
            "cfn-guard",
            "cfn-lint",
            "cfn-nag",
            "checkov",
            "detect-secrets",
            "gitleaks",
            "grype",
            "hadolint",
            "npm-audit",
            "opengrep",
            "semgrep",
            "syft",
            "trivy",
            "zizmor",
        ]

        for name in sorted(statuses):
            print(f"  {name:<18} {statuses[name]}")
        print()

        # MISSING means the binary was absent: the scanner contributed zero findings and
        # said so only in this table. That is the specific silent under-report this mode
        # exists to eliminate, so it is the assertion. A scanner reporting FAILED is
        # healthy -- that is ASH's word for "found actionable findings".
        missing = [n for n in flake_supplied if statuses.get(n, "MISSING").upper() == "MISSING"]
        absent = [n for n in flake_supplied if n not in statuses]

        if absent:
            sys.exit(f"FAIL: scanners absent from the report entirely: {absent}")
        if missing:
            sys.exit(f"FAIL: flake-supplied scanners reported MISSING: {missing}")

        print(f"PASS: all {len(flake_supplied)} flake-supplied scanners participated")
        PY

    # === zizmor, on its own ===
    #
    # zizmor also runs in the scan above, whose participation check says only that
    # it was not MISSING. This runs it alone with --scanners against a workflow that
    # has a known template injection, and requires a FAILED status with that finding: MISSING or ERROR would mean the
    # flake does not supply a working zizmor, and PASSED would mean it ran
    # but its output was lost.
    - name: "nix: zizmor runs and reports"
      shell: bash
      env:
        # The flake under review, for the reason given on the scan step above.
        ASH_NIX_FLAKE_REF: "path:${{ github.workspace }}"
      run: |
        mkdir -p /tmp/ash-zizmor-selftest/.github/workflows
        # The expression is assembled from two halves so this action file never
        # contains a literal one: GitHub would expand it here, in this step.
        open='$''{{'
        printf '%s\n' \
          'on: issues' \
          'permissions: {}' \
          'jobs:' \
          '  greet:' \
          '    runs-on: ubuntu-latest' \
          '    steps:' \
          "      - run: echo \"${open} github.event.issue.title }}\"" \
          > /tmp/ash-zizmor-selftest/.github/workflows/selftest.yml
        cat /tmp/ash-zizmor-selftest/.github/workflows/selftest.yml
        set +e
        ash scan \
          --mode nix \
          --source-dir /tmp/ash-zizmor-selftest \
          --output-dir /tmp/ash-zizmor-selftest/output \
          --scanners zizmor \
          --no-fail-on-findings \
          --fail-on-incomplete-scanners \
          --simple
        rc=$?
        set -e
        if [ "$rc" -ne 0 ]; then
          echo "::error::ash scan --scanners zizmor exited $rc; with --no-fail-on-findings only an incomplete or broken scan exits non-zero."
          exit "$rc"
        fi
        python3 <<'PY'
        import json
        import pathlib
        import sys

        data = json.loads(pathlib.Path("/tmp/ash-zizmor-selftest/output/ash_aggregated_results.json").read_text())
        status = str((data.get("scanner_results") or {}).get("zizmor", {}).get("status", "absent"))
        rules = [
            result.get("ruleId")
            for run in (data.get("sarif") or {}).get("runs", [])
            for result in run.get("results", [])
        ]
        print(f"zizmor status: {status}; rules: {sorted(set(r for r in rules if r))}")
        if status.upper() != "FAILED" or "zizmor/template-injection" not in rules:
            sys.exit("FAIL: zizmor did not report the fixture's template injection")
        print("PASS: zizmor ran and reported the fixture's template injection")
        PY
    # The snapshot tests run under uv, from this checkout, so their `ash` is the code under
    # review. Same uv pin as .github/actions/setup-ash, which this job does not use. Its
    # cache is off: the Actions cache of a public repository is readable by anyone, and
    # .github/scripts/assert-publish-surfaces.py admits only the caches already reviewed.
    - name: "nix: install uv for the snapshot check"
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: "0.11.4"
        enable-cache: false

    # What `ash scan --mode nix` prints around the shell and exits with, against syrupy
    # snapshots. tests/conftest.py deselects the module everywhere else, because only a leg
    # with Nix can enter the shell. After the scan above on purpose: that scan's first entry
    # into the shell already seeded the grype and rule caches, so this one downloads nothing.
    - name: "nix: snapshot the Nix-mode output"
      shell: bash
      run: |
        uv run --extra cdk pytest \
          tests/snapshot/container/runtime/test_snapshot_container_nix_runtime.py \
          --run-nix-snapshots --no-cov -n 0
