name: "Run Unit Tests"
description: "Run pytest with coverage and publish results"

inputs:
  os:
    description: "OS label for artifact naming"
    required: true
  python-version:
    description: "Python version label for artifact naming"
    required: true
  shard:
    description: >-
      Which slice of the suite to run, written <index>of<count> (for example 3of8).
      The default, 1of1, runs the whole suite and enforces the coverage threshold
      itself. Any other value runs only that shard's test files, measures coverage
      without gating it, and leaves the threshold to the unit-coverage job, which
      combines every shard's data (.github/scripts/combine-unit-coverage.py).
    required: false
    default: "1of1"

runs:
  using: "composite"
  steps:
    # WHY THE ARCH LABEL IS DERIVED HERE RATHER THAN PASSED IN
    #
    # This was an `arch` input, fed from a five-row `include:` table in ash-unified-ci.yml that
    # mapped each `os` to a label by hand. Those labels could disagree with the machine, and one
    # did: `macos-latest` is an alias, GitHub moved it to Apple silicon, and the table said
    # x86_64 while the runner logged `Image: macos-26-arm64`.
    #
    # The label is not only cosmetic here. The "Code coverage summary" step below selects exactly
    # one of the 25 matrix legs, and it used to select it by comparing that label, so a
    # mislabelled Linux row would have dropped the step from every leg at once -- a summary that
    # nothing renders and nothing reports missing. It now compares `runner.arch` directly, which
    # is the runner's own statement about itself and cannot be mislabelled upstream.
    #
    # Deriving it in the workflow was not available: GitHub Actions `include:` entries are
    # literals and no expression context exposes a sibling matrix key, so a matrix cannot compute
    # one of its own values from another.
    #
    # `runner.arch` is a closed set. Per the GitHub docs at
    # https://docs.github.com/en/actions/reference/workflows-and-actions/contexts it is "X86, X64,
    # ARM, or ARM64" -- verbatim. All four have an arm, and the default arm still fails closed: a
    # fifth value appearing upstream must surface as a failed step rather than as an empty string
    # in an artifact name, which is how two legs would come to upload under the same name.
    #
    # x86_64 and arm64 are the labels the old table used, kept so artifact names and the `PyTest -
    # ...` check-run names do not change for the legs whose labels were already right.
    - name: Resolve this runner's architecture from the runner itself
      id: runner-arch
      shell: bash
      run: |
        case "${RUNNER_ARCH}" in
          X64) label=x86_64 ;;
          ARM64) label=arm64 ;;
          X86) label=i686 ;;
          ARM) label=armv7l ;;
          *)
            # Two steps below carry `if: success() || failure()`, so they run even once this one
            # has failed. A label is still emitted so the artifact name stays distinct per leg --
            # an empty one would make several legs upload under the same name and bury the real
            # error under a duplicate-artifact error.
            echo "label=unknown-${RUNNER_ARCH}" >> "$GITHUB_OUTPUT"
            echo "::error::runner.arch is '${RUNNER_ARCH}', which is not one of the documented values (X86, X64, ARM, ARM64). Add an arm rather than letting the artifact name lose its architecture."
            exit 1
            ;;
        esac
        echo "label=${label}" >> "$GITHUB_OUTPUT"
        echo "runner.arch=${RUNNER_ARCH} -> ${label}"

    - name: Install dependencies
      shell: bash
      # --extra cdk is required, not cosmetic. A plain `uv sync` installs no optional
      # extras, so cdk-nag was absent from every test run and nothing could exercise the
      # cdk-nag scanner against its real dependency. A breaking major bump of that
      # dependency was therefore invisible to CI.
      #
      # --extra symbols installs tree-sitter and its grammars for symbol-scoped
      # suppressions. They are native wheels, and this matrix is where every OS,
      # architecture and Python version the project supports gets one installed and
      # loaded.
      run: uv sync --extra cdk --extra symbols

    # ASH_REQUIRE_SYMBOLS_EXTRA and ASH_REQUIRE_CDK_EXTRA turn the skip-when-absent of the
    # tests that need each extra into a hard failure, so a leg that stops installing an extra
    # cannot pass by skipping them. A plain `uv sync` on a contributor's machine sets neither,
    # and those tests skip there and name the `uv sync --extra ...` that installs the extra.
    # tests/unit/test_unit_test_step_gates.py fails if either variable is dropped here.
    #
    # The coverage options and the 80% threshold are passed here rather than through
    # pytest.ini's addopts. In addopts they gated every run, so a contributor's run of one
    # directory failed on total coverage with every test passing. This step is the one run
    # of the whole suite, so it is where the threshold means something.
    # tests/unit/test_unit_test_step_gates.py runs this command against a planted test and
    # fails unless it exits non-zero below 80%.
    #
    # It runs only for the whole-suite shard (1of1). ash-unified-ci.yml gives the suite
    # eight shards per OS and Python version, because the whole suite (about 47,000 items)
    # did not finish inside any job timeout on a 4-worker runner. A shard covers part of
    # the package, so the next step runs it without the threshold, and the unit-coverage
    # job applies the same 80% to the shards' combined data.
    #
    # PYTEST_DEBUG_TEMPROOT moves pytest's basetemp (tmp_path and friends) off the
    # runner's shared /tmp. The sandbox backends deliberately treat anything under
    # /tmp as already covered by --private-tmp and the fresh `--tmpfs /tmp` mount
    # (automated_security_helper/utils/sandbox/backends.py, _TMP_ROOT), so a fake
    # home a test builds under tmp_path gets no --blacklist args when basetemp is
    # /tmp/pytest-of-runner, and a passwd home under /tmp reads the `--tmpfs /tmp`
    # value as an ancestor grant: 29 sandbox-policy tests fail on the hosted Linux
    # runners and pass wherever basetemp lives off /tmp. runner.temp is
    # /home/runner/work/_temp on the Linux images, so the tests measure the
    # intended scenario, a home that is NOT inside the sandbox's private tmp.
    # tests/conftest.py sets this knob with setdefault, so the value here wins.
    - name: Run PyTest
      if: inputs.shard == '1of1'
      shell: bash
      env:
        ASH_REQUIRE_SYMBOLS_EXTRA: "1"
        ASH_REQUIRE_CDK_EXTRA: "1"
        PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
      run: |
        uv run pytest \
          --cov=automated_security_helper \
          --cov-config=.coveragerc \
          --cov-report=term-missing \
          --cov-report=xml:test-results/pytest.coverage.xml \
          --cov-report=html:test-results/coverage_html \
          --cov-fail-under=80

    # One shard of the suite, with the same extras gates and basetemp as "Run PyTest" above.
    #
    # ASH_TEST_SHARD makes tests/conftest.py's pytest_ignore_collect hook (tests/utils/
    # sharding.py) ignore the test modules another shard owns. No file is named on the
    # command line: a file named there would skip pytest's own ignore rules and its
    # python_files match, so pytest collects exactly as it does for the whole suite and the
    # hook only removes modules, which are then never imported.
    #
    # Coverage is measured, with no threshold, because a shard covers only part of the
    # package; --cov-report= prints and writes no report. The data stays in pytest-cov's
    # default .coverage, not a COVERAGE_FILE set here: that variable would reach every
    # process a test starts and could merge a nested run's data into this shard's.
    #
    # Its own --junit-xml path, so it does not claim the file "Run PyTest" names. The
    # report step's glob matches both.
    - name: Run PyTest shard
      if: inputs.shard != '1of1'
      shell: bash
      env:
        ASH_REQUIRE_SYMBOLS_EXTRA: "1"
        ASH_REQUIRE_CDK_EXTRA: "1"
        PYTEST_DEBUG_TEMPROOT: ${{ runner.temp }}
        ASH_TEST_SHARD: ${{ inputs.shard }}
      run: |
        uv run pytest \
          --cov=automated_security_helper \
          --cov-config=.coveragerc \
          --cov-report= \
          --junit-xml=test-results/pytest-shard.junit.xml

    # The shard's coverage data, where the artifact upload below carries it to the
    # unit-coverage job. It runs after a failed test run too, since that run's data is
    # still the shard's. The name has no leading dot on purpose: upload-artifact leaves out
    # hidden files unless told otherwise.
    - name: Keep this shard's coverage data
      if: (success() || failure()) && inputs.shard != '1of1'
      shell: bash
      run: |
        mkdir -p test-results
        cp .coverage test-results/coverage.data

    # Runs the cdk-nag integration tests, which the default pytest invocation above does
    # NOT run: tests/conftest.py skips anything whose keywords include "integration", and
    # pytest picks that up from the tests/integration directory name.
    #
    # This step is no longer the only thing that passes --run-integration. The rest of the
    # suite now runs in the `integration-test` job in ash-unified-ci.yml, which covers all
    # 115 gated items including these 11. So the reason this step stays scoped to one file
    # has changed, and it is worth stating rather than leaving the old one to rot: it is
    # here to keep the cdk-nag path exercised on every Python version in the matrix, which
    # a single-platform, single-version integration job does not do. That is also why the
    # duplication is deliberate rather than an oversight.
    #
    # The old reason -- that enabling the tree surfaced pre-existing failures and would
    # make this check noise -- was true when written and is not why the scoping remains.
    #
    # ASH_REQUIRE_CDK_EXTRA turns a missing extra into a hard failure instead of a skip, so
    # this step cannot silently stop testing anything if the install step above changes.
    #
    # Its own --junit-xml path. Without one it took pytest.ini's
    # test-results/pytest.junit.xml and overwrote the report "Run PyTest" had just
    # written, so the published check listed only these tests. report_paths below
    # matches both files.
    #
    # Once per OS and Python version, not once per shard: it runs in the first shard
    # (the whole-suite shard 1of1 also starts with "1of"), so each OS and Python
    # combination still runs these eleven tests exactly once.
    - name: Run cdk-nag integration tests
      if: success() && startsWith(inputs.shard, '1of')
      shell: bash
      env:
        ASH_REQUIRE_CDK_EXTRA: "1"
      run: |
        uv run pytest \
          tests/integration/scanners/test_cdk_nag_real_pack.py \
          --run-integration -p no:randomly --no-cov -v \
          --junit-xml=test-results/cdk-nag-integration.junit.xml

    # No `update_check: true`. It selected the action's update path, which looks up an
    # existing check run by `job_name` -- default `${{ github.job }}`, the job's YAML
    # key `unit-test` -- while GitHub names the check run after the job's DISPLAY name,
    # `unit-test (ubuntu-latest, py3.12)`. Nothing matched, so `checks.data.check_runs`
    # came back empty and annotator.ts reads `check_runs[0].id` with no guard. Every
    # job threw "Cannot read properties of undefined (reading 'id')" and lost its
    # annotations. The action catches that and still reports success, so the loss was
    # silent and total -- on passing runs too, which is why it went unnoticed, and why
    # a failing test rendered as a red cell with no inline detail.
    #
    # It was not a permissions problem, despite the action's own hint saying it usually
    # is: the calling job already grants `checks: write`, and no log contains "Resource
    # not accessible by integration". Nor a stale pin; v6.5.0 is the newest release.
    # Dropping the input takes the create path, which names the check run from
    # `check_name` below -- so that per-cell input is load-bearing now instead of dead.
    - name: Publish PyTest JUnit Test Report
      uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6.5.0
      if: success() || failure()
      with:
        # One glob for both steps' reports, so they are grouped into the one check run
        # this cell publishes (group_reports defaults to true).
        report_paths: "test-results/*.junit.xml"
        include_passed: true
        check_name: PyTest - ${{ inputs.os }} ${{ steps.runner-arch.outputs.label }} Python ${{ inputs.python-version }} shard ${{ inputs.shard }}

    # Rendered by coverage.py itself rather than by irongut/CodeCoverageSummary, which is a
    # Docker-based action. A Docker action's image is pulled during the job's prepare phase,
    # BEFORE any step's `if` is evaluated, so this step's condition -- which selects exactly
    # one of the twenty-five matrix legs -- did not stop the other legs from pulling it. Measured
    # on run 35246976698: every Linux leg logged "Pull ghcr.io/irongut/codecoveragesummary
    # :v1.3.0", including ubuntu-24.04-arm/py3.11 and ubuntu-latest/py3.13, where the
    # condition is false. macOS and Windows legs logged no pull at all, so the exposure was the
    # Linux legs, of which one actually runs the step. That run had eight of them; the matrix now
    # has ten, ubuntu-latest and ubuntu-24.04-arm across five Python versions each. The leg count
    # is stated for the matrix as it stands, the eight for the run it was measured on -- they are
    # different populations and only one of them was ever counted on a runner.
    #
    # That made a cosmetic summary a hard dependency on ghcr.io for every Linux leg but one --
    # seven at the time of that run, nine now. On that run the pull failed DNS resolution three
    # times (6.4s and 8.8s backoffs, then
    # give up), and because the prepare phase precedes execution, "Install dependencies",
    # "Run PyTest" and "Run cdk-nag integration tests" were all skipped with duration_ms=0.
    # The leg reported failure having run zero tests, and it ejected PR #587 from the merge
    # queue.
    #
    # coverage.py has rendered Markdown since 7.0 and pytest-cov>=7.1 already pins it, so this
    # needs no new dependency and no container. `--fail-under=0` keeps this step from becoming
    # a second coverage gate: `coverage report` exits 2 below any fail_under it is given, and
    # .coveragerc would supply one if a threshold were ever added there again. The real gate
    # is `--cov-fail-under=80` on "Run PyTest" above, which has already run by this point and
    # fails the leg on its own.
    - name: Code coverage summary
      shell: bash
      # `runner.arch == 'X64'`, not a comparison against the derived label. Both select the same
      # single leg -- ubuntu-latest at 3.12, since ubuntu-24.04-arm reports ARM64 -- but this form
      # reads the runner context directly, so the selection does not depend on the mapping in the
      # step above being right. A typo there can only break an artifact name, never silently
      # deselect every leg.
      #
      # Only for the whole-suite shard: a sharded leg has only its own slice's data, and the
      # unit-coverage job renders this table from the combined data instead.
      if: runner.os == 'Linux' && inputs.python-version == '3.12' && runner.arch == 'X64' && inputs.shard == '1of1'
      run: |
        {
          echo '## Code coverage'
          echo
          uv run coverage report --format=markdown --fail-under=0
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload test results
      if: success() || failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ inputs.os }}-${{ steps.runner-arch.outputs.label }}-py${{ inputs.python-version }}-shard${{ inputs.shard }}
        path: test-results/
        if-no-files-found: warn
