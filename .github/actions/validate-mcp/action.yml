name: "Validate MCP Server"
description: "MCP server health check and import test"

runs:
  using: "composite"
  steps:
    - name: Install ASH
      shell: bash
      run: pip install .

    - name: Create test fixture
      shell: bash
      run: |
        mkdir -p /tmp/ash-selftest
        echo 'print("hello")' > /tmp/ash-selftest/test_sample.py

    - name: "mcp: verify command"
      shell: bash
      run: ash mcp --help

    - name: "mcp: test import"
      shell: bash
      run: python -c "from automated_security_helper.cli.mcp_server import run_mcp_server; print('OK')"

    - name: "mcp: start server and health check"
      if: runner.os != 'Windows'
      shell: bash
      run: |
        sleep 5 | ash mcp &
        MCP_PID=$!
        sleep 2
        if kill -0 $MCP_PID; then
          kill $MCP_PID
          wait $MCP_PID || :
          echo "MCP server started and stopped cleanly"
        else
          echo "ERROR: MCP server exited prematurely"
          exit 1
        fi

    - name: "mcp: install MCP Inspector"
      if: runner.os != 'Windows'
      shell: bash
      run: npm install -g @modelcontextprotocol/inspector

    # `--scanners detect-secrets` for the same reason as validate-install: this job
    # checks that the MCP install can run a scan, and it installs ASH alone, so
    # detect-secrets is the only default scanner whose tool arrives with it --
    # `detect-secrets>=1.5.0,<2` is in [project] dependencies and the scanner drives
    # the library in process. Naming it records which scanner the smoke test covers
    # and leaves the other nine SKIPPED rather than MISSING, so the report says what
    # was measured, where suppressing the completeness check would have asserted
    # nothing at all.
    #
    # This used to name bandit and claim bandit was the only scanner whose tool was
    # present. bandit is in no part of pyproject.toml; BanditScanner provisions it
    # with `uv tool install` at scan time, so this cell's green depended on a PyPI
    # fetch and a registry blip read as a completeness failure.
    - name: "mcp: self-test scan"
      shell: bash
      run: ash scan --source-dir /tmp/ash-selftest --output-dir /tmp/ash-selftest/output --simple --phases scan --phases report --scanners detect-secrets
