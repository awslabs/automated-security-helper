name: "Validate Install Method"
description: "Install ASH via pip, pipx, uvx, homebrew, or pre-commit and verify"

inputs:
  method:
    description: "Install method: pip, pipx, uvx, homebrew, pre-commit"
    required: true
  pre-commit-run-hooks:
    description: >-
      pre-commit only. "true" also runs the hooks against fixture repositories
      (pre-commit.sh: minutes, and network for every scanner install), which the
      callers ask for on one cell per OS; any other value runs the manifest check
      alone.
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Create test fixture
      shell: bash
      run: |
        # RUNNER_TEMP, not /tmp: the runner empties it after every job.
        mkdir -p "${RUNNER_TEMP}/ash-selftest"
        echo 'print("hello")' > "${RUNNER_TEMP}/ash-selftest/test_sample.py"

    # Every self-test scan below passes `--scanners detect-secrets`, and that is a
    # statement about what these jobs test rather than a way to quieten them.
    #
    # This action answers one question: after installing ASH by method X, does
    # `ashx scan` run end to end? It installs ASH and nothing else -- no
    # `ashx dependencies install`, no `[cdk]` extra, no ruby gem, no Go binaries --
    # so of the ten default scanners only the pip-installed ones could possibly
    # run here. Left unnarrowed, the scan selects all ten, five report MISSING for
    # tools this job never intended to provide, and `ashx scan` exits non-zero
    # because a scan that could not run what it was asked to run is not a pass.
    #
    # Naming one scanner says which one the smoke test covers. The nine it leaves
    # out are recorded SKIPPED -- not selected -- so the report shows what was and
    # was not measured. The alternative, `--no-fail-on-incomplete-scanners`, would
    # have kept the same green while asserting nothing about whether any scanner
    # ran, which is the failure mode the completeness gate exists to remove.
    #
    # detect-secrets specifically, because it is the only default scanner that is
    # genuinely vendored. `detect-secrets>=1.5.0,<2` is in [project] dependencies,
    # and DetectSecretsScanner imports the library at module scope and drives it
    # through the in-process Python API, so validate_plugin_dependencies returns
    # True without consulting anything: if the library were absent, ASH's plugin
    # loading would fail outright rather than the scanner reporting MISSING.
    #
    # This used to name bandit, on the stated grounds that bandit was "a core
    # dependency in pyproject.toml". It is not, and never was -- bandit appears
    # nowhere in pyproject.toml, in dependencies, in any extra, or in
    # dependency-groups. BanditScanner sets use_uv_tool and its
    # validate_plugin_dependencies runs `uv tool install bandit[sarif,toml]` on
    # demand, so every one of these cells was reaching PyPI at scan time and a
    # registry blip made the completeness gate fail rather than skip a scanner. A
    # gate whose green depends on a network fetch is a flaky gate, and flaky gates
    # get disabled.

    # `ashx` is the canonical command. pip and pipx also install the deprecated
    # `ash` alias, so their verify steps run assert-deprecated-alias.sh: same exit
    # code and --version output as `ashx`, plus exactly one deprecation line on
    # stderr. uvx runs one named script from a temporary environment and has no
    # PATH alias to check, so it only exercises `ashx`.

    # === pip ===
    - name: "pip: install"
      if: inputs.method == 'pip'
      shell: bash
      run: pip install .
    - name: "pip: verify"
      if: inputs.method == 'pip'
      shell: bash
      run: |
        ashx --version
        ashx --help
        bash "${GITHUB_ACTION_PATH}/assert-deprecated-alias.sh"
    - name: "pip: self-test scan"
      if: inputs.method == 'pip'
      shell: bash
      run: ashx scan --source-dir "${RUNNER_TEMP}/ash-selftest" --output-dir "${RUNNER_TEMP}/ash-selftest/output" --simple --phases scan --phases report --scanners detect-secrets

    # === pipx ===
    - name: "pipx: install pipx"
      if: inputs.method == 'pipx'
      shell: bash
      run: pip install pipx
    - name: "pipx: install ASH"
      if: inputs.method == 'pipx'
      shell: bash
      run: pipx install .
    - name: "pipx: verify"
      if: inputs.method == 'pipx'
      shell: bash
      run: |
        ashx --version
        ashx --help
        bash "${GITHUB_ACTION_PATH}/assert-deprecated-alias.sh"
    - name: "pipx: self-test scan"
      if: inputs.method == 'pipx'
      shell: bash
      run: ashx scan --source-dir "${RUNNER_TEMP}/ash-selftest" --output-dir "${RUNNER_TEMP}/ash-selftest/output" --simple --phases scan --phases report --scanners detect-secrets

    # === uvx ===
    # setup-uv, pinned like every other action here, rather than piping astral's
    # install script into a shell. The script was fetched unpinned on every run, so
    # whatever that URL served at the time executed with this job's token; the
    # action is a reviewed commit. Both runner OSes are covered by the one step.
    - name: "uvx: install uv"
      if: inputs.method == 'uvx'
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        enable-cache: false
    - name: "uvx: verify"
      if: inputs.method == 'uvx'
      shell: bash
      run: uvx --from . ashx --version
    - name: "uvx: self-test scan"
      if: inputs.method == 'uvx'
      shell: bash
      run: uvx --from . ashx scan --source-dir "${RUNNER_TEMP}/ash-selftest" --output-dir "${RUNNER_TEMP}/ash-selftest/output" --simple --phases scan --phases report --scanners detect-secrets

    # === homebrew ===
    # A real install of the formula, built from this commit rather than the release
    # tag on its `url` line, then `brew test`, `ash --version` and local-mode scans,
    # one of them with the default scanner selection. See homebrew.sh. The syntax
    # check stays first because it fails in a second, before Homebrew installs
    # anything.
    - name: "homebrew: validate formula syntax"
      if: inputs.method == 'homebrew'
      shell: bash
      run: ruby -c Formula/ash.rb
    - name: "homebrew: install from this commit, test and scan"
      if: inputs.method == 'homebrew'
      shell: bash
      run: |
        set -euo pipefail
        version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
        work="${RUNNER_TEMP}/ash-homebrew"
        mkdir -p "$work"
        tarball="$work/automated-security-helper-${version}.tar.gz"
        git archive --format=tar.gz --prefix="automated-security-helper-${version}/" -o "$tarball" HEAD
        bash "${GITHUB_ACTION_PATH}/homebrew.sh" "$GITHUB_WORKSPACE" "$tarball" "$work"

    # === pre-commit ===
    - name: "pre-commit: install"
      if: inputs.method == 'pre-commit'
      shell: bash
      run: pip install pre-commit
    - name: "pre-commit: validate manifest"
      if: inputs.method == 'pre-commit'
      shell: bash
      run: pre-commit validate-manifest .pre-commit-hooks.yaml
    # Runs the hooks against fixture repositories, not just the manifest schema;
    # see pre-commit.sh. One cell per OS: the workflows pass the input, and
    # tests/unit/test_pre_commit_hooks_manifest.py holds both to the same cells.
    - name: "pre-commit: run the hooks"
      if: inputs.method == 'pre-commit' && inputs.pre-commit-run-hooks == 'true'
      shell: bash
      run: bash "${GITHUB_ACTION_PATH}/pre-commit.sh" "$GITHUB_WORKSPACE" "${RUNNER_TEMP}/ash-pre-commit"

