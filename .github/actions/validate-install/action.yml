name: "Validate Install Method"
description: "Install ASH via pip, pipx, uvx, homebrew, or pre-commit and verify"

inputs:
  method:
    description: "Install method: pip, pipx, uvx, homebrew, pre-commit"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create test fixture
      shell: bash
      run: |
        mkdir -p /tmp/ash-selftest
        echo 'print("hello")' > /tmp/ash-selftest/test_sample.py

    # Every self-test scan below passes `--scanners detect-secrets`, and that is a
    # statement about what these jobs test rather than a way to quieten them.
    #
    # This action answers one question: after installing ASH by method X, does
    # `ash scan` run end to end? It installs ASH and nothing else -- no
    # `ash dependencies install`, no `[cdk]` extra, no ruby gem, no Go binaries --
    # so of the ten default scanners only the pip-installed ones could possibly
    # run here. Left unnarrowed, the scan selects all ten, five report MISSING for
    # tools this job never intended to provide, and `ash scan` exits non-zero
    # because a scan that could not run what it was asked to run is not a pass.
    #
    # Naming one scanner says which one the smoke test covers. The nine it leaves
    # out are recorded SKIPPED -- not selected -- so the report shows what was and
    # was not measured. The alternative, `--no-fail-on-incomplete-scanners`, would
    # have kept the same green while asserting nothing about whether any scanner
    # ran, which is the failure mode the completeness gate exists to remove.
    #
    # detect-secrets specifically, because it is the only default scanner that is
    # genuinely vendored. `detect-secrets>=1.5.0,<2` is in [project] dependencies,
    # and DetectSecretsScanner imports the library at module scope and drives it
    # through the in-process Python API, so validate_plugin_dependencies returns
    # True without consulting anything: if the library were absent, ASH's plugin
    # loading would fail outright rather than the scanner reporting MISSING.
    #
    # This used to name bandit, on the stated grounds that bandit was "a core
    # dependency in pyproject.toml". It is not, and never was -- bandit appears
    # nowhere in pyproject.toml, in dependencies, in any extra, or in
    # dependency-groups. BanditScanner sets use_uv_tool and its
    # validate_plugin_dependencies runs `uv tool install bandit[sarif,toml]` on
    # demand, so every one of these cells was reaching PyPI at scan time and a
    # registry blip made the completeness gate fail rather than skip a scanner. A
    # gate whose green depends on a network fetch is a flaky gate, and flaky gates
    # get disabled.

    # === pip ===
    - name: "pip: install"
      if: inputs.method == 'pip'
      shell: bash
      run: pip install .
    - name: "pip: verify"
      if: inputs.method == 'pip'
      shell: bash
      run: |
        ash --version
        ash --help
    - name: "pip: self-test scan"
      if: inputs.method == 'pip'
      shell: bash
      run: ash scan --source-dir /tmp/ash-selftest --output-dir /tmp/ash-selftest/output --simple --phases scan --phases report --scanners detect-secrets

    # === pipx ===
    - name: "pipx: install pipx"
      if: inputs.method == 'pipx'
      shell: bash
      run: pip install pipx
    - name: "pipx: install ASH"
      if: inputs.method == 'pipx'
      shell: bash
      run: pipx install .
    - name: "pipx: verify"
      if: inputs.method == 'pipx'
      shell: bash
      run: |
        ash --version
        ash --help
    - name: "pipx: self-test scan"
      if: inputs.method == 'pipx'
      shell: bash
      run: ash scan --source-dir /tmp/ash-selftest --output-dir /tmp/ash-selftest/output --simple --phases scan --phases report --scanners detect-secrets

    # === uvx ===
    - name: "uvx: install uv (Unix)"
      if: inputs.method == 'uvx' && runner.os != 'Windows'
      shell: bash
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: "uvx: install uv (Windows)"
      if: inputs.method == 'uvx' && runner.os == 'Windows'
      shell: pwsh
      run: irm https://astral.sh/uv/install.ps1 | iex
    - name: "uvx: verify"
      if: inputs.method == 'uvx'
      shell: bash
      run: uvx --from . ash --version
    - name: "uvx: self-test scan"
      if: inputs.method == 'uvx'
      shell: bash
      run: uvx --from . ash scan --source-dir /tmp/ash-selftest --output-dir /tmp/ash-selftest/output --simple --phases scan --phases report --scanners detect-secrets

    # === homebrew ===
    - name: "homebrew: validate formula"
      if: inputs.method == 'homebrew'
      shell: bash
      run: ruby -c Formula/ash.rb

    # === pre-commit ===
    - name: "pre-commit: install"
      if: inputs.method == 'pre-commit'
      shell: bash
      run: pip install pre-commit
    - name: "pre-commit: validate manifest"
      if: inputs.method == 'pre-commit'
      shell: bash
      run: pre-commit validate-manifest .pre-commit-hooks.yaml

