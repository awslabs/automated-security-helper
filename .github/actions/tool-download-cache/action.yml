name: "ASH tool download cache"
description: "Restore or save the digest-pinned release assets `ashx dependencies install` downloads. Use mode restore before the install and mode save after it."

# What this caches, and why it is allowed to.
#
# The release ASSETS (archives and bare executables) that install_pinned_tool
# downloads for the tools pinned in automated_security_helper/utils/tool_downloads.py:
# public upstream releases, each pinned there by sha256. Never extracted binaries,
# never install receipts, never ASH's own wheel or image. The operator approved
# caching these pinned public assets; the decision is recorded on the allowlist entry
# in .github/scripts/assert-publish-surfaces.py.
#
# Nothing restored is trusted. ASH reads the directory through ASH_TOOL_DOWNLOAD_CACHE
# and re-hashes every asset against its pin each time it uses one; a mismatch is
# deleted and downloaded again (download_utils._restore_cached_asset, and
# tests/unit/utils/test_pinned_tool_downloads.py::TestReleaseAssetCache).
#
# Keyed on the pin table's hash plus OS and arch, so a version bump re-keys it.
# Restored everywhere, saved from a push to main only.

inputs:
  mode:
    description: "restore or save"
    required: true

runs:
  using: "composite"
  steps:
    - name: "Fail on an unknown mode"
      if: inputs.mode != 'restore' && inputs.mode != 'save'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "::error::tool-download-cache mode is '${MODE}', expected restore or save"
        exit 1

    - name: "Point ASH at the tool download cache"
      if: inputs.mode == 'restore'
      shell: bash
      run: echo "ASH_TOOL_DOWNLOAD_CACHE=${RUNNER_TEMP}/ash-tool-downloads" >> "$GITHUB_ENV"

    - name: "Restore the tool download cache"
      id: restore
      if: inputs.mode == 'restore'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ash-tool-downloads
        key: ash-tool-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automated_security_helper/utils/tool_downloads.py') }}

    - name: "Cache report: ash-tool-assets"
      if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
      shell: bash
      env:
        CACHE_NAME: ash-tool-assets
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
        CACHE_MATCHED: ${{ steps.restore.outputs.cache-matched-key }}
      run: |
        # One line per cache per job, same shape everywhere, so hit rates can be
        # counted across runs from job summaries.
        if [ "${CACHE_HIT}" = "true" ]; then result=hit
        elif [ -n "${CACHE_MATCHED:-}" ]; then result="partial (${CACHE_MATCHED})"
        else result=miss; fi
        echo "cache ${CACHE_NAME}: ${result}" | tee -a "$GITHUB_STEP_SUMMARY"
        # Carried to the save invocation, which is a separate use of this action.
        echo "ASH_TOOL_DOWNLOAD_CACHE_HIT=${CACHE_HIT}" >> "$GITHUB_ENV"

    - name: "Save the tool download cache (main only)"
      if: >-
        inputs.mode == 'save'
        && env.ASH_TOOL_DOWNLOAD_CACHE_HIT != 'true'
        && github.event_name == 'push'
        && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ash-tool-downloads
        key: ash-tool-assets-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('automated_security_helper/utils/tool_downloads.py') }}
