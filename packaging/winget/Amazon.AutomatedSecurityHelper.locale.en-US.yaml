# `ash` is the moniker so that `winget install ash` resolves, matching the deb, rpm and
# Chocolatey package names. A moniker is not required to be unique across the
# repository, which is why it can be this short.
Moniker: ash
ShortDescription: Runs many security scanners over a repository and reports the findings as SARIF.
Description: |-
  ASH orchestrates security scanners over a code repository and normalizes what they
  report into a single SARIF document, plus text, JSON, and Markdown reports.

  ASH drives third-party scanners; it does not contain them. After installing, run
  `ash dependencies install` to provision the ones ASH can install itself.

  Three commands are installed. `ash` is the one to use. `ashv3` still works and warns
  once that its name pins a major version. `automated-security-helper` is the same
  program under a name nothing else claims, which matters on Windows because MSYS2
  ships the Almquist shell as `ash`.
