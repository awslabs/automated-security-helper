                                items:
                                  type: string
                                type: array
                              denied_paths:
                                description: 'JSON-Pointer glob patterns that are never allowed (denied
                                  wins over allowed). Each entry starts with ''/''. The defaults block
                                  the fields that decide whether a scan fails, what it runs and reports,
                                  where findings are sent, the scanner sandbox, and this policy. A list
                                  equal to a default ASH has shipped counts as the current default list.
