                              nullable: true
                            client_supplied:
                              x-kubernetes-preserve-unknown-fields: true
                              description: 'Set by ASH: True when a config or workspace policy file an
                                MCP client delivered supplied this entry, so results show which suppressions
                                and ignored paths came from the client. A value written in a config file
                                is ignored.'
                            rule_id:
                              type: string
                              description: Rule ID to suppress
                              nullable: true
                            line_start:
                              x-kubernetes-preserve-unknown-fields: true
                              description: (Optional) Starting line number
                            line_end:
                              x-kubernetes-preserve-unknown-fields: true
                              description: (Optional) Ending line number
                            package_name:
                              type: string
                              description: (Optional) Only suppress findings about this package (glob,
                                case-insensitive). Findings that do not report a package name never match.
                              nullable: true
                            package_version:
                              type: string
                              description: (Optional) Only suppress findings about this installed package
                                version (glob, case-insensitive). Findings that do not report an installed
                                version never match.
                              nullable: true
                            package_path:
                              type: string
                              description: (Optional) Only suppress findings about the package copy installed
                                at this path, relative to the scan root (glob, supports **), e.g. 'deploy/cdk/node_modules/aws-cdk-lib/node_modules/brace-expansion'.
                                Separates two copies with the same name and version. Findings that do
