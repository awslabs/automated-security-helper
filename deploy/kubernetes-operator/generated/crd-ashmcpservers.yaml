                                  opengrep, semgrep, snyk-code, trivy, trivy-repo and zizmor scanners)
                                  are added to it.'
                                items:
                                  type: string
                                type: array
                              denied_value_patterns:
                                additionalProperties:
                                  type: string
                                description: Map of JSON-Pointer pattern to regex. add/replace ops are
                                  rejected when any string leaf reachable from the op's value matches
                                  the regex; lists and dicts are walked recursively so a forbidden token
                                  cannot be hidden inside a nested structure. The `test` op is exempt
                                  because it is read-only. Each key starts with '/'.
                                type: object
                              replace_default_denied_paths:
                                x-kubernetes-preserve-unknown-fields: true
                                description: When true, denied_paths is used as written instead of being
                                  added to ASH's default list, and each default entry it leaves out is
                                  named in a warning. When false (the default), the entries listed are
                                  denied as well as the defaults. Either way, an unset list, or one equal
                                  to a default ASH has shipped, gets the current default list.
                            type: object
                        type: object
                    type: object
                    description: Global default settings for ASH shared across scanners. If the same setting
                      exists at the scanner level and is set in both places, the scanner level settings
                      take precedence.
                  fail_on_findings:
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'Whether to exit with non-zero code if findings are detected


                      IGNORED BY THE OPERATOR: Set on `ashx merge` from spec.failOnFindings instead. A
                      shard''s exit code is discarded, so setting it here would read as a gate that never
                      fires.'
                  fail_on_incomplete_scanners:
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'Whether to exit with a non-zero code when a selected scanner did not
                      complete -- status ERROR (ran and failed) or MISSING (dependencies unavailable,
                      never ran). A SKIPPED scanner, one not selected or one with nothing of its kind
                      to scan, does not trip this by itself, but a run in which every scanner is SKIPPED,
                      such as one where no selected scanner had a file to scan, exits 1 while this is
                      on. Independent of fail_on_findings: one answers ''was anything found'', this one
                      answers ''did what I asked for actually run''. Selects on the scanner''s status,
                      so it covers only a failure that reached that status. Defaults to True, so a scanner
                      recorded ERROR or MISSING does not report the exit code of a clean scan. Converters
                      count too: one that crashed, one that could not convert some of its inputs, and
                      one whose tool is missing while it had inputs make the scan exit non-zero the same
                      way. Set it to False, or pass --no-fail-on-incomplete-scanners, to accept a partial
                      scan''s exit code; excluding the scanner whose tool is unavailable is usually better,
                      because an excluded scanner is recorded SKIPPED and the report then says what was
                      not measured. One ending overrides this setting: a run where ASH could not stop
                      a scanner''s tool exits 1 either way, because the tool may still be running and
                      writing into the output directory.


                      IGNORED BY THE OPERATOR: Set on `ashx merge` from spec.failOnIncompleteScanners
                      instead, for the same reason as fail_on_findings.'
                  fail_on_unknown_keys:
                    x-kubernetes-preserve-unknown-fields: true
                    description: Whether an unknown key in a suppression or ignore-path entry refuses
                      the config at load. False (the default) loads the config with a warning that names
                      the key, with a did-you-mean, and the entry it sits in suppresses nothing until
                      it is fixed, so a typo can never widen a suppression. True refuses the config, naming
                      the same key. ASH v4 flips the default to True; set it True now to adopt the error
                      early.
                  honor_ignore_files:
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'Whether the .gitignore and .ignore files in the scanned tree decide
                      which files are left out of ASH''s scan set, the file list detect-secrets, cfn-nag,
                      cdk-nag, cfn-lint, cfn-guard, actionlint, zizmor, npm-audit and the converters read.
                      True (the default) leaves out every file they match. False scans those files too;
                      ASH''s own exclusions (.git, CDK assets, its own output directory) still apply.
                      An operator setting: a config file inside the scanned tree, or one an MCP client
                      supplied, cannot change it, and its value there is ignored with a warning. Set it
                      in a config file outside the tree, with --config-overrides, or with --no-honor-ignore-files
                      / --honor-ignore-files. Every scan records the outcome in metadata.ignore_file_exclusions.'
                  sandbox:
                    description: OS-level sandboxing of scanner subprocesses.
                    properties:
                      mode:
                        type: string
                        anyOf:
                        - enum:
                          - 'off'
                          - auto
                          - bwrap
                          - firejail
                          - landlock
                          - sandbox-exec
                        - description: An environment reference, resolved to the variable's value when
                            the file is loaded.
                          pattern: ^(!ENV )?\$\{\w+(:.*)?\}$
                        description: 'How scanner subprocesses are confined. ''off'' runs them as plain
                          subprocesses. ''auto'' uses the best sandbox available (Linux: bwrap, then firejail,
                          then landlock; macOS: sandbox-exec). Any other value requires that backend.
                          A scanner that cannot be sandboxed as requested is recorded MISSING with the
                          reason; it is never run unsandboxed. A mode that --sandbox, ASH_CONFIG or the
                          operator''s config file sets is a floor: a config file inside a git checkout
                          or the scanned directory cannot turn it off or switch backends. Not applied
                          in container mode, where the container is the boundary; ASH logs a warning when
                          it is set there.'
                      network_scanners:
                        items:
                          type: string
                        type: array
                        description: 'Scanners allowed a network when the scan is online. Null (the default)
                          uses each scanner''s declared need: semgrep, opengrep, grype, trivy, npm-audit
                          and snyk-code fetch rules, databases or audit data. A list replaces those defaults.
                          Under --offline no scanner gets a network. Honored only from --config-overrides
                          or a config file outside every git checkout and the scanned directory; set by
                          any other config file, a list can only remove network.'
                        nullable: true
                      extra_read_paths:
                        description: Additional host paths every sandboxed scanner may read, for example
                          a corporate CA bundle or a shared rule directory. '~' and $VARS expand. Honored
                          only from --config-overrides or a config file outside every git checkout and
                          the scanned directory.
                        items:
                          type: string
                        type: array
                      read_path_scanners:
                        description: Scanners allowed the extra host paths their own options ask for (a
                          rules file or baseline outside the source tree, for example). Under a sandbox,
                          without this, a scanner whose read paths come from its options gets only the
                          default policy, and ASH does not read a detect-secrets baseline_file outside
                          the source tree. With it, a granted path, that baseline included, is used only
                          when it resolves inside the source tree or an extra_read_paths entry. Honored
                          only from --config-overrides or a config file outside every git checkout and
                          the scanned directory.
                        items:
                          type: string
                        type: array
                      env_scanners:
                        description: Scanners allowed the environment variables their own options ask
                          for (a token for an online check, for example). Without this, such variables
                          are not passed. Honored only from --config-overrides or a config file outside
                          every git checkout and the scanned directory.
                        items:
                          type: string
                        type: array
                      environment:
                        description: 'The environment variables every sandboxed scanner is passed besides
                          its fixed baseline (PATH, locale and terminal settings, a few tool homes such
                          as JAVA_HOME and VIRTUAL_ENV, and the ASH_, UV_, LC_ and PYTHON families), written
                          as a docker-compose ''environment'' list: NAME passes the value ASH has, NAME=value
                          sets one, and a name listed twice takes its last entry. The default list is
                          the proxy variables (HTTP_PROXY, HTTPS_PROXY, ALL_PROXY, NO_PROXY and their
                          lower-case spellings), which a scanner is passed only when it has a network,
                          and the CA-bundle variables (SSL_CERT_FILE, SSL_CERT_DIR, REQUESTS_CA_BUNDLE,
                          CURL_CA_BUNDLE, NODE_EXTRA_CA_CERTS), whose files the sandbox also lets a scanner
                          with a network read. A list here REPLACES the default, as a compose list replaces
                          an image''s: [MY_VAR] alone drops the proxy and CA variables, so list them too.
                          A name that marks a credential (TOKEN, PASSWORD, SECRET and the like), TMPDIR,
                          TEMP, TMP, HOME and ASH''s own run id are refused with the name; a scanner that
                          needs a credential is granted it with env_scanners. Honored only from --config-overrides
                          or a config file outside every git checkout and the scanned directory.'
                        items:
                          type: string
                        type: array
                    type: object
                  content_db_staleness:
                    type: string
                    anyOf:
                    - enum:
                      - fail
                      - warn
                    - description: An environment reference, resolved to the variable's value when the
                        file is loaded.
                      pattern: ^(!ENV )?\$\{\w+(:.*)?\}$
                    description: What a scan does when a scanner's content database (grype's or trivy's
                      vulnerability database, the offline semgrep/opengrep rulesets) was built longer
                      ago than the bound declared for it in automated_security_helper/utils/content_databases.py.
                      'fail' (the default) keeps the scanner's findings and exits 1, naming the database,
                      its build time, its age and the bound. 'warn' lets the scan pass and records the
                      same warning in the log and in the reports (summary, SARIF invocation notifications,
                      flat JSON). The CLI flag --allow-stale-content-db sets 'warn' for one scan and takes
                      precedence over this value; --no-allow-stale-content-db sets 'fail'.
                  content_db_staleness_overrides:
                    description: Per-database exceptions to content_db_staleness, each with a required
                      expiration date and reason. An entry holds one named database to its own policy
                      until 00:00 UTC on its expiration date, and every database not named keeps content_db_staleness.
                      An expired entry is ignored with a warning. Empty by default. Either form of --allow-stale-content-db
                      clears this list for that scan, so the flag still decides for every database.
                    items:
                      description: 'One content database held to a different staleness policy, until a
                        fixed date.


                        ``content_db_staleness`` decides for every database at once. This narrows a

                        relaxation to the one database that needs it -- typically one whose upstream

                        publisher has stopped publishing for a while -- so every other database is still

                        held to the scan-wide policy. ``expiration`` and ``reason`` are required, the

                        same two fields a time-boxed suppression carries: an exception to a freshness

                        gate that has no end date is a permanent one. On and after ``expiration``

                        (00:00 UTC) the entry is ignored, with a warning in the log, and the database

                        is held to the policy it has without the entry: ``content_db_staleness``, or,

                        for trivy-db in an image built with ``OFFLINE=YES``, that image''s ``warn``

                        default unless ``content_db_staleness_offline_image_default`` is false.'
                      properties:
                        database:
                          description: 'The content database''s registry name, as listed in automated_security_helper/utils/content_databases.py:
                            grype-db, trivy-db, semgrep-offline-rules or opengrep-offline-rules.'
                          type: string
                        policy:
                          type: string
                          anyOf:
                          - enum:
                            - fail
                            - warn
                          - description: An environment reference, resolved to the variable's value when
                              the file is loaded.
                            pattern: ^(!ENV )?\$\{\w+(:.*)?\}$
                          description: The policy this database is held to while the entry is in effect.
                        expiration:
                          description: 'Required. The date (YYYY-MM-DD, UTC) from which the entry no longer
                            applies: at 00:00 UTC that day the database returns to the policy it has without
                            the entry, which is content_db_staleness, or, for trivy-db in an image built
                            with OFFLINE=YES, that image''s warn default unless content_db_staleness_offline_image_default
                            is false.'
                          type: string
                        reason:
                          type: string
                          anyOf:
                          - minLength: 1
                          - description: An environment reference, resolved to the variable's value when
                              the file is loaded.
                            pattern: ^(!ENV )?\$\{\w+(:.*)?\}$
                          description: Required. Why this database is held differently.
                      required:
                      - database
                      - policy
                      - expiration
                      - reason
                      type: object
                    type: array
                  content_db_staleness_offline_image_default:
                    x-kubernetes-preserve-unknown-fields: true
                    description: 'Whether an image built with OFFLINE=YES holds trivy-db to ''warn'' rather
                      than to content_db_staleness: fail. Such an image carries the trivy database it
                      was built with, and trivy''s own bound would fail every scan in it from a day after
                      the build; with this, those scans pass and every report records the stale database.
                      Only trivy-db: grype-db and the offline rulesets keep content_db_staleness. ASH_OFFLINE_AT_BUILD_TIME=YES
                      in ASH''s environment, which the image sets from its OFFLINE build argument, turns
                      it on; without that variable this does nothing, whatever it says. Set false to hold
                      trivy-db to content_db_staleness in the image too. A content_db_staleness_overrides
                      entry for trivy-db outranks it, and either form of --allow-stale-content-db sets
                      this to false for that scan.'
                  ash_plugin_modules:
                    description: List of Python modules to import containing ASH plugins and/or event
                      subscribers. These are loaded in addition to the default modules.
                    items:
                      type: string
                    type: array
                  external_reports_to_include:
                    description: List of external reports to include in the final report. These can be
                      paths to SARIF or CycloneDX reports produced by other tools.
                    items:
                      type: string
                    type: array
                  build:
                    description: Configuration model for build-time settings.
                    properties:
                      build_mode:
                        type: string
                        anyOf:
                        - enum:
                          - ONLINE
                          - OFFLINE
                        - description: An environment reference, resolved to the variable's value when
                            the file is loaded.
                          pattern: ^(!ENV )?\$\{\w+(:.*)?\}$
                        description: 'Not used: nothing reads this setting, so it changes neither the
                          container image build nor the scan. To scan offline, pass --offline or set ASH_OFFLINE.'
