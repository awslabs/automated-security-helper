[project]
name = "automated-security-helper"
version = "3.7.0"
description = "Automated Security Helper for GitHub Actions"
requires-python = ">=3.10,<4"
readme = "README.md"
license = "Apache-2.0"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
dependencies = [
 "uv>=0.9.21,<0.12",
 "requests>=2.28.0,<3.0.0",
 "attrs>=26.1.0,<27.0.0",
 "jsonschema>=4.26.0,<5.0.0",
 "importlib-metadata>=9.0.0,<10.0.0",
 "cattrs>=26.1.0,<27.0.0",
 "docker>=7.2.0,<8.0.0",
 "GitPython>=3.1.59,<4.0.0",
 "gitdb>=4.0.12,<5.0.0",
 "pyrsistent>=0.20.0,<1.0.0",
 "pydantic[email]>=2.13.4,<2.14",
 "typer>=0.27.1,<0.28",
 "rich>=15.0.0,<16",
 "igittigitt>=2.2.3,<3.0.0",
 "defusedxml>=0.7.1,<0.8",
 "junitparser>=5.0.0,<6",
 "textual>=8.2.8,<9",
 "detect-secrets>=1.5.0,<2",
 "boto3>=1.43.76,<1.44",
 "cfn-flip>=1.3.0,<2",
 "mcp>=2.0.0,<3",
 "toml>=0.10.2,<1.0.0",
 "python-multipart>=0.0.32,<0.1",
 # Transitive via pyjwt[crypto] <- mcp[crypto]; pinned to patch GHSA-g6cj-pr64-35w5
 "cryptography>=50.0.0,<51",
 "uvicorn>=0.52.4,<1",
 "jsonpatch>=1.33,<2",
]
[project.optional-dependencies]
cdk = [
    "aws-cdk-lib>=2.257.0,<3.0.0",
    "cdk-nag>=3.0.2,<4.0.0",
    "constructs>=10.8.1,<11.0.0",
]

[[project.authors]]
name = "Daniel Begimher"
email = "dbbegimh@amazon.com"

[[project.authors]]
name = "Madison Steiner"
email = "awsmadi@amazon.com"

[[project.authors]]
name = "Nate Ferrell"
email = "nateferl@amazon.com"

[[project.authors]]
name = "Nathan Bates"
email = "nbb@amazon.com"

[[project.authors]]
name = "Rafael Pereyra"
email = "rapg@amazon.com"

[[project.authors]]
name = "Tim Hahn"
email = "timhahn@amazon.com"

[[project.authors]]
name = "Nathan Theule"
email = "ntheule@amazon.com"

[dependency-groups]
dev = [
 "ruff>=0.16.3,<1.0.0",
 "pytest>=9.1.1,<10.0.0",
 "pytest-cov>=7.1.0,<8.0.0",
 "pytest-mock>=3.15.1,<4.0.0",
 "mypy>=2.3.1,<3.0.0",
 "types-pyyaml>=6.0.12.20260815",
 "lazydocs>=0.4.8,<1.0.0",
 "mkdocs>=1.6.1,<2.0.0",
 "mkdocs-material>=9.7.6,<10.0.0",
 "pymdown-extensions>=11.0.1,<12.0.0",
 "mkdocstrings[python]>=1.0.6,<2.0.0",
 "mkdocs-autorefs>=1.4.1,<2.0.0",
 "pytest-asyncio>=1.4.0,<2.0.0",
 "types-boto3[essential, logs, s3, securityhub, securitylake, sts]>=1.43.75,<2.0.0",
 "mkdocs-awesome-nav>=3.3.0,<4.0.0",
 "mkdocs-mermaid2-plugin>=1.2.3,<2.0.0",
 "pytest-xdist>=3.8.0,<4.0.0",
 "toml>=0.10.2",
 "hatchling>=1.32.0",
 "mcp>=2.0.0",
 "commitizen>=4.17.0",
 "httpx>=0.28.1,<1.0.0",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/awslabs/automated-security-helper"

[project.scripts]
ash = "automated_security_helper.cli.main:app"
ashv3 = "automated_security_helper.cli.main:app"
automated-security-helper = "automated_security_helper.cli.main:app"

[tool.commitizen]
name = "cz_conventional_commits"
version = "3.7.0"
# Formula/ash.rb pins the git tag Homebrew builds from. It was absent here, so
# releases bumped the package and left the tap on an older tag until `brew
# install` broke. The `tag:` pattern matches the url line; commitizen rewrites
# the version substring within it and leaves the leading "v" alone.
version_files = ["pyproject.toml:^version", "Formula/ash.rb:tag:"]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
legacy_tag_formats = [
    "$version-e-$prerelease",
    "v$version-$prerelease",
]

[tool.mypy]
plugins = [ "pydantic.mypy",]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.uv.workspace]
members = [ ".",]

[tool.uv.sources]

[tool.hatch.build.targets.sdist]
include = [ "automated_security_helper", "Dockerfile", "automated_security_helper/assets/ASH_INSTALLED_REVISION", "automated_security_helper/assets/Dockerfile",]

[tool.hatch.build.targets.wheel]
include = [ "automated_security_helper", "automated_security_helper/assets", "automated_security_helper/assets/ASH_INSTALLED_REVISION", "automated_security_helper/assets/Dockerfile",]

[tool.hatch.build.targets.sdist.force-include]
"automated_security_helper/assets/Dockerfile" = "automated_security_helper/assets/Dockerfile"
"automated_security_helper/assets/ASH_INSTALLED_REVISION" = "automated_security_helper/assets/ASH_INSTALLED_REVISION"

[tool.hatch.build.targets.wheel.force-include]
"automated_security_helper/assets/Dockerfile" = "automated_security_helper/assets/Dockerfile"
"automated_security_helper/assets/ASH_INSTALLED_REVISION" = "automated_security_helper/assets/ASH_INSTALLED_REVISION"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
