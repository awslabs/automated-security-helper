[project]
name = "automated-security-helper"
version = "3.7.0"
description = "Automated Security Helper for GitHub Actions"
requires-python = ">=3.10,<4"
readme = "README.md"
license = "Apache-2.0"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",]
dependencies = [
 "uv>=0.12,<0.13",
 "requests>=2.34,<3.0.0",
 "attrs>=26.1,<27.0.0",
 "jsonschema>=4.26,<5.0.0",
 "importlib-metadata>=9.0,<10.0.0",
 "cattrs>=26.1,<27.0.0",
 "docker>=7.2,<8.0.0",
 "GitPython>=3.1.61,<4.0.0",  # floor is advisory-driven: GHSA-wvpp-8hx9-p66j and others affect <= 3.1.57
 "gitdb>=4.0,<5.0.0",
 "pyrsistent>=0.20,<1.0.0",
 "pydantic[email]>=2.13,<2.14",
 "typer>=0.27,<0.28",
 "rich>=15.0,<16",
 "igittigitt>=2.2,<3.0.0",
 "defusedxml>=0.7,<0.8",
 "junitparser>=5.0,<6",
 "textual>=8.2,<9",
 "detect-secrets>=1.5,<2",
 "boto3>=1.43,<1.44",
 "cfn-flip>=1.3,<2",
 "mcp>=2.1,<3",
 "toml>=0.10,<1.0.0",
 "python-multipart>=0.0.32,<0.1",  # 0.0.x -- the patch is the only version component, so >=0.0 is meaningless
 # Transitive via pyjwt[crypto] <- mcp[crypto]; pinned to patch GHSA-g6cj-pr64-35w5.
 # >=50.0 keeps that floor: the advisory affects >= 44.0.0, < 50.0.0, so 50.0.0 is the fix.
 "cryptography>=50.0,<51",
 "uvicorn>=0.52,<1",
 "jsonpatch>=1.33,<2",
]
[project.optional-dependencies]
cdk = [
    "aws-cdk-lib>=2.267,<3.0.0",
    "cdk-nag>=3.0,<4.0.0",
    "constructs>=10.8,<11.0.0",
]

[[project.authors]]
name = "Daniel Begimher"
email = "dbbegimh@amazon.com"

[[project.authors]]
name = "Madison Steiner"
email = "awsmadi@amazon.com"

[[project.authors]]
name = "Nate Ferrell"
email = "nateferl@amazon.com"

[[project.authors]]
name = "Nathan Bates"
email = "nbb@amazon.com"

[[project.authors]]
name = "Rafael Pereyra"
email = "rapg@amazon.com"

[[project.authors]]
name = "Tim Hahn"
email = "timhahn@amazon.com"

[[project.authors]]
name = "Nathan Theule"
email = "ntheule@amazon.com"

[dependency-groups]
dev = [
 "ruff>=0.16,<1.0.0",
 "pytest>=9.1,<10.0.0",
 "pytest-cov>=7.1,<8.0.0",
 "pytest-mock>=3.15,<4.0.0",
 "mypy>=2.3,<3.0.0",
 "types-pyyaml>=6.0",
 "lazydocs>=0.4,<1.0.0",
 "mkdocs>=1.6,<2.0.0",
 "mkdocs-material>=9.7.7,<10.0.0",  # floor is advisory-driven: GHSA-xvg9-69gf-fjrf affects >= 7.2.0, < 9.7.7
 "pymdown-extensions>=11.0.2,<12.0.0",  # floor is advisory-driven: GHSA-gm37-52c6-37mw affects <= 11.0.0
 "mkdocstrings[python]>=1.0,<2.0.0",
 "mkdocs-autorefs>=1.4,<2.0.0",
 "pytest-asyncio>=1.4,<2.0.0",
 "types-boto3[essential, logs, s3, securityhub, securitylake, sts]>=1.43,<2.0.0",
 "mkdocs-awesome-nav>=3.3,<4.0.0",
 "mkdocs-mermaid2-plugin>=1.2,<2.0.0",
 "pytest-xdist>=3.8,<4.0.0",
 "toml>=0.10",
 "hatchling>=1.32",
 "mcp>=2.1",
 "commitizen>=4.18",
 "httpx>=0.28,<1.0.0",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/awslabs/automated-security-helper"

[project.scripts]
ash = "automated_security_helper.cli.main:app"
ashv3 = "automated_security_helper.cli.main:app"
automated-security-helper = "automated_security_helper.cli.main:app"

[tool.commitizen]
name = "cz_conventional_commits"
version = "3.7.0"
# Every entry below names a file that pins an ASH git tag someone else installs
# from. They are listed here because a pin nothing rewrites goes stale silently:
# the release succeeds, the package version moves, and the stale pin keeps
# resolving to a real-but-old tag, so nothing fails until a user runs the
# install command and gets the wrong ASH.
#
# Formula/ash.rb pins the git tag Homebrew builds from. It was absent here, so
# releases bumped the package and left the tap on an older tag until `brew
# install` broke. The `tag:` pattern matches the url line; commitizen rewrites
# the version substring within it and leaves the leading "v" alone.
#
# The four transpiler _base/ files are the same failure, found the same way --
# a reviewer noticed a generated plugin still advertising v3.4.0 long after
# v3.7.0 shipped. _base/ is the single source of truth the transpiler renders
# into AGENTS.md plus 17 per-platform plugin trees and the repository-root
# skills/ tree, so one stale literal there reaches every one of them, and
# editing a generated copy is pointless because the next transpiler run
# overwrites it. Two of the four carry the tag as structured data
# (manifest.json's ash_version, mcp.json's uvx --from argument) and two carry
# it as prose a user is told to paste, but all four break identically: uvx
# resolves the ref, so a wrong tag is a wrong ASH and a deleted tag is a hard
# failure.
#
# On pattern choice: commitizen matches each regex per line, then replaces the
# bare current version within the matching lines. `ash_version` is used rather
# than `version` because manifest.json also carries the plugin's own unrelated
# "version": "1.0.0", and a pattern that matched both would depend on the two
# never colliding. `automated-security-helper@` is the narrowest string that
# identifies an install ref in the other three.
#
# Keep the value here in step with `version` above. commitizen searches for the
# CURRENT version and replaces it, so a _base/ file written ahead of
# [tool.commitizen] version is not "already up to date" -- it is a line the
# next bump cannot match, which means it stops being maintained from then on
# and drifts silently again. That is why these say v3.7.0 and not the newest
# published tag.
version_files = [
    "pyproject.toml:^version",
    "Formula/ash.rb:tag:",
    "ash-agent-plugins/agentic-coding/transpiler/_base/manifest.json:ash_version",
    "ash-agent-plugins/agentic-coding/transpiler/_base/mcp.json:automated-security-helper@",
    "ash-agent-plugins/agentic-coding/transpiler/_base/commands/scan.md:automated-security-helper@",
    "ash-agent-plugins/agentic-coding/transpiler/_base/references/troubleshooting.md:automated-security-helper@",
]
# Rewriting _base/ is only half the chain: the 17 generated trees are still on
# the old tag until the transpiler reruns, and `agentic-plugins check` byte-
# compares them, so a bump that only touched _base/ would hand CI a guaranteed
# drift failure on the release commit. This hook runs after version_files are
# rewritten and before the bump commit is made, and commitizen commits with
# `git commit -a`, so the regenerated trees land in that same commit.
pre_bump_hooks = [
    "uv run --project ash-agent-plugins/agentic-coding/transpiler agentic-plugins build",
]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
legacy_tag_formats = [
    "$version-e-$prerelease",
    "v$version-$prerelease",
]

[tool.mypy]
plugins = [ "pydantic.mypy",]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
no_implicit_reexport = true
disallow_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.uv.workspace]
members = [ ".",]

[tool.uv.sources]

[tool.hatch.build.targets.sdist]
include = [ "automated_security_helper", "Dockerfile", "automated_security_helper/assets/ASH_INSTALLED_REVISION", "automated_security_helper/assets/Dockerfile",]

[tool.hatch.build.targets.wheel]
include = [ "automated_security_helper", "automated_security_helper/assets", "automated_security_helper/assets/ASH_INSTALLED_REVISION", "automated_security_helper/assets/Dockerfile",]

[tool.hatch.build.targets.sdist.force-include]
"automated_security_helper/assets/Dockerfile" = "automated_security_helper/assets/Dockerfile"
"automated_security_helper/assets/ASH_INSTALLED_REVISION" = "automated_security_helper/assets/ASH_INSTALLED_REVISION"

[tool.hatch.build.targets.wheel.force-include]
"automated_security_helper/assets/Dockerfile" = "automated_security_helper/assets/Dockerfile"
"automated_security_helper/assets/ASH_INSTALLED_REVISION" = "automated_security_helper/assets/ASH_INSTALLED_REVISION"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
