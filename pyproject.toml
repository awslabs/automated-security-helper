[tool.hatch.build.targets.sdist]
include = [ "automated_security_helper", "Dockerfile", "automated_security_helper/assets/ASH_INSTALLED_REVISION", "automated_security_helper/assets/Dockerfile",]

[tool.hatch.build.targets.wheel]
include = [ "automated_security_helper", "automated_security_helper/assets", "automated_security_helper/assets/ASH_INSTALLED_REVISION", "automated_security_helper/assets/Dockerfile",]

[tool.hatch.build.targets.sdist.force-include]
"automated_security_helper/assets/Dockerfile" = "automated_security_helper/assets/Dockerfile"
"automated_security_helper/assets/ASH_INSTALLED_REVISION" = "automated_security_helper/assets/ASH_INSTALLED_REVISION"
# Staged into assets/ by hatch_build.py so the shipped Dockerfile can COPY them --
# its build context is the assets directory. Force-included because they are
# gitignored, like the two entries above: without this the wheel carried them (the
# wheel takes the whole assets tree) and the sdist did not, which the artifact gate
# reports as a stale allowlist entry rather than as a packaging asymmetry.
"automated_security_helper/assets/tool_downloads.py" = "automated_security_helper/assets/tool_downloads.py"
"automated_security_helper/assets/exceptions.py" = "automated_security_helper/assets/exceptions.py"

[tool.hatch.build.targets.wheel.force-include]
"automated_security_helper/assets/Dockerfile" = "automated_security_helper/assets/Dockerfile"
"automated_security_helper/assets/ASH_INSTALLED_REVISION" = "automated_security_helper/assets/ASH_INSTALLED_REVISION"
"automated_security_helper/assets/tool_downloads.py" = "automated_security_helper/assets/tool_downloads.py"
"automated_security_helper/assets/exceptions.py" = "automated_security_helper/assets/exceptions.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
